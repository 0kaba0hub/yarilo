mode: cluster

general:
  ssl:
    tls_cert: /etc/yarilo/tls/cert.pem
    tls_key: /etc/yarilo/tls/key.pem
    tls_min_version: TLS1.2
  haproxy:
    timeout: 3
    trusted_nets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"
  xclient:
    trusted_nets:
      - "10.0.0.0/8"
  limits:
    mail_max_userip_connections: 0
  startup_dial_retries: 3

services:
  imaps:
    enabled: true
    port: 10993
    ssl_mode: ssl
    haproxy_protocol: false
    xclient_protocol: true
  imap:
    enabled: true
    port: 10143
    ssl_mode: starttls
    haproxy_protocol: false
    xclient_protocol: true
  pop3s:
    enabled: true
    port: 10995
    ssl_mode: ssl
    haproxy_protocol: false
    xclient_protocol: true
  pop3:
    enabled: true
    port: 10110
    ssl_mode: starttls
    haproxy_protocol: false
    xclient_protocol: true
  lmtp:
    enabled: true
    port: 10024
    ssl_mode: "no"
    haproxy_protocol: false
    xclient_protocol: true
  submission:
    enabled: true
    port: 10587
    ssl_mode: starttls
    disable_plaintext_auth: true
  submissions:
    enabled: false
    port: 10465
    ssl_mode: ssl
    disable_plaintext_auth: true
  managesieve:
    enabled: true
    port: 14190
    ssl_mode: starttls
    disable_plaintext_auth: false
    haproxy_protocol: false
  managesieve_be:
    enabled: true
    port: 14190
    ssl_mode: "no"

protocol:
  imap:
    imap_idle_notify_interval: 120
    imap_max_line_length: 65536
    imap_id_send: "name *"
    login_greeting: ""
    imap_logout_format: ""
    imap_special_use_defaults:
      "Archive": "\\Archive"
      "Drafts": "\\Drafts"
      "Junk": "\\Junk"
      "Sent": "\\Sent"
      "Trash": "\\Trash"
  pop3:
    pop3_no_flag_updates: false
    pop3_reuse_xuidl: false
    pop3_uidl_format: "%u.%v"
    pop3_uidl_duplicates: "rename"
    pop3_enable_last: false
    pop3_delete_type: "expunge"
    pop3_deleted_flag: ""
  lmtp:
    login_greeting: "Yarilo ready."
    add_received_header: true
    save_to_detail_mailbox: false
    hdr_delivery_address: "final"
    verbose_replies: false
    user_concurrency_limit: 10
    read_timeout: 300
    write_timeout: 300
  submission:
    hostname: ""
    max_message_size: 41943040
    max_line_length: 4096
    max_recipients: 0
    recipient_delimiter: "+"
    submission_add_received_header: true
    relay:
      host: ""
      port: 25
      user: ""
      password: ""
      ssl: "no"
      ssl_verify: true
      trusted: false
      connect_timeout: 30
      command_timeout: 300
  managesieve:
    max_script_size: 65536
    max_invalid_commands: 3

sieve:
  sieve_enabled: true
  sieve_default_name: "yarilo"
  sieve_scripts_driver: "fs"
  sieve_max_script_size: 65536
  sieve_max_redirects: 32
  sieve_max_actions: 32
  sieve_duplicate_max_period: 604800
  sieve_duplicate_driver: "file"
  sieve_duplicate_file: ".yarilo.sieve-duplicate"
  sieve_vacation_enabled: true
  sieve_spamtest_status_header: "X-Spam-Score"
  sieve_spamtest_max_value: 10
  sieve_virustest_status_header: ""
  sieve_virustest_max_value: 5
  sieve_report_user_agent: "yarilo"
  sieve_submission_host: "relay-fwd.yarilo-relay.svc.cluster.local:25"
  sieve_submission_ssl: "no"
  sieve_submission_timeout: 30
  sieve_submission_auth_secret: "sieve-smtp-auth"
  sieve_extensions:
    - fileinto
    - reject
    - ereject
    - envelope
    - encoded-character
    - variables
    - relational
    - subaddress
    - body
    - date
    - index
    - mailbox
    - mailboxid
    - mboxmetadata
    - servermetadata
    - imapsieve
    - duplicate
    - imap4flags
    - redirect
    - copy
    - vacation
    - enotify
    - spamtest
    - spamtestplus
    - virustest
    - comparator-i;ascii-numeric
    - foreverypart
    - mime
    - extracttext
    - replace
    - enclose
    - vnd.yarilo.debug
    - vnd.yarilo.filter
    - vnd.yarilo.execute
    - vnd.yarilo.pipe
    - vnd.yarilo.report
    - environment
    - vnd.yarilo.environment
  imapsieve_enabled: true
  imapsieve_script_dir: "/etc/yarilo/imapsieve"
  sieve_pipe_bin_dir: "/usr/lib/yarilo/sieve-pipe"
  sieve_pipe_socket_dir: "sieve-pipe"
  sieve_pipe_exec_timeout: 10
  sieve_pipe_input_eol: "crlf"
  sieve_filter_bin_dir: "/usr/lib/yarilo/sieve-filter"
  sieve_filter_socket_dir: "sieve-filter"
  sieve_filter_exec_timeout: 10
  sieve_filter_input_eol: "crlf"

auth:
  failure_delay: 2
  internal_failure_delay_ms: 2000
  cache:
    size_bytes: 1.048576e+08
    ttl_seconds: 1800
    negative_ttl_seconds: 1800
  penalty:
    enabled: false
  policy:
    url: ""
    api_header: ""
    hash_mech: "sha256"
    hash_nonce: ""
    hash_truncate_bits: 12
    timeout_ms: 5000
    reject_on_fail: false
    log_only: false
    check_before: true
    check_after: true
    report_after: true
  oauth2:
  passdb:
    - driver: sqlite
      dsn: /var/lib/yarilo/users.db
acl:
  enabled: true
  defaults_from_inbox: false
  globals_only: false
fts:
  enabled: false
  fts_engine: "flatcurve"
  fts_mode: "remote"
  fts_addr: "yarilo-fts:9106"
  fts_listen: ":9106"
  fts_auth_master_addr: "yarilo-auth:9102"
  fts_autoindex: true
  fts_autoindex_max_recent_msgs: 0
  fts_message_max_size: 0
  fts_header_includes: []
  fts_header_excludes: []
  fts_commit_limit: 500
  fts_search_add_missing: "body-search-only"
  fts_search_read_fallback: true
  fts_search_timeout_secs: 30
  fts_search_strict: false
  languages: ["en"]
  language_filters: ["lowercase","snowball","stopwords"]
  fts_flatcurve_commit_limit: 500
  fts_flatcurve_min_term_size: 2
  fts_flatcurve_optimize_limit: 10
  fts_flatcurve_rotate_count: 5000
  fts_flatcurve_rotate_time: 5000
  fts_flatcurve_substring_search: false
quota:
  enabled: true
  quota_name: "User quota"
  quota_exceeded_message: "Quota exceeded (mailbox for user is full)"
  quota_mail_size: "50M"
  quota_storage_percentage: 100
  quota_message_percentage: 100
  quota_grace: "10M"
  quota_warning_exec_timeout: 10
  quota_clone_dicts:
    - "quota_clone_redis"
  quota_clone_flush_delay: 10
namespaces:
  - type: "personal"
    prefix: ""
    separator: "/"
    list: true
    subscriptions: true
    inbox: true
    acl_ignore: false
  - type: "public"
    prefix: "Public/"
    separator: "/"
    list: true
    subscriptions: false
    inbox: false
    acl_ignore: false
    location: "maildir:/var/mail/vhosts/public"
storage:
  mailbox: "maildir"
  maildir_root: "/var/mail/vhosts"
  mail_home_template: "%d/%u"
  index: "fileindex"
  # mdbox tuning (only used when mailbox: mdbox):
  # mdbox_rotate_size: 10M           # max size per m.<N> before rolling (10M/1G or raw bytes; 0 = default 10 MiB)
  # mdbox_rotate_interval: 0         # roll append file once older than this (30s/5m/1h or raw seconds; 0 = disabled)
  # mdbox_preallocate_space: false   # fallocate() new m.<N> up front (Linux only)
dicts:
  metadata:
    driver: "redis"
    settings:
      addr: "redis:6379"
      db: 0
      path: null
      prefix: "yarilo:metadata:"
  quota_clone_mysql:
    driver: "sql"
    settings:
      driver: "mysql"
      dsn: "${YARILO_DB_DSN}"
      table: "quota"
  quota_clone_redis:
    driver: "redis"
    settings:
      addr: "redis:6379"
      db: 0
      prefix: "quota:"
  sieve_duplicate:
    driver: "redis"
    settings:
      addr: "redis:6379"
      db: 0
      prefix: "yarilo:sieve:duplicate:%u:"
  sieve_vacation:
    driver: "redis"
    settings:
      addr: "redis:6379"
      db: 0
      prefix: "yarilo:sieve:vacation:%u:"

internal_tls:
  enabled: false
  cert: ""
  key: ""
  ca: ""

auth_service:
  listen: ":9100"
  addr: "yarilo-auth:9100"
  master_listen: ":9102"
  master_addr: "yarilo-auth:9102"
  shutdown:
    session_grace_period: 30
    kill_timeout: 5

warden_service:
  listen: ":9101"
  addr: "yarilo-warden:9101"
  shutdown:
    session_grace_period: 30
    kill_timeout: 5
imap_login_service:
  backend_addr: "yarilo-imap:10143"
pop3_login_service:
  backend_addr: "yarilo-pop3:10110"
lmtp_login_service:
  backend_addr: "yarilo-lmtp:10024"
managesieve_login_service:
  backend_addr: "yarilo-managesieve:14190"
submission_login_service:
  backend_addr: "yarilo-submission:10587"
## yarilo-backend-api consumes this section. Token is loaded from
## the Secret at /etc/yarilo/backend-api-token via $BACKEND_API_TOKEN
## env so it never lands in the ConfigMap.
locks_service:
  mode: remote
  listen: ":9104"
  redis: "redis://redis:6379/0"
  shutdown:
    session_grace_period: 30
    kill_timeout: 5

## Every session binary (yarilo-imap / pop3 / submission / lmtp) dials this.
locks_client:
  mode: remote
  endpoints:
    - "yarilo-locks:9104"


sasl_login:
  listen: ":12325"
  haproxy_protocol: false
quota_status:
  listen: ":12340"
  recipient_delimiter: "+"
  quota_status_nouser: "REJECT Unknown user"
  auth_master_addr: "yarilo-auth:9102"

telemetry:
  listen: ":8080"

log:
  level: "debug"
