<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>

  <!-- Flame rays: golden at base → fiery red at tips -->
  <radialGradient id="flG" cx="100" cy="100" r="100" gradientUnits="userSpaceOnUse">
    <stop offset="76%" stop-color="#fde047"/>
    <stop offset="90%" stop-color="#f97316"/>
    <stop offset="100%" stop-color="#c2410c"/>
  </radialGradient>

  <!-- Inner disk: deep warm dark (gold symbol pops against it) -->
  <radialGradient id="dkBg" cx="40%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#3b0d02"/>
    <stop offset="100%" stop-color="#78350f"/>
  </radialGradient>

  <!-- Kolovrat arms: bright gold center → warm amber outer -->
  <radialGradient id="armG" cx="100" cy="100" r="74" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#fef9c3"/>
    <stop offset="25%"  stop-color="#fef08a"/>
    <stop offset="70%"  stop-color="#fbbf24"/>
    <stop offset="100%" stop-color="#f59e0b"/>
  </radialGradient>

  <!-- Central sun disc -->
  <radialGradient id="ctrG" cx="36%" cy="33%" r="65%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="35%"  stop-color="#fef08a"/>
    <stop offset="100%" stop-color="#fbbf24"/>
  </radialGradient>

  <!-- Flame ray at 12 o'clock: tip r=99, base r≈79 -->
  <path id="fl" fill="url(#flG)"
    d="M 100,1 C 87,5 82,14 90,20 L 100,18 L 110,20 C 118,14 113,5 100,1 Z"/>

  <!-- Kolovrat arm at 0° (up, clockwise hook = right), width 22px -->
  <!-- arm top y=32 (r=68), hook to x=125 (r≈72), hook height 22px -->
  <path id="arm" fill="url(#armG)"
    d="M 89,100 L 89,32 L 125,32 L 125,54 L 111,54 L 111,100 Z"/>

</defs>

<!-- Warm cream background -->
<circle cx="100" cy="100" r="100" fill="#fffbeb"/>

<!-- 16 flame rays at 22.5° spacing -->
<use href="#fl" transform="rotate(0,100,100)"/>
<use href="#fl" transform="rotate(22.5,100,100)"/>
<use href="#fl" transform="rotate(45,100,100)"/>
<use href="#fl" transform="rotate(67.5,100,100)"/>
<use href="#fl" transform="rotate(90,100,100)"/>
<use href="#fl" transform="rotate(112.5,100,100)"/>
<use href="#fl" transform="rotate(135,100,100)"/>
<use href="#fl" transform="rotate(157.5,100,100)"/>
<use href="#fl" transform="rotate(180,100,100)"/>
<use href="#fl" transform="rotate(202.5,100,100)"/>
<use href="#fl" transform="rotate(225,100,100)"/>
<use href="#fl" transform="rotate(247.5,100,100)"/>
<use href="#fl" transform="rotate(270,100,100)"/>
<use href="#fl" transform="rotate(292.5,100,100)"/>
<use href="#fl" transform="rotate(315,100,100)"/>
<use href="#fl" transform="rotate(337.5,100,100)"/>

<!-- Main disk: dark interior, bold orange border -->
<circle cx="100" cy="100" r="74" fill="url(#dkBg)" stroke="#ea580c" stroke-width="5"/>

<!-- Inner accent ring -->
<circle cx="100" cy="100" r="68" fill="none" stroke="#f97316" stroke-width="1" opacity="0.5"/>

<!-- 8-arm clockwise kolovrat -->
<use href="#arm" transform="rotate(0,100,100)"/>
<use href="#arm" transform="rotate(45,100,100)"/>
<use href="#arm" transform="rotate(90,100,100)"/>
<use href="#arm" transform="rotate(135,100,100)"/>
<use href="#arm" transform="rotate(180,100,100)"/>
<use href="#arm" transform="rotate(225,100,100)"/>
<use href="#arm" transform="rotate(270,100,100)"/>
<use href="#arm" transform="rotate(315,100,100)"/>

<!-- Central sun disc (covers arm origins) -->
<circle cx="100" cy="100" r="14" fill="url(#ctrG)"/>
<circle cx="100" cy="100" r="14" fill="none" stroke="#f97316" stroke-width="1.5"/>

</svg>
