<svg width="1160" height="560" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <marker id="ad" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#1d4ed8"/>
    </marker>
    <marker id="aa" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#ca8a04"/>
    </marker>
    <marker id="al" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#7c2d12"/>
    </marker>
    <marker id="ap" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#0f766e"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1160" height="560" fill="#f8fafc"/>
  <text x="510" y="22" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="bold">yarilo — backend deployment (behind director · co-located pod, one IP owns a user's per-user state)</text>

  <!-- ══════════════════════════════════════════════════
       External top row: shared services + director
  ══════════════════════════════════════════════════ -->
  <rect x="20" y="46" width="230" height="80" rx="6" fill="#fffbeb" stroke="#a16207" stroke-width="2"/>
  <text x="135" y="61" text-anchor="middle" fill="#a16207" font-size="11" font-weight="bold">shared services · mTLS</text>
  <text x="135" y="70" text-anchor="middle" fill="#a16207" font-size="8">k8s: Deployments × 2</text>
  <rect x="32" y="72" width="100" height="48" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="82" y="89" text-anchor="middle" fill="#ca8a04" font-size="10" font-weight="bold">yarilo-auth</text>
  <text x="82" y="102" text-anchor="middle" fill="#475569" font-size="8">:9100</text>
  <text x="82" y="113" text-anchor="middle" fill="#475569" font-size="8">passdb/userdb</text>
  <rect x="138" y="72" width="100" height="48" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="188" y="89" text-anchor="middle" fill="#ca8a04" font-size="10" font-weight="bold">yarilo-warden</text>
  <text x="188" y="102" text-anchor="middle" fill="#475569" font-size="8">:9101</text>
  <text x="188" y="113" text-anchor="middle" fill="#475569" font-size="8">conn/sess limits</text>

  <!-- Director deployment (login pods live here, not in backend) -->
  <rect x="270" y="46" width="870" height="80" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="705" y="66" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="bold">director deployment  (login proxies live here — see yarilo_director.svg)</text>
  <text x="705" y="80" text-anchor="middle" fill="#1d4ed8" font-size="9">k8s: StatefulSet × 3 · ONE ring · ONE userDir (one pod IP per user)</text>
  <text x="705" y="95" text-anchor="middle" fill="#475569" font-size="10">ring · userDir · TLS terminate · passdb · preamble parse</text>
  <text x="705" y="110" text-anchor="middle" fill="#475569" font-size="9">plain TCP → pod-IP:{protocol port} · yarilo-jmap-login: HTTPS → pod-IP:8080 over internal mTLS</text>

  <!-- ══════════════════════════════════════════════════
       Outer wrapper: backend deployment (Helm release per tag)
  ══════════════════════════════════════════════════ -->
  <rect x="15" y="146" width="1130" height="400" rx="10" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="903" y="148" width="240" height="24" rx="2" fill="#0f172a"/>
  <text x="1138" y="165" text-anchor="end" fill="#f8fafc" font-size="11" font-weight="bold">backend deployment · Helm release</text>

  <!-- Director → co-located pod (single plain-TCP route to one pod IP) -->
  <line x1="360" y1="126" x2="360" y2="198" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#ad)"/>
  <text x="150" y="164" text-anchor="start" fill="#1d4ed8" font-size="9" font-weight="bold">plain TCP → pod IP</text>
  <text x="150" y="176" text-anchor="start" fill="#1d4ed8" font-size="8">imap:10143 pop3:10110 sub:10587 lmtp:10024 sieve:14190</text>

  <!-- jmap-login → jmap container: per-request HTTP over internal mTLS -->
  <line x1="786" y1="126" x2="786" y2="198" stroke="#be123c" stroke-width="2.2" marker-end="url(#ad)"/>
  <text x="800" y="186" text-anchor="start" fill="#be123c" font-size="9" font-weight="bold">HTTP per request · mTLS</text>
  <text x="800" y="195" text-anchor="start" fill="#be123c" font-size="7">Forwarded · X-Session-ID · trusted from login cert only</text>

  <!-- reg sidecar → director: BACKEND-UP heartbeat for the pod IP -->
  <line x1="600" y1="330" x2="600" y2="126" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="608" y="150" text-anchor="start" fill="#475569" font-size="9" font-weight="bold">BACKEND-UP heartbeat</text>
  <text x="608" y="162" text-anchor="start" fill="#475569" font-size="8">pod IP · seq · protocol-ready-gated</text>
  <text x="608" y="173" text-anchor="start" fill="#475569" font-size="8">(#776 lease · #787 PONG+backoff)</text>

  <!-- ══════════════════════════════════════════════════
       ONE co-located pod: 5 protocols + fts + backend-api + reg sidecar, one IP
  ══════════════════════════════════════════════════ -->
  <rect x="30" y="198" width="840" height="200" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="32" y="200" width="360" height="18" rx="2" fill="#334155"/>
  <text x="38" y="213" text-anchor="start" fill="#f8fafc" font-size="10" font-weight="bold">co-located pod · one IP · StatefulSet × N</text>
  <text x="864" y="213" text-anchor="end" fill="#334155" font-size="8" font-weight="bold">all containers share pod IP + NFS PV</text>

  <!-- Protocol container row (5) -->
  <rect x="42" y="232" width="128" height="72" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="106" y="250" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="bold">yarilo-imap</text>
  <text x="106" y="262" text-anchor="middle" fill="#1d4ed8" font-size="8">container · :10143</text>
  <text x="106" y="277" text-anchor="middle" fill="#475569" font-size="8">IMAP sessions</text>
  <text x="106" y="290" text-anchor="middle" fill="#475569" font-size="8">read mailbox·index</text>

  <rect x="178" y="232" width="128" height="72" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="242" y="250" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="bold">yarilo-pop3</text>
  <text x="242" y="262" text-anchor="middle" fill="#b91c1c" font-size="8">container · :10110</text>
  <text x="242" y="277" text-anchor="middle" fill="#475569" font-size="8">POP3 sessions</text>
  <text x="242" y="290" text-anchor="middle" fill="#475569" font-size="8">read mailbox</text>

  <rect x="314" y="232" width="128" height="72" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="378" y="250" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="bold">yarilo-submission</text>
  <text x="378" y="262" text-anchor="middle" fill="#6d28d9" font-size="8">container · :10587</text>
  <text x="378" y="277" text-anchor="middle" fill="#475569" font-size="8">SMTP · DKIM</text>
  <text x="378" y="290" text-anchor="middle" fill="#475569" font-size="8">write Sent · sieve</text>

  <rect x="450" y="232" width="128" height="72" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="514" y="250" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">yarilo-lmtp</text>
  <text x="514" y="262" text-anchor="middle" fill="#0f766e" font-size="8">container · :10024</text>
  <text x="514" y="277" text-anchor="middle" fill="#475569" font-size="8">deliver → INBOX</text>
  <text x="514" y="290" text-anchor="middle" fill="#475569" font-size="8">preamble · sieve</text>

  <rect x="586" y="232" width="128" height="72" rx="5" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="650" y="250" text-anchor="middle" fill="#a16207" font-size="10" font-weight="bold">yarilo-managesieve</text>
  <text x="650" y="262" text-anchor="middle" fill="#a16207" font-size="8">container · :14190</text>
  <text x="650" y="277" text-anchor="middle" fill="#475569" font-size="8">ManageSieve</text>
  <text x="650" y="290" text-anchor="middle" fill="#475569" font-size="8">script store</text>

  <rect x="722" y="232" width="128" height="72" rx="5" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
  <text x="786" y="250" text-anchor="middle" fill="#be123c" font-size="11" font-weight="bold">yarilo-jmap</text>
  <text x="786" y="262" text-anchor="middle" fill="#be123c" font-size="8">container · :8080</text>
  <text x="786" y="277" text-anchor="middle" fill="#475569" font-size="8">JMAP methods · storage</text>
  <text x="786" y="290" text-anchor="middle" fill="#475569" font-size="8">no client TLS</text>

  <!-- fts + backend-api + reg sidecar row -->
  <rect x="42" y="316" width="250" height="70" rx="5" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="167" y="334" text-anchor="middle" fill="#4338ca" font-size="10" font-weight="bold">yarilo-fts (localhost)</text>
  <text x="167" y="348" text-anchor="middle" fill="#475569" font-size="8">per-user Xapian · sticky pod = sole writer</text>
  <text x="167" y="360" text-anchor="middle" fill="#475569" font-size="8">single-writer free → #675/#676</text>
  <text x="167" y="374" text-anchor="middle" fill="#64748b" font-size="7">best-effort · NOT in readiness gate</text>

  <rect x="300" y="316" width="190" height="70" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="395" y="334" text-anchor="middle" fill="#15803d" font-size="10" font-weight="bold">yarilo-backend-api</text>
  <text x="395" y="348" text-anchor="middle" fill="#475569" font-size="8">admin API · per-user writer</text>
  <text x="395" y="360" text-anchor="middle" fill="#475569" font-size="8">listens pod-IP only</text>
  <text x="395" y="374" text-anchor="middle" fill="#64748b" font-size="7">admin LOOKUP-routed (#792)</text>

  <rect x="498" y="316" width="216" height="70" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="606" y="334" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">yarilo-backend-reg</text>
  <text x="606" y="348" text-anchor="middle" fill="#334155" font-size="8">registration sidecar</text>
  <text x="606" y="360" text-anchor="middle" fill="#475569" font-size="8">one BACKEND-UP for pod IP</text>
  <text x="606" y="373" text-anchor="middle" fill="#475569" font-size="8">gated on all protocols ready</text>

  <!-- ══════════════════════════════════════════════════
       Backend-side SEPARATE deployments: locks + quota-status (global-read)
  ══════════════════════════════════════════════════ -->
  <rect x="888" y="198" width="242" height="60" rx="5" fill="#fef2f2" stroke="#7c2d12" stroke-width="2"/>
  <text x="1009" y="216" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="bold">yarilo-locks</text>
  <text x="1009" y="230" text-anchor="middle" fill="#7c2d12" font-size="8">Deployment × 2 · mTLS :9104</text>
  <text x="1009" y="245" text-anchor="middle" fill="#475569" font-size="9">cross-pod write coord · TTL 30s</text>

  <rect x="888" y="280" width="242" height="70" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="1009" y="300" text-anchor="middle" fill="#15803d" font-size="11" font-weight="bold">yarilo-quota-status</text>
  <text x="1009" y="315" text-anchor="middle" fill="#475569" font-size="9">Postfix policy service (global-read)</text>
  <text x="1009" y="329" text-anchor="middle" fill="#64748b" font-size="8">separate Deployment · stable ClusterIP</text>
  <text x="1009" y="342" text-anchor="middle" fill="#64748b" font-size="8">for the external MTA · no per-user write</text>

  <!-- Control-plane bus (pod → locks + shared services) -->
  <line x1="380" y1="398" x2="380" y2="414" stroke="#64748b" stroke-width="1.8"/>
  <line x1="82" y1="414" x2="1009" y2="414" stroke="#64748b" stroke-width="2"/>
  <circle cx="380" cy="414" r="3" fill="#64748b"/>
  <text x="470" y="431" text-anchor="middle" fill="#475569" font-size="10" font-weight="bold">control plane · mTLS</text>

  <line x1="1009" y1="414" x2="1009" y2="260" stroke="#7c2d12" stroke-width="1.6" marker-end="url(#al)"/>
  <text x="1001" y="405" text-anchor="end" fill="#7c2d12" font-size="9" font-weight="bold">X locks</text>

  <line x1="82" y1="414" x2="82" y2="121" stroke="#ca8a04" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="74" y="300" text-anchor="end" fill="#ca8a04" font-size="9" font-weight="bold">userdb</text>
  <line x1="188" y1="414" x2="188" y2="121" stroke="#ca8a04" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="196" y="300" text-anchor="start" fill="#ca8a04" font-size="9" font-weight="bold">warden</text>
  <text x="196" y="312" text-anchor="start" fill="#ca8a04" font-size="8">(not lmtp)</text>
  <circle cx="82" cy="414" r="3" fill="#64748b"/>
  <circle cx="188" cy="414" r="3" fill="#64748b"/>

  <!-- Data plane: pod → storage -->
  <line x1="380" y1="414" x2="380" y2="440" stroke="#0f766e" stroke-width="2" marker-end="url(#ap)"/>

  <!-- Storage block (NFS RWX, shared by all co-located pods in this tag) -->
  <rect x="40" y="442" width="1080" height="94" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="510" y="462" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="bold">local storage (NFS PV, RWX)</text>
  <text x="510" y="476" text-anchor="middle" fill="#475569" font-size="9">shared by all co-located backend pods in this tag (tag = one NFS shard) · per-user dirs, one writer via sticky routing</text>
  <line x1="380" y1="482" x2="380" y2="528" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="660" y1="482" x2="660" y2="528" stroke="#cbd5e1" stroke-width="1"/>
  <text x="210" y="500" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">mailbox data</text>
  <text x="210" y="515" text-anchor="middle" fill="#475569" font-size="9">MailboxBackend · maildir·dbox</text>
  <text x="520" y="500" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">index data</text>
  <text x="520" y="515" text-anchor="middle" fill="#475569" font-size="9">IndexBackend · fileindex·sqlite</text>
  <text x="960" y="500" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="bold">fts index (per-user)</text>
  <text x="960" y="515" text-anchor="middle" fill="#475569" font-size="9">Xapian · one writer/user</text>
</svg>
