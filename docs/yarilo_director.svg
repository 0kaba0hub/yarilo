  <text x="410" y="623" text-anchor="middle" fill="#475569" font-size="9">ring · userDir · sessions</text>
  <text x="410" y="638" text-anchor="middle" fill="#475569" font-size="9">mTLS :9102 · API :9103</text>
  <rect x="560" y="590" width="220" height="56" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="670" y="608" text-anchor="middle" fill="#c2410c" font-size="11" font-weight="bold">backend lease · #776</text>
  <text x="670" y="623" text-anchor="middle" fill="#475569" font-size="9">BACKEND-UP heartbeat (seq)</text>
  <text x="670" y="638" text-anchor="middle" fill="#475569" font-size="9">TTL expiry → RING-CHANGE down</text>
  <line x1="560" y1="618" x2="522" y2="618" stroke="#c2410c" stroke-width="1.8" marker-end="url(#am)"/>

  <!-- Peer sync (ring) between directors -->
  <line x1="270" y1="418" x2="270" y2="618" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="270" y1="418" x2="300" y2="418" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="270" y1="518" x2="300" y2="518" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="270" y1="618" x2="300" y2="618" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="270" cy="418" r="2.5" fill="#1d4ed8"/>
  <circle cx="270" cy="518" r="2.5" fill="#1d4ed8"/>
  <circle cx="270" cy="618" r="2.5" fill="#1d4ed8"/>
