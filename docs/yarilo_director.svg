<svg width="1240" height="840" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <marker id="am" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#c2410c"/>
    </marker>
    <marker id="aa" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#ca8a04"/>
    </marker>
    <marker id="ad" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#1d4ed8"/>
    </marker>
    <marker id="ax" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#475569"/>
    </marker>
    <marker id="ap" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#0f766e"/>
