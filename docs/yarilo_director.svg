  <text x="670" y="438" text-anchor="middle" fill="#475569" font-size="9">TTL expiry → RING-CHANGE down</text>
  <line x1="560" y1="418" x2="522" y2="418" stroke="#c2410c" stroke-width="1.8" marker-end="url(#am)"/>

  <!-- Pod 2 -->
  <rect x="280" y="467" width="520" height="86" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3"/>
