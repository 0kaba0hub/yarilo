  <text x="410" y="523" text-anchor="middle" fill="#475569" font-size="9">ring · userDir · sessions</text>
  <text x="410" y="538" text-anchor="middle" fill="#475569" font-size="9">mTLS :9102 · API :9103</text>
  <rect x="560" y="490" width="220" height="56" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="670" y="508" text-anchor="middle" fill="#c2410c" font-size="11" font-weight="bold">backend lease · #776</text>
  <text x="670" y="523" text-anchor="middle" fill="#475569" font-size="9">BACKEND-UP heartbeat (seq)</text>
  <text x="670" y="538" text-anchor="middle" fill="#475569" font-size="9">TTL expiry → RING-CHANGE down</text>
  <line x1="560" y1="518" x2="522" y2="518" stroke="#c2410c" stroke-width="1.8" marker-end="url(#am)"/>

  <!-- Pod 3 -->
  <rect x="280" y="567" width="520" height="86" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="293" y="585" text-anchor="start" fill="#475569" font-size="10" font-weight="bold">pod: director-3</text>
  <rect x="300" y="590" width="220" height="56" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
