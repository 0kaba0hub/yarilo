  <rect x="280" y="367" width="520" height="86" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="293" y="385" text-anchor="start" fill="#475569" font-size="10" font-weight="bold">pod: director-1</text>
  <rect x="300" y="390" width="220" height="56" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
