  ══════════════════════════════════════════════════ -->
  <rect x="40" y="182" width="200" height="72" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="205" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">yarilo-imap-login</text>
  <text x="140" y="223" text-anchor="middle" fill="#475569" font-size="10">:993 / :143</text>
  <text x="140" y="239" text-anchor="middle" fill="#475569" font-size="9">TLS · preamble · proxy</text>

  <rect x="260" y="182" width="200" height="72" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
