  <text x="360" y="223" text-anchor="middle" fill="#475569" font-size="10">:995 / :110</text>
  <text x="360" y="239" text-anchor="middle" fill="#475569" font-size="9">TLS · preamble · proxy</text>

  <rect x="480" y="182" width="200" height="72" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="205" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="bold">yarilo-submission-login</text>
  <text x="580" y="223" text-anchor="middle" fill="#475569" font-size="10">:465 / :587</text>
  <text x="580" y="239" text-anchor="middle" fill="#475569" font-size="9">TLS · preamble · proxy</text>

  <rect x="700" y="182" width="200" height="72" rx="5" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="800" y="204" text-anchor="middle" fill="#be123c" font-size="12" font-weight="bold">yarilo-jmap-login</text>
