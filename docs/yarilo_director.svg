  <text x="800" y="240" text-anchor="middle" fill="#475569" font-size="9">TLS · headers · proxy</text>

  <rect x="920" y="182" width="200" height="72" rx="5" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
