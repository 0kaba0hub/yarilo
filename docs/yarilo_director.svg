  <rect width="1240" height="840" fill="#f8fafc"/>
  <text x="510" y="22" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="bold">yarilo — director deployment · shared services · backend pool</text>

  <!-- ══════════════════════════════════════════════════
       External top row: shared services + MUA + MTA
  ══════════════════════════════════════════════════ -->

  <!-- Shared services (auth + warden only — no locks here) -->
  <rect x="20" y="50" width="230" height="80" rx="6" fill="#fffbeb" stroke="#a16207" stroke-width="2"/>
  <text x="135" y="65" text-anchor="middle" fill="#a16207" font-size="11" font-weight="bold">shared services · mTLS</text>
  <text x="135" y="74" text-anchor="middle" fill="#a16207" font-size="8">k8s: Deployments × 2</text>

  <rect x="32" y="76" width="100" height="48" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="82" y="93" text-anchor="middle" fill="#ca8a04" font-size="10" font-weight="bold">yarilo-auth</text>
  <text x="82" y="106" text-anchor="middle" fill="#475569" font-size="8">:9100</text>
  <text x="82" y="117" text-anchor="middle" fill="#475569" font-size="8">passdb/userdb</text>

  <rect x="138" y="76" width="100" height="48" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="188" y="93" text-anchor="middle" fill="#ca8a04" font-size="10" font-weight="bold">yarilo-warden</text>
  <text x="188" y="106" text-anchor="middle" fill="#475569" font-size="8">:9101</text>
  <text x="188" y="117" text-anchor="middle" fill="#475569" font-size="8">conn/sess limits</text>

  <!-- client MUA -->
  <rect x="270" y="50" width="430" height="80" rx="5" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="485" y="75" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">client MUA</text>
  <text x="485" y="93" text-anchor="middle" fill="#475569" font-size="10">Thunderbird · Outlook</text>
  <text x="485" y="108" text-anchor="middle" fill="#475569" font-size="9">IMAP / POP3 / Submission / JMAP (TLS)</text>

  <!-- MTA / MX server -->
  <rect x="720" y="50" width="280" height="80" rx="5" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="860" y="75" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">MTA / MX server</text>
  <text x="860" y="93" text-anchor="middle" fill="#475569" font-size="10">Postfix · Exim · etc.</text>
  <text x="860" y="108" text-anchor="middle" fill="#475569" font-size="9">LMTP delivery</text>

  <!-- ══════════════════════════════════════════════════
       Outer wrapper: director deployment
  ══════════════════════════════════════════════════ -->
  <rect x="15" y="150" width="1210" height="542" rx="10" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="948" y="152" width="275" height="24" rx="2" fill="#0f172a"/>
  <text x="1218" y="169" text-anchor="end" fill="#f8fafc" font-size="11" font-weight="bold">director · StatefulSet × 3 (peer-sync)</text>

  <!-- External entry arrows (MUA/MTA → login proxies) -->
  <line x1="320" y1="130" x2="140" y2="182" stroke="#475569" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="450" y1="130" x2="360" y2="182" stroke="#475569" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="600" y1="130" x2="580" y2="182" stroke="#475569" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="880" y1="130" x2="935" y2="182" stroke="#475569" stroke-width="1.8" marker-end="url(#ax)"/>

