  <text x="60" y="724" text-anchor="start" fill="#0f766e" font-size="9" font-style="italic">data plane · ring-routed by director (per tag · per user)</text>

  <!-- Backend (standalone) deployments (tagged shards) -->
  <rect x="40" y="745" width="220" height="80" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="150" y="767" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">backend deployment</text>
  <text x="150" y="783" text-anchor="middle" fill="#475569" font-size="10">4× StatefulSets · NFS · locks</text>
  <text x="150" y="805" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">tag: A</text>

  <rect x="280" y="745" width="220" height="80" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="390" y="767" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">backend deployment</text>
  <text x="390" y="783" text-anchor="middle" fill="#475569" font-size="10">4× StatefulSets · NFS · locks</text>
  <text x="390" y="805" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">tag: B</text>

  <rect x="520" y="745" width="220" height="80" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="630" y="767" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">backend deployment</text>
  <text x="630" y="783" text-anchor="middle" fill="#475569" font-size="10">4× StatefulSets · NFS · locks</text>
  <text x="630" y="805" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">tag: C</text>

  <rect x="760" y="745" width="220" height="80" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="870" y="767" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">backend deployment</text>
  <text x="870" y="783" text-anchor="middle" fill="#475569" font-size="10">4× StatefulSets · NFS · locks</text>
  <text x="870" y="808" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="bold">… (tag: x)</text>
