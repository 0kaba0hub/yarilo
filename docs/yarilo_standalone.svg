  <text x="942" y="254" text-anchor="middle" fill="#475569" font-size="9">MTA-facing · auth + proxy</text>
  <text x="942" y="266" text-anchor="middle" fill="#94a3b8" font-size="8">Service: yarilo-lmtp-login.svc</text>

