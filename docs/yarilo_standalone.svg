  <!-- Storage block — RWX PVC shared by all session pods -->
  <rect x="30" y="490" width="1060" height="100" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="560" y="512" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="bold">PersistentVolumeClaim · ReadWriteMany (NFS · CephFS · hostPath on single node)</text>
  <text x="560" y="526" text-anchor="middle" fill="#475569" font-size="10">shared by every session pod · cross-pod write coordination via yarilo-locks</text>
  <line x1="560" y1="538" x2="560" y2="582" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="555" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">mailbox data</text>
  <text x="290" y="569" text-anchor="middle" fill="#475569" font-size="9">pkg/mailbox · MailboxBackend</text>
  <text x="290" y="581" text-anchor="middle" fill="#64748b" font-size="9">maildir · dbox · mdbox</text>
  <text x="830" y="555" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">index data</text>
  <text x="830" y="569" text-anchor="middle" fill="#475569" font-size="9">pkg/mailbox · IndexBackend</text>
  <text x="830" y="581" text-anchor="middle" fill="#64748b" font-size="9">fileindex · sqlite</text>

  <!-- ══════════════════════════════════════════════════
       Footer legend
  ══════════════════════════════════════════════════ -->
  <rect x="30" y="610" width="1060" height="120" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="40" y="628" fill="#0f172a" font-size="11" font-weight="bold">Scaling model</text>
  <text x="40" y="644" fill="#475569" font-size="10">• Every box above is its own k8s Deployment (or StatefulSet for redis). Bump replicaCount in values.yaml per component — no rewiring.</text>
  <text x="40" y="658" fill="#475569" font-size="10">• login pods and session pods are SEPARATE Deployments. Connect via mTLS TCP + auth preamble through ClusterIP Service DNS — not Unix-socket fd-pass.</text>
  <text x="40" y="672" fill="#475569" font-size="10">• yarilo-locks scales independently (default 2 for HA). State in Redis means N session pods see one consistent view.</text>
  <text x="40" y="686" fill="#475569" font-size="10">• PVC must be ReadWriteMany — even on a single node, multiple session pods mount the same volume. hostPath / NFS / CephFS all valid; storageClass in values.yaml.</text>
  <text x="40" y="700" fill="#475569" font-size="10">• Redis is bundled by default (StatefulSet subchart). For HA point at external managed Redis (Sentinel / Cluster) by overriding the connection URL.</text>
  <text x="40" y="714" fill="#475569" font-size="10">• No director, no per-tag sharding. Cross-pod write contention handled by yarilo-locks. Upgrade path to backend deployment (with director) does not touch session binaries.</text>
</svg>
