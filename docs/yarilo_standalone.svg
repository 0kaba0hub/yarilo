  <line x1="210" y1="435" x2="942" y2="435" stroke="#64748b" stroke-width="2"/>
  <circle cx="327" cy="435" r="3" fill="#64748b"/>
  <circle cx="532" cy="435" r="3" fill="#64748b"/>
  <circle cx="737" cy="435" r="3" fill="#64748b"/>
  <circle cx="942" cy="435" r="3" fill="#64748b"/>
  <circle cx="210" cy="435" r="3" fill="#64748b"/>
  <text x="635" y="452" text-anchor="middle" fill="#475569" font-size="10" font-weight="bold">control plane · mTLS over ClusterIP Service DNS</text>
  <text x="635" y="464" text-anchor="middle" fill="#94a3b8" font-size="9">sessions → yarilo-locks (X locks · EVENT) · sessions → yarilo-auth (userdb) · logins → yarilo-anvil (rate-limit) · logins → yarilo-auth (passdb)</text>

