  <text x="737" y="404" text-anchor="middle" fill="#94a3b8" font-size="8">Service: yarilo-submission.svc</text>

  <rect x="845" y="332" width="195" height="76" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="942" y="352" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="bold">yarilo-lmtp</text>
  <text x="942" y="366" text-anchor="middle" fill="#475569" font-size="9">Deployment · replicaCount=N</text>
  <text x="942" y="379" text-anchor="middle" fill="#475569" font-size="9">LMTP delivery · sieve filter</text>
  <text x="942" y="392" text-anchor="middle" fill="#475569" font-size="9">scales by delivery queue</text>
  <text x="942" y="404" text-anchor="middle" fill="#94a3b8" font-size="8">Service: yarilo-lmtp.svc</text>

