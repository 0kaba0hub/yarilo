  <text x="120" y="324" text-anchor="middle" fill="#94a3b8" font-size="8">ClusterIP Service · yarilo-anvil.svc</text>

  <rect x="30" y="338" width="180" height="62" rx="5" fill="#fef2f2" stroke="#7c2d12" stroke-width="2"/>
  <text x="120" y="357" text-anchor="middle" fill="#7c2d12" font-size="12" font-weight="bold">yarilo-locks</text>
