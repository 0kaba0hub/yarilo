  <text x="532" y="366" text-anchor="middle" fill="#475569" font-size="9">Deployment · replicaCount=N</text>
  <text x="532" y="379" text-anchor="middle" fill="#475569" font-size="9">POP3 session · goroutines/user</text>
  <text x="532" y="392" text-anchor="middle" fill="#475569" font-size="9">scales by poll rate</text>
  <text x="532" y="404" text-anchor="middle" fill="#94a3b8" font-size="8">Service: yarilo-pop3.svc</text>

  <rect x="640" y="332" width="195" height="76" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="737" y="352" text-anchor="middle" fill="#6d28d9" font-size="12" font-weight="bold">yarilo-submission</text>
  <text x="737" y="366" text-anchor="middle" fill="#475569" font-size="9">Deployment · replicaCount=N</text>
  <text x="737" y="379" text-anchor="middle" fill="#475569" font-size="9">SMTP submit · DKIM · sieve</text>
