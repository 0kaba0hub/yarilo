  <rect x="780" y="142" width="323" height="24" rx="2" fill="#0f172a"/>
  <text x="1098" y="159" text-anchor="end" fill="#f8fafc" font-size="11" font-weight="bold">Helm release: yarilo-standalone (one chart, many Deployments)</text>

  <!-- MUA → login proxies arrows -->
  <line x1="320" y1="120" x2="320" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="450" y1="120" x2="520" y2="194" stroke="#475569" stroke-width="1.8" marker-end="url(#ax)"/>
