  <text x="120" y="384" text-anchor="middle" fill="#475569" font-size="9">mTLS :9104 · X locks · EVENT</text>
  <text x="120" y="396" text-anchor="middle" fill="#94a3b8" font-size="8">ClusterIP Service · yarilo-locks.svc</text>

