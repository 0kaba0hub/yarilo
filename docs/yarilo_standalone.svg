  <rect width="1120" height="760" fill="#f8fafc"/>

  <text x="560" y="22" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="bold">yarilo — standalone Helm release · single-node k8s · independent Deployments per component</text>
  <text x="560" y="38" text-anchor="middle" fill="#475569" font-size="10">no director · each component has its own replicaCount · all coordination via ClusterIP Services + mTLS</text>

  <!-- ══════════════════════════════════════════════════
       External clients/MTA (above the Helm release)
  ══════════════════════════════════════════════════ -->
  <rect x="240" y="55" width="400" height="65" rx="5" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="440" y="78" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">client MUA</text>
  <text x="440" y="94" text-anchor="middle" fill="#475569" font-size="10">Thunderbird · Outlook</text>
  <text x="440" y="108" text-anchor="middle" fill="#475569" font-size="9">IMAP · POP3 · Submission (TLS)</text>

  <rect x="680" y="55" width="280" height="65" rx="5" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="820" y="78" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">MTA / MX server</text>
  <text x="820" y="94" text-anchor="middle" fill="#475569" font-size="10">Postfix · Exim · etc.</text>
  <text x="820" y="108" text-anchor="middle" fill="#475569" font-size="9">LMTP delivery</text>

