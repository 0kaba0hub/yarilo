  <text x="327" y="379" text-anchor="middle" fill="#475569" font-size="9">IMAP session · goroutines/user</text>
  <text x="327" y="392" text-anchor="middle" fill="#475569" font-size="9">scales by conn count</text>
  <text x="327" y="404" text-anchor="middle" fill="#94a3b8" font-size="8">Service: yarilo-imap.svc</text>

