  <text x="120" y="213" text-anchor="middle" fill="#ca8a04" font-size="12" font-weight="bold">yarilo-auth</text>
  <text x="120" y="227" text-anchor="middle" fill="#475569" font-size="9">Deployment · replicaCount=N</text>
  <text x="120" y="240" text-anchor="middle" fill="#475569" font-size="9">mTLS :9100 · passdb / userdb</text>
  <text x="120" y="252" text-anchor="middle" fill="#94a3b8" font-size="8">ClusterIP Service · yarilo-auth.svc</text>

  <rect x="30" y="266" width="180" height="62" rx="5" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
  <text x="120" y="285" text-anchor="middle" fill="#ca8a04" font-size="12" font-weight="bold">yarilo-anvil</text>
