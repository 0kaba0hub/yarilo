{{- if .Values.telemetry.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "yarilo.fullname" . }}
  namespace: {{ .Values.telemetry.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "yarilo.labels" . | nindent 4 }}
    {{- with .Values.telemetry.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "yarilo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: telemetry
  endpoints:
    - port: telemetry
      path: /metrics
      interval: {{ .Values.telemetry.serviceMonitor.interval }}
{{- end }}
