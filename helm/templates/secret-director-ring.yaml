{{- if .Values.components.director.enabled }}
{{- $secretName := printf "%s-director-ring-secret" (include "yarilo.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $secret := "" }}
{{- if $existing }}
{{- $secret = index $existing.data "secret" | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret: {{ $secret | b64enc }}
{{- end }}
