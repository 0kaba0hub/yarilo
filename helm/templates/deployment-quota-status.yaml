{{- if .Values.components.quotaStatus.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-quota-status
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "quota-status") | nindent 4 }}
spec:
  replicas: {{ .Values.components.quotaStatus.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "quota-status") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "quota-status") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- /* No wait-redis init container (#903): the startupProbe below waits for
             Redis before the pod takes traffic. */}}
      containers:
        - name: yarilo-quota-status
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-quota-status"
            - name: LOG_LEVEL
              value: {{ include "yarilo.logLevel" (dict "name" "yarilo-quota-status" "root" $) | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: policy
              containerPort: {{ .Values.components.quotaStatus.containerPort }}
              protocol: TCP
            - name: telemetry
              containerPort: 8080
          {{- include "yarilo.depStartupProbe" (dict "probe" .Values.components.quotaStatus.startupProbe "targets" (list (printf "tcp://%s:%s" (include "yarilo.redisInitHost" .) (include "yarilo.redisInitPort" .)))) | nindent 10 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.components.quotaStatus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.storage.persistence.enabled }}
            - name: mail
              mountPath: {{ .Values.storage.maildir_root }}
              readOnly: true
            {{- end }}
            {{- include "yarilo.internalTLSMount" .Values.components.quotaStatus.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.storage.persistence.enabled }}
        - name: mail
          persistentVolumeClaim:
            claimName: {{ include "yarilo.fullname" . }}-mail
            readOnly: true
        {{- end }}
        {{- include "yarilo.internalTLSVolume" .Values.components.quotaStatus.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
