{{- if .Values.components.imapLogin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-imap-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "imap-login") | nindent 4 }}
spec:
  replicas: {{ .Values.components.imapLogin.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "imap-login") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "imap-login") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.gracefulShutdown.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: yarilo-imap-login
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-imap-login"
            - name: LOG_LEVEL
              value: {{ include "yarilo.logLevel" (dict "name" "yarilo-imap-login" "root" $) | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            {{- if .Values.components.imapLogin.listeners.imaps.enabled }}
            - name: imaps
              containerPort: {{ .Values.components.imapLogin.listeners.imaps.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.imapLogin.listeners.imap.enabled }}
            - name: imap
              containerPort: {{ .Values.components.imapLogin.listeners.imap.containerPort }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: 8080
              protocol: TCP
          ## startupProbe replaces the wait-auth / wait-warden init containers (#903).
          ## It works here because this pod does NOT dial auth or warden during
          ## startup — those connections are created lazily on the first login
          ## (#885/#891) — so the process comes up regardless and the probe simply
          ## withholds traffic until the dependencies answer.
          ##
          ## While it fails: the pod stays out of the Service endpoints AND the
          ## liveness probe is not run, so a dependency that is slow to appear
          ## cannot cause a restart. Once it succeeds once it never runs again; a
          ## dependency failing later is a runtime error the login reports to the
          ## client, not a reason to pull the pod.
          ##
          ## yarctl rather than wget: one deadline covers DNS, dial and response,
          ## the failing URL and reason reach `kubectl describe`, and it needs no
          ## second image — yarctl already ships in this one.
          {{- if .Values.components.imapLogin.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - yarctl
                - wait
                - --timeout={{ .Values.components.imapLogin.startupProbe.timeout }}
                ## URLs are positional: yarctl registers a global --url (Director API)
                ## and strips global flags from argv before a subcommand sees them, so
                ## a --url here is swallowed and the probe never passes.
                - http://{{ include "yarilo.fullname" . }}-auth-telemetry.{{ .Release.Namespace }}.svc:8080/readyz
                {{- if .Values.components.warden.enabled }}
                - http://{{ include "yarilo.fullname" . }}-warden-telemetry.{{ .Release.Namespace }}.svc:8080/readyz
                {{- end }}
            periodSeconds: {{ .Values.components.imapLogin.startupProbe.periodSeconds }}
            ## failureThreshold x periodSeconds is the whole startup budget. Keep it
            ## generous: exceeding it restarts a pod that is itself healthy and only
            ## waiting, which the init container never did.
            failureThreshold: {{ .Values.components.imapLogin.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- include "yarilo.preStopDrain" . | nindent 10 }}
          resources:
            {{- toYaml .Values.components.imapLogin.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "yarilo.externalTLSMount" .Values.components.imapLogin.tls.secretName | nindent 12 }}
            {{- include "yarilo.internalTLSMount" .Values.components.imapLogin.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- include "yarilo.externalTLSVolume" .Values.components.imapLogin.tls.secretName | nindent 8 }}
        {{- include "yarilo.internalTLSVolume" .Values.components.imapLogin.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
