apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yarilo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.labels" . | nindent 4 }}
data:
  yarilo.yaml: |
    mode: cluster

    general:
      ssl:
        {{- $extTLSSecret := coalesce .Values.components.imapLogin.tls.secretName .Values.components.pop3Login.tls.secretName .Values.components.submissionLogin.tls.secretName }}
        {{- if $extTLSSecret }}
        tls_cert: /etc/yarilo/tls/tls.crt
        tls_key: /etc/yarilo/tls/tls.key
        {{- else }}
        tls_cert: ""
        tls_key: ""
        {{- end }}
        tls_min_version: TLS1.2
      haproxy:
        timeout: {{ .Values.general.haproxy.timeout }}
        trusted_nets:
          {{- range .Values.general.haproxy.trustedNets }}
          - {{ . | quote }}
          {{- end }}
      xclient:
        trusted_nets:
          {{- range .Values.general.xclient.trustedNets }}
          - {{ . | quote }}
          {{- end }}
      limits:
        mail_max_userip_connections: {{ .Values.general.limits.maxUserIPConnections }}
      startup_dial_retries: {{ .Values.general.startupDialRetries | default 3 }}

    services:
      imaps:
        enabled: {{ .Values.components.imapLogin.listeners.imaps.enabled }}
        port: {{ .Values.components.imapLogin.listeners.imaps.containerPort }}
        ssl_mode: ssl
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      imap:
        enabled: {{ .Values.components.imapLogin.listeners.imap.enabled }}
        port: {{ .Values.components.imapLogin.listeners.imap.containerPort }}
        ssl_mode: starttls
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      pop3s:
        enabled: {{ .Values.components.pop3Login.listeners.pop3s.enabled }}
        port: {{ .Values.components.pop3Login.listeners.pop3s.containerPort }}
        ssl_mode: ssl
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      pop3:
        enabled: {{ .Values.components.pop3Login.listeners.pop3.enabled }}
        port: {{ .Values.components.pop3Login.listeners.pop3.containerPort }}
        ssl_mode: starttls
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      lmtp:
        {{- if .Values.components.director.enabled }}
        enabled: {{ .Values.components.director.listeners.lmtp.enabled }}
        port: {{ .Values.components.director.listeners.lmtp.containerPort }}
        {{- else }}
        enabled: {{ .Values.components.lmtp.listeners.lmtp.enabled }}
        port: {{ .Values.components.lmtp.listeners.lmtp.containerPort }}
        {{- end }}
        ssl_mode: "no"
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      submission:
        enabled: {{ .Values.components.submissionLogin.listeners.submission.enabled }}
        port: {{ .Values.components.submissionLogin.listeners.submission.containerPort }}
        ssl_mode: starttls
        disable_plaintext_auth: true
      submissions:
        enabled: {{ .Values.components.submissionLogin.listeners.submissions.enabled }}
        port: {{ .Values.components.submissionLogin.listeners.submissions.containerPort }}
        ssl_mode: ssl
        disable_plaintext_auth: true
      {{- $msLoginL := (((.Values.components.manageSieveLogin | default dict).listeners | default dict).managesieve | default dict) }}
      managesieve:
        enabled: {{ $msLoginL.enabled | default false }}
        port: {{ $msLoginL.containerPort | default 4190 }}
        ssl_mode: starttls
        disable_plaintext_auth: {{ $msLoginL.disablePlainAuth | default false }}
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
      {{- $msL := (((.Values.components.manageSieve | default dict).listeners | default dict).managesieve | default dict) }}
      managesieve_be:
        enabled: {{ $msL.enabled | default false }}
        port: {{ $msL.containerPort | default 14190 }}
        ssl_mode: "no"

    protocol:
      imap:
        imap_idle_notify_interval: {{ .Values.protocol.imap.idleNotifyInterval }}
        imap_max_line_length: {{ .Values.protocol.imap.maxLineLength }}
        imap_id_send: {{ .Values.protocol.imap.idSend | quote }}
        login_greeting: {{ .Values.protocol.imap.loginGreeting | quote }}
        imap_logout_format: {{ .Values.protocol.imap.logoutFormat | quote }}
        {{- with .Values.protocol.imap.clientWorkarounds }}
        client_workarounds:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- with .Values.protocol.imap.specialUseDefaults }}
        imap_special_use_defaults:
          {{- range $folder, $attr := . }}
          {{ $folder | quote }}: {{ $attr | quote }}
          {{- end }}
        {{- end }}
        acl:
          enabled: {{ .Values.protocol.imap.acl.enabled }}
      pop3:
        pop3_no_flag_updates: {{ .Values.protocol.pop3.noFlagUpdates }}
        pop3_reuse_xuidl: {{ .Values.protocol.pop3.reuseXUIDL }}
        pop3_uidl_format: {{ .Values.protocol.pop3.uidlFormat | quote }}
        pop3_uidl_duplicates: {{ .Values.protocol.pop3.uidlDuplicates | quote }}
        pop3_enable_last: {{ .Values.protocol.pop3.enableLast }}
        pop3_delete_type: {{ .Values.protocol.pop3.deleteType | quote }}
        pop3_deleted_flag: {{ .Values.protocol.pop3.deletedFlag | quote }}
      lmtp:
        login_greeting: {{ .Values.protocol.lmtp.loginGreeting | quote }}
        add_received_header: {{ .Values.protocol.lmtp.addReceivedHeader }}
        save_to_detail_mailbox: {{ .Values.protocol.lmtp.saveToDetailMailbox }}
        hdr_delivery_address: {{ .Values.protocol.lmtp.hdrDeliveryAddress | quote }}
        verbose_replies: {{ .Values.protocol.lmtp.verboseReplies }}
        user_concurrency_limit: {{ .Values.protocol.lmtp.userConcurrencyLimit }}
        read_timeout: {{ .Values.protocol.lmtp.readTimeout }}
        write_timeout: {{ .Values.protocol.lmtp.writeTimeout }}
        {{- with .Values.protocol.lmtp.clientWorkarounds }}
        client_workarounds:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
      submission:
        hostname: {{ .Values.protocol.submission.hostname | quote }}
        max_message_size: {{ int64 .Values.protocol.submission.maxMessageSize }}
        max_line_length: {{ int .Values.protocol.submission.maxLineLength }}
        max_recipients: {{ .Values.protocol.submission.maxRecipients }}
        recipient_delimiter: {{ .Values.protocol.submission.recipientDelimiter | quote }}
        submission_add_received_header: {{ .Values.protocol.submission.addReceivedHeader }}
        relay:
          host: {{ .Values.protocol.submission.relay.host | quote }}
          port: {{ .Values.protocol.submission.relay.port }}
          user: {{ .Values.protocol.submission.relay.user | quote }}
          password: {{ .Values.protocol.submission.relay.password | quote }}
          ssl: {{ .Values.protocol.submission.relay.ssl | quote }}
          ssl_verify: {{ .Values.protocol.submission.relay.sslVerify }}
          trusted: {{ .Values.protocol.submission.relay.trusted }}
          connect_timeout: {{ .Values.protocol.submission.relay.connectTimeout }}
          command_timeout: {{ .Values.protocol.submission.relay.commandTimeout }}
      managesieve:
        max_script_size: {{ (.Values.protocol.managesieve | default dict).maxScriptSize | default 65536 }}
        max_invalid_commands: {{ (.Values.protocol.managesieve | default dict).maxInvalidCommands | default 3 }}

    sieve:
      {{- $sieve := (.Values.sieve | default dict) }}
      {{- $sub := ($sieve.submission | default dict) }}
      enabled: {{ $sieve.enabled | default false }}
      max_script_size: {{ $sieve.maxScriptSize | default 65536 }}
      max_redirects: {{ $sieve.maxRedirects | default 32 }}
      vacation_enabled: {{ $sieve.vacationEnabled | default true }}
      submission_host: {{ $sub.host | default "" | quote }}
      submission_ssl: {{ $sub.ssl | default "no" | quote }}
      submission_timeout: {{ $sub.timeout | default 30 }}
      submission_auth_secret: {{ $sub.authSecret | default "" | quote }}
      {{- with $sieve.sieveExtensions }}
      sieve_extensions:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    auth:
      failure_delay: {{ .Values.components.auth.failureDelay | default 2 }}
      internal_failure_delay_ms: {{ .Values.components.auth.internalFailureDelayMs | default 2000 }}
      cache:
        size_bytes: {{ .Values.components.auth.cache.sizeBytes | default 0 }}
        ttl_seconds: {{ .Values.components.auth.cache.ttlSeconds | default 1800 }}
        negative_ttl_seconds: {{ .Values.components.auth.cache.negativeTTLSeconds | default 1800 }}
      penalty:
        enabled: {{ .Values.components.auth.penalty.enabled | default false }}
      policy:
        url: {{ .Values.components.auth.policy.url | default "" | quote }}
        api_header: {{ .Values.components.auth.policy.apiHeader | default "" | quote }}
        hash_mech: {{ .Values.components.auth.policy.hashMech | default "sha256" | quote }}
        hash_nonce: {{ .Values.components.auth.policy.hashNonce | default "" | quote }}
        hash_truncate_bits: {{ .Values.components.auth.policy.hashTruncateBits | default 12 }}
        timeout_ms: {{ .Values.components.auth.policy.timeoutMs | default 5000 }}
        reject_on_fail: {{ .Values.components.auth.policy.rejectOnFail | default false }}
        log_only: {{ .Values.components.auth.policy.logOnly | default false }}
        check_before: {{ .Values.components.auth.policy.checkBefore | default true }}
        check_after: {{ .Values.components.auth.policy.checkAfter | default true }}
        report_after: {{ .Values.components.auth.policy.reportAfter | default true }}
      oauth2:
        {{- range (.Values.components.auth.oauth2 | default list) }}
        - mode: {{ .mode | quote }}
          {{- with .jwks_url }}
          jwks_url: {{ . | quote }}
          {{- end }}
          {{- with .introspection_url }}
          introspection_url: {{ . | quote }}
          {{- end }}
          {{- with .tokeninfo_url }}
          tokeninfo_url: {{ . | quote }}
          {{- end }}
          {{- with .issuer_url }}
          issuer_url: {{ . | quote }}
          {{- end }}
          {{- with .introspection_mode }}
          introspection_mode: {{ . | quote }}
          {{- end }}
          {{- if .prefer_introspection }}
          prefer_introspection: true
          {{- end }}
          {{- with .client_id }}
          client_id: {{ . | quote }}
          {{- end }}
          {{- with .client_secret }}
          client_secret: {{ . | quote }}
          {{- end }}
          {{- with .issuers }}
          issuers: {{ . | toJson }}
          {{- end }}
          {{- with .audience }}
          audience: {{ . | quote }}
          {{- end }}
          {{- with .scopes }}
          scopes: {{ . | toJson }}
          {{- end }}
          {{- with .username_attribute }}
          username_attribute: {{ . | quote }}
          {{- end }}
          {{- with .username_validation_format }}
          username_validation_format: {{ . | quote }}
          {{- end }}
          {{- with .active_attribute }}
          active_attribute: {{ . | quote }}
          {{- end }}
          {{- with .active_value }}
          active_value: {{ . | quote }}
          {{- end }}
          {{- with .extra_fields }}
          extra_fields: {{ . | toJson }}
          {{- end }}
          {{- with .token_expire_grace_seconds }}
          token_expire_grace_seconds: {{ . }}
          {{- end }}
          {{- with .http_timeout_ms }}
          http_timeout_ms: {{ . }}
          {{- end }}
        {{- end }}
      passdb:
        {{- range .Values.components.auth.passdb }}
        - driver: {{ .driver | quote }}
          dsn: {{ .dsn | quote }}
          {{- with .passwordQuery }}
          password_query: |
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .userQuery }}
          user_query: |
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .iterateQuery }}
          iterate_query: |
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .defaultPassScheme }}
          default_pass_scheme: {{ . | quote }}
          {{- end }}
          {{- if .skipSchema }}
          skip_schema: true
          {{- end }}
        {{- end }}
      master_users:
        enabled: {{ .Values.components.auth.masterUsers.enabled | default false }}
        separator: {{ .Values.components.auth.masterUsers.separator | default "*" | quote }}
        masterdb:
          {{- range (.Values.components.auth.masterUsers.masterdb | default list) }}
          - driver: {{ .driver | quote }}
            dsn: {{ .dsn | quote }}
            {{- with .passwordQuery }}
            password_query: |
              {{- . | nindent 14 }}
            {{- end }}
            {{- with .userQuery }}
            user_query: |
              {{- . | nindent 14 }}
            {{- end }}
            {{- with .iterateQuery }}
            iterate_query: |
              {{- . | nindent 14 }}
            {{- end }}
            {{- with .defaultPassScheme }}
            default_pass_scheme: {{ . | quote }}
            {{- end }}
            {{- if .skipSchema }}
            skip_schema: true
            {{- end }}
          {{- end }}
      token:
        ttl_seconds: {{ .Values.components.auth.token.ttlSeconds | default 60 }}
        backend: {{ .Values.components.auth.token.backend | default "memory" | quote }}
        {{- with .Values.components.auth.token.redisAddr }}
        redis_addr: {{ . | quote }}
        {{- end }}

    {{- $storage := .Values.storage }}
    {{- if $storage }}
    storage:
      mailbox: {{ $storage.mailbox | quote }}
      maildir_root: {{ $storage.maildirRoot | quote }}
      mail_home_template: {{ $storage.mailHomeTemplate | quote }}
      index: {{ $storage.index | quote }}
      {{- if $storage.indexDir }}
      index_dir: {{ $storage.indexDir | quote }}
      {{- end }}
      {{- if $storage.controlDir }}
      control_dir: {{ $storage.controlDir | quote }}
      {{- end }}
      {{- if $storage.volatileDir }}
      volatile_dir: {{ $storage.volatileDir | quote }}
      {{- end }}
      {{- if $storage.altDir }}
      alt_dir: {{ $storage.altDir | quote }}
      {{- end }}
      {{- if $storage.indexLogCompactMinBytes }}
      index_log_compact_min_bytes: {{ $storage.indexLogCompactMinBytes }}
      {{- end }}
      {{- if $storage.indexLogCompactMaxBytes }}
      index_log_compact_max_bytes: {{ $storage.indexLogCompactMaxBytes }}
      {{- end }}
      {{- if $storage.indexLogCompactMinAgeSecs }}
      index_log_compact_min_age_secs: {{ $storage.indexLogCompactMinAgeSecs }}
      {{- end }}
      {{- if $storage.maxConcurrentWrites }}
      max_concurrent_writes: {{ $storage.maxConcurrentWrites }}
      {{- end }}
    {{- end }}

    {{- with .Values.dicts }}
    dicts:
      {{- range $name, $d := . }}
      {{ $name }}:
        driver: {{ $d.driver | quote }}
        {{- with $d.settings }}
        settings:
          {{- range $k, $v := . }}
          {{ $k }}: {{ $v | toJson }}
          {{- end }}
        {{- end }}
        {{- if $d.expire_secs }}
        expire_secs: {{ $d.expire_secs }}
        {{- end }}
      {{- end }}
    {{- end }}

    internal_tls:
      {{- $msTLSEnabled := ((.Values.components.manageSieve | default dict).internalTLS | default dict).enabled }}
      {{- $msLoginTLSEnabled := ((.Values.components.manageSieveLogin | default dict).internalTLS | default dict).enabled }}
      {{- $anyTLS := or .Values.components.director.internalTLS.enabled .Values.components.auth.internalTLS.enabled .Values.components.anvil.internalTLS.enabled .Values.components.imap.internalTLS.enabled .Values.components.pop3.internalTLS.enabled .Values.components.lmtp.internalTLS.enabled .Values.components.imapLogin.internalTLS.enabled .Values.components.pop3Login.internalTLS.enabled .Values.components.submissionLogin.internalTLS.enabled $msTLSEnabled $msLoginTLSEnabled }}
      enabled: {{ $anyTLS | default false }}
      {{- $tlsSecret := coalesce .Values.components.director.internalTLS.secretName .Values.components.auth.internalTLS.secretName .Values.components.anvil.internalTLS.secretName .Values.components.imap.internalTLS.secretName }}
      {{- if $tlsSecret }}
      cert: /etc/yarilo/internal-tls/tls.crt
      key: /etc/yarilo/internal-tls/tls.key
      ca: /etc/yarilo/internal-tls/ca.crt
      {{- else }}
      cert: ""
      key: ""
      ca: ""
      {{- end }}

    auth_service:
      listen: {{ .Values.components.auth.listen | quote }}
      {{- if .Values.components.auth.addr }}
      addr: {{ .Values.components.auth.addr | quote }}
      {{- else }}
      addr: {{ printf "%s-auth.%s.svc.cluster.local:%s" (include "yarilo.fullname" .) .Release.Namespace (trimPrefix ":" .Values.components.auth.listen) | quote }}
      {{- end }}
      {{- if .Values.components.auth.masterListen }}
      master_listen: {{ .Values.components.auth.masterListen | quote }}
      master_addr: {{ printf "%s-auth.%s.svc.cluster.local:%s" (include "yarilo.fullname" .) .Release.Namespace (trimPrefix ":" .Values.components.auth.masterListen) | quote }}
      {{- end }}
      {{- if .Values.components.auth.saslListen }}
      sasl_listen: {{ .Values.components.auth.saslListen | quote }}
      {{- end }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5

    anvil_service:
      listen: {{ .Values.components.anvil.listen | quote }}
      addr: {{ printf "%s-anvil%s" (include "yarilo.fullname" .) .Values.components.anvil.listen | quote }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5

    {{- if .Values.components.imapLogin.enabled }}
    imap_login_service:
      backend_addr: {{ .Values.components.imapLogin.backendAddr | quote }}
    {{- end }}

    {{- if .Values.components.pop3Login.enabled }}
    pop3_login_service:
      backend_addr: {{ .Values.components.pop3Login.backendAddr | quote }}
    {{- end }}

    {{- if .Values.components.submissionLogin.enabled }}
    submission_login_service:
      backend_addr: {{ .Values.components.submissionLogin.backendAddr | quote }}
    {{- end }}

    {{- if .Values.components.lmtpLogin.enabled }}
    lmtp_login_service:
      {{- if .Values.components.lmtpLogin.directorAddr }}
      director_addr: {{ .Values.components.lmtpLogin.directorAddr | quote }}
      {{- if .Values.components.lmtpLogin.directorTag }}
      director_tag: {{ .Values.components.lmtpLogin.directorTag | quote }}
      {{- end }}
      {{- if .Values.components.lmtpLogin.backendPort }}
      backend_port: {{ .Values.components.lmtpLogin.backendPort }}
      {{- end }}
      {{- else }}
      backend_addr: {{ .Values.components.lmtpLogin.backendAddr | quote }}
      {{- end }}
    {{- end }}

    {{- if ((.Values.components.manageSieveLogin | default dict).enabled) }}
    managesieve_login_service:
      backend_addr: {{ .Values.components.manageSieveLogin.backendAddr | quote }}
      {{- if .Values.components.manageSieveLogin.haProxy }}
      haproxy_protocol: true
      haproxy_timeout: {{ .Values.components.manageSieveLogin.haProxyTimeout }}
      {{- with .Values.components.manageSieveLogin.haProxyNets }}
      haproxy_trusted_nets:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
    {{- end }}

    {{- if .Values.components.backendAPI.enabled }}
    ## yarilo-backend-api consumes this section. Token is loaded from
    ## the Secret at /etc/yarilo/backend-api-token via $BACKEND_API_TOKEN
    ## env so it never lands in the ConfigMap.
    backend_api:
      listen: {{ .Values.components.backendAPI.listen | quote }}
      token: "${BACKEND_API_TOKEN}"
      {{- if .Values.components.backendAPI.authMasterAddr }}
      auth_master_addr: {{ .Values.components.backendAPI.authMasterAddr | quote }}
      {{- else if .Values.components.auth.masterListen }}
      auth_master_addr: {{ printf "%s-auth.%s.svc.cluster.local:%s" (include "yarilo.fullname" .) .Release.Namespace (trimPrefix ":" .Values.components.auth.masterListen) | quote }}
      {{- end }}
      {{- with .Values.components.backendAPI.allowedNets }}
      allowed_nets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}

    {{- if .Values.components.locks.enabled }}
    ## yarilo-locks pod consumes this section. Sessions consume locks_client below.
    locks_service:
      mode: remote
      listen: {{ .Values.components.locks.listen | quote }}
      {{- if .Values.redis.bundled }}
      redis: {{ printf "redis://%s-redis.%s.svc.cluster.local:6379/0" (include "yarilo.fullname" .) .Release.Namespace | quote }}
      {{- else }}
      redis: {{ .Values.redis.externalUrl | quote }}
      {{- end }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5

    ## Every session binary (yarilo-imap / pop3 / submission / lmtp) dials this.
    locks_client:
      mode: remote
      endpoints:
        - {{ printf "%s-locks.%s.svc.cluster.local:9104" (include "yarilo.fullname" .) .Release.Namespace | quote }}
    {{- end }}

    director_service:
      listen: {{ printf ":%d" (int .Values.components.director.directorPort) | quote }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5
      user_expire: {{ .Values.components.director.userExpire }}
      ping_interval: {{ .Values.components.director.pingInterval }}
      ping_timeout: {{ .Values.components.director.pingTimeout }}
      {{- with .Values.components.director.backends }}
      mail_servers:
        {{- range . }}
        - host: {{ .host | quote }}
          port: {{ .port }}
          tag: {{ .tag | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.components.director.peers }}
      peers:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      api:
        listen: {{ printf ":%d" (int .Values.components.director.api.port) | quote }}
        token: "${DIRECTOR_API_TOKEN}"
        allowed_nets:
          {{- range .Values.components.director.api.allowedNets }}
          - {{ . | quote }}
          {{- end }}

    {{- if .Values.components.saslLogin.enabled }}
    sasl_login:
      listen: {{ printf ":%d" (int .Values.components.saslLogin.containerPort) | quote }}
      {{- if .Values.components.saslLogin.authAddr }}
      auth_addr: {{ .Values.components.saslLogin.authAddr | quote }}
      {{- end }}
      {{- with .Values.components.saslLogin.trustedNets }}
      trusted_nets:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      haproxy_protocol: {{ .Values.components.saslLogin.haproxy }}
      {{- if .Values.components.saslLogin.haproxy }}
      haproxy_timeout: {{ .Values.components.saslLogin.haproxyTimeout }}
      {{- with .Values.components.saslLogin.haproxyNets }}
      haproxy_trusted_nets:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
    {{- end }}

    {{- if .Values.components.quotaStatus.enabled }}
    quota_status:
      listen: {{ printf ":%d" (int .Values.components.quotaStatus.containerPort) | quote }}
      {{- with .Values.components.quotaStatus.defaultQuotaRules }}
      default_quota_rules:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.components.quotaStatus.aliasDict }}
      alias_dict: {{ .Values.components.quotaStatus.aliasDict | quote }}
      alias_max_hops: {{ .Values.components.quotaStatus.aliasMaxHops }}
      {{- end }}
      {{- if .Values.components.quotaStatus.authMasterAddr }}
      auth_master_addr: {{ .Values.components.quotaStatus.authMasterAddr | quote }}
      {{- end }}
    {{- end }}

    telemetry:
      listen: {{ .Values.telemetry.listen | quote }}

    log:
      level: {{ .Values.logLevel | quote }}
