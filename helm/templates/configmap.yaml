apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yarilo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.labels" . | nindent 4 }}
data:
  yarilo.yaml: |
    mode: cluster

    general:
      ssl:
        {{- $extTLSSecret := coalesce .Values.components.imapLogin.tls.secretName .Values.components.pop3Login.tls.secretName .Values.components.submissionLogin.tls.secretName }}
        {{- if $extTLSSecret }}
        tls_cert: /etc/yarilo/tls/tls.crt
        tls_key: /etc/yarilo/tls/tls.key
        {{- else }}
        tls_cert: ""
        tls_key: ""
        {{- end }}
        tls_min_version: TLS1.2
      haproxy:
        timeout: {{ .Values.general.haproxy.timeout }}
        trusted_nets:
          {{- range .Values.general.haproxy.trusted_nets }}
          - {{ . | quote }}
          {{- end }}
      xclient:
        trusted_nets:
          {{- range .Values.general.xclient.trusted_nets }}
          - {{ . | quote }}
          {{- end }}
      limits:
        mail_max_userip_connections: {{ .Values.general.limits.max_user_ip_connections }}
      startup_dial_retries: {{ .Values.general.startup_dial_retries | default 3 }}

    services:
      imaps:
        enabled: {{ .Values.components.imapLogin.listeners.imaps.enabled }}
        port: {{ .Values.components.imapLogin.listeners.imaps.containerPort }}
        ssl_mode: ssl
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      imap:
        enabled: {{ .Values.components.imapLogin.listeners.imap.enabled }}
        port: {{ .Values.components.imapLogin.listeners.imap.containerPort }}
        ssl_mode: starttls
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      pop3s:
        enabled: {{ .Values.components.pop3Login.listeners.pop3s.enabled }}
        port: {{ .Values.components.pop3Login.listeners.pop3s.containerPort }}
        ssl_mode: ssl
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      pop3:
        enabled: {{ .Values.components.pop3Login.listeners.pop3.enabled }}
        port: {{ .Values.components.pop3Login.listeners.pop3.containerPort }}
        ssl_mode: starttls
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      lmtp:
        ## Always the lmtp/lmtp-login pods' listener (#748 item 1): the
        ## director's embedded LMTP proxy has its own key
        ## (director_service.lmtp_listen) and must never repurpose this block.
        enabled: {{ .Values.components.lmtp.listeners.lmtp.enabled }}
        port: {{ .Values.components.lmtp.listeners.lmtp.containerPort }}
        ssl_mode: "no"
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
        xclient_protocol: {{ .Values.general.xclient.enabled }}
      submission:
        enabled: {{ .Values.components.submissionLogin.listeners.submission.enabled }}
        port: {{ .Values.components.submissionLogin.listeners.submission.containerPort }}
        ssl_mode: starttls
        disable_plaintext_auth: true
      submissions:
        enabled: {{ .Values.components.submissionLogin.listeners.submissions.enabled }}
        port: {{ .Values.components.submissionLogin.listeners.submissions.containerPort }}
        ssl_mode: ssl
        disable_plaintext_auth: true
      {{- $msLoginL := (((.Values.components.manageSieveLogin | default dict).listeners | default dict).managesieve | default dict) }}
      managesieve:
        enabled: {{ $msLoginL.enabled | default false }}
        port: {{ $msLoginL.containerPort | default 4190 }}
        ssl_mode: starttls
        disable_plaintext_auth: {{ $msLoginL.disablePlainAuth | default false }}
        haproxy_protocol: {{ .Values.general.haproxy.enabled }}
      {{- $msL := (((.Values.components.manageSieve | default dict).listeners | default dict).managesieve | default dict) }}
      managesieve_be:
        enabled: {{ $msL.enabled | default false }}
        port: {{ $msL.containerPort | default 14190 }}
        ssl_mode: "no"

    protocol:
      imap:
        imap_idle_notify_interval: {{ .Values.protocol.imap.imap_idle_notify_interval }}
        imap_max_line_length: {{ .Values.protocol.imap.imap_max_line_length }}
        imap_id_send: {{ .Values.protocol.imap.imap_id_send | quote }}
        login_greeting: {{ .Values.protocol.imap.login_greeting | quote }}
        imap_logout_format: {{ .Values.protocol.imap.imap_logout_format | quote }}
        {{- with .Values.protocol.imap.client_workarounds }}
        client_workarounds:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- with .Values.protocol.imap.imap_special_use_defaults }}
        imap_special_use_defaults:
          {{- range $folder, $attr := . }}
          {{ $folder | quote }}: {{ $attr | quote }}
          {{- end }}
        {{- end }}
      pop3:
        pop3_no_flag_updates: {{ .Values.protocol.pop3.pop3_no_flag_updates }}
        pop3_reuse_xuidl: {{ .Values.protocol.pop3.pop3_reuse_xuidl }}
        pop3_uidl_format: {{ .Values.protocol.pop3.pop3_uidl_format | quote }}
        pop3_uidl_duplicates: {{ .Values.protocol.pop3.pop3_uidl_duplicates | quote }}
        pop3_enable_last: {{ .Values.protocol.pop3.pop3_enable_last }}
        pop3_delete_type: {{ .Values.protocol.pop3.pop3_delete_type | quote }}
        pop3_deleted_flag: {{ .Values.protocol.pop3.pop3_deleted_flag | quote }}
      lmtp:
        login_greeting: {{ .Values.protocol.lmtp.login_greeting | quote }}
        add_received_header: {{ .Values.protocol.lmtp.add_received_header }}
        save_to_detail_mailbox: {{ .Values.protocol.lmtp.save_to_detail_mailbox }}
        hdr_delivery_address: {{ .Values.protocol.lmtp.hdr_delivery_address | quote }}
        verbose_replies: {{ .Values.protocol.lmtp.verbose_replies }}
        user_concurrency_limit: {{ .Values.protocol.lmtp.user_concurrency_limit }}
        read_timeout: {{ .Values.protocol.lmtp.read_timeout }}
        write_timeout: {{ .Values.protocol.lmtp.write_timeout }}
        {{- with .Values.protocol.lmtp.client_workarounds }}
        client_workarounds:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
      submission:
        hostname: {{ .Values.protocol.submission.hostname | quote }}
        max_message_size: {{ int64 .Values.protocol.submission.max_message_size }}
        max_line_length: {{ int .Values.protocol.submission.max_line_length }}
        max_recipients: {{ .Values.protocol.submission.max_recipients }}
        recipient_delimiter: {{ .Values.protocol.submission.recipient_delimiter | quote }}
        submission_add_received_header: {{ .Values.protocol.submission.add_received_header }}
        relay:
          host: {{ .Values.protocol.submission.relay.host | quote }}
          port: {{ .Values.protocol.submission.relay.port }}
          user: {{ .Values.protocol.submission.relay.user | quote }}
          password: {{ .Values.protocol.submission.relay.password | quote }}
          ssl: {{ .Values.protocol.submission.relay.ssl | quote }}
          ssl_verify: {{ .Values.protocol.submission.relay.ssl_verify }}
          trusted: {{ .Values.protocol.submission.relay.trusted }}
          connect_timeout: {{ .Values.protocol.submission.relay.connect_timeout }}
          command_timeout: {{ .Values.protocol.submission.relay.command_timeout }}
      managesieve:
        max_script_size: {{ (.Values.protocol.managesieve | default dict).max_script_size | default 65536 }}
        max_invalid_commands: {{ (.Values.protocol.managesieve | default dict).max_invalid_commands | default 3 }}

    sieve:
      {{- $sieve := (.Values.sieve | default dict) }}
      sieve_enabled: {{ $sieve.sieve_enabled | default false }}
      sieve_default_name: {{ $sieve.sieve_default_name | default "yarilo" | quote }}
      sieve_scripts_driver: {{ $sieve.sieve_scripts_driver | default "fs" | quote }}
      {{- with $sieve.sieve_scripts_dict }}
      sieve_scripts_dict: {{ . | quote }}
      {{- end }}
      sieve_max_script_size: {{ $sieve.sieve_max_script_size | default 65536 }}
      sieve_max_redirects: {{ $sieve.sieve_max_redirects | default 32 }}
      sieve_max_actions: {{ $sieve.sieve_max_actions | default 32 }}
      sieve_duplicate_max_period: {{ $sieve.sieve_duplicate_max_period | default 604800 }}
      sieve_duplicate_driver: {{ $sieve.sieve_duplicate_driver | default "file" | quote }}
      sieve_duplicate_file: {{ $sieve.sieve_duplicate_file | default ".yarilo.sieve-duplicate" | quote }}
      sieve_vacation_enabled: {{ $sieve.sieve_vacation_enabled | default true }}
      sieve_spamtest_status_header: {{ $sieve.sieve_spamtest_status_header | default "" | quote }}
      sieve_spamtest_max_value: {{ $sieve.sieve_spamtest_max_value | default 10 }}
      sieve_virustest_status_header: {{ $sieve.sieve_virustest_status_header | default "" | quote }}
      sieve_virustest_max_value: {{ $sieve.sieve_virustest_max_value | default 5 }}
      sieve_report_user_agent: {{ $sieve.sieve_report_user_agent | default "yarilo" | quote }}
      sieve_submission_host: {{ $sieve.sieve_submission_host | default "" | quote }}
      sieve_submission_ssl: {{ $sieve.sieve_submission_ssl | default "no" | quote }}
      sieve_submission_timeout: {{ $sieve.sieve_submission_timeout | default 30 }}
      sieve_submission_auth_secret: {{ $sieve.sieve_submission_auth_secret | default "" | quote }}
      {{- with $sieve.sieve_extensions }}
      sieve_extensions:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sieve.sieve_environment }}
      sieve_environment:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imapsieve_enabled: {{ index $sieve "imapsieve_enabled" | default false }}
      imapsieve_script_dir: {{ index $sieve "imapsieve_script_dir" | default "" | quote }}
      {{- with $sieve.imapsieve_global_before }}
      imapsieve_global_before:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sieve.imapsieve_global_after }}
      imapsieve_global_after:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      sieve_pipe_bin_dir: {{ index $sieve "sieve_pipe_bin_dir" | default "/usr/lib/yarilo/sieve-pipe" | quote }}
      sieve_pipe_socket_dir: {{ index $sieve "sieve_pipe_socket_dir" | default "sieve-pipe" | quote }}
      sieve_pipe_exec_timeout: {{ index $sieve "sieve_pipe_exec_timeout" | default 10 }}
      sieve_pipe_input_eol: {{ index $sieve "sieve_pipe_input_eol" | default "crlf" | quote }}
      sieve_filter_bin_dir: {{ index $sieve "sieve_filter_bin_dir" | default "/usr/lib/yarilo/sieve-filter" | quote }}
      sieve_filter_socket_dir: {{ index $sieve "sieve_filter_socket_dir" | default "sieve-filter" | quote }}
      sieve_filter_exec_timeout: {{ index $sieve "sieve_filter_exec_timeout" | default 10 }}
      sieve_filter_input_eol: {{ index $sieve "sieve_filter_input_eol" | default "crlf" | quote }}

    auth:
      failure_delay: {{ .Values.components.auth.failure_delay | default 2 }}
      internal_failure_delay_ms: {{ .Values.components.auth.internal_failure_delay_ms | default 2000 }}
      cache:
        size_bytes: {{ .Values.components.auth.cache.size_bytes | default 0 }}
        ttl_seconds: {{ .Values.components.auth.cache.ttl_seconds | default 1800 }}
        negative_ttl_seconds: {{ .Values.components.auth.cache.negative_ttl_seconds | default 1800 }}
      penalty:
        enabled: {{ .Values.components.auth.penalty.enabled | default false }}
      policy:
        url: {{ .Values.components.auth.policy.url | default "" | quote }}
        api_header: {{ .Values.components.auth.policy.api_header | default "" | quote }}
        hash_mech: {{ .Values.components.auth.policy.hash_mech | default "sha256" | quote }}
        hash_nonce: {{ .Values.components.auth.policy.hash_nonce | default "" | quote }}
        hash_truncate_bits: {{ .Values.components.auth.policy.hash_truncate_bits | default 12 }}
        timeout_ms: {{ .Values.components.auth.policy.timeout_ms | default 5000 }}
        reject_on_fail: {{ .Values.components.auth.policy.reject_on_fail | default false }}
        log_only: {{ .Values.components.auth.policy.log_only | default false }}
        check_before: {{ .Values.components.auth.policy.check_before | default true }}
        check_after: {{ .Values.components.auth.policy.check_after | default true }}
        report_after: {{ .Values.components.auth.policy.report_after | default true }}
      oauth2:
        {{- range (.Values.components.auth.oauth2 | default list) }}
        - mode: {{ .mode | quote }}
          {{- with .jwks_url }}
          jwks_url: {{ . | quote }}
          {{- end }}
          {{- with .introspection_url }}
          introspection_url: {{ . | quote }}
          {{- end }}
          {{- with .tokeninfo_url }}
          tokeninfo_url: {{ . | quote }}
          {{- end }}
          {{- with .issuer_url }}
          issuer_url: {{ . | quote }}
          {{- end }}
          {{- with .introspection_mode }}
          introspection_mode: {{ . | quote }}
          {{- end }}
          {{- if .prefer_introspection }}
          prefer_introspection: true
          {{- end }}
          {{- with .client_id }}
          client_id: {{ . | quote }}
          {{- end }}
          {{- with .client_secret }}
          client_secret: {{ . | quote }}
          {{- end }}
          {{- with .issuers }}
          issuers: {{ . | toJson }}
          {{- end }}
          {{- with .audience }}
          audience: {{ . | quote }}
          {{- end }}
          {{- with .scopes }}
          scopes: {{ . | toJson }}
          {{- end }}
          {{- with .username_attribute }}
          username_attribute: {{ . | quote }}
          {{- end }}
          {{- with .username_validation_format }}
          username_validation_format: {{ . | quote }}
          {{- end }}
          {{- with .active_attribute }}
          active_attribute: {{ . | quote }}
          {{- end }}
          {{- with .active_value }}
          active_value: {{ . | quote }}
          {{- end }}
          {{- with .extra_fields }}
          extra_fields: {{ . | toJson }}
          {{- end }}
          {{- with .token_expire_grace_seconds }}
          token_expire_grace_seconds: {{ . }}
          {{- end }}
          {{- with .http_timeout_ms }}
          http_timeout_ms: {{ . }}
          {{- end }}
        {{- end }}
      passdb:
        {{- range .Values.components.auth.passdb }}
        - driver: {{ .driver | quote }}
          {{- with .dsn }}
          dsn: {{ . | quote }}
          {{- end }}
          {{- with .passwd_file }}
          passwd_file: {{ . | quote }}
          {{- end }}
          {{- with .password_query }}
          password_query: |
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .user_query }}
          user_query: |
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .iterate_query }}
          iterate_query: |
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .default_pass_scheme }}
          default_pass_scheme: {{ . | quote }}
          {{- end }}
          {{- if .skip_schema }}
          skip_schema: true
          {{- end }}
          {{- with .static_password }}
          static_password: {{ . | quote }}
          {{- end }}
          {{- if .nopassword }}
          nopassword: true
          {{- end }}
          {{- with .fields }}
          fields:
            {{- range $k, $v := . }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
      master_users:
        enabled: {{ .Values.components.auth.master_users.enabled | default false }}
        separator: {{ .Values.components.auth.master_users.separator | default "*" | quote }}
        masterdb:
          {{- range (.Values.components.auth.master_users.masterdb | default list) }}
          - driver: {{ .driver | quote }}
            {{- with .dsn }}
            dsn: {{ . | quote }}
            {{- end }}
            {{- with .passwd_file }}
            passwd_file: {{ . | quote }}
            {{- end }}
            {{- with .password_query }}
            password_query: |
              {{- . | nindent 14 }}
            {{- end }}
            {{- with .user_query }}
            user_query: |
              {{- . | nindent 14 }}
            {{- end }}
            {{- with .iterate_query }}
            iterate_query: |
              {{- . | nindent 14 }}
            {{- end }}
            {{- with .default_pass_scheme }}
            default_pass_scheme: {{ . | quote }}
            {{- end }}
            {{- if .skip_schema }}
            skip_schema: true
            {{- end }}
          {{- end }}
      token:
        ttl_seconds: {{ .Values.components.auth.token.ttl_seconds | default 60 }}
        backend: {{ .Values.components.auth.token.backend | default "memory" | quote }}
        {{- with .Values.components.auth.token.redis_addr }}
        redis_addr: {{ . | quote }}
        {{- end }}

    {{- with .Values.acl }}
    acl:
      enabled: {{ .enabled | default false }}
      defaults_from_inbox: {{ .defaults_from_inbox | default false }}
      globals_only: {{ .globals_only | default false }}
      {{- with .global }}
      global:
        {{- range . }}
        - mailbox: {{ .mailbox | default "*" | quote }}
          entries:
            {{- range .entries }}
            - identifier: {{ .identifier | quote }}
              rights: {{ .rights | quote }}
            {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}

    {{- if $.Values.fts.enabled }}
    fts:
      enabled: true
      fts_engine: {{ $.Values.fts.fts_engine | quote }}
      fts_mode: {{ $.Values.fts.fts_mode | quote }}
      fts_addr: {{ $.Values.fts.fts_addr | default (printf "%s-fts:%d" (include "yarilo.fullname" .) (int $.Values.components.fts.port)) | quote }}
      fts_listen: {{ $.Values.fts.fts_listen | quote }}
      fts_auth_master_addr: {{ $.Values.fts.fts_auth_master_addr | quote }}
      fts_autoindex: {{ $.Values.fts.fts_autoindex }}
      fts_autoindex_max_recent_msgs: {{ $.Values.fts.fts_autoindex_max_recent_msgs }}
      fts_message_max_size: {{ $.Values.fts.fts_message_max_size }}
      fts_header_includes: {{ $.Values.fts.fts_header_includes | toJson }}
      fts_header_excludes: {{ $.Values.fts.fts_header_excludes | toJson }}
      fts_commit_limit: {{ $.Values.fts.fts_commit_limit }}
      fts_search_add_missing: {{ $.Values.fts.fts_search_add_missing | quote }}
      fts_search_read_fallback: {{ $.Values.fts.fts_search_read_fallback }}
      fts_search_timeout_secs: {{ $.Values.fts.fts_search_timeout_secs }}
      fts_search_strict: {{ $.Values.fts.fts_search_strict }}
      fts_search: {{ $.Values.fts.fts_search | default true }}
      languages: {{ $.Values.fts.languages | toJson }}
      language_filters: {{ $.Values.fts.language_filters | toJson }}
      {{- with $.Values.fts.fts_language_filters_override }}
      fts_language_filters_override:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      fts_language_tokenizer_generic_token_maxlen: {{ $.Values.fts.fts_language_tokenizer_generic_token_maxlen | default 0 }}
      fts_language_tokenizer_address_token_maxlen: {{ $.Values.fts.fts_language_tokenizer_address_token_maxlen | default 0 }}
      fts_language_tokenizer_generic_algorithm: {{ $.Values.fts.fts_language_tokenizer_generic_algorithm | default "simple" | quote }}
      fts_language_tokenizer_generic_wb5a: {{ $.Values.fts.fts_language_tokenizer_generic_wb5a | default false }}
      fts_language_tokenizer_generic_explicit_prefix: {{ $.Values.fts.fts_language_tokenizer_generic_explicit_prefix | default false }}
      fts_detection_sample_bytes: {{ $.Values.fts.fts_detection_sample_bytes }}
      fts_detection_min_runes: {{ $.Values.fts.fts_detection_min_runes }}
      fts_flatcurve_commit_limit: {{ $.Values.fts.fts_flatcurve_commit_limit }}
      fts_flatcurve_min_term_size: {{ $.Values.fts.fts_flatcurve_min_term_size }}
      fts_flatcurve_optimize_limit: {{ $.Values.fts.fts_flatcurve_optimize_limit }}
      fts_flatcurve_rotate_count: {{ $.Values.fts.fts_flatcurve_rotate_count }}
      fts_flatcurve_rotate_time: {{ $.Values.fts.fts_flatcurve_rotate_time }}
      fts_flatcurve_substring_search: {{ $.Values.fts.fts_flatcurve_substring_search }}
      fts_decoder_driver: {{ $.Values.fts.fts_decoder_driver | quote }}
      fts_decoder_script_addr: {{ $.Values.fts.fts_decoder_script_addr | quote }}
      fts_decoder_tika_url: {{ $.Values.fts.fts_decoder_tika_url | quote }}
      fts_decoder_max_size: {{ $.Values.fts.fts_decoder_max_size }}
      fts_decoder_timeout_secs: {{ $.Values.fts.fts_decoder_timeout_secs }}
      fts_decoder_max_attempts: {{ $.Values.fts.fts_decoder_max_attempts }}
      fts_dedup_body_parts: {{ $.Values.fts.fts_dedup_body_parts }}
    {{- end }}
    {{- with .Values.quota }}
    quota:
      enabled: {{ .enabled | default false }}
      {{- if .quota_name }}
      quota_name: {{ .quota_name | quote }}
      {{- end }}
      {{- if .quota_exceeded_message }}
      quota_exceeded_message: {{ .quota_exceeded_message | quote }}
      {{- end }}
      {{- if .quota_mail_size }}
      quota_mail_size: {{ .quota_mail_size | quote }}
      {{- end }}
      {{- if .quota_storage_percentage }}
      quota_storage_percentage: {{ .quota_storage_percentage }}
      {{- end }}
      {{- if .quota_message_percentage }}
      quota_message_percentage: {{ .quota_message_percentage }}
      {{- end }}
      {{- if .quota_storage_extra }}
      quota_storage_extra: {{ .quota_storage_extra | quote }}
      {{- end }}
      {{- if .quota_grace }}
      quota_grace: {{ .quota_grace | quote }}
      {{- end }}
      {{- if .quota_ignore_unlimited }}
      quota_ignore_unlimited: true
      {{- end }}
      {{- if .quota_mailbox_count }}
      quota_mailbox_count: {{ .quota_mailbox_count }}
      {{- end }}
      {{- if .quota_mailbox_message_count }}
      quota_mailbox_message_count: {{ .quota_mailbox_message_count }}
      {{- end }}
      {{- if .quota_hidden }}
      quota_hidden: true
      {{- end }}
      {{- if .quota_warning_bin_dir }}
      quota_warning_bin_dir: {{ .quota_warning_bin_dir | quote }}
      {{- end }}
      {{- if .quota_warning_exec_timeout }}
      quota_warning_exec_timeout: {{ .quota_warning_exec_timeout }}
      {{- end }}
      {{- with .quota_warnings }}
      quota_warnings:
        {{- range . }}
        - quota_warning_name: {{ .quota_warning_name | quote }}
          quota_warning_resource: {{ .quota_warning_resource | default "storage" | quote }}
          quota_warning_threshold: {{ .quota_warning_threshold | default "over" | quote }}
          quota_warning_percentage: {{ .quota_warning_percentage | default 90 }}
          quota_warning_execute: {{ .quota_warning_execute | quote }}
        {{- end }}
      {{- end }}
      {{- with .quota_clone_dicts }}
      quota_clone_dicts:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .quota_clone_flush_delay }}
      quota_clone_flush_delay: {{ .quota_clone_flush_delay }}
      {{- end }}
      {{- if .quota_over_status_mask }}
      quota_over_status_mask: {{ .quota_over_status_mask | quote }}
      {{- end }}
      {{- if .quota_over_status_lazy_check }}
      quota_over_status_lazy_check: true
      {{- end }}
      {{- if .quota_over_status_execute }}
      quota_over_status_execute: {{ .quota_over_status_execute | quote }}
      {{- end }}
    {{- end }}

    {{- with .Values.namespaces }}
    namespaces:
      {{- range . }}
      - type: {{ .type | quote }}
        prefix: {{ .prefix | default "" | quote }}
        separator: {{ .separator | default "." | quote }}
        list: {{ .list | default false }}
        subscriptions: {{ .subscriptions | default false }}
        inbox: {{ .inbox | default false }}
        acl_ignore: {{ .acl_ignore | default false }}
        {{- with .location }}
        location: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}

    {{- $storage := .Values.storage }}
    {{- if $storage }}
    storage:
      mailbox: {{ $storage.mailbox | quote }}
      maildir_root: {{ $storage.maildir_root | quote }}
      mail_home_template: {{ $storage.mail_home_template | quote }}
      index: {{ $storage.index | quote }}
      {{- if $storage.mdbox_alt_storage_path }}
      mdbox_alt_storage_path: {{ $storage.mdbox_alt_storage_path | quote }}
      {{- end }}
      {{- if $storage.index_dir }}
      index_dir: {{ $storage.index_dir | quote }}
      {{- end }}
      {{- if $storage.control_dir }}
      control_dir: {{ $storage.control_dir | quote }}
      {{- end }}
      {{- if $storage.volatile_dir }}
      volatile_dir: {{ $storage.volatile_dir | quote }}
      {{- end }}
      {{- if $storage.alt_dir }}
      alt_dir: {{ $storage.alt_dir | quote }}
      {{- end }}
      {{- if $storage.index_log_compact_min_bytes }}
      index_log_compact_min_bytes: {{ $storage.index_log_compact_min_bytes }}
      {{- end }}
      {{- if $storage.index_log_compact_max_bytes }}
      index_log_compact_max_bytes: {{ $storage.index_log_compact_max_bytes }}
      {{- end }}
      {{- if $storage.index_log_compact_min_age_secs }}
      index_log_compact_min_age_secs: {{ $storage.index_log_compact_min_age_secs }}
      {{- end }}
      {{- if $storage.max_concurrent_writes }}
      max_concurrent_writes: {{ $storage.max_concurrent_writes }}
      {{- end }}
      {{- if $storage.mdbox_rotate_size }}
      mdbox_rotate_size: {{ $storage.mdbox_rotate_size | quote }}
      {{- end }}
      {{- if $storage.mdbox_rotate_interval }}
      mdbox_rotate_interval: {{ $storage.mdbox_rotate_interval | quote }}
      {{- end }}
      {{- if $storage.mdbox_preallocate_space }}
      mdbox_preallocate_space: {{ $storage.mdbox_preallocate_space }}
      {{- end }}
    {{- end }}

    {{- with .Values.dicts }}
    dicts:
      {{- range $name, $d := . }}
      {{ $name }}:
        driver: {{ $d.driver | quote }}
        {{- with $d.settings }}
        settings:
          {{- range $k, $v := . }}
          {{ $k }}: {{ $v | toJson }}
          {{- end }}
        {{- end }}
        {{- if $d.expire_secs }}
        expire_secs: {{ $d.expire_secs }}
        {{- end }}
      {{- end }}
    {{- end }}

    internal_tls:
      {{- $msTLSEnabled := ((.Values.components.manageSieve | default dict).internalTLS | default dict).enabled }}
      {{- $msLoginTLSEnabled := ((.Values.components.manageSieveLogin | default dict).internalTLS | default dict).enabled }}
      {{- $anyTLS := or .Values.components.director.internalTLS.enabled .Values.components.auth.internalTLS.enabled .Values.components.anvil.internalTLS.enabled .Values.components.imap.internalTLS.enabled .Values.components.pop3.internalTLS.enabled .Values.components.lmtp.internalTLS.enabled .Values.components.imapLogin.internalTLS.enabled .Values.components.pop3Login.internalTLS.enabled .Values.components.submissionLogin.internalTLS.enabled $msTLSEnabled $msLoginTLSEnabled }}
      enabled: {{ $anyTLS | default false }}
      {{- $tlsSecret := coalesce .Values.components.director.internalTLS.secretName .Values.components.auth.internalTLS.secretName .Values.components.anvil.internalTLS.secretName .Values.components.imap.internalTLS.secretName }}
      {{- if $tlsSecret }}
      cert: /etc/yarilo/internal-tls/tls.crt
      key: /etc/yarilo/internal-tls/tls.key
      ca: /etc/yarilo/internal-tls/ca.crt
      {{- else }}
      cert: ""
      key: ""
      ca: ""
      {{- end }}

    auth_service:
      listen: {{ .Values.components.auth.listen | quote }}
      {{- if .Values.components.auth.addr }}
      addr: {{ .Values.components.auth.addr | quote }}
      {{- else }}
      addr: {{ printf "%s-auth.%s.svc.cluster.local:%s" (include "yarilo.fullname" .) .Release.Namespace (trimPrefix ":" .Values.components.auth.listen) | quote }}
      {{- end }}
      {{- if .Values.components.auth.masterListen }}
      master_listen: {{ .Values.components.auth.masterListen | quote }}
      master_addr: {{ printf "%s-auth.%s.svc.cluster.local:%s" (include "yarilo.fullname" .) .Release.Namespace (trimPrefix ":" .Values.components.auth.masterListen) | quote }}
      {{- end }}
      {{- if .Values.components.auth.saslListen }}
      sasl_listen: {{ .Values.components.auth.saslListen | quote }}
      {{- end }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5

    anvil_service:
      listen: {{ .Values.components.anvil.listen | quote }}
      addr: {{ printf "%s-anvil%s" (include "yarilo.fullname" .) .Values.components.anvil.listen | quote }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5

    {{- if .Values.components.imapLogin.enabled }}
    imap_login_service:
      backend_addr: {{ .Values.components.imapLogin.backend_addr | quote }}
      director_addr: {{ .Values.components.imapLogin.director_addr | quote }}
      backend_port: {{ .Values.components.imapLogin.backend_port | default 0 }}
      director_tag: {{ .Values.components.imapLogin.director_tag | quote }}
    {{- end }}

    {{- if .Values.components.pop3Login.enabled }}
    pop3_login_service:
      backend_addr: {{ .Values.components.pop3Login.backend_addr | quote }}
      director_addr: {{ .Values.components.pop3Login.director_addr | quote }}
      backend_port: {{ .Values.components.pop3Login.backend_port | default 0 }}
      director_tag: {{ .Values.components.pop3Login.director_tag | quote }}
    {{- end }}

    {{- if .Values.components.submissionLogin.enabled }}
    submission_login_service:
      backend_addr: {{ .Values.components.submissionLogin.backend_addr | quote }}
      director_addr: {{ .Values.components.submissionLogin.director_addr | quote }}
      backend_port: {{ .Values.components.submissionLogin.backend_port | default 0 }}
      director_tag: {{ .Values.components.submissionLogin.director_tag | quote }}
    {{- end }}

    {{- if .Values.components.lmtpLogin.enabled }}
    lmtp_login_service:
      {{- if .Values.components.lmtpLogin.director_addr }}
      director_addr: {{ .Values.components.lmtpLogin.director_addr | quote }}
      {{- if .Values.components.lmtpLogin.director_tag }}
      director_tag: {{ .Values.components.lmtpLogin.director_tag | quote }}
      {{- end }}
      {{- if .Values.components.lmtpLogin.backend_port }}
      backend_port: {{ .Values.components.lmtpLogin.backend_port }}
      {{- end }}
      {{- else }}
      backend_addr: {{ .Values.components.lmtpLogin.backend_addr | quote }}
      {{- end }}
    {{- end }}

    {{- if ((.Values.components.manageSieveLogin | default dict).enabled) }}
    managesieve_login_service:
      backend_addr: {{ .Values.components.manageSieveLogin.backend_addr | quote }}
      director_addr: {{ .Values.components.manageSieveLogin.director_addr | quote }}
      backend_port: {{ .Values.components.manageSieveLogin.backend_port | default 0 }}
      director_tag: {{ .Values.components.manageSieveLogin.director_tag | quote }}
      {{- if .Values.components.manageSieveLogin.haproxy_protocol }}
      haproxy_protocol: true
      haproxy_timeout: {{ .Values.components.manageSieveLogin.haproxy_timeout }}
      {{- with .Values.components.manageSieveLogin.haproxy_nets }}
      haproxy_trusted_nets:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
    {{- end }}

    {{- if .Values.components.backendAPI.enabled }}
    ## yarilo-backend-api consumes this section. Token is loaded from
    ## the Secret at /etc/yarilo/backend-api-token via $BACKEND_API_TOKEN
    ## env so it never lands in the ConfigMap.
    backend_api:
      listen: {{ .Values.components.backendAPI.listen | quote }}
      token: "${BACKEND_API_TOKEN}"
      {{- if .Values.components.backendAPI.auth_master_addr }}
      auth_master_addr: {{ .Values.components.backendAPI.auth_master_addr | quote }}
      {{- else if .Values.components.auth.masterListen }}
      auth_master_addr: {{ printf "%s-auth.%s.svc.cluster.local:%s" (include "yarilo.fullname" .) .Release.Namespace (trimPrefix ":" .Values.components.auth.masterListen) | quote }}
      {{- end }}
      {{- with .Values.components.backendAPI.allowed_nets }}
      allowed_nets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}

    {{- if .Values.components.locks.enabled }}
    ## yarilo-locks pod consumes this section. Sessions consume locks_client below.
    locks_service:
      mode: remote
      listen: {{ .Values.components.locks.listen | quote }}
      {{- if .Values.redis.bundled }}
      redis: {{ printf "redis://%s-redis.%s.svc.cluster.local:6379/0" (include "yarilo.fullname" .) .Release.Namespace | quote }}
      {{- else }}
      redis: {{ .Values.redis.externalUrl | quote }}
      {{- end }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5

    ## Every session binary (yarilo-imap / pop3 / submission / lmtp) dials this.
    locks_client:
      mode: remote
      endpoints:
        - {{ printf "%s-locks.%s.svc.cluster.local:9104" (include "yarilo.fullname" .) .Release.Namespace | quote }}
    {{- end }}

    director_service:
      listen: {{ printf ":%d" (int .Values.components.director.directorPort) | quote }}
      shutdown:
        session_grace_period: 30
        kill_timeout: 5
      user_expire: {{ .Values.components.director.user_expire }}
      ping_interval: {{ .Values.components.director.ping_interval }}
      ping_timeout: {{ .Values.components.director.ping_timeout }}
      username_hash_lowercase: {{ .Values.components.director.username_hash_lowercase }}
      ring_secret: {{ .Values.components.director.ring_secret | quote }}
      min_members: {{ .Values.components.director.min_members }}
      anti_entropy_interval: {{ .Values.components.director.anti_entropy_interval }}
      seed_poll_interval: {{ .Values.components.director.seed_poll_interval }}
      seed_poll_idle_interval: {{ .Values.components.director.seed_poll_idle_interval }}
      {{- with .Values.components.director.backends }}
      mail_servers:
        {{- range . }}
        - host: {{ .host | quote }}
          port: {{ .port }}
          tag: {{ .tag | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.components.director.listeners.lmtp.enabled }}
      lmtp_listen: {{ printf ":%d" (int .Values.components.director.listeners.lmtp.containerPort) | quote }}
      {{- end }}
      ## Seed list for the self-organizing ring (#750). An explicit
      ## peers override wins; otherwise, at replicas > 1, the seed is
      ## auto-derived to the HEADLESS -director-ring Service (#751/#764),
      ## NEVER the ClusterIP -director Service. This matters: the ring
      ## seed must resolve to every director pod's IP so the DNS fan-out
      ## (#763) can poll each peer directly. The ClusterIP -director
      ## resolves to a single virtual IP, which load-balances every dial
      ## randomly (including back to self) and silently reintroduces the
      ## formation partition #759 fought — that Service stays the LOOKUP
      ## endpoint for login pods, not the ring seed. A lone replica
      ## (N=1) needs no seed at all.
      {{- $peers := .Values.components.director.peers }}
      {{- if and (not $peers) (gt (int .Values.components.director.replicas) 1) }}
      {{- $peers = list (printf "%s-director-ring:%v" (include "yarilo.fullname" .) (int .Values.components.director.directorPort)) }}
      {{- end }}
      {{- with $peers }}
      peers:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      api:
        listen: {{ printf ":%d" (int .Values.components.director.api.port) | quote }}
        token: "${DIRECTOR_API_TOKEN}"
        allowed_nets:
          {{- range .Values.components.director.api.allowed_nets }}
          - {{ . | quote }}
          {{- end }}

    {{- if .Values.components.saslLogin.enabled }}
    sasl_login:
      listen: {{ printf ":%d" (int .Values.components.saslLogin.containerPort) | quote }}
      {{- if .Values.components.saslLogin.auth_addr }}
      auth_addr: {{ .Values.components.saslLogin.auth_addr | quote }}
      {{- end }}
      {{- with .Values.components.saslLogin.trusted_nets }}
      trusted_nets:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      haproxy_protocol: {{ .Values.components.saslLogin.haproxy }}
      {{- if .Values.components.saslLogin.haproxy }}
      haproxy_timeout: {{ .Values.components.saslLogin.haproxy_timeout }}
      {{- with .Values.components.saslLogin.haproxy_nets }}
      haproxy_trusted_nets:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
    {{- end }}

    {{- if .Values.components.quotaStatus.enabled }}
    quota_status:
      listen: {{ printf ":%d" (int .Values.components.quotaStatus.containerPort) | quote }}
      {{- if .Values.components.quotaStatus.recipient_delimiter }}
      recipient_delimiter: {{ .Values.components.quotaStatus.recipient_delimiter | quote }}
      {{- end }}
      {{- if hasKey .Values.components.quotaStatus "quota_status_nouser" }}
      quota_status_nouser: {{ .Values.components.quotaStatus.quota_status_nouser | quote }}
      {{- end }}
      {{- with .Values.components.quotaStatus.default_quota_rules }}
      default_quota_rules:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.components.quotaStatus.alias_dict }}
      alias_dict: {{ .Values.components.quotaStatus.alias_dict | quote }}
      alias_max_hops: {{ .Values.components.quotaStatus.alias_max_hops }}
      {{- end }}
      {{- if .Values.components.quotaStatus.auth_master_addr }}
      auth_master_addr: {{ .Values.components.quotaStatus.auth_master_addr | quote }}
      {{- end }}
    {{- end }}

    telemetry:
      listen: {{ .Values.telemetry.listen | quote }}

    log:
      level: {{ .Values.logLevel | quote }}
