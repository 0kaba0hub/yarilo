{{- if .Values.components.locks.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-locks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "locks") | nindent 4 }}
spec:
  replicas: {{ .Values.components.locks.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "locks") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "locks") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "yarilo.initWaitTCP" (dict "name" "wait-redis" "host" (include "yarilo.redisInitHost" .) "port" (include "yarilo.redisInitPort" .) "image" (.Values.initContainerImage | default "busybox:1.36")) | nindent 8 }}
        {{- /* No wait-db here on purpose: yarilo-locks never touches SQL. Both of its
               modes are in-memory (embedded) or Redis-backed (remote) — grep the
               binary and pkg/locks for database/sql and there is nothing. Waiting for
               a database it does not use would only delay startup. */}}
      containers:
        - name: yarilo-locks
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-locks"
            - name: LOG_LEVEL
              value: {{ include "yarilo.logLevel" (dict "name" "yarilo-locks" "root" $) | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: locks
              containerPort: 9104
              protocol: TCP
            - name: telemetry
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.components.locks.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: varlib
              mountPath: /var/lib/yarilo
            - name: tmp
              mountPath: /tmp
            {{- include "yarilo.internalTLSMount" .Values.components.locks.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: varlib
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "yarilo.internalTLSVolume" .Values.components.locks.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
