{{- if .Values.components.director.enabled }}
{{- if .Values.components.director.listeners.lmtp.enabled }}
## LoadBalancer — LMTP (incoming mail delivery from MX). Named -director-lmtp
## (#748 item 3): the plain -director name is the stable ClusterIP login pods
## dial for LOOKUP, and must not depend on the LMTP listener toggle.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-director-lmtp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
  {{- with .Values.components.director.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.components.director.service.type }}
  {{- if .Values.components.director.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.components.director.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: lmtp
      port: {{ .Values.components.director.listeners.lmtp.port }}
      targetPort: lmtp
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "director") | nindent 4 }}
{{- end }}
---
## Stable ClusterIP — director LOOKUP endpoint for login pods (#748 item 3).
## This is the address components.*.director_addr should use:
##   <release>-director:{{ .Values.components.director.directorPort }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-director
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: director
      port: {{ .Values.components.director.directorPort }}
      targetPort: director
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "director") | nindent 4 }}
---
## Headless — StatefulSet per-pod DNS for peer ring-sync (#748 item 2):
## <sts-pod>.<release>-director-ring.<ns>.svc resolves only through a
## headless governing Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-director-ring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: director
      port: {{ .Values.components.director.directorPort }}
      targetPort: director
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "director") | nindent 4 }}
---
## ClusterIP — admin API (yarilo-admin CLI)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-director-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.components.director.api.port }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "director") | nindent 4 }}
---
## ClusterIP — telemetry / health
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-director-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "director") | nindent 4 }}
{{- end }}
