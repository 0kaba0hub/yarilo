{{- if .Values.components.imap.enabled }}
## ClusterIP — IMAP backend (director proxies 993/143 here)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-imap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "imap") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: imap
      port: 993
      targetPort: imap
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "imap") | nindent 4 }}
---
## ClusterIP — telemetry / health
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-imap-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "imap") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "imap") | nindent 4 }}
{{- end }}
