{{- if .Values.components.pop3Login.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-pop3-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "pop3-login") | nindent 4 }}
spec:
  replicas: {{ .Values.components.pop3Login.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "pop3-login") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "pop3-login") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.gracefulShutdown.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "yarilo.initWaitTCP" (dict "name" "wait-auth" "host" (printf "%s-auth.%s.svc" (include "yarilo.fullname" .) .Release.Namespace) "port" "9100" "image" (.Values.initContainerImage | default "busybox:1.36")) | nindent 8 }}
        {{- if .Values.components.anvil.enabled }}
        {{- include "yarilo.initWaitTCP" (dict "name" "wait-anvil" "host" (printf "%s-anvil.%s.svc" (include "yarilo.fullname" .) .Release.Namespace) "port" "9101" "image" (.Values.initContainerImage | default "busybox:1.36")) | nindent 8 }}
        {{- end }}
      containers:
        - name: yarilo-pop3-login
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-pop3-login"
            - name: LOG_LEVEL
              value: {{ include "yarilo.logLevel" (dict "name" "yarilo-pop3-login" "root" $) | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            {{- if .Values.components.pop3Login.listeners.pop3s.enabled }}
            - name: pop3s
              containerPort: {{ .Values.components.pop3Login.listeners.pop3s.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.pop3Login.listeners.pop3.enabled }}
            - name: pop3
              containerPort: {{ .Values.components.pop3Login.listeners.pop3.containerPort }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- include "yarilo.preStopDrain" . | nindent 10 }}
          resources:
            {{- toYaml .Values.components.pop3Login.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "yarilo.externalTLSMount" .Values.components.pop3Login.tls.secretName | nindent 12 }}
            {{- include "yarilo.internalTLSMount" .Values.components.pop3Login.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- include "yarilo.externalTLSVolume" .Values.components.pop3Login.tls.secretName | nindent 8 }}
        {{- include "yarilo.internalTLSVolume" .Values.components.pop3Login.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
