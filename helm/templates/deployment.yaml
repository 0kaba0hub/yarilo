apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "yarilo.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate   # ensures old pod releases the PVC before new pod mounts it
  template:
    metadata:
      labels:
        {{- include "yarilo.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: yarilo
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/yarilo/yarilo.yaml
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.services.imaps.enabled }}
            - name: imaps
              containerPort: {{ .Values.services.imaps.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.services.imap.enabled }}
            - name: imap
              containerPort: {{ .Values.services.imap.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.services.submission.enabled }}
            - name: submission
              containerPort: {{ .Values.services.submission.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.services.submissions.enabled }}
            - name: submissions
              containerPort: {{ .Values.services.submissions.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.services.pop3.enabled }}
            - name: pop3
              containerPort: {{ .Values.services.pop3.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.services.pop3s.enabled }}
            - name: pop3s
              containerPort: {{ .Values.services.pop3s.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.services.lmtp.enabled }}
            - name: lmtp
              containerPort: {{ .Values.services.lmtp.port }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: mail
              mountPath: {{ .Values.storage.maildirRoot }}
            - name: varlib
              mountPath: /var/lib/yarilo
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/yarilo/tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: mail
          {{- if .Values.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.storage.persistence.existingClaim | default (printf "%s-mail" (include "yarilo.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: varlib
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
