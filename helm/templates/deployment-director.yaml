{{- if .Values.components.director.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-director
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
spec:
  replicas: {{ .Values.components.director.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "director") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: yarilo-director
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-director"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DIRECTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-director-api-token" (include "yarilo.fullname" .) }}
                  key: token
            - name: DIRECTOR_RING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-director-ring-secret" (include "yarilo.fullname" .) }}
                  key: secret
            {{- include "yarilo.adminDirectorEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: director
              containerPort: {{ .Values.components.director.directorPort }}
              protocol: TCP
            {{- if .Values.components.director.listeners.lmtp.enabled }}
            - name: lmtp
              containerPort: {{ .Values.components.director.listeners.lmtp.containerPort }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: 8080
              protocol: TCP
            - name: api
              containerPort: {{ .Values.components.director.api.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.components.director.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "yarilo.internalTLSMount" .Values.components.director.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.components.director.monitor.enabled }}
        ## Backend-health monitor sidecar (#748 item 4): probes ring backends
        ## and feeds BACKEND-UP/FLUSH/DOWN to the local director over
        ## 127.0.0.1. Without it a backend pod restart leaves the director on
        ## a stale IP until the director itself restarts.
        - name: yarilo-monitor
          image: {{ .Values.components.director.monitor.image | default (include "yarilo.image" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["yarilo-monitor"]
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-monitor"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MONITOR_CONFIG
              value: /etc/yarilo-monitor/monitor.yaml
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: monitor-config
              mountPath: /etc/yarilo-monitor
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.components.director.monitor.enabled }}
        - name: monitor-config
          configMap:
            name: {{ include "yarilo.fullname" . }}-monitor
        {{- end }}
        {{- include "yarilo.internalTLSVolume" .Values.components.director.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
