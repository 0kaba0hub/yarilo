{{- if .Values.components.director.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-director
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 4 }}
spec:
  replicas: {{ .Values.components.director.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "director") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "director") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: yarilo-director
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-director"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: director
              containerPort: {{ .Values.components.director.directorPort }}
              protocol: TCP
            {{- if .Values.components.director.listeners.imaps.enabled }}
            - name: imaps
              containerPort: {{ .Values.components.director.listeners.imaps.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.director.listeners.imap.enabled }}
            - name: imap
              containerPort: {{ .Values.components.director.listeners.imap.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.director.listeners.pop3s.enabled }}
            - name: pop3s
              containerPort: {{ .Values.components.director.listeners.pop3s.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.director.listeners.pop3.enabled }}
            - name: pop3
              containerPort: {{ .Values.components.director.listeners.pop3.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.director.listeners.lmtp.enabled }}
            - name: lmtp
              containerPort: {{ .Values.components.director.listeners.lmtp.containerPort }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: 8080
              protocol: TCP
            - name: api
              containerPort: {{ .Values.components.director.api.port }}
              protocol: TCP
          {{- if .Values.components.director.api.tokenSecret.name }}
          env:
            - name: DIRECTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.components.director.api.tokenSecret.name }}
                  key: {{ .Values.components.director.api.tokenSecret.key }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.components.director.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "yarilo.externalTLSMount" .Values.components.director.tls.secretName | nindent 12 }}
            {{- include "yarilo.internalTLSMount" .Values.components.director.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- include "yarilo.externalTLSVolume" .Values.components.director.tls.secretName | nindent 8 }}
        {{- include "yarilo.internalTLSVolume" .Values.components.director.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
