{{- if and ((.Values.components.jmap | default dict).enabled) (not .Values.components.backend.coLocated) }}
## Headless — JMAP backend pods (internal, reached by the login pod).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-jmap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "jmap") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: jmap
      port: {{ .Values.components.jmap.listeners.jmap.containerPort }}
      targetPort: jmap
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "jmap") | nindent 4 }}
---
## ClusterIP — telemetry / health
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-jmap-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "jmap") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "jmap") | nindent 4 }}
{{- end }}
