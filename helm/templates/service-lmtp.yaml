{{- if .Values.components.lmtp.enabled }}
## ClusterIP — LMTP backend (MTA delivers here via director)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-lmtp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: lmtp
      port: 24
      targetPort: lmtp
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
---
## ClusterIP — telemetry / health
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-lmtp-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
{{- end }}
