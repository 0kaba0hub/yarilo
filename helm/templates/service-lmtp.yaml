{{- if and .Values.components.lmtp.enabled (not .Values.components.backend.coLocated) }}
## Headless — LMTP backend pods (director resolves A-records → individual pod IPs)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-lmtp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: lmtp
      port: {{ .Values.components.lmtp.listeners.lmtp.servicePort }}
      targetPort: lmtp
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
---
## ClusterIP — telemetry / health
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-lmtp-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "lmtp") | nindent 4 }}
{{- end }}
