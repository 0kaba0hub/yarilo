{{- $imapCert := .Values.components.imapLogin.tls.certificate }}
{{- $imapSecret := .Values.components.imapLogin.tls.secretName }}
{{- if and $imapCert.enabled $imapSecret }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "yarilo.fullname" . }}-imap-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.labels" . | nindent 4 }}
spec:
  secretName: {{ $imapSecret }}
  issuerRef:
    kind: {{ $imapCert.issuerRef.kind }}
    name: {{ $imapCert.issuerRef.name }}
  dnsNames:
    {{- range $imapCert.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  {{- with $imapCert.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with $imapCert.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
{{- end }}
