{{- if .Values.components.submission.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-submission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "submission") | nindent 4 }}
spec:
  replicas: {{ .Values.components.submission.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "submission") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "submission") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if include "yarilo.dbInitHost" . }}
        {{- include "yarilo.initWaitTCP" (dict "name" "wait-db" "host" (include "yarilo.dbInitHost" .) "port" (include "yarilo.dbInitPort" .) "image" (.Values.initContainerImage | default "busybox:1.36")) | nindent 8 }}
        {{- end }}
      containers:
        - name: yarilo-submission
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-submission"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- include "yarilo.adminBackendEnv" . | nindent 12 }}
            {{- include "yarilo.dbEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            {{- if .Values.components.submission.listeners.submission.enabled }}
            - name: submission
              containerPort: {{ .Values.components.submission.listeners.submission.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.submission.listeners.submissions.enabled }}
            - name: submissions
              containerPort: {{ .Values.components.submission.listeners.submissions.containerPort }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.components.submission.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.components.submission.tls.secretName }}
            - name: tls
              mountPath: /etc/yarilo/tls
              readOnly: true
            {{- end }}
            {{- include "yarilo.internalTLSMount" .Values.components.submission.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.components.submission.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.components.submission.tls.secretName }}
        {{- end }}
        {{- include "yarilo.internalTLSVolume" .Values.components.submission.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
