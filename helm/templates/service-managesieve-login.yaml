{{- if ((.Values.components.manageSieveLogin | default dict).enabled) }}
## ClusterIP — ManageSieve connections from mail clients (port 4190, STARTTLS).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-managesieve-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "managesieve-login") | nindent 4 }}
  {{- with ((.Values.components.manageSieveLogin.service | default dict).annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ (.Values.components.manageSieveLogin.service | default dict).type | default "ClusterIP" }}
  ports:
    {{- if .Values.components.manageSieveLogin.listeners.managesieve.enabled }}
    - name: managesieve
      port: {{ .Values.components.manageSieveLogin.listeners.managesieve.servicePort }}
      targetPort: managesieve
      protocol: TCP
    {{- end }}
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "managesieve-login") | nindent 4 }}
---
## ClusterIP — telemetry / health
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-managesieve-login-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "managesieve-login") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "managesieve-login") | nindent 4 }}
{{- end }}
