{{- if .Values.components.submissionLogin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-submission-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "submission-login") | nindent 4 }}
spec:
  replicas: {{ .Values.components.submissionLogin.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "submission-login") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "submission-login") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.gracefulShutdown.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.components.warden.enabled }}
      {{- end }}
      containers:
        - name: yarilo-submission-login
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-submission-login"
            - name: LOG_LEVEL
              value: {{ include "yarilo.logLevel" (dict "name" "yarilo-submission-login" "root" $) | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            {{- if .Values.components.submissionLogin.listeners.submission.enabled }}
            - name: submission
              containerPort: {{ .Values.components.submissionLogin.listeners.submission.containerPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.components.submissionLogin.listeners.submissions.enabled }}
            - name: submissions
              containerPort: {{ .Values.components.submissionLogin.listeners.submissions.containerPort }}
              protocol: TCP
            {{- end }}
            - name: telemetry
              containerPort: 8080
              protocol: TCP
          {{- include "yarilo.loginStartupProbe" (dict "probe" .Values.components.submissionLogin.startupProbe "root" $ "auth" true "warden" true) | nindent 10 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- include "yarilo.preStopDrain" . | nindent 10 }}
          resources:
            {{- toYaml .Values.components.submissionLogin.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "yarilo.externalTLSMount" .Values.components.submissionLogin.tls.secretName | nindent 12 }}
            {{- include "yarilo.internalTLSMount" .Values.components.submissionLogin.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- include "yarilo.externalTLSVolume" .Values.components.submissionLogin.tls.secretName | nindent 8 }}
        {{- include "yarilo.internalTLSVolume" .Values.components.submissionLogin.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
