{{- if .Values.components.submissionLogin.enabled }}
## LoadBalancer — SMTP Submission client connections (Submissions:465 / Submission:587 with STARTTLS).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-submission-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "submission-login") | nindent 4 }}
  {{- with .Values.components.submissionLogin.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.components.submissionLogin.service.type }}
  ports:
    {{- if .Values.components.submissionLogin.listeners.submission.enabled }}
    - name: submission
      port: {{ .Values.components.submissionLogin.listeners.submission.servicePort }}
      targetPort: submission
      protocol: TCP
    {{- end }}
    {{- if .Values.components.submissionLogin.listeners.submissions.enabled }}
    - name: submissions
      port: {{ .Values.components.submissionLogin.listeners.submissions.servicePort }}
      targetPort: submissions
      protocol: TCP
    {{- end }}
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "submission-login") | nindent 4 }}
---
## ClusterIP — telemetry / health
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yarilo.fullname" . }}-submission-login-telemetry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "submission-login") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: telemetry
      port: 8080
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "submission-login") | nindent 4 }}
{{- end }}
