{{- if and .Values.components.backendAPI.enabled (not .Values.components.backend.coLocated) }}
{{- $tokenSecret := .Values.components.backendAPI.token_secret }}
{{- if eq $tokenSecret "" }}
{{- $tokenSecret = printf "%s-backend-api-token" (include "yarilo.fullname" .) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-backend-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "backend-api") | nindent 4 }}
spec:
  replicas: {{ .Values.components.backendAPI.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "backend-api") | nindent 6 }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "backend-api") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- /* No wait-db init container (#903): the startupProbe below waits for the
             DB (when one is configured) before the pod takes traffic. */}}
      containers:
        - name: yarilo-backend-api
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-backend-api"
            - name: LOG_LEVEL
              value: {{ include "yarilo.logLevel" (dict "name" "yarilo-backend-api" "root" $) | quote }}
            # POD_IP lets `who` scope to this backend by default (#814).
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- include "yarilo.adminBackendEnv" . | nindent 12 }}
            {{- if .Values.components.director.enabled }}
            {{- include "yarilo.adminDirectorEnv" . | nindent 12 }}
            {{- end }}
            {{- include "yarilo.dbEnv" . | nindent 12 }}
            - name: BACKEND_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $tokenSecret }}
                  key: token
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: backend-api
              containerPort: 9105
              protocol: TCP
          {{- $targets := list }}
          {{- if include "yarilo.dbInitHost" . }}
          {{- $targets = append $targets (printf "tcp://%s:%s" (include "yarilo.dbInitHost" .) (include "yarilo.dbInitPort" .)) }}
          {{- end }}
          {{- include "yarilo.depStartupProbe" (dict "probe" .Values.components.backendAPI.startupProbe "targets" $targets) | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /api/backend/health
              port: backend-api
              {{- if .Values.components.backendAPI.internalTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/backend/health
              port: backend-api
              {{- if .Values.components.backendAPI.internalTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.components.backendAPI.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.storage.persistence.enabled }}
            - name: mail
              mountPath: {{ .Values.storage.maildir_root }}
            {{- end }}
            {{- include "yarilo.internalTLSMount" .Values.components.backendAPI.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.storage.persistence.enabled }}
        - name: mail
          persistentVolumeClaim:
            claimName: {{ include "yarilo.fullname" . }}-mail
        {{- end }}
        {{- include "yarilo.internalTLSVolume" .Values.components.backendAPI.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
