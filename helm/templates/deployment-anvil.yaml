{{- if .Values.components.anvil.enabled }}
{{- $anvilBackend := .Values.components.anvil.service.state_backend | default "memory" }}
{{- if and (gt (int .Values.components.anvil.replicas) 1) (ne $anvilBackend "redis") }}
{{- fail "anvil: components.anvil.replicas > 1 requires components.anvil.service.state_backend: redis (memory state is per-pod; sessions, the connection limit, and the kick bus would fragment across replicas). Either set state_backend: redis, or set replicas: 1." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yarilo.fullname" . }}-anvil
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yarilo.componentLabels" (dict "root" . "component" "anvil") | nindent 4 }}
spec:
  replicas: {{ .Values.components.anvil.replicas }}
  selector:
    matchLabels:
      {{- include "yarilo.componentSelectorLabels" (dict "root" . "component" "anvil") | nindent 6 }}
  strategy:
    {{- if eq $anvilBackend "redis" }}
    # redis-backed pods are stateless, so a rolling update is safe.
    type: RollingUpdate
    {{- else }}
    # memory state is per-pod: a rolling update would briefly run two pods and
    # split sessions/penalty/kick state. Recreate keeps the single-replica
    # memory backend correct by default (old pod gone before the new one starts).
    type: Recreate
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "yarilo.componentLabels" (dict "root" . "component" "anvil") | nindent 8 }}
      annotations:
        {{- include "yarilo.configChecksum" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: yarilo-anvil
          image: {{ include "yarilo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: YARILO_COMPONENT
              value: "yarilo-anvil"
            - name: LOG_LEVEL
              value: {{ include "yarilo.logLevel" (dict "name" "yarilo-anvil" "root" $) | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: anvil
              containerPort: 9101
              protocol: TCP
            - name: telemetry
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.components.anvil.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/yarilo
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "yarilo.internalTLSMount" .Values.components.anvil.internalTLS | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "yarilo.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- include "yarilo.internalTLSVolume" .Values.components.anvil.internalTLS | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
