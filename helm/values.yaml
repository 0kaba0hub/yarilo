## yarilo Helm chart values

image:
  repository: ghcr.io/0kaba0hub/yarilo
  tag: ""
  pullPolicy: IfNotPresent

## -------------------------------------------------------------------
## Storage (shared across all session components)
## -------------------------------------------------------------------
## These settings apply to every yarilo session component (imap, pop3,
## lmtp). When a userdb lookup returns explicit per-user values
## (volatile_dir=, index_dir=, control_dir= or modifiers in the mail=
## location string), those take priority over these cluster-wide defaults.
storage:
  mailbox: maildir
  maildirRoot: /var/mail/vhosts
  mailHomeTemplate: "%d/%n"
  index: fileindex
  ## mdboxAltStoragePath: "/mnt/cold/%d/%n"  # cold-tier base for mdbox alt-move
  ## indexDir: "/var/yarilo-index/%d/%n"     # redirect per-folder index files to a faster disk
  ## controlDir: "/var/yarilo-control/%d/%n" # redirect yarilo-uidlist and subscriptions files
  ## volatileDir: "/run/yarilo-volatile/%d/%n" # local tmpfs for index tmp files (NFS deployments)
  ## altDir: "/mnt/cold/%d/%n"               # cold-tier alt storage root (two-tier maildir)
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 10Gi

## -------------------------------------------------------------------
## Components
## -------------------------------------------------------------------
components:

  ## Director — front-end proxy.
  ## Accepts client connections, routes to backend via consistent hash.
  director:
    enabled: false
    replicas: 1

    ## Internal director protocol (ring management, LOOKUP between directors).
    directorPort: 9102

    ## Client-facing listeners.
    ## IMAP/POP3/Submission are handled by dedicated login pods; director only proxies LMTP.
    listeners:
      lmtp:
        enabled: false
        port: 24
        containerPort: 10024

    ## mTLS for internal connections (director ↔ auth, director ↔ backend).
    internalTLS:
      enabled: false
      secretName: ""

    ## Consistent-hash routing settings.
    userExpire: 900
    pingInterval: 30
    pingTimeout: 10

    ## Static backend list loaded at startup.
    ## Each entry must match a backend service in the backend namespace.
    ## tag: optional pool tag to group backends (empty = default pool).
    backends: []
    # - host: yarilo-imap.yarilo-backend.svc.cluster.local
    #   port: 993
    #   tag: ""
    # - host: yarilo-pop3.yarilo-backend.svc.cluster.local
    #   port: 110
    #   tag: ""
    # - host: yarilo-lmtp.yarilo-backend.svc.cluster.local
    #   port: 24
    #   tag: ""

    ## Peer director addresses for ring sync (required when replicas > 1).
    ## Each entry is "host:port" where port matches directorPort (default 9102).
    ## With StatefulSet, use headless-service pod DNS:
    ##   yarilo-director-0.yarilo-director-headless:9102
    ##   yarilo-director-1.yarilo-director-headless:9102
    peers: []

    ## HTTP admin API (yarilo-admin CLI target).
    ## A 32-char token is auto-generated into Secret <release>-director-api-token on first
    ## deploy and preserved on upgrades. To rotate: delete the Secret before helm upgrade.
    api:
      port: 9103
      ## CIDRs allowed to reach the API. Default: loopback + k8s service/pod CIDRs.
      allowedNets:
        - "127.0.0.0/8"
        - "10.96.0.0/12"
        - "10.244.0.0/16"

    ## yarilo-monitor sidecar — probes backend pods and reports health to the director.
    ## Runs as a sidecar container in the director pod.
    monitor:
      enabled: false

      ## Image override (defaults to the same image as the director).
      image: ""

      ## Which protocols to probe on every backend in the ring.
      ## Ports default to standard mail ports (993 / 110 / 24).
      pollIMAP: true
      imapPort: 993
      pollPOP3: false
      pop3Port: 110
      pollLMTP: false
      lmtpPort: 24

      ## Poll interval and per-probe timeout (seconds).
      interval: 10
      timeout: 3

      ## Consecutive failures before rapid poll; rapid poll threshold.
      retryCount: 3
      rapidRounds: 10
      rapidFailsNeeded: 7

      ## Per-tag monitoring credentials.
      ## The tag is the same label used on backends, users, and storage.
      ## The "" key covers untagged backends.
      ##
      ## tags:
      ##   "":
      ##     user: monitor@example.com
      ##     password: secret
      ##   ssd:
      ##     user: monitor-ssd@example.com
      ##     password: ssd-secret
      tags: {}

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## Auth — passdb/userdb chain.
  auth:
    enabled: true
    replicas: 1
    ## listen — client protocol (login pods speak here).
    listen: ":9100"
    ## addr — address login pods dial to reach yarilo-auth.
    ## Defaults to listen when empty (single-process / dev mode).
    ## In k8s set to the ClusterIP service DNS, e.g. "<release>-auth:9100".
    addr: ""
    ## masterListen — Dovecot-style master protocol for password-less
    ## userdb lookups (USER / LIST) used by yarilo-backend-api admin
    ## endpoints and CLI tooling. Empty disables; the binary then only
    ## opens the client listener.
    masterListen: ":9102"
    ## saslListen — plain-TCP listener for Postfix SASL auth
    ## (smtpd_sasl_type=dovecot, smtpd_sasl_path=inet:[yarilo-auth]:12345).
    ## Empty disables the listener.
    saslListen: ""

    internalTLS:
      enabled: false
      secretName: ""

    passdb:
      - driver: mysql
        dsn: "${YARILO_DB_DSN}"
        defaultPassScheme: BCRYPT
        ## Custom queries (optional — leave empty to use the auto-created yarilo_users schema).
        ## passwordQuery: |
        ##   SELECT password, '' AS home, '' AS mail, active AS enabled
        ##   FROM users WHERE username = LOWER(%u)
        ## userQuery: |
        ##   SELECT home, mail_path FROM users WHERE username = LOWER(%u)
        ## iterateQuery: |
        ##   SELECT username FROM users WHERE active = 1 ORDER BY username
        ## skipSchema: true   # set when using a custom table instead of yarilo_users

    ## failureDelay — timing-leak mitigation. Every failed auth
    ## reply (wrong password, unknown user, malformed SASL) is
    ## held back this many seconds before surfacing to the client
    ## so unknown-user and wrong-password paths return in the same
    ## wall-clock time. Default 2s mirrors Dovecot's
    ## `auth_failure_delay`. Set to 0 to disable (tests only —
    ## production should keep >0).
    ## persistence — SQLite fallback only; not used when mysql.bundled=true.
    persistence:
      enabled: false
      storageClass: ""
      size: 1Gi

    ## maxAttempts — number of failed auth attempts allowed on a single
    ## connection before the server sends BYE and closes (IMAP/POP3).
    ## Mirrors Dovecot's `auth_max_attempts`. Default 3.
    maxAttempts: 3
    failureDelay: 2
    ## internalFailureDelayMs — separate delay for INTERNAL
    ## failures (passdb backend down, SQL refused). Mirrors
    ## Dovecot's `auth_internal_failure_delay`. Typically shorter
    ## than failureDelay so a passdb outage does not amplify
    ## into user-facing latency.
    internalFailureDelayMs: 2000

    ## cache — in-process auth cache (LRU, bytes-bounded).
    ## OPT-IN, disabled by default (sizeBytes: 0). Stores
    ## HMAC-ed passwords (never plain) keyed by
    ## `<service>\t<username>`. Positive entries hold the
    ## verified credential and bag; negative entries short-
    ## circuit failed lookups for the NegativeTTL window. Evict
    ## selectively via `yarilo-admin auth cache flush
    ## [user-mask...]`.
    cache:
      sizeBytes: 0
      ttlSeconds: 1800
      negativeTTLSeconds: 1800

    ## penalty — cross-pod IP-bound auth-fail backoff. OPT-IN.
    ## Every failed auth from a given client IP increments the
    ## counter in the anvil service; subsequent attempts from that
    ## IP sleep PenaltyToSecs(count) seconds before the chain runs
    ## (exponential 0/2/4/8/15 cap). Successful auth resets the
    ## counter to 0. Master-user flows are exempt.
    ##
    ## Requires the anvil service to be reachable.
    penalty:
      enabled: false

    ## token — one-time session token issued after successful passdb.
    ## The login pod forwards the token to the backend (XCLIENT TOKEN=);
    ## the backend calls yarilo-auth VERIFY to consume it and enter
    ## authenticated state without replaying credentials.
    token:
      ## ttlSeconds — how long the token is valid for the backend to
      ## consume. Must be larger than the login→backend roundtrip time.
      ## Default 60 s is generous; lower to 10-15 s in production.
      ttlSeconds: 60
      ## backend — token store implementation.
      ## "memory": in-process (single auth pod only).
      ## "redis": Redis-backed, safe for replicaCount > 1.
      backend: memory
      ## redisAddr — Redis URL used when backend=redis.
      ## Format: redis://[password@]host:port/db
      redisAddr: ""

    ## oauth2 — OAuth 2.0 bearer-token providers. Each entry
    ## becomes a passdb that participates in the auth chain (placed
    ## AHEAD of SQL so an OAUTHBEARER login resolves through the
    ## validator before SQL ever sees the bearer token as a
    ## plaintext password). Empty list disables OAUTHBEARER.
    ##
    ## See docs/AUTH_OAUTH2.md for the wire spec, configuration
    ## reference, and worked examples for Google Workspace,
    ## Microsoft 365, and Keycloak / Authelia.
    ##
    ## Four validation modes:
    ##   - local         — JWT verify against jwks_url (recommended)
    ##   - introspection — RFC 7662 endpoint
    ##   - tokeninfo     — Google-style endpoint
    ##   - discovery     — auto-resolve via OIDC discovery (issuer_url)
    oauth2: []
      # - mode: discovery
      #   issuer_url: https://accounts.google.com
      #   audience: <your-google-oauth-client-id>
      #   scopes: [openid, email]
      #   username_attribute: email
      #   username_validation_format: "%Lu"
      #   extra_fields: [sub, hd]
      # - mode: local
      #   jwks_url: https://login.microsoftonline.com/common/discovery/keys
      #   issuers: ["https://login.microsoftonline.com/<tenant-id>/v2.0"]
      #   audience: <your-azure-app-id>
      #   username_attribute: preferred_username
      # - mode: introspection
      #   introspection_url: https://keycloak.internal/realms/yarilo/protocol/openid-connect/token/introspect
      #   introspection_mode: post
      #   client_id: yarilo-auth
      #   client_secret: change-me
      #   username_attribute: email

    ## policy — wforce-compatible HTTP policy-server hook. URL=""
    ## disables. When set, every login attempt POSTs JSON to the
    ## policy server which can allow / reject / tarpit the request.
    ## See docs/AUTH_POLICY.md for the wire format and a wforce
    ## configuration example.
    ##
    ## hashNonce is REQUIRED when url is set — it salts the pwhash
    ## field so two deployments don't share the same hash space.
    ## Default hash is truncated to 12 bits (4096 buckets) so the
    ## policy server can group attempts without seeing real
    ## passwords.
    policy:
      url: ""
      apiHeader: ""
      hashMech: sha256
      hashNonce: ""
      hashTruncateBits: 12
      timeoutMs: 5000
      rejectOnFail: false
      logOnly: false
      checkBefore: true
      checkAfter: true
      reportAfter: true

    ## masterUsers — Dovecot-style master-user impersonation
    ## (SASL PLAIN authzid). OPT-IN, disabled by default. While
    ## `enabled: false` the IMAP / POP3 / Submission / wire
    ## yarilo-auth code paths drop the authzid before consulting
    ## the chain — distinct authzid produces an opaque auth
    ## failure indistinguishable from a wrong password.
    ##
    ## Set `enabled: true` to allow EITHER of these admin paths:
    ##   1. A dedicated `masterdb` chain (entries below) whose
    ##      rows are unconditionally allowed to impersonate any
    ##      target. Independent SQL store; same query syntax as
    ##      the regular `passdb`.
    ##   2. A regular `passdb` row that returns the extra field
    ##      `master_user=yes` from its passwordQuery. That row
    ##      is then allowed to impersonate any target — useful
    ##      when admins and end-users share one user table.
    ##
    ## `separator` enables the legacy `target<sep>master` SASL
    ## workaround for clients that cannot supply authzid (older
    ## Outlook, some mobile MUAs). Empty disables the workaround
    ## even when `enabled: true`. `*` matches Dovecot's default
    ## `auth_master_user_separator`.
    masterUsers:
      enabled: false
      separator: "*"
      masterdb: []
        ## - driver: sqlite
        ##   dsn: /var/lib/yarilo/masters.db
        ##   passwordQuery: "SELECT password FROM masters WHERE username = ?"
        ##   defaultPassScheme: BCRYPT

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## Anvil — connection rate limiter. Keep replicas: 1.
  anvil:
    enabled: true
    replicas: 1
    listen: ":9101"

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## yarilo-backend-api — storage-plane operator HTTP API.
  ## Exposes dict / acl (later) / quota (later) / folder / user
  ## operations consumed by yarilo-admin CLI. Mounts the same
  ## storage PVC as the session pods + connects to every
  ## configured dict.
  ##
  ## Bearer token auth (auto-generated Secret unless tokenSecret
  ## is provided). For multi-pod backend cluster, director's
  ## /api/admin/proxy/<user>/... proxies admin requests to the
  ## right backend's yarilo-backend-api by user-to-backend mapping.
  backendAPI:
    enabled: true
    replicas: 1
    listen: ":9105"

    internalTLS:
      enabled: false
      secretName: ""

    ## Pre-existing Secret with key "token" holding the bearer
    ## token. When empty, the chart generates a random token and
    ## stores it in <release>-backend-api-token. CLI reads from
    ## YARILO_BACKEND_API_TOKEN env or --backend-token flag.
    tokenSecret: ""

    ## CIDR allow-list for callers. Empty = allow any IP (token
    ## auth still applies). Set to your operator subnet for
    ## defence-in-depth.
    allowedNets: []

    ## yarilo-auth master-protocol address. When set, backend-api
    ## dials at startup via pkg/authclient and:
    ##   - enriches /api/backend/user/info with a `userdb` block
    ##     (uid, gid, groups, quota_rule, allow_nets, ...) plus a
    ##     `userdb_status` field ("ok" / "not_found" / "error")
    ##   - serves /api/backend/user/iterate
    ## Empty disables both surfaces — handy for dev / smoke runs.
    ## In a standard Helm release this is the in-cluster service:
    ##   "<release>-auth:9102"
    authMasterAddr: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  ## yarilo-locks — cross-process write coordinator.
  ## Every session pod dials this Service to take X locks on
  ## mbox:<user>:<folder> before mutating maildir / index files.
  ## State lives in Redis (see top-level redis: section).
  ## Default 2 replicas for HA — set replicas: 1 for single-node dev.
  locks:
    enabled: true
    replicas: 2
    listen: ":9104"

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## IMAP backend — handles sessions proxied from director.
  ## Director proxies 993→imap:993, 143→imap:143.
  imap:
    enabled: true
    replicas: 1

    listeners:
      imaps:
        enabled: true
        servicePort: 993
        containerPort: 10993
      imap:
        enabled: false
        servicePort: 143
        containerPort: 10143

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  ## POP3 backend — director proxies 995→pop3:995, 110→pop3:110.
  pop3:
    enabled: false
    replicas: 1

    listeners:
      pop3s:
        enabled: true
        servicePort: 995
        containerPort: 10995
      pop3:
        enabled: false
        servicePort: 110
        containerPort: 10110

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## LMTP backend — director proxies 24→lmtp:24.
  lmtp:
    enabled: false
    replicas: 1

    listeners:
      lmtp:
        enabled: true
        servicePort: 24
        containerPort: 10024

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## Postfix SASL proxy — delegates smtpd_sasl_type=dovecot authentication to yarilo-auth.
  ## Postfix config: smtpd_sasl_path = inet:<host>:12325
  ## Postfix has no direct access to yarilo-auth; yarilo-sasl-login proxies each session.
  saslLogin:
    enabled: false
    replicas: 1
    servicePort: 12325
    containerPort: 12325

    ## authAddr overrides the yarilo-auth dial address.
    ## Defaults to auth_service.addr from the shared config.
    authAddr: ""

    ## trustedNets lists CIDRs allowed to connect. Empty = allow all.
    trustedNets: []
    #  - "10.0.0.0/8"

    ## haproxy enables PROXY protocol v1/v2 on the listener.
    haproxy: false
    haproxyTimeout: 3
    ## haproxyNets lists CIDRs whose PROXY header is trusted.
    haproxyNets: []
    #  - "10.0.0.0/8"

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  ## Postfix policy service — quota enforcement before message queuing.
  ## Postfix config: check_policy_service inet:[<ClusterIP>]:12340
  quotaStatus:
    enabled: false
    replicas: 1
    servicePort: 12340
    containerPort: 12340

    ## defaultQuotaRules mirror yarilo.yaml quota_rule format.
    ## Applied to every recipient; per-user rules require userdb lookup (future phase).
    defaultQuotaRules: []
    #  - "*:storage=5G"
    #  - "*:messages=100000"
    #  - "Trash:storage=+1G"
    #  - "Spam:ignore"

    ## aliasDict is the name of a dict in the dicts: map that resolves
    ## virtual aliases (source → destination). Empty = disabled.
    aliasDict: ""
    aliasMaxHops: 5

    ## authMasterAddr is the yarilo-auth master-protocol listener address
    ## used for per-user quota_rule lookups via userdb. When set, per-user
    ## rules override defaultQuotaRules; defaultQuotaRules remain as fallback.
    ## Example: "yarilo-auth:9101"
    authMasterAddr: ""

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  ## Submission backend — accepts mail from submission-login pods, relays to upstream MTA.
  ## ClusterIP only; mail clients connect to yarilo-submission-login (LoadBalancer).
  submission:
    enabled: false
    replicas: 1

    listeners:
      submission:
        enabled: true
        servicePort: 587
        containerPort: 10587
      submissions:
        enabled: false
        servicePort: 465
        containerPort: 10465

    internalTLS:
      enabled: false
      secretName: ""

    tls:
      secretName: ""

    service:
      type: ClusterIP

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## IMAP login pod — TLS terminator + director LOOKUP + proxy to yarilo-imap backend.
  ## Faces mail clients on 993/143; does NOT store mail.
  imapLogin:
    enabled: false
    replicas: 1

    listeners:
      imaps:
        enabled: true
        servicePort: 993
        containerPort: 10993
      imap:
        enabled: false
        servicePort: 143
        containerPort: 10143

    ## TLS cert presented to mail clients (IMAPS / STARTTLS for IMAP).
    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    ## mTLS for connections to director and backend pods.
    internalTLS:
      enabled: false
      secretName: ""

    ## backendAddr bypasses director LOOKUP for standalone deployments.
    ## Set to "<release>-imap:<port>" (plain) or "<release>-imap:<tls-port>" (mTLS).
    ## Leave empty in director deployments — LOOKUP is used instead.
    backendAddr: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## POP3 login pod — TLS terminator + director LOOKUP + proxy to yarilo-pop3 backend.
  pop3Login:
    enabled: false
    replicas: 1

    listeners:
      pop3s:
        enabled: true
        servicePort: 995
        containerPort: 10995
      pop3:
        enabled: false
        servicePort: 110
        containerPort: 10110

    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    internalTLS:
      enabled: false
      secretName: ""

    ## backendAddr bypasses director LOOKUP for standalone deployments.
    ## Set to "<release>-pop3:<port>" (plain) or "<release>-pop3:<tls-port>" (mTLS).
    ## Leave empty in director deployments — LOOKUP is used instead.
    backendAddr: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## Submission login pod — TLS terminator + director LOOKUP + proxy to yarilo-submission backend.
  submissionLogin:
    enabled: false
    replicas: 1

    listeners:
      submission:
        enabled: true
        servicePort: 587
        containerPort: 10587
      submissions:
        enabled: false
        servicePort: 465
        containerPort: 10465

    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    internalTLS:
      enabled: false
      secretName: ""

    ## backendAddr bypasses director LOOKUP for standalone deployments.
    ## Set to "<release>-submission:<port>" (plain) or "<release>-submission:<tls-port>" (mTLS).
    ## Leave empty in director deployments — LOOKUP is used instead.
    backendAddr: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## LMTP login pod — MTA-facing LMTP proxy with per-recipient anvil CONNECT
  ## and yarilo-auth SESSION token issuance. Fans out one backend connection
  ## per recipient, each with a YARILO preamble.
  lmtpLogin:
    enabled: false
    replicas: 1

    listeners:
      lmtp:
        enabled: true
        servicePort: 24
        containerPort: 10024

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or directorAddr).
    ## Typically "<release>-lmtp:<containerPort>" within the cluster.
    backendAddr: ""

    ## Director mode: per-recipient LOOKUP via yarilo-director (set either this or backendAddr).
    directorAddr: ""
    ## directorTag restricts LOOKUP to backends with this tag. Empty = full ring.
    directorTag: ""
    ## backendPort overrides the port in the director LOOKUP result. 0 = use result as-is.
    backendPort: 0

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## ManageSieve backend — RFC 5804 Sieve script management (internal, port 14190).
  manageSieve:
    enabled: false
    replicas: 1

    listeners:
      managesieve:
        enabled: true
        servicePort: 14190
        containerPort: 14190

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## ManageSieve login pod — RFC 5804 client-facing proxy (port 4190, STARTTLS).
  manageSieveLogin:
    enabled: false
    replicas: 1

    listeners:
      managesieve:
        enabled: true
        servicePort: 4190
        containerPort: 14190
        disablePlainAuth: false

    tls:
      secretName: ""

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address.
    ## Typically "<release>-managesieve:<containerPort>" within the cluster.
    backendAddr: ""

    haProxy: false
    haProxyTimeout: 3
    haProxyNets: []

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

## -------------------------------------------------------------------
## Protocol tuning
## -------------------------------------------------------------------
protocol:
  imap:
    idleNotifyInterval: 120
    maxLineLength: 65536
    idSend: "name *"
    loginGreeting: ""
    logoutFormat: ""
    clientWorkarounds: []
    ## RFC 6154 SPECIAL-USE — map a folder name to a special-use attribute
    ## advertised in LIST replies. Operators can override per deployment;
    ## per-user CREATE (USE ...) takes precedence at runtime via the
    ## on-disk special_use file. Mirrors Dovecot's
    ## namespace.mailbox.special_use convention.
    specialUseDefaults:
      Sent: "\\Sent"
      Drafts: "\\Drafts"
      Trash: "\\Trash"
      Junk: "\\Junk"
      Archive: "\\Archive"
    ## RFC 4314 server-side ACL — GETACL / SETACL / DELETEACL / MYRIGHTS
    ## / LISTRIGHTS plus enforcement on SELECT / APPEND / COPY / MOVE
    ## / STORE / EXPUNGE / CREATE / DELETE / RENAME / STATUS. Storage
    ## is a per-mailbox `yarilo-acl` file alongside each folder's
    ## `yarilo.index*`; a namespace-wide `yarilo-acl-list` index
    ## mirrors which mailboxes have an explicit ACL for LIST
    ## optimisation. Admin surface lives at
    ## `yarilo-backend-api /api/backend/acl/*` and `yarilo-admin
    ## backend acl <command>`. When disabled, every ACL command
    ## returns NO("ACL extension disabled by operator") and ACL is
    ## absent from the CAPABILITY response.
    acl:
      enabled: false

  pop3:
    noFlagUpdates: false
    reuseXUIDL: false
    uidlFormat: "%u.%v"
    uidlDuplicates: rename
    enableLast: false
    deleteType: expunge
    deletedFlag: ""
    saveUIDL: false     # persist computed UIDLs to index for stability across index rebuilds
    lockSession: false  # dotlock file in user home to prevent simultaneous IMAP+POP3 access

  lmtp:
    loginGreeting: "Yarilo ready."
    addReceivedHeader: true
    saveToDetailMailbox: false
    hdrDeliveryAddress: final
    verboseReplies: false
    userConcurrencyLimit: 10
    readTimeout: 300
    writeTimeout: 300
    clientWorkarounds: []

  submission:
    hostname: ""
    maxMessageSize: 41943040
    maxLineLength: 4096
    maxRecipients: 0
    recipientDelimiter: "+"
    addReceivedHeader: true
    clientWorkarounds: []
    relay:
      host: ""
      port: 25
      user: ""
      password: ""
      ssl: "no"
      sslVerify: true
      trusted: false
      connectTimeout: 30
      commandTimeout: 300

  managesieve:
    maxScriptSize: 65536
    maxInvalidCommands: 3

## -------------------------------------------------------------------
## Sieve mail filtering
## -------------------------------------------------------------------
sieve:
  enabled: false
  maxScriptSize: 65536
  maxRedirects: 32
  vacationEnabled: true
  submissionHost: ""
  submissionSSL: "no"
  submissionTimeout: 30
  submissionAuthSecret: ""

## -------------------------------------------------------------------
## General infrastructure
## -------------------------------------------------------------------
general:
  ## startupDialRetries — number of dial attempts (with exponential backoff)
  ## when connecting to external dependencies at startup (anvil, Redis).
  ## Prevents permanent loss of functionality on rolling restarts when a
  ## dependency pod is not yet ready. Default 3.
  startupDialRetries: 3

  limits:
    ## Maximum simultaneous IMAP/POP3 connections from a single IP address.
    maxUserIPConnections: 10

  ## HAProxy PROXY protocol v1/v2 support.
  ## Enable when an upstream load balancer (HAProxy, nginx, AWS NLB with proxy_protocol)
  ## sits in front of the director and forwards the real client IP in the PROXY header.
  ## The director reads the header before TLS handshake; conn.RemoteAddr() always reflects
  ## the real client IP after this point.
  ##
  ## haproxy_protocol must also be enabled per-listener (services.imaps.haproxy_protocol etc.)
  ## in the generated config — the global enabled flag controls all listeners at once.
  ##
  ## trustedNets: CIDRs of load balancers allowed to send PROXY headers.
  ##              Connections from untrusted IPs have the header silently ignored.
  ## timeout:     Seconds to wait for the PROXY header before rejecting the connection.
  haproxy:
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"
    timeout: 3

  ## XCLIENT forwarding support.
  ## When enabled, the director sends an XCLIENT ADDR=<real-ip> command to the backend
  ## (yarilo-imap / yarilo-pop3 / yarilo-lmtp) immediately after connecting, so the
  ## backend session sees the real client IP instead of the director's pod IP.
  ##
  ## Requires the backend to trust the director's pod CIDR in its own xclient.trustedNets.
  ## The director itself does not check trustedNets for outgoing XCLIENT — trustedNets here
  ## is written into the backend config so it knows which sources to accept XCLIENT from.
  xclient:
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"

## -------------------------------------------------------------------
## Redis — state backend for yarilo-locks (and future yarilo-anvil).
## -------------------------------------------------------------------
## Bundled (default): a StatefulSet runs in the release, single-replica
## for single-node clusters. For prod HA either bump replicas + run
## Sentinel/Cluster externally and point at it via externalUrl.
##
## bundled: false disables the StatefulSet + Service templates;
## externalUrl is then required.
redis:
  bundled: true
  replicas: 1
  ## image — pulled from the public Redis library on Docker Hub by default.
  image:
    repository: redis
    tag: "8.8"
    pullPolicy: IfNotPresent
  ## persistent volume claim for AOF + dump; required for restart safety.
  persistence:
    size: 1Gi
  storageClass: ""

  ## External Redis (used when bundled: false). Standard go-redis URL.
  ## Examples:
  ##   redis://my-redis.prod.svc:6379/0
  ##   rediss://master.cache.amazonaws.com:6379/0
  externalUrl: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

## -------------------------------------------------------------------
## MySQL — bundled passdb/userdb backend (optional).
##
## bundled: true  → spins up a MySQL 8.4 StatefulSet + ClusterIP Service
##                  in the release namespace. yarilo-auth auto-creates the
##                  yarilo_users table on first start (no manual init SQL).
## bundled: false → no StatefulSet; configure components.auth.passdb[].dsn
##                  directly in your values override.
##
## The DSN is stored in a Secret (<release>-mysql) and injected into
## yarilo-auth as YARILO_DB_DSN. Reference it in passdb config:
##   components.auth.passdb:
##     - driver: mysql
##       dsn: "${YARILO_DB_DSN}"
## -------------------------------------------------------------------
mysql:
  bundled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  db: yarilo
  user: yarilo
  ## password — required when bundled: true. Use --set mysql.password=... or
  ## a values override file. Never commit a real password here.
  password: ""
  storageClass: ""
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

## -------------------------------------------------------------------
## Telemetry (:8080 per component pod)
## -------------------------------------------------------------------
telemetry:
  listen: ":8080"
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

## -------------------------------------------------------------------
## Shared scheduling / security
## -------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: telemetry
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: telemetry
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

logLevel: info

## initContainerImage — image used by dependency-wait init containers.
## Must include busybox-compatible `nc` (netcat). Default: busybox:1.36.
initContainerImage: "busybox:1.36"

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Named dicts (pkg/dict). Yarilo features (metadata, quota counters, ACL state)
# look these up by name. Each entry picks a driver (file|redis|sql|memory|fail)
# and configures it via driver-specific `settings`. See docs/DICT.md for the
# full reference per driver. The same template renders into yarilo.yaml.
#
# Standalone single-pod default uses file driver on the local PVC.
# Backend multi-pod helm release should override with redis or sql to share
# state across replicas.
# IMAP namespaces (RFC 2342 / RFC 9051 §6.3.10).
#
# When omitted (default), yarilo runs as personal-only — backwards-
# compatible with pre-v1.20 deployments.
#
# When you declare Shared/Public namespaces, yarilo opens an
# additional storage handle per namespace and routes SELECT/APPEND/
# COPY/MOVE/SUBSCRIBE/etc to the right backend based on the prefix.
# IMPORTANT (pre-ACL-1): with Shared/Public configured, **any
# authenticated user reads and writes everything under them**.
# Treat as cooperative-trust until ACL-1 lands.
#
# Storage roots referenced by `location:` are the operator's
# responsibility — mount the PV (NFS/CephFS RWX in multi-pod
# deployments) at the chosen path; yarilo creates the per-folder
# maildir tree on the first CREATE / APPEND. Do NOT point shared
# locations at per-user storage paths.
#
# See docs/NAMESPACE.md for full schema, separator semantics,
# METADATA priv/ per-accessing-user behaviour and the post-NS-1b
# roadmap (ACL-1, NS-3 cross-pod routing, QUOTA-1 owner-paid).
namespaces: []
#   - type: personal              # personal | other | shared
#     prefix: ""                  # mailbox name prefix; "" reserved for personal
#     separator: "/"              # one character; different per-namespace allowed
#     list: true                  # show in NAMESPACE response
#     subscriptions: true
#     inbox: true                 # owns the magic "INBOX" (set on exactly one)
#     # personal inherits storage from cfg.Storage.MailHomeTemplate;
#     # leave `location:` unset.
#   - type: shared
#     prefix: "Shared/"
#     separator: "/"
#     list: true
#     # Absolute path; mount a PV here in multi-pod deployments.
#     location: "maildir:/var/yarilo/shared"
#   - type: other                 # Other Users — declared-only until ACL-1 + NS-3
#     prefix: "user/"
#     separator: "/"
#     list: true

dicts:
  # IMAP METADATA (RFC 5464) state. When omitted, GETMETADATA /
  # SETMETADATA respond NO "Metadata storage not configured" but the
  # rest of the server still works. file driver is fine for standalone
  # single-pod releases; switch to redis or sql for backend multi-pod.
  metadata:
    driver: file
    settings:
      path: /var/yarilo/dicts/metadata.json
#   quota:
#     driver: redis
#     settings:
#       addr: yarilo-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
#       db: 0
#       prefix: "yarilo:quota:"
#     expire_secs: 86400