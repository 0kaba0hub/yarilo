## yarilo Helm chart values
## Full reference: https://github.com/0kaba0hub/yarilo

image:
  repository: ghcr.io/0kaba0hub/yarilo
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

replicaCount: 1    # single-node only — maildir PVC is not shared-access

## -------------------------------------------------------------------
## TLS (shared certificate mounted at /etc/yarilo/tls/)
## -------------------------------------------------------------------
tls:
  ## Name of an existing Secret containing tls.crt and tls.key.
  ## Required if imaps, submissions, or pop3s is enabled.
  secretName: ""

## -------------------------------------------------------------------
## Services — per-listener toggles
## -------------------------------------------------------------------
services:
  ## IMAP over TLS (port 993)
  imaps:
    enabled: true
    port: 993
    disablePlainAuth: false

  ## IMAP with STARTTLS (port 143)
  imap:
    enabled: false
    port: 143
    disablePlainAuth: false

  ## SMTP MX inbound (port 25)
  smtp:
    enabled: false
    port: 25

  ## Submission STARTTLS (port 587)
  submission:
    enabled: false
    port: 587
    disablePlainAuth: true

  ## Submission SSL (port 465)
  submissions:
    enabled: false
    port: 465
    disablePlainAuth: true

  ## POP3 with STARTTLS (port 110)
  pop3:
    enabled: false
    port: 110

  ## POP3 over TLS (port 995)
  pop3s:
    enabled: false
    port: 995

## -------------------------------------------------------------------
## Protocol tuning (independent of listener)
## -------------------------------------------------------------------
protocol:
  imap:
    idleNotifyInterval: 120      # seconds; 0 = disabled
    maxLineLength: 65536          # bytes
    idSend: "name *"              # ID pairs; * = default; empty = disabled
    loginGreeting: ""
    logoutFormat: ""

  smtp:
    hostname: ""                  # defaults to system hostname
    maxMessageSize: 41943040      # 40 MiB
    maxLineLength: 4096
    recipientDelimiter: "+"

  pop3:
    noFlagUpdates: false
    reuseXUIDL: false
    uidlFormat: "%u.%v"
    uidlDuplicates: rename        # allow | rename
    enableLast: false
    deleteType: expunge           # expunge | flag
    deletedFlag: ""

## -------------------------------------------------------------------
## General infrastructure (shared across all listeners)
## -------------------------------------------------------------------
general:
  limits:
    maxUserIPConnections: 10      # 0 = unlimited; per user+IP pair

  haproxy:
    ## Enable PROXY protocol on ALL listeners (requires trusted upstream LB).
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"
    timeout: 3                    # seconds to wait for PROXY header

  xclient:
    ## Enable XCLIENT on ALL listeners.
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"

## -------------------------------------------------------------------
## Authentication
## -------------------------------------------------------------------
auth:
  passdb:
    - driver: sqlite
      ## Path inside the container (mounted from PVC or emptyDir).
      dsn: /var/lib/yarilo/users.db

## -------------------------------------------------------------------
## Storage
## -------------------------------------------------------------------
storage:
  ## Mailbox format: maildir | dbox | mdbox
  mailbox: maildir
  maildirRoot: /var/mail/vhosts

  ## Index backend: fileindex | sqlite
  index: fileindex

  persistence:
    enabled: true
    storageClass: ""   # "" = cluster default
    accessMode: ReadWriteOnce
    size: 10Gi
    ## Bind to an existing PVC instead of creating one:
    # existingClaim: ""

## -------------------------------------------------------------------
## Telemetry
## -------------------------------------------------------------------
telemetry:
  listen: ":8080"
  ## Expose /metrics to a Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    namespace: ""          # defaults to Release.Namespace
    interval: 30s
    labels: {}

## -------------------------------------------------------------------
## Kubernetes service
## -------------------------------------------------------------------
service:
  type: LoadBalancer
  ## Telemetry / health (always ClusterIP, separate service)
  telemetryPort: 8080
  ## Optional static IP for LoadBalancer
  # loadBalancerIP: ""
  annotations: {}

## -------------------------------------------------------------------
## Resources, probes, scheduling
## -------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: telemetry
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: telemetry
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

## -------------------------------------------------------------------
## Log level (also settable via LOG_LEVEL env var)
## -------------------------------------------------------------------
logLevel: info   # debug | info | warn | error

## -------------------------------------------------------------------
## Extra environment variables injected into the container
## -------------------------------------------------------------------
extraEnv: []
# - name: SOME_VAR
#   value: "value"

## -------------------------------------------------------------------
## Extra volumes / mounts (e.g. for CA bundles)
## -------------------------------------------------------------------
extraVolumes: []
extraVolumeMounts: []
