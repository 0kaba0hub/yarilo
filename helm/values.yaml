## yarilo Helm chart values

image:
  repository: ghcr.io/yarilomail/yarilo
  tag: ""
  pullPolicy: IfNotPresent

## Cluster-wide internal mTLS (#816). Per-component internalTLS.{enabled,
## secretName} live under components.* ; this block holds the ONE setting
## shared across all of them: the TLS name every internal client dial pins.
internalTLS:
  ## Name every internal client (auth/warden/locks/backend-api/... dials) pins
  ## as the server certificate name. Internal services are reached by short
  ## name / FQDN / pod IP interchangeably, so this stable pinned name — not the
  ## dialed host — is what gets verified. Empty auto-derives <release>-internal,
  ## which the chart also injects into the director cert SANs; the shared
  ## internal-tls cert you provide MUST carry this name as a SAN. The director
  ## RING dial is separate (components.director.internalTLS.ringTlsServerName).
  serverName: ""
  ## TLS 1.3 client session resumption for internal mTLS dials (#856). Repeated
  ## dials to the same peer resume via a cached session ticket instead of a full
  ## handshake — cuts the delivery→verify handshake CPU that times out heavy
  ## smoke tests on a single-core node.
  ## sessionCacheSize: cache entries per client config. 0 = built-in default
  ##   (64); a negative value disables resumption (every dial is a full handshake).
  sessionCacheSize: 0
  ## sessionCacheTtl: seconds a cached session may still be resumed, on top of
  ##   LRU eviction. 0 = LRU-only (no age limit). Set a TTL so a cert rotation
  ##   stops resuming stale sessions within the window.
  sessionCacheTtl: 0

## -------------------------------------------------------------------
## Login proxies (shared across imap/pop3/submission/managesieve login)
## -------------------------------------------------------------------
login:
  ## Confirmed-kick LOOKUP hold budget (#847/#858). While the director holds a
  ## user under a confirmed kick, the login proxy re-LOOKUPs instead of erroring
  ## the concurrent login. lookupHoldMax × lookupHoldBackoffMs MUST exceed the
  ## director's worst-case confirm time (components.director.user_kill_confirm_grace
  ## + drain), or the proxy exhausts retries before the kill confirms and the
  ## login errors. Defaults 20 × 150ms = 3s budget (covers the default 1s grace +
  ## drain). Raise both together if you raise user_kill_confirm_grace.
  ## 0 = built-in default.
  lookupHoldMax: 0
  lookupHoldBackoffMs: 0
  ## How often (seconds) a login proxy sends the director the full list of
  ## sessions it is running, so a director that missed a SESSION-CLOSE stops
  ## counting a session nobody has. Announcing opens and closes alone leaves a
  ## lost event wrong forever; this is how long a wrong count may last. The
  ## list is also sent whenever a director connection is established.
  ## 0 = built-in default (30); negative = only on connect.
  sessionSyncIntervalSeconds: 0
  ## Graceful drain (#857): seconds the login proxy keeps serving in-flight
  ## sessions after SIGTERM before closing them. Must fit within
  ## gracefulShutdown.terminationGracePeriodSeconds. 0 = default (30).
  sessionGracePeriodSeconds: 0
  ## transientRetries (#896): extra attempts a transient failure gets before the
  ## client is told the service is unavailable — yarilo-auth reporting temp-fail,
  ## the first dial to auth, and bringing up the backend session. Answering on the
  ## first error turns a dependency blip (a rolling restart, a reconnect) into a
  ## visible login failure the client can only recover from by opening a new
  ## connection and repeating the TLS handshake.
  ## 0 = built-in default (3). A negative value opts out and restores
  ## fail-on-first-error.
  ##
  ## Watch yarilo_login_transient_retries_total against
  ## yarilo_login_transient_exhausted_total: retries rising with exhausted flat
  ## means the budget is absorbing blips; both rising means the outage outlasts it
  ## and the fix is upstream, not a larger budget.
  transientRetries: 0

  ## transientReloginCap (#896) is the DIFFERENT, second-layer knob. Once the
  ## per-hop transientRetries above are exhausted, the proxy answers a tagged
  ## NO [UNAVAILABLE] but keeps the connection OPEN and returns to the pre-auth
  ## command loop, so the client can LOGIN again on the SAME connection — no new
  ## TCP + TLS handshake, which is the whole cost #896 removes.
  ## The cap is the number of transient failures ONE connection tolerates, each
  ## answered with a tagged NO, before it is finally closed — so a wedged backend
  ## cannot accumulate sockets that never progress. Counted from the first
  ## attempt, so cap=N permits N tagged NOs, i.e. N-1 actual re-LOGINs between
  ## them. Independent of auth_max_attempts (bad passwords). 0 = default (3); a
  ## negative value opts out and closes on the first transient, as before #896.
  ##   transientRetries    = internal per-hop retries BEFORE the client sees a NO
  ##   transientReloginCap = transient NOs tolerated per connection AFTER them
  transientReloginCap: 0

## -------------------------------------------------------------------
## Graceful rollout (#857)
## -------------------------------------------------------------------
## During a rolling update, login/backend pods must not drop in-flight or
## racing-new client connections.
gracefulShutdown:
  ## preStop sleep (seconds) before SIGTERM, so kube removes the pod from
  ## Service endpoints BEFORE the process stops accepting — closes the
  ## endpoint-removal race (new connections routed to a terminating pod).
  ## Should be >= the endpoint-propagation interval (kube-proxy / MetalLB).
  preStopSleepSeconds: 5
  ## Pod terminationGracePeriodSeconds. Must be >= preStopSleepSeconds +
  ## login.session_grace_period so the in-flight drain is not hard-killed.
  terminationGracePeriodSeconds: 45

## -------------------------------------------------------------------
## Storage (shared across all session components)
## -------------------------------------------------------------------
## These settings apply to every yarilo session component (imap, pop3,
## lmtp). When a userdb lookup returns explicit per-user values
## (mail_volatile_path=, mail_index_path=, mail_control_path= or modifiers in the mail=
## location string), those take priority over these cluster-wide defaults.
## Backend self-registration + heartbeat to the director (#776). The backend
## session pods (imap/pop3/lmtp/submission) register their own POD_IP + session
## port in the director hash ring and heartbeat while /readyz is true, so the
## ring reflects live backends without a one-time DNS resolve or an external
## prober. A graceful SIGTERM sends BACKEND-DOWN (immediate remove + rehash);
## a crash / wedge stops the heartbeat and the director expires the lease
## (components.director.backend_expire). Requires POD_IP (set automatically on
## the backend deployments via the Downward API) and network reachability to
## the director Service.
backend_register:
  ## Enable backend registration. Default true: the co-located pod's
  ## yarilo-backend-reg sidecar registers the pod IP with the director. Harmless
  ## for standalone (no sidecar container, director_addr stays empty → no-op).
  enabled: true
  ## Director address to register against. Empty + enabled auto-derives to the
  ## ClusterIP -director Service (the LOOKUP endpoint); any replica answers and
  ## the registration gossips ring-wide. Set explicitly for non-k8s runs.
  director_addr: ""
  ## Heartbeat interval in seconds. 0 = default (10).
  register_interval: 10
  ## Routing pool tag = NFS shard; must match a director tag. NOT a protocol
  ## dimension (#788). Empty = default pool.
  tag: ""
  ## Ring weight (vhosts), 1..100. Register an explicit weight so the pod is a
  ## real candidate under assignment_policy: least_sessions, where vhosts 0 means
  ## DRAIN (excluded from new placements, #797). 100 = full weight.
  vhosts: 100
  ## Readiness signal for the co-located pod (#788). Each protocol container
  ## touches readiness_dir/<proto> only while ready; the yarilo-backend-reg
  ## sidecar heartbeats only while all readiness_protocols files are fresh.
  ## readiness_dir is a shared emptyDir mounted into every container in the pod.
  readiness_dir: /run/yarilo-ready
  ## How often (seconds) a protocol container re-touches its file WHILE ready.
  ## 0 = default (5).
  readiness_touch_interval: 5
  ## How old (seconds) a readiness file may be before the sidecar treats that
  ## protocol as down and withholds the pod's heartbeat. 0 = default (15 ≈ 3×
  ## touch). Widen on slow nodes to avoid false silence flapping the whole pod.
  readiness_stale_after: 15
  ## Protocols the sidecar requires fresh before heartbeating. Empty = no gate
  ## (heartbeat unconditionally). The co-located pod sets its full container set.
  readiness_protocols:
    - imap
    - pop3
    - submission
    - lmtp
    - managesieve

storage:
  mail_driver: maildir
  maildir_root: /var/mail/vhosts
  mail_home: "%d/%u"
  index: fileindex
  ## On-disk format of the per-user mdbox map index. v2 is fixed-width and
  ## sorted by map_uid, so an open parses nothing; v1 is the older format, kept
  ## because it is what an older image can still read. Changing this converts
  ## the map on the next open, either way, preserving every map_uid.
  mdbox_map_format: v2
  ## maildir_sync_on_select: true          # reconcile the index with cur/ and new/ on SELECT so MDA/second-MUA deliveries appear without a rebuild (maildir only)
  ## dbox_reactive_rebuild: true           # sdbox: on a missing/corrupt message read, flag the folder and heal its index (expunge vanished records) on the next open
  ## mail_path: ""                            # mail storage root (empty = same as home); supports ~/ and %u/%d/%n/%h
  ## mail_inbox_path: ""                      # INBOX override path (empty = mail_path); supports ~/ and %u/%d/%n/%h
  ## (the cold tier is mail_alt_path below — one key for maildir and mdbox alike)
  ## mdbox_rotate_size: 10M               # max size per m.<N> before rolling (e.g. 10M, 1G, or a raw byte count; 0 = default 10 MiB)
  ## mdbox_rotate_interval: 0             # roll the append file once older than this (e.g. 30s, 5m, 1h, or raw seconds; 0 = disabled)
  ## mdbox_preallocate_space: false       # fallocate() new m.<N> files up front (Linux only)
  ## mail_index_path: "/var/yarilo-index/%d/%n"     # redirect per-folder index files to a faster disk
  ## mail_control_path: "/var/yarilo-control/%d/%n" # redirect yarilo-uidlist and subscriptions files
  ## mail_volatile_path: "/run/yarilo-volatile/%d/%n" # local tmpfs for index tmp files (NFS deployments)
  ## mail_alt_path: "/mnt/cold/%d/%n"              # cold-tier storage root, maildir and mdbox alike
  ## Log rotation, one policy for both transaction logs — the mdbox map and the per-folder file index.
  ## Every open replays the tail since the last fold, so the floor bounds what an open costs.
  ## Each of the three works on its own: set one and the other two keep their
  ## built-in values. They are commented out here because those built-ins are
  ## what runs when nothing is set.
  ## mail_index_log_rotate_min_size: "32k"  # 32 KiB — never fold below this (human-readable; quote it)
  ## mail_index_log_rotate_min_age: 60      # 60s    — between min and max, fold only once the log is this old.
  ##                                         #          Measured (#1460): at 300s an actively delivering account
  ##                                         #          carried a log to ~110 KB and paid p99 249ms against 128ms.
  ##                                         #          Raise it for a very large mailbox with sparse delivery,
  ##                                         #          where folds are the rarer cost.
  ## mail_index_log_rotate_max_size: "1M"   # 1 MiB  — fold above this whatever the age (human-readable; quote it)
  ## max_concurrent_writes: 0           # 0 = unlimited; tune to storage type: ~32 HDD, ~256 SSD
  ## mailbox_list_utf8: true            # true = UTF-8 on disk (default); false = modified-UTF-7 for legacy migrations
  ##                                    # UPGRADE NOTE: before 2.3.55 this key was documented but never rendered,
  ##                                    # and the default was not applied either, so names went to disk as
  ##                                    # modified-UTF-7 regardless. A deployment that already holds non-ASCII
  ##                                    # folder names created under those releases must set this to false to keep
  ##                                    # reading them; ASCII-only installations are unaffected.
  ##                                    # Note that false leaves the two trees naming one mailbox differently:
  ##                                    # the index (and volatile, and FTS) path is built from the logical folder
  ##                                    # name and is therefore always UTF-8, while the mail directory is
  ##                                    # modified-UTF-7. That is not new — it is what those releases already do —
  ##                                    # but it means a later move to UTF-8 renames only the mail directories;
  ##                                    # the index side is already there.
  ## mailbox_list_normalize_names_to_nfc: true # true = NFC-normalise folder names (default)
  ##                                    # Same upgrade note: unrendered and undefaulted before 2.3.55.
  ##                                    # UPGRADE NOTE (2.3.72): normalisation now happens where a folder
  ##                                    # name becomes a storage name, so the index, volatile, ACL and FTS
  ##                                    # trees spell a name the way the mail tree already did. Before, one
  ##                                    # mailbox addressed in two Unicode forms was one mail directory and
  ##                                    # two of each of the others. A deployment that already holds a
  ##                                    # decomposed (NFD) folder name -- non-ASCII, created by a client that
  ##                                    # sends NFD, macOS clients historically did -- gets a fresh index and
  ##                                    # FTS directory for it on first access after the upgrade, so that
  ##                                    # mailbox reindexes and its UIDVALIDITY changes once. The mail is not
  ##                                    # touched: it was always in the one directory. ASCII-only folder
  ##                                    # names are unaffected.
  ##                                    # UPGRADE NOTE (2.3.77): normalisation moved once more, from path
  ##                                    # derivation to the name-entry boundary -- one owner, applied where a
  ##                                    # wire name becomes the name every tree is addressed by. Behaviour for
  ##                                    # new names is unchanged; the retroactivity above (a decomposed name's
  ##                                    # index/ACL/FTS trees rebuilt once, UIDVALIDITY changing once, mail
  ##                                    # untouched) is the same event and happens on the 2.3.72 -> 2.3.77
  ##                                    # upgrade if it did not already. One extra caveat: a SUBSCRIBE recorded
  ##                                    # under a decomposed name keeps its stored spelling, so LSUB may return
  ##                                    # a name in a different form than LIST until it is re-subscribed. SELECT
  ##                                    # of either form resolves the same folder, so nothing is lost.
  ## mailbox_list_validate_fs_names: true # refuse folder names unsafe as paths: "."/".." segments, adjacent
  ##                                      # separators, leading "/" or "~", and the on-disk hierarchy separator
  ##                                      # when it differs from the namespace one (default true; turn off only
  ##                                      # for a driver that never builds a path from the name)
  ## mailbox_list_refuse_layout_separator: false
  ##                                      # refuse names containing the on-disk hierarchy separator when the
  ##                                      # namespace uses a different one (with separator "/" on maildir, that
  ##                                      # means any name with a "."). Off by default: it is retroactive against
  ##                                      # ordinary names such as example.com, and on maildir a nested "a/b" and
  ##                                      # a dotted "a.b" are the same bytes on disk, so existing names cannot be
  ##                                      # audited by reading the filesystem. Turn on for new deployments.
  ##                                      # NOTE: with this off and no escape char set, such a name is not "kept"
  ##                                      # on maildir — it is reinterpreted. CREATE "Invoices.2026" is accepted
  ##                                      # and LIST returns "Invoices/2026": a parent and a child the client
  ##                                      # never asked for. SELECT of the original name still works, so a client
  ##                                      # that does not LIST never learns of the substitution. Set
  ##                                      # mailbox_list_storage_escape_char to keep such names literal.
  ## mailbox_list_storage_escape_char: "^"
  ##                                      # single character; "" (default) disables escaping. When set, a folder
  ##                                      # name is kept literal on disk: the layout separator the client wrote is
  ##                                      # stored as <char><hex>, so "Invoices.2026" stays one mailbox and is
  ##                                      # listed as written, while "a/b" still nests. It also makes the name
  ##                                      # portable — the same folder is one mailbox on maildir and on dbox, so a
  ##                                      # format migration preserves it.
  ##                                      # NOT retroactive: a folder already on disk as ".Invoices.2026" keeps
  ##                                      # listing as "Invoices/2026". Only folders created after it is enabled
  ##                                      # are stored escaped. Changing or unsetting the character later has the
  ##                                      # same effect in reverse, so pick one before creating mail.
  ##                                      # When set, it supersedes the two refusals that exist because such names
  ##                                      # could not be represented: the layout separator and reserved segments
  ##                                      # are escaped and stored rather than refused. Traversal names are still
  ##                                      # refused.
  ##                                      # Must be a single printable ASCII byte outside the modified-UTF-7
  ##                                      # base64 alphabet [A-Za-z0-9+,], and not "." "/" or "&". Startup fails
  ##                                      # on anything else rather than accepting a value that would make folder
  ##                                      # names unreadable on disk. "^" and "%" are good choices.
  ## mailbox_list_reserved_segments: ["cur", "new", "tmp", "dbox-Mails"]
  ##                                      # names a single hierarchy segment may not equal, because the storage
  ##                                      # layout owns the directory. Only the names the layout in use actually
  ##                                      # owns are enforced: maildir++ gives every folder a leading "." so a
  ##                                      # folder called "new" is ".new" and collides with nothing, while the
  ##                                      # dbox layouts own only their "dbox-Mails" marker. A name listed here
  ##                                      # that the layout does not own is not a collision and is ignored.
  ##                                      # Retroactive where it does apply: a user who already owns such a
  ##                                      # folder loses access to it. [] disables the check.
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

## -------------------------------------------------------------------
## Components
## -------------------------------------------------------------------
components:

  ## Key-naming boundary within each component:
  ##   * config-mirror keys — those that render into a yarilo.yaml config section
  ##     — are snake_case and spelled 1:1 with the config key (e.g. a `service:`
  ##     or `token:` sub-block: listen, key_prefix, channel_prefix, redis_addr).
  ##   * k8s-shape keys — deployment concerns (replicas, startupProbe, resources,
  ##     internalTLS) — are camelCase.
  ## Keep the two apart so the same config knob is never spelled two ways. Warden
  ## (#908: service.state_backend / key_prefix / channel_prefix) follows this
  ## from its first PR.

  ## Co-located backend pod (#788). One StatefulSet whose pod runs every
  ## protocol container (imap/pop3/submission/lmtp/managesieve) + yarilo-fts
  ## (localhost) + yarilo-backend-api + the yarilo-backend-reg sidecar, sharing
  ## one pod IP + the tag's NFS PV. Restores the reference invariant "one
  ## mail-host owns every per-user resource" → one director ring + one userDir
  ## are correct, and per-user fts is single-writer for free (#675/#676).
  ## Per-container resources come from the components.<proto>/fts/backendAPI
  ## blocks below. quota-status stays a SEPARATE Deployment (global-read, served
  ## to the external Postfix MTA — it writes no per-user state).
  backend:
    ## threading — which delivered messages are recorded as belonging to one
    ## conversation (#1425). Written on the delivery path, into a per-account
    ## sidecar beside the other control files.
    threading:
      ## On by default since 2.3.246. Measured before the default moved
      ## (#1425): the sidecar write costs ~1ms per delivery, and that figure
      ## does not move with the driver or with the size of the account -- the
      ## fold cache is what keeps it flat, so delivery does not pay
      ## O(account) per message.
      ##
      ## Turning it off costs nothing and leaves nothing behind: an account
      ## stops recording conversations and behaves exactly as it did before
      ## threading existed -- every message its own conversation, which is
      ## also how an account looks before the migration step reaches it.
      ## Existing sidecars stay on disk and are picked up again when it is
      ## turned back on -- but messages delivered while it was off were never
      ## recorded, and stay one conversation each until an operator runs
      ## `yarilo-migrate --thread-backfill --force` for the account. Without
      ## that, toggling the knob looks like conversations partly disappearing.
      enabled: true
      ## Seconds a process keeps an account's folded sidecar after its last
      ## delivery. Folding is O(account) -- 0.4ms at a thousand messages, 37ms
      ## at a hundred thousand -- so it is cached rather than repeated per
      ## message; bounded by idleness so an account nobody delivers to gives
      ## its memory back. 0 = built-in default (300); negative = never cache,
      ## which pays the fold on every delivery.
      cache_idle: 0

    ## coLocated: true renders the merged StatefulSet and suppresses the legacy
    ## per-protocol backend Deployments. This is the model behind a director.
    coLocated: true
    replicas: 3
    ## startupProbe on each session container: waits for locks, Redis and (when a DB
    ## host is configured) the database to accept a TCP connection before that
    ## container takes traffic, replacing the wait-* init containers (#903). The
    ## fts/backend-api/backend-reg sidecars are ungated. Code is unchanged (fail-fast).
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    ## Internal mTLS for the pod's control channels (director registration,
    ## auth/warden/locks dials). Shared by all containers in the pod.
    internalTLS:
      enabled: false
      secretName: ""
    ## Resources for the tiny yarilo-backend-reg registration sidecar.
    regResources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 100m
        memory: 64Mi

  ## Director — front-end proxy.
  ## Accepts client connections, routes to backend via consistent hash.
  director:
    enabled: false
    replicas: 1

    ## Internal director protocol (ring management, LOOKUP between directors).
    directorPort: 9102

    ## Client-facing listeners.
    ## IMAP/POP3/Submission are handled by dedicated login pods; director only proxies LMTP.
    listeners:
      lmtp:
        enabled: false
        port: 24
        containerPort: 10024

    ## mTLS for internal connections (director ↔ auth, director ↔ backend).
    ## Ring mTLS (#753). Ring peers are dialled by EPHEMERAL pod IP, so the
    ## dial pins a stable TLS ServerName (ringTlsServerName below) that must be
    ## a SAN in the director's internal-tls cert. The stock shared internal-tls
    ## secret has no such SAN, so enable certificate below to have the chart
    ## issue a director-specific cert into secretName with the ring SANs — or
    ## provide your own secret via secretName. With internalTLS.enabled=true and
    ## peers configured but no ring name in the cert, the ring cannot verify
    ## peers and never converges (the director logs an ERROR/Warn to say so).
    internalTLS:
      enabled: false
      ## Director-specific internal-tls secret (distinct from the shared one),
      ## carrying the ring SANs. Required when certificate.enabled is true.
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          ## Must be a cluster-INTERNAL CA — a public ACME issuer
          ## (letsencrypt) cannot sign these internal names.
          kind: ClusterIssuer
          name: yarilo-internal-ca
        ## SANs for the issued cert. Empty defaults (in certificate.yaml) to
        ## [<release>-director-ring, <release>-director]; override to add names.
        dnsNames: []
        # duration: 2160h
        # renewBefore: 360h
      ## TLS ServerName used when dialling ring peers (rendered to
      ## director_service.ring_tls_server_name). Empty defaults to
      ## <release>-director-ring in the rendered config.
      ringTlsServerName: ""

    ## Consistent-hash routing settings.
    user_expire: 900
    ping_interval: 30
    ## Seconds to wait for PONG before closing a client connection. Deliberately
    ## 10s (the reference allows up to 60s): a login pod that has not PONGed in
    ## 10s is treated as gone so its sticky sessions are cleaned up promptly.
    ## Raise toward 60 on high-latency links if false disconnects appear (#740).
    ping_timeout: 10
    write_timeout: 10

    ## Lowercase usernames before hashing/keying them for ring routing, sticky
    ## assignments and admin overrides (#738). Without this, "User@d.test" and
    ## "user@d.test" hash to different values and can land on different
    ## backends, defeating sticky routing. Matches the reference
    ## implementation's default hash template. Migration: flipping this on an
    ## already-running cluster changes hashes for mixed-case usernames — their
    ## existing sticky entries just expire naturally via user_expire, no
    ## special migration step is needed.
    username_hash_lowercase: true
    ## Username hash template (#850) — uses the same director_username_hash
    ## expression syntax, so an existing value migrates verbatim. Variables: %u (whole
    ## user), %n (local part, before first '@'), %d (domain, after first '@'), each
    ## with optional %L lowercase; %% is a literal percent. Examples: "%Lu" (default,
    ## whole username lowercased), "%u" (case-sensitive), "%Ld" (route the whole domain
    ## to one backend — shared-mailbox/ACL locality), "%Ln" (local part only, for
    ## alias-domain installs). Empty ("") derives the template from
    ## username_hash_lowercase (%Lu / %u) for byte-identical back-compat. When set, it —
    ## not the bool — governs case-folding. An invalid template aborts startup.
    username_hash: ""
    ## Initial (unpinned) user placement (#797): hash | least_sessions.
    ## hash = consistent hash (reference semantics, deterministic). least_sessions
    ## = load-aware two-level pick (per-protocol then total, vhosts-normalized).
    assignment_policy: hash

    ## Grace window (seconds) before an admin-initiated kick pushes USER-KICKED
    ## (#740), letting a user's in-flight command on the old backend finish
    ## after a move. Admin path only — a backend-down/expiry kick fires
    ## immediately (nothing to grace on a dead backend) and the split-writer
    ## conflict-kick is never delayed. Matches the reference's
    ## director_user_kick_delay. 0 = 2; negative = disabled (immediate).
    ## Note: there is no max_parallel_moves knob — yarilo rehashes lazily
    ## (kick -> re-login -> LOOKUP), so the move rate is already bounded by
    ## max_parallel_kicks below; a parsed-but-unread key is deliberately omitted.
    user_kick_delay: 2
    ## Confirmed ring-wide kick (#847, reference user_kill_state parity). While a
    ## user is being kicked/moved, LOOKUP is HELD so a concurrent login cannot
    ## land on a fresh backend before the old sessions are gone (the split-writer
    ## window). user_kill_timeout is the hard fallthrough (seconds): if the kill
    ## is not confirmed complete within it (a stuck session-holder), the hold is
    ## released anyway with a WARN, so a user is never locked out permanently.
    ## Replicated ring-wide as a DURATION — each director computes its own local
    ## deadline, never a wall-clock one (pod-clock skew would make it unstable).
    ## The login proxy treats the hold as retryable (bounded re-LOOKUP), so a
    ## kick does not turn concurrent logins into client errors. 0 = 15.
    user_kill_timeout: 15
    ## How long (seconds) the user's ring-wide session count must stay at zero
    ## before the kill is confirmed complete (#847) — a stable-zero window that
    ## absorbs a session opening mid-kill dipping the count to zero momentarily.
    ## 0 = 1.
    user_kill_confirm_grace: 1
    ## Cap on sessions kicked per batch when a backend goes down (#740). The
    ## rest are kicked in later batches with a short pause between them,
    ## spreading the re-login stampede across surviving backends instead of
    ## firing every kick at once. Matches director_max_parallel_kicks.
    ## 0 = 100; negative = no batching (kick all at once).
    max_parallel_kicks: 100
    ## Cap on concurrent user moves during a GRACEFUL backend evacuation (#849) —
    ## the throttled `yarctl director backends flush IP` (no --force). The director
    ## keeps at most this many users draining at once; each user's old sessions
    ## confirm gone before the next is pulled in, so a planned backend drain
    ## (rolling upgrade, maintenance) spreads the re-login across surviving pods
    ## instead of stampeding them. Matches director_max_parallel_moves.
    ## 0 = 5; negative = unlimited (all at once, ~equivalent to --force).
    max_parallel_moves: 5
    ## Optional external per-user cleanup hook (#848), the analog of the reference's
    ## director_flush_socket. Path to an executable run once per user AFTER a
    ## deliberate relocation (admin move or graceful evacuation) confirms ring-wide —
    ## i.e. after the user's old sessions are gone. Called as:
    ##   flush_program FLUSH <username> <username_hash> <old_backend> <new_backend>
    ## Best-effort + async with a bounded timeout: a slow/failing hook is logged, never
    ## blocks the ring/LOOKUP, never fails the move. Only the director that originated
    ## the move runs it; mass/reactive paths (backend-down, --force flush) do not.
    ## The program runs in the director pod's context. Empty = disabled (default).
    flush_program: ""
    ## Seconds one flush_program run may take before it is killed. The hook is
    ## best-effort, so an overrun leaves nothing behind but a WARN on the
    ## server -- which is why the bound belongs to whoever wrote the script.
    ## Raise it for a hook that legitimately takes longer than ten seconds.
    flush_program_timeout: 10

    ## Static backend list loaded at startup.
    ## Each entry must match a backend service in the backend namespace.
    ## tag: optional pool tag to group backends (empty = default pool).
    ## vhosts (#740): optional ring weight 1..100 — declare it so a static
    ## backend is a real candidate under assignment_policy: least_sessions
    ## (there vhosts 0 means DRAIN); also makes weighting reproducible across
    ## director restarts instead of being runtime-API-only. Omit for the default.
    backends: []
    # - host: yarilo-imap.yarilo-backend.svc.cluster.local
    #   port: 993
    #   tag: ""
    #   vhosts: 100
    # - host: yarilo-pop3.yarilo-backend.svc.cluster.local
    #   port: 110
    #   tag: ""
    # - host: yarilo-lmtp.yarilo-backend.svc.cluster.local
    #   port: 24
    #   tag: ""

    ## Seed address(es) for the self-organizing ring (#750, replaces the old
    ## static full-mesh peer list — same key, new semantics). Each entry is
    ## "host:port"; director joins via the first that accepts a
    ## DIRECTOR-JOIN, then maintains membership automatically from there —
    ## no further entries here needed as replicas scale.
    ##
    ## LEAVE THIS EMPTY in k8s. At replicas > 1 the seed is auto-derived to
    ## the headless <release>-director-ring Service (#751/#764), which is
    ## the ONLY correct ring seed: its DNS name resolves to every ready pod
    ## IP directly, so the DNS fan-out (#763) polls each peer and formation
    ## converges deterministically with no self-dials. Do NOT point this at
    ## the ClusterIP <release>-director Service — that resolves to a single
    ## virtual IP, load-balances every dial randomly (including back to
    ## self), and silently reintroduces the formation partition #759 fought.
    ## -director stays the LOOKUP endpoint for login pods, never the seed.
    ##
    ## Set an explicit host:port list only for non-k8s deployments or a
    ## deliberate manual seed; it overrides the auto-derived default.
    ## replicas: 1 needs no seed at all — a lone director is a valid N=1 ring.
    peers: []

    ## HMAC secret authenticating DIRECTOR-JOIN requests (#750). Auto-generated
    ## into Secret <release>-director-ring-secret on first deploy and preserved
    ## on upgrades, same pattern as the API token below. Empty (or a rotated,
    ## now-mismatched value) means every JOIN is rejected — that replica can
    ## only ever run as a singleton ring, so keep this in sync across replicas
    ## (which the auto-generated Secret already guarantees within one release).
    ring_secret: "${DIRECTOR_RING_SECRET}"

    ## Install-time warning threshold only ("fewer members than this = no
    ## state redundancy") — never refuses service at any member count.
    min_members: 3

    ## CIDRs a DIRECTOR-JOIN is accepted from (#773) — same semantics as
    ## api.allowed_nets: empty list = allow all (unchanged behaviour),
    ## otherwise the joiner's source IP must fall inside one of these networks
    ## or the JOIN is rejected before the HMAC challenge. A live director is
    ## additionally dialled back at its claimed address to prove it controls it
    ## (unconditional, not a knob). On k8s set this to the pod network CIDR to
    ## keep the ring-join surface off everything else.
    join_allowed_nets: []

    ## How long (seconds) a lease-managed backend may go without a
    ## heartbeat before it is removed ring-wide (#776). A backend becomes
    ## lease-managed when it self-registers with a monotonic seq (a
    ## heartbeating pod); static mail_servers / admin-added backends never
    ## heartbeat and are never expired. The last backend of a tag is never
    ## expired (kept over a guaranteed total blackhole, logged loudly).
    ## 0 = default (30); negative = disabled.
    backend_expire: 30

    ## Active fast-fail re-route (#782): when login proxies fail to dial an
    ## assigned backend they report it unreachable; once this many DISTINCT
    ## proxies corroborate within backend_unreachable_window, the director
    ## evicts the backend from the ring ahead of the lease TTL above, so the
    ## next LOOKUP lands on a live pod instead of waiting out backend_expire.
    ## Reports replicate ring-wide, so the count aggregates across all
    ## directors. Default 2 guards against a single partitioned proxy wrongly
    ## evicting a healthy backend; the last backend of a tag is never evicted.
    ## Single-login-replica deployments (e.g. sandbox, where two distinct
    ## reporters for one protocol's failure may never physically exist) should
    ## set backend_unreachable_reporters=1 — the TTL lease stays the backstop
    ## regardless. 0 = default (2).
    backend_unreachable_reporters: 2
    ## Sliding window (seconds) over which the distinct reports must arrive.
    ## 0 = default (5).
    backend_unreachable_window: 5

    ## How often (seconds) each ring member re-broadcasts its
    ## member+tombstone snapshot over every live ring connection (#759) —
    ## a bounded safety net that heals membership splits without waiting
    ## for a possibly-lost ADD/REMOVE broadcast. 0 = default (3);
    ## negative = disabled.
    anti_entropy_interval: 3

    ## How often (seconds) each member re-polls a seed after its initial
    ## join (#759). The seed is the one guaranteed crossing point between
    ## partitioned member views — broadcast and anti-entropy only travel
    ## over connections that already exist, so a formation split with no
    ## crossing connection can ONLY heal through the seed. Runs at full
    ## cadence while the node's view holds fewer than min_members (a
    ## short view is per se proof of work left, no matter how stable it
    ## looks), easing to a lazy 30s backstop once the expected cluster
    ## size is reached — and snapping back the moment a member is lost.
    ## A hostname seed (the headless -director-ring Service) is resolved
    ## explicitly and every resulting pod address except self is polled
    ## each cycle — deterministic convergence in one cycle, no
    ## load-balancer routing luck. 0 = default (2); negative = one-shot
    ## join (join once, never poll again).
    seed_poll_interval: 2

    ## Eased poll cadence (seconds) once the view has reached min_members.
    ## Defaults to the same 2s as seed_poll_interval — i.e. NO effective
    ## backoff — because a node cannot tell "converged" from "stable but
    ## holding a dead member": a freshly-respawned replacement pod that
    ## learned a since-dead member during the death-detection window would
    ## otherwise keep it for a full idle interval (#765, live-measured 40s+
    ## at a 30s idle). Raise this only to trade steady-state polling for
    ## slower dead-member eviction on fresh joiners. Clamped up to
    ## seed_poll_interval. 0 = default (2).
    seed_poll_idle_interval: 2

    ## How long (seconds) a dead member's tombstone is kept and gossiped
    ## (#765) — bounds tombstone-set growth across many rollouts. Safe to
    ## expire: neighbor liveness monitoring (#768 — both immediate
    ## neighbors watch every member, reference model) re-evicts a
    ## resurrected-but-unreachable member within seconds regardless of
    ## tombstone state. 0 = default (600); negative = never expire.
    tombstone_ttl: 600

    ## HTTP admin API (yarctl CLI target).
    ## A 32-char token is auto-generated into Secret <release>-director-api-token on first
    ## deploy and preserved on upgrades. To rotate: delete the Secret before helm upgrade.
    api:
      port: 9103
      ## CIDRs allowed to reach the API, checked BEFORE the bearer token.
      ## Empty (default) = no IP restriction — the API is gated on the
      ## auto-generated token alone, which is the real security boundary
      ## (random per install, never logged). This is deliberate: service
      ## and pod CIDRs differ per cluster/CNI, so any hardcoded default
      ## here (kubeadm's 10.96.0.0/12 + 10.244.0.0/16 was tried and
      ## silently 403'd every request on clusters using different ranges,
      ## #759) would either be wrong out of the box or require every
      ## installer to already know their cluster's CIDRs before the chart
      ## even works. Empty here does NOT mean "no security" — it means
      ## "security is the token." Set this to your actual service/pod
      ## CIDRs as opt-in defense-in-depth once you know them.
      allowed_nets: []

    ## yarilo-monitor sidecar — probes backend pods and reports health to the director.
    ## Runs as a sidecar container in the director pod.
    monitor:
      enabled: false

      ## Image override (defaults to the same image as the director).
      image: ""

      ## Which protocols to probe on every backend in the ring.
      ## Ports default to standard mail ports (993 / 110 / 24).
      pollIMAP: true
      imapPort: 993
      pollPOP3: false
      pop3Port: 110
      pollLMTP: false
      lmtpPort: 24

      ## Poll interval and per-probe timeout (seconds).
      interval: 10
      timeout: 3

      ## Consecutive failures before rapid poll; rapid poll threshold.
      retryCount: 3
      rapidRounds: 10
      rapidFailsNeeded: 7

      ## Seconds from BACKEND-FLUSH (drain start) to BACKEND-DOWN (full ring
      ## removal). Supported by the monitor but previously not rendered
      ## (#748 item 4).
      drainTimeout: 60

      ## Per-tag monitoring credentials.
      ## The tag is the same label used on backends, users, and storage.
      ## The "" key covers untagged backends.
      ##
      ## tags:
      ##   "":
      ##     user: monitor@example.com
      ##     password: secret
      ##   ssd:
      ##     user: monitor-ssd@example.com
      ##     password: ssd-secret
      tags: {}

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 500m
        memory: 256Mi

  ## Auth — passdb/userdb chain.
  auth:
    enabled: true
    replicas: 1
    ## Seconds a process waits at STARTUP for yarilo-auth to answer before it
    ## gives up and exits. A pod starting while auth is rolling has nobody to
    ## tell, so exiting immediately turns a few seconds of dependency downtime
    ## into a restart loop.
    ## Startup only: on a request a fast refusal beats a hang, so the
    ## per-request dials never wait. 0 = built-in default (30); negative = do
    ## not wait at all.
    startup_wait: 30

    ## client — how OTHER components talk to auth's MASTER listener (userdb
    ## lookups from the jmap and fts resolvers), as opposed to the login pods
    ## on the client protocol above.
    client:
      ## Master-protocol connections a process keeps open for userdb lookups.
      ## The dial costs about seven times the lookup it carries, and arrives at
      ## auth as a connection per lookup with a full handshake on its side too.
      ## 0 = built-in default (4); NEGATIVE = a connection per lookup, i.e. the
      ## behaviour before pooling — the rollback, by config rather than by a
      ## release.
      ## Raising it costs at shutdown: closing waits up to a second per slot
      ## still serving a lookup, so a large pool of stuck lookups delays exit by
      ## roughly its size in seconds.
      pool_size: 0
      ## Seconds before an unused pooled connection is closed, so a process
      ## that resolved nobody for an hour is not holding one. 0 = built-in
      ## default (300, matching fts handle_idle_timeout); negative = never
      ## evict. A connection idle for a quarter of this is probed before it is
      ## handed out, rather than discovering a dead peer by failing a lookup.
      pool_idle_timeout: 0

    ## listen — client protocol (login pods speak here).
    listen: ":9100"
    ## addr — address login pods dial to reach yarilo-auth.
    ## Defaults to listen when empty (single-process / dev mode).
    ## In k8s set to the ClusterIP service DNS, e.g. "<release>-auth:9100".
    addr: ""
    ## masterListen — master protocol for password-less
    ## userdb lookups (USER / LIST) used by yarilo-backend-api admin
    ## endpoints and CLI tooling. Empty disables; the binary then only
    ## opens the client listener.
    masterListen: ":9102"
    ## saslListen — plain-TCP listener for Postfix SASL auth
    ## (smtpd_sasl_type=dovecot, smtpd_sasl_path=inet:[yarilo-auth]:12345).
    ## Empty disables the listener.
    saslListen: ""

    ## startupProbe waits for Redis and (when applicable) the SQL database to accept
    ## a TCP connection before this pod takes traffic, replacing the wait-redis /
    ## wait-db init containers (#903). The auth code is unchanged — it still fails
    ## fast if a dependency is missing at process start — so the DB must be up first
    ## (the sandbox db-init and managed schemas ensure this); the probe withholds
    ## traffic and does not run liveness until the dependencies answer.
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3m).
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90

    internalTLS:
      enabled: false
      secretName: ""

    passdb:
      - driver: mysql
        dsn: "${YARILO_DB_DSN}"
        default_pass_scheme: BCRYPT
        ## Custom queries (optional — leave empty to use the auto-created yarilo_users schema).
        ## password_query: |
        ##   SELECT password, '' AS home, '' AS mail, active AS enabled
        ##   FROM users WHERE username = LOWER(%u)
        ## user_query: |
        ##   SELECT CONCAT(home, mpath) AS home,
        ##          CONCAT(mbtype, ':~/', maildir,
        ##                 ':INDEX=~/index',
        ##                 ':VOLATILEDIR=/tmp/yarilo-volatile/%2.256Nu/%u') AS mail,
        ##          CONCAT('*:bytes=', quota) AS quota_rule
        ##   FROM mailbox WHERE username = %u
        ## iterate_query: |
        ##   SELECT username FROM users WHERE active = 1 ORDER BY username
        ## skip_schema: true   # set when using a custom table instead of yarilo_users
        ##
        ## Connection-pool limits (#886). Defaults are per driver, because the
        ## cost of a connection is not comparable between them:
        ##   mysql    25 — a connection is a thread
        ##   postgres  8 — a connection is a process, and the stock
        ##                 max_connections is 100, LOWER than MySQL's 151
        ##   sqlite    1 — a file, whose writers serialise inside the library;
        ##                 extra connections buy SQLITE_BUSY, not throughput
        ## max_idle_conns defaults to max_open_conns: retaining fewer idle
        ## connections than the pool opens means the difference is re-dialled on
        ## every burst, which is what drove the sandbox MySQL to its ceiling.
        ## Negative disables a limit. Seconds for the two timeouts.
        ## max_open_conns: 0
        ## max_idle_conns: 0
        ## conn_max_lifetime: 0   # 0 = 300
        ## conn_max_idle_time: 0  # 0 = 60

      ## passwd-file driver — a flat, colon-separated user file (classic
      ## /etc/passwd layout) that serves both passdb and userdb roles, so a
      ## self-hosted deployment can run without a database. One line per user:
      ##   user:password:uid:gid:gecos:home:shell:extra_fields
      ## Only user + password are required; uid/gid/gecos/shell are parsed for
      ## layout compatibility but ignored. extra_fields are space-separated
      ## key=value; userdb_-prefixed keys populate the userdb (userdb_mail,
      ## userdb_quota_rule, ...). Passwords carry a {SCHEME} prefix or a crypt(3)
      ## marker; unmarked values assume default_pass_scheme (default CRYPT).
      ## Mount the file into its OWN dir via extraVolumes/extraVolumeMounts —
      ## NOT under /etc/yarilo (the rendered-config mount); a subPath file there
      ## fails with "not a directory" and crash-loops the pod.
      # - driver: passwd-file
      #   passwd_file: /etc/yarilo-passwd/passwd
      #   default_pass_scheme: CRYPT

      ## static driver — one shared credential + templated fields applied to
      ## every user. For tests, single-mailbox installs, and proxy front-ends
      ## (set nopassword: true to accept any password and let the upstream
      ## authenticate). Matches every username, so place it LAST in the chain.
      ## fields values expand %u/%n/%d; userdb_-prefixed keys populate the
      ## userdb, bare keys are forwarded on the passdb path.
      # - driver: static
      #   static_password: "${YARILO_STATIC_PASSWORD}"   # or nopassword: true
      #   default_pass_scheme: BCRYPT
      #   fields:
      #     userdb_home: "/var/vmail/%d/%n"
      #     userdb_mail: "maildir:/var/vmail/%d/%n/Maildir"

    ## failureDelay — timing-leak mitigation. Every failed auth
    ## reply (wrong password, unknown user, malformed SASL) is
    ## held back this many seconds before surfacing to the client
    ## so unknown-user and wrong-password paths return in the same
    ## wall-clock time. Default 2s. Corresponds to the
    ## `auth_failure_delay`. Set to 0 to disable (tests only —
    ## production should keep >0).
    ## persistence — SQLite fallback only; not used when mysql.bundled=true.
    persistence:
      enabled: false
      storageClass: ""
      size: 1Gi

    ## maxAttempts — number of failed auth attempts allowed on a single
    ## connection before the server sends BYE and closes (IMAP/POP3).
    ## Mirrors the `auth_max_attempts`. Default 3.
    maxAttempts: 3
    failure_delay: 2
    ## internal_failure_delay_ms — separate delay for INTERNAL
    ## failures (passdb backend down, SQL refused). Matches
    ## the `auth_internal_failure_delay` setting. Typically shorter
    ## than failure_delay so a passdb outage does not amplify
    ## into user-facing latency.
    internal_failure_delay_ms: 2000

    ## cache — in-process auth cache (LRU, bytes-bounded).
    ## OPT-IN, disabled by default (sizeBytes: 0). Stores
    ## HMAC-ed passwords (never plain) keyed by
    ## `<service>\t<username>`. Positive entries hold the
    ## verified credential and bag; negative entries short-
    ## circuit failed lookups for the NegativeTTL window. Evict
    ## selectively via `yarctl auth cache flush
    ## [user-mask...]`.
    cache:
      ## cache_size — human-readable byte cap (1024-based units: b, k, M, G, T;
      ## a bare integer is bytes). "100M" == 104857600. Empty/0 disables caching.
      ## Quote it so a unit suffix stays a string.
      cache_size: "100M"
      ttl_seconds: 1800
      negative_ttl_seconds: 1800

    ## penalty — cross-pod IP-bound auth-fail backoff. OPT-IN.
    ## Every failed auth from a given client IP increments the
    ## counter in the warden service; subsequent attempts from that
    ## IP sleep PenaltyToSecs(count) seconds before the chain runs
    ## (exponential 0/2/4/8/15 cap). Successful auth resets the
    ## counter to 0. Master-user flows are exempt.
    ##
    ## Requires the warden service to be reachable.
    penalty:
      enabled: false

    ## token — one-time session token issued after successful passdb.
    ## The login pod forwards the token to the backend (XCLIENT TOKEN=);
    ## the backend calls yarilo-auth VERIFY to consume it and enter
    ## authenticated state without replaying credentials.
    token:
      ## ttl_seconds — how long the token is valid for the backend to
      ## consume. Must be larger than the login→backend roundtrip time.
      ## Default 60 s is generous; lower to 10-15 s in production.
      ttl_seconds: 60
      ## backend — token store implementation.
      ## "memory": in-process (single auth pod only).
      ## "redis": Redis-backed, safe for replicaCount > 1.
      backend: memory
      ## redis_addr — Redis URL used when backend=redis.
      ## Format: redis://[password@]host:port/db
      redis_addr: ""
      ## key_prefix — Redis key namespace for tokens (#939). The installation
      ## boundary: when several installations share one Redis, give each a
      ## distinct prefix so their token keys do not collide. Keep it consistent
      ## with the other Redis-using components' prefixes (locks, warden) for one
      ## install. Default is service-name based.
      key_prefix: "yarilo:authtoken:"

    ## oauth2 — OAuth 2.0 bearer-token providers. Each entry
    ## becomes a passdb that participates in the auth chain (placed
    ## AHEAD of SQL so an OAUTHBEARER login resolves through the
    ## validator before SQL ever sees the bearer token as a
    ## plaintext password). Empty list disables OAUTHBEARER.
    ##
    ## See https://doc.yarilomail.org/AUTH_OAUTH2 for the wire spec, configuration
    ## reference, and worked examples for Google Workspace,
    ## Microsoft 365, and Keycloak / Authelia.
    ##
    ## Four validation modes:
    ##   - local         — JWT verify against jwks_url (recommended)
    ##   - introspection — RFC 7662 endpoint
    ##   - tokeninfo     — Google-style endpoint
    ##   - discovery     — auto-resolve via OIDC discovery (issuer_url)
    oauth2: []
      # - mode: discovery
      #   issuer_url: https://accounts.google.com
      #   audience: <your-google-oauth-client-id>
      #   scopes: [openid, email]
      #   username_attribute: email
      #   username_validation_format: "%Lu"
      #   extra_fields: [sub, hd]
      # - mode: local
      #   jwks_url: https://login.microsoftonline.com/common/discovery/keys
      #   issuers: ["https://login.microsoftonline.com/<tenant-id>/v2.0"]
      #   audience: <your-azure-app-id>
      #   username_attribute: preferred_username
      # - mode: introspection
      #   introspection_url: https://keycloak.internal/realms/yarilo/protocol/openid-connect/token/introspect
      #   introspection_mode: post
      #   client_id: yarilo-auth
      #   client_secret: change-me
      #   username_attribute: email

    ## policy — wforce-compatible HTTP policy-server hook. URL=""
    ## disables. When set, every login attempt POSTs JSON to the
    ## policy server which can allow / reject / tarpit the request.
    ## See https://doc.yarilomail.org/AUTH_POLICY for the wire format and a wforce
    ## configuration example.
    ##
    ## hashNonce is REQUIRED when url is set — it salts the pwhash
    ## field so two deployments don't share the same hash space.
    ## Default hash is truncated to 12 bits (4096 buckets) so the
    ## policy server can group attempts without seeing real
    ## passwords.
    policy:
      url: ""
      api_header: ""
      hash_mech: sha256
      hash_nonce: ""
      hash_truncate_bits: 12
      timeout_ms: 5000
      reject_on_fail: false
      log_only: false
      check_before: true
      check_after: true
      report_after: true

    ## masterUsers — master-user impersonation
    ## (SASL PLAIN authzid). OPT-IN, disabled by default. While
    ## `enabled: false` the IMAP / POP3 / Submission / wire
    ## yarilo-auth code paths drop the authzid before consulting
    ## the chain — distinct authzid produces an opaque auth
    ## failure indistinguishable from a wrong password.
    ##
    ## Set `enabled: true` to allow EITHER of these admin paths:
    ##   1. A dedicated `masterdb` chain (entries below) whose
    ##      rows are unconditionally allowed to impersonate any
    ##      target. Independent SQL store; same query syntax as
    ##      the regular `passdb`.
    ##   2. A regular `passdb` row that returns the extra field
    ##      `master_user=yes` from its passwordQuery. That row
    ##      is then allowed to impersonate any target — useful
    ##      when admins and end-users share one user table.
    ##
    ## `separator` enables the legacy `target<sep>master` SASL
    ## workaround for clients that cannot supply authzid (older
    ## Outlook, some mobile MUAs). Empty disables the workaround
    ## even when `enabled: true`. `*` matches the default
    ## `auth_master_user_separator`.
    master_users:
      enabled: false
      separator: "*"
      masterdb: []
        ## - driver: sqlite
        ##   dsn: /var/lib/yarilo/masters.db
        ##   password_query: "SELECT password FROM masters WHERE username = ?"
        ##   default_pass_scheme: BCRYPT

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 320Mi

  ## Warden — connection rate limiter. Keep replicas: 1.
  warden:
    enabled: true
    replicas: 1

    ## service — config-mirror subtree: snake_case keys, 1:1 with warden_service.*
    ## of yarilo.yaml. k8s-shape keys (replicas / internalTLS / resources) stay at
    ## the level above. See the boundary note at the top of components:.
    service:
      listen: ":9101"
      ## conns — long-lived connections each login pod keeps to yarilo-warden
      ## (#878). 0 = built-in default (4). Sessions do not own a connection: every
      ## command carries the session id and the server keeps no per-connection
      ## state, so the connection count no longer tracks the login rate. The warden
      ## protocol has no request id, so one connection serves one command at a
      ## time — each is a sub-ms round trip, so a handful covers any login rate.
      conns: 0

      ## state_backend (#908) — shared-state store.
      ##   "memory": in-process, single replica (replicas MUST stay 1).
      ##   "redis":  survives a restart and is shared across replicas; required
      ##             before raising replicas > 1. In this phase only the per-IP
      ##             penalty counter is Redis-backed; sessions/kick follow.
      state_backend: memory
      ## redis_addr — Redis URL when state_backend=redis. Empty derives it from
      ## the top-level redis: section (bundled or externalUrl), same as locks.
      redis_addr: ""
      ## key/channel prefixes (#938/#939 practice) — the installation boundary;
      ## keep consistent with locks/authtoken on a shared Redis. channel_prefix
      ## namespaces the kick bus Pub/Sub (#908). Defaults are service-name based.
      key_prefix: "yarilo:warden:"
      channel_prefix: "yarilo:warden:events:"

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

  ## yarilo-backend-api — storage-plane operator HTTP API.
  ## Exposes dict / acl (later) / quota (later) / folder / user
  ## operations consumed by yarctl CLI. Mounts the same
  ## storage PVC as the session pods + connects to every
  ## configured dict.
  ##
  ## Bearer token auth (auto-generated Secret unless tokenSecret
  ## is provided). For multi-pod backend cluster, director's
  ## /api/admin/proxy/<user>/... proxies admin requests to the
  ## right backend's yarilo-backend-api by user-to-backend mapping.
  backendAPI:
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    enabled: true
    replicas: 1
    listen: ":9105"

    internalTLS:
      enabled: false
      secretName: ""

    ## Pre-existing Secret with key "token" holding the bearer
    ## token. When empty, the chart generates a random token and
    ## stores it in <release>-backend-api-token. CLI reads from
    ## YARILO_BACKEND_API_TOKEN env or --backend-token flag.
    token_secret: ""

    ## CIDR allow-list for callers. Empty = allow any IP (token
    ## auth still applies). Set to your operator subnet for
    ## defence-in-depth.
    allowed_nets: []

    ## yarilo-auth master-protocol address. When set, backend-api
    ## dials at startup via pkg/authclient and:
    ##   - enriches /api/backend/user/info with a `userdb` block
    ##     (uid, gid, groups, quota_rule, allow_nets, ...) plus a
    ##     `userdb_status` field ("ok" / "not_found" / "error")
    ##   - serves /api/backend/user/iterate
    ## Empty disables both surfaces — handy for dev / smoke runs.
    ## In a standard Helm release this is the in-cluster service:
    ##   "<release>-auth:9102"
    auth_master_addr: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 256Mi

  ## yarilo-locks — cross-process write coordinator.
  ## Every session pod dials this Service to take X locks on
  ## mbox:<user>:<folder> before mutating maildir / index files.
  ## State lives in Redis (see top-level redis: section).
  ## Default 2 replicas for HA — set replicas: 1 for single-node dev.
  locks:
    enabled: true
    replicas: 2

    ## service — config-mirror subtree: keys here are snake_case and map 1:1 to
    ## the locks_service.* section of yarilo.yaml, unlike the k8s-shape keys
    ## (replicas / startupProbe / resources) at this level. See the boundary note
    ## at the top of components:.
    service:
      listen: ":9104"
      ## Redis key/channel prefixes (#938). The prefix is the installation
      ## boundary: when several installations share one Redis, give each a
      ## DISTINCT prefix so their lock keys and event channels do not collide.
      ## Keep it consistent across an installation's Redis-using components
      ## (locks, authtoken, and warden #908) so one namespace value covers the
      ## whole install. Defaults are service-name based; leave as-is for a
      ## dedicated Redis.
      key_prefix: "yarilo:locks:"
      channel_prefix: "yarilo:events:"

    ## client — the side every other component uses to reach yarilo-locks.
    client:
      ## Seconds a component waits for the lock service on its first connection
      ## before giving up. Pod start order is not guaranteed and locks is its
      ## own deployment, so "not up yet" is ordinary and exiting on it costs a
      ## restart -- which also spends the RESTARTS counter a rollout is judged
      ## by (#1350). Bounded on purpose: a wrong endpoint must still fail
      ## loudly. Negative disables waiting.
      startup_wait: 30

    ## startupProbe waits for Redis (remote mode) to accept a TCP connection before
    ## this pod takes traffic, replacing the wait-redis init container (#903). Safe
    ## because the process comes up regardless of Redis — redis.NewClient is lazy
    ## (connects on first use) — so the probe only withholds traffic until Redis
    ## answers. periodSeconds x failureThreshold is the startup budget (2s x 90 = 3m).
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 128Mi

  ## IMAP backend — handles sessions proxied from director.
  ## Director proxies 993→imap:993, 143→imap:143.
  imap:
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    enabled: true
    replicas: 1

    listeners:
      imaps:
        enabled: true
        servicePort: 993
        containerPort: 10993
      imap:
        enabled: false
        servicePort: 143
        containerPort: 10143

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 1000m
        memory: 512Mi

  ## POP3 backend — director proxies 995→pop3:995, 110→pop3:110.
  pop3:
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    enabled: false
    replicas: 1

    listeners:
      pop3s:
        enabled: true
        servicePort: 995
        containerPort: 10995
      pop3:
        enabled: false
        servicePort: 110
        containerPort: 10110

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 500m
        memory: 256Mi

  ## LMTP backend — director proxies 24→lmtp:24.
  lmtp:
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    enabled: false
    replicas: 1

    listeners:
      lmtp:
        enabled: true
        servicePort: 24
        containerPort: 10024

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 500m
        memory: 256Mi

  ## Postfix SASL proxy — delegates smtpd_sasl_type=dovecot authentication to yarilo-auth.
  ## Postfix config: smtpd_sasl_path = inet:<host>:12325
  ## Postfix has no direct access to yarilo-auth; yarilo-sasl-login proxies each session.
  saslLogin:
    enabled: false

    ## startupProbe waits for yarilo-auth to report ready before this pod takes
    ## traffic, replacing its wait-* init containers (#903). Safe because a login
    ## pod does not dial its dependencies during startup — the connections are
    ## created lazily on the first login.
    ##
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3 min).
    ## Prefer generous: exceeding it restarts a pod that is healthy and merely
    ## waiting, which the init container never did.
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    replicas: 1
    servicePort: 12325
    containerPort: 12325

    ## mTLS for the dial to yarilo-auth (#816). Required when the shared
    ## internal_tls is enabled — without the mount this pod CrashLoops on the
    ## missing cert. secretName is the shared internal-tls secret.
    internalTLS:
      enabled: false
      secretName: ""

    ## auth_addr overrides the yarilo-auth dial address.
    ## Defaults to auth_service.addr from the shared config.
    auth_addr: ""

    ## trusted_nets lists CIDRs allowed to connect. Empty = allow all.
    trusted_nets: []
    #  - "10.0.0.0/8"

    ## haproxy enables PROXY protocol v1/v2 on the listener.
    haproxy: false
    haproxy_timeout: 3
    ## haproxy_nets lists CIDRs whose PROXY header is trusted.
    haproxy_nets: []
    #  - "10.0.0.0/8"

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 100m
        memory: 64Mi

  ## Postfix policy service — quota enforcement before message queuing.
  ## Postfix config: check_policy_service inet:[<ClusterIP>]:12340
  ## Full-text search service — sole owner of the FTS indexes (indexing
  ## queue + worker + LOOKUP endpoint). Runs yarilo-fts, the only cgo
  ## binary (libxapian), from the same single image as every other pod.
  fts:
    enabled: false
    replicas: 1
    port: 9106
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        ## measured: one core is saturated at ~100% utilisation under
        ## sandbox delivery load, which is why fts_index_workers stays 1
        cpu: "1"
        memory: 1Gi

  quotaStatus:
    enabled: false
    replicas: 1
    servicePort: 12340
    containerPort: 12340

    ## startupProbe waits for Redis (the dict backend) to accept a TCP connection
    ## before this pod takes traffic, replacing the wait-redis init container (#903).
    ## The code is unchanged — it still fails fast on a missing dependency at process
    ## start — so the probe only withholds traffic/liveness until Redis answers.
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3m).
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90

    ## mTLS for the dial to yarilo-auth (#816). Required when the shared
    ## internal_tls is enabled — without the mount this pod CrashLoops on the
    ## missing cert. secretName is the shared internal-tls secret.
    internalTLS:
      enabled: false
      secretName: ""

    ## default_quota_rules mirror yarilo.yaml quota_rule format.
    ## Applied to every recipient; per-user rules require userdb lookup (future phase).
    default_quota_rules: []
    #  - "*:storage=5G"
    #  - "*:messages=100000"
    #  - "Trash:storage=+1G"
    #  - "Spam:ignore"

    ## alias_dict is the name of a dict in the dicts: map that resolves
    ## virtual aliases (source → destination). Empty = disabled.
    alias_dict: ""
    alias_max_hops: 5

    ## recipient_delimiter separates the address detail used to derive the
    ## target folder (alice+Spam@ → Spam). Default "+".
    recipient_delimiter: "+"

    ## quota_status_nouser is the policy action returned when the recipient is
    ## unknown in userdb. Default "REJECT Unknown user"; set "" to fall back to
    ## DUNNO (accept, let a later Postfix check decide).
    quota_status_nouser: "REJECT Unknown user"

    ## auth_master_addr is the yarilo-auth master-protocol listener address
    ## used for per-user quota_rule lookups via userdb. When set, per-user
    ## rules override default_quota_rules; default_quota_rules remain as fallback.
    ## Example: "yarilo-auth:9101"
    auth_master_addr: ""

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 100m
        memory: 64Mi

  ## Submission backend — accepts mail from submission-login pods, relays to upstream MTA.
  ## ClusterIP only; mail clients connect to yarilo-submission-login (LoadBalancer).
  submission:
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    enabled: false
    replicas: 1

    listeners:
      submission:
        enabled: true
        servicePort: 587
        containerPort: 10587
      submissions:
        enabled: false
        servicePort: 465
        containerPort: 10465

    internalTLS:
      enabled: false
      secretName: ""

    tls:
      secretName: ""

    service:
      type: ClusterIP

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

  ## IMAP login pod — TLS terminator + director LOOKUP + proxy to yarilo-imap backend.
  ## Faces mail clients on 993/143; does NOT store mail.
  imapLogin:
    enabled: false
    replicas: 1

    ## startupProbe waits for yarilo-auth and yarilo-warden to report ready before
    ## this pod takes traffic, replacing the wait-auth / wait-warden init containers
    ## (#903). Safe here because a login pod does not dial either dependency during
    ## startup — those connections are created lazily on the first login
    ## (#885/#891) — so the process comes up regardless and the probe only
    ## withholds traffic.
    ##
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3 min).
    ## Prefer generous: exceeding it restarts a pod that is healthy and merely
    ## waiting, which the init container never did.
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90

    listeners:
      imaps:
        enabled: true
        servicePort: 993
        containerPort: 10993
      imap:
        enabled: false
        servicePort: 143
        containerPort: 10143

    ## TLS cert presented to mail clients (IMAPS / STARTTLS for IMAP).
    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    ## mTLS for connections to director and backend pods.
    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or director_addr).
    ## Set to "<release>-imap:<port>" (plain) or "<release>-imap:<tls-port>" (mTLS).
    backend_addr: ""
    ## Director mode: per-session LOOKUP via yarilo-director (set either this
    ## or backend_addr). One of the two is required (#735) — an empty
    ## director_addr with an empty backend_addr previously dialed localhost
    ## silently, since it fell back to this process's own in-process
    ## director bind address rather than failing at startup.
    ## Precedence when BOTH are set: backend_addr wins (explicit standalone
    ## override always takes priority over director mode) — matches
    ## internal/login's existing behavior, unchanged by #735.
    director_addr: ""
    ## backend_port overrides the port in the director LOOKUP result
    ## (the backend's protocol-specific containerPort may differ from what
    ## the director's ring tracks). 0 = use the LOOKUP result port as-is.
    backend_port: 0
    ## director_tag restricts LOOKUP to backends with this tag (#737).
    ## "" = the untagged pool, not "any tag" — there is no full-ring mode.
    ##
    ## This is the STATIC sharding model: a dedicated login fleet per tag
    ## pool, each with director_tag set to the pool it serves — use this
    ## when each tag pool has its own login Service/IP. For the SHARED
    ## model — one login fleet serving users of every tag, tag resolved
    ## per-user from the passdb response — see #746 (per-user value wins,
    ## this static value stays as the fallback for users with no passdb tag).
    director_tag: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

  ## POP3 login pod — TLS terminator + director LOOKUP + proxy to yarilo-pop3 backend.
  pop3Login:
    enabled: false

    ## startupProbe waits for yarilo-auth and yarilo-warden to report ready before this pod takes
    ## traffic, replacing its wait-* init containers (#903). Safe because a login
    ## pod does not dial its dependencies during startup — the connections are
    ## created lazily on the first login.
    ##
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3 min).
    ## Prefer generous: exceeding it restarts a pod that is healthy and merely
    ## waiting, which the init container never did.
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    replicas: 1

    listeners:
      pop3s:
        enabled: true
        servicePort: 995
        containerPort: 10995
      pop3:
        enabled: false
        servicePort: 110
        containerPort: 10110

    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or director_addr).
    ## Set to "<release>-pop3:<port>" (plain) or "<release>-pop3:<tls-port>" (mTLS).
    backend_addr: ""
    ## Director mode: per-session LOOKUP via yarilo-director (set either this
    ## or backend_addr). One of the two is required (#735). Precedence when
    ## BOTH are set: backend_addr wins — see imapLogin's comment for why.
    director_addr: ""
    ## backend_port overrides the port in the director LOOKUP result, which
    ## reports the pod, not the JMAP container. Set it to
    ## components.jmap.listeners.jmap.containerPort.
    ## 0 = use the LOOKUP result port as-is.
    backend_port: 10443
    ## director_tag — see imapLogin's comment for the tag/pool-topology rule.
    director_tag: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

  ## Submission login pod — TLS terminator + director LOOKUP + proxy to yarilo-submission backend.
  submissionLogin:
    enabled: false

    ## startupProbe waits for yarilo-auth and yarilo-warden to report ready before
    ## this pod takes traffic, replacing its wait-* init containers (#903).
    ##
    ## auth is included even though the init containers only had wait-warden: this
    ## pod authenticates logins and configures AuthAddr like every other login
    ## proxy, so the missing wait-auth was an oversight rather than a design. Safe because a login
    ## pod does not dial its dependencies during startup — the connections are
    ## created lazily on the first login.
    ##
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3 min).
    ## Prefer generous: exceeding it restarts a pod that is healthy and merely
    ## waiting, which the init container never did.
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    replicas: 1

    listeners:
      submission:
        enabled: true
        servicePort: 587
        containerPort: 10587
      submissions:
        enabled: false
        servicePort: 465
        containerPort: 10465

    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or director_addr).
    ## Set to "<release>-submission:<port>" (plain) or "<release>-submission:<tls-port>" (mTLS).
    backend_addr: ""
    ## Director mode: per-session LOOKUP via yarilo-director (set either this
    ## or backend_addr). One of the two is required (#735). Precedence when
    ## BOTH are set: backend_addr wins — see imapLogin's comment for why.
    director_addr: ""
    ## backend_port overrides the port in the director LOOKUP result.
    ## 0 = use the LOOKUP result port as-is.
    backend_port: 0
    ## director_tag — see imapLogin's comment for the tag/pool-topology rule.
    director_tag: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

  ## LMTP login pod — MTA-facing LMTP proxy with per-recipient warden CONNECT
  ## and yarilo-auth SESSION token issuance. Fans out one backend connection
  ## per recipient, each with a YARILO preamble.
  lmtpLogin:
    enabled: false

    ## startupProbe waits for yarilo-auth and yarilo-warden to report ready before this pod takes
    ## traffic, replacing its wait-* init containers (#903). Safe because a login
    ## pod does not dial its dependencies during startup — the connections are
    ## created lazily on the first login.
    ##
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3 min).
    ## Prefer generous: exceeding it restarts a pod that is healthy and merely
    ## waiting, which the init container never did.
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    replicas: 1

    listeners:
      lmtp:
        enabled: true
        servicePort: 24
        containerPort: 10024

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or director_addr).
    ## Typically "<release>-lmtp:<containerPort>" within the cluster.
    backend_addr: ""

    ## Director mode: per-recipient LOOKUP via yarilo-director (set either this
    ## or backend_addr). One of the two is required (#735). Precedence when
    ## BOTH are set: backend_addr wins — see imapLogin's comment for why.
    ## (#741 — lmtp-login previously inverted this; a deploy that had both set
    ## must remove backend_addr to keep director routing, or it silently
    ## switches to the static backend.)
    director_addr: ""
    ## director_tag restricts LOOKUP to backends with this tag (#737).
    ## "" = the untagged pool, not "any tag" — there is no full-ring mode.
    ##
    ## This is the STATIC sharding model: a dedicated login fleet per tag
    ## pool, each with director_tag set to the pool it serves — use this
    ## when each tag pool has its own login Service/IP. For the SHARED
    ## model — one login fleet serving users of every tag, tag resolved
    ## per-user from the passdb response — see #746 (per-user value wins,
    ## this static value stays as the fallback for users with no passdb tag).
    director_tag: ""
    ## backend_port overrides the port in the director LOOKUP result. 0 = use result as-is.
    backend_port: 0

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

  ## ManageSieve backend — RFC 5804 Sieve script management (internal, port 14190).
  manageSieve:
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    enabled: false
    replicas: 1

    listeners:
      managesieve:
        enabled: true
        servicePort: 14190
        containerPort: 14190

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 500m
        memory: 256Mi

  ## ManageSieve login pod — RFC 5804 client-facing proxy (port 4190, STARTTLS).
  manageSieveLogin:
    enabled: false

    ## startupProbe waits for yarilo-auth and yarilo-warden to report ready before this pod takes
    ## traffic, replacing its wait-* init containers (#903). Safe because a login
    ## pod does not dial its dependencies during startup — the connections are
    ## created lazily on the first login.
    ##
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3 min).
    ## Prefer generous: exceeding it restarts a pod that is healthy and merely
    ## waiting, which the init container never did.
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    replicas: 1

    listeners:
      managesieve:
        enabled: true
        servicePort: 4190
        containerPort: 14190
        disablePlainAuth: false

    tls:
      secretName: ""

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or director_addr).
    ## Typically "<release>-managesieve:<containerPort>" within the cluster.
    backend_addr: ""
    ## Director mode: per-session LOOKUP via yarilo-director (set either this
    ## or backend_addr). One of the two is required (#735) — previously
    ## managesieve-login had NO director_addr wiring at all, so director
    ## mode was silently unavailable (not just misdirected to localhost like
    ## the other three logins). Precedence when BOTH are set: backend_addr
    ## wins — see imapLogin's comment for why.
    director_addr: ""
    ## backend_port overrides the port in the director LOOKUP result.
    ## 0 = use the LOOKUP result port as-is.
    backend_port: 0
    ## director_tag — see imapLogin's comment for the tag/pool-topology rule.
    director_tag: ""

    haproxy_protocol: false
    haproxy_timeout: 3
    haproxy_nets: []

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

  ## JMAP backend — the container inside the co-located backend pod that owns
  ## the user's state and answers the JMAP methods. It never terminates the
  ## client's TLS and never runs the passdb chain: yarilo-jmap-login did both
  ## and asserts the user per request, which is why the trust anchor below is
  ## not optional.
  jmap:
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90
    enabled: false
    replicas: 1

    ## yarilo-auth MASTER-protocol listener, used for per-user userdb lookups
    ## (home, mail location, INDEX= overrides). This is NOT auth_service.addr:
    ## the client listener answers a different handshake, so pointing this at it
    ## fails every lookup. Empty derives it from components.auth.masterListen.
    auth_master_addr: ""

    listeners:
      ## Internal listener the login proxy dials (services.jmap_be). Deliberately
      ## clear of 8080, which is the telemetry port on every component pod.
      jmap:
        enabled: true
        containerPort: 10443
        ## Trust the login hop by peer address, using general.xclient.trusted_nets.
        ## Only consulted when internalTLS is off: with mTLS the peer certificate
        ## is the anchor. With neither, every request is refused with 403 — the
        ## listener still binds, so the cause is visible rather than looking like
        ## a network fault.
        xclient: false

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        ## measured once and found short: 1.31 cores wanted under 8 clients
        ## and 50 users, 81% of scheduling periods throttled (#1026)
        cpu: 500m
        memory: 256Mi

  ## JMAP login pod — TLS terminator + director LOOKUP + per-request HTTP proxy
  ## to the yarilo-jmap backend container. Internet-facing, like the other
  ## *Login pods; not part of the co-located backend StatefulSet.
  jmapLogin:
    enabled: false
    replicas: 1

    ## startupProbe waits for yarilo-auth and yarilo-warden to report ready before this pod takes
    ## traffic, replacing its wait-* init containers (#903). Safe because a login
    ## pod does not dial its dependencies during startup — the connections are
    ## created lazily on the first request.
    ##
    ## periodSeconds x failureThreshold is the startup budget (2s x 90 = 3 min).
    ## Prefer generous: exceeding it restarts a pod that is healthy and merely
    ## waiting, which the init container never did.
    startupProbe:
      enabled: true
      timeout: 2s
      periodSeconds: 2
      failureThreshold: 90

    listeners:
      ## Client-facing HTTPS. containerPort is services.jmap.port.
      jmap:
        enabled: true
        servicePort: 443
        containerPort: 8443
        ## Per-user/IP accounting held in warden. 0 = unlimited.
        connectionLimit: 0
        ## Refuse Basic credentials on a non-TLS listener.
        disablePlainAuth: true

    ## TLS cert presented to JMAP clients. Required while the listener's
    ## ssl_mode is ssl: the proxy refuses to start without one rather than
    ## serving :8443 in the clear, which would carry Basic credentials in
    ## plaintext while looking healthy. Set ssl_mode to "no" only when TLS is
    ## terminated by an ingress in front of this pod.
    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    ## mTLS for connections to director and backend pods.
    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or director_addr).
    ## Set to "<release>-jmap:<port>".
    backend_addr: ""
    ## Director mode: per-request LOOKUP via yarilo-director (set either this
    ## or backend_addr). One of the two is required (#735). Precedence when
    ## BOTH are set: backend_addr wins — see imapLogin's comment for why.
    director_addr: ""
    ## backend_port overrides the port in the director LOOKUP result.
    ## 0 = use the LOOKUP result port as-is.
    backend_port: 0
    ## director_tag — see imapLogin's comment for the tag/pool-topology rule.
    director_tag: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        ## unmeasured — a starting point, not a recommendation (#1040)
        cpu: 200m
        memory: 128Mi

## -------------------------------------------------------------------
## Protocol tuning
## -------------------------------------------------------------------
protocol:
  imap:
    imap_idle_notify_interval: 120
    imap_max_line_length: 65536
    imap_id_send: "name *"
    login_greeting: ""
    imap_logout_format: ""
    client_workarounds: []
    ## IMAP QUOTA extension (RFC 9208): advertise the QUOTA capability and
    ## answer GETQUOTA / GETQUOTAROOT. Client-facing query only — enforcement
    ## is the separate quota engine (quota.enabled). Default on.
    imap_quota: true
    ## RFC 6154 SPECIAL-USE — map a folder name to a special-use attribute
    ## advertised in LIST replies. Operators can override per deployment;
    ## per-user CREATE (USE ...) takes precedence at runtime via the
    ## on-disk special_use file, per the
    ## namespace.mailbox.special_use convention.
    imap_special_use_defaults:
      Sent: "\\Sent"
      Drafts: "\\Drafts"
      Trash: "\\Trash"
      Junk: "\\Junk"
      Archive: "\\Archive"
  pop3:
    pop3_no_flag_updates: false
    pop3_reuse_xuidl: false
    pop3_uidl_format: "%u.%v"
    pop3_uidl_duplicates: rename
    pop3_enable_last: false
    pop3_delete_type: expunge
    pop3_deleted_flag: ""
    pop3_save_uidl: false     # persist computed UIDLs to index for stability across index rebuilds
    pop3_lock_session: false  # dotlock file in user home to prevent simultaneous IMAP+POP3 access

  lmtp:
    login_greeting: "Yarilo ready."
    add_received_header: true
    save_to_detail_mailbox: false
    hdr_delivery_address: final
    verbose_replies: false
    user_concurrency_limit: 10
    read_timeout: 300
    write_timeout: 300
    client_workarounds: []
    ## rate_limit — deliveries allowed per (sender IP, recipient mailbox) pair
    ## inside one window; beyond it a sender gets 421 4.7.0 and retries later.
    ## Counters live in yarilo-locks, so the limit is cluster-wide rather than
    ## per pod.
    ##
    ## The defaults suit ordinary mail. They do NOT suit bulk delivery to one
    ## account -- a migration, a load test, a mailing-list expansion landing in
    ## one mailbox -- which is what raising the burst or widening the window is
    ## for. Turning it off entirely leaves nothing between a misbehaving sender
    ## and a mailbox.
    rate_limit:
      enabled: true
      per_recipient_burst: 100
      per_recipient_window_seconds: 60

  submission:
    hostname: ""
    ## max_message_size — human-readable (bytes or K/M/G/T, e.g. "40M"). Quote it.
    max_message_size: "40M"
    max_line_length: 4096
    max_recipients: 0
    recipient_delimiter: "+"
    add_received_header: true
    client_workarounds: []
    relay:
      host: ""
      port: 25
      user: ""
      password: ""
      ssl: "no"
      ssl_verify: true
      trusted: false
      connect_timeout: 30
      command_timeout: 300

  managesieve:
    ## The script-size limit lives in the sieve section as sieve_max_script_size:
    ## one limit, one key. A values file still carrying max_script_size here
    ## keeps working — the server folds it onto the sieve key and says so once.
    max_invalid_commands: 3

  jmap:
    ## Public origin clients reach this deployment on. It prefixes every URL in
    ## the session resource, so it must be the externally visible name, not a
    ## pod address. Empty renders relative-looking URLs no client can follow.
    jmap_base_url: ""
    ## Limits advertised in the session resource AND enforced. A client batches
    ## against what is published, so the two must not diverge.
    jmap_max_concurrent_requests: 10
    jmap_max_calls_in_request: 16
    jmap_max_objects_in_get: 500
    jmap_max_objects_in_set: 500
    jmap_max_size_upload: 40M
    jmap_max_size_request: 10M
    ## Server ceiling on one returned Email body value. A client's own
    ## maxBodyValueBytes (RFC 8621 §4.2.2) wins when smaller; a client naming
    ## none gets this rather than the whole body. Truncated values are marked
    ## isTruncated: true, so the cap is visible to the client rather than silent.
    ## Worst-case work per Email/get is jmap_max_objects_in_get x this value.
    jmap_max_body_value_bytes: 256K
    ## Server ceiling on how many ids one Email/query or Mailbox/query returns.
    ## A smaller client limit wins; a client naming none gets this rather than
    ## the whole result set, and the response reports the limit that was
    ## applied, so the client knows to page with position.
    jmap_query_max_limit: 256
    ## How many mailboxes one Email/query may search with full text. A query
    ## over more is refused, never answered from part of them. This is a bound
    ## on one request; fts_max_conns bounds what one process takes from the
    ## service, and the two move for different reasons.
    jmap_max_query_folders: 64
    ## Visible characters in the preview a SearchSnippet returns; the markup and
    ## HTML escapes around them are not counted. The subject is never cut.
    jmap_snippet_max_chars: 256
    ## Idle timeout for a push connection, seconds. Unused until the push phase.
    jmap_push_timeout: 90
    ## Browser origins allowed to call the JMAP endpoint. Empty denies every
    ## cross-origin request, which is the default: an endpoint any page can
    ## call with the user's credentials is an account-takeover surface. Exact
    ## match, scheme included. "*" is accepted but cannot carry credentials.
    jmap_cors_allow_origins: []

## -------------------------------------------------------------------
## Sieve mail filtering
## -------------------------------------------------------------------
## Every key in this section carries the sieve_ prefix (matching the config
## koanf tags), even under `sieve:`.
sieve:
  sieve_enabled: false
  ## sieve_scripts_driver selects the script storage backend: "fs" (default, files
  ## in user home) or "redis" (dict backend, requires sieve_scripts_dict to
  ## reference an entry in dicts:). Use "redis" for multi-pod without shared NFS.
  sieve_scripts_driver: "fs"
  ## sieve_scripts_dict is the key in dicts: pointing to the dict instance used
  ## when sieve_scripts_driver is "redis". Ignored for "fs".
  sieve_scripts_dict: ""
  ## sieve_default_name is the reserved script name used as the active-pointer
  ## entry point. Default: "yarilo".
  sieve_default_name: "yarilo"
  sieve_max_script_size: 65536
  sieve_max_redirects: 32
  ## sieve_max_actions caps the total actions a single script may apply (fileinto,
  ## redirect, keep, ...). Guards runaway scripts. 0 = unlimited.
  sieve_max_actions: 32
  ## Max tracking period for the duplicate test, seconds (RFC 7352 §7 — a
  ## larger :seconds is silently clamped). 0 = no limit. Default 7 days.
  sieve_duplicate_max_period: 604800
  ## duplicate test (RFC 7352) backend:
  ##   file   — per-user file in the home dir (default; cross-pod on shared storage)
  ##   memory — per-process, single-pod only
  ##   redis  — the `sieve_duplicate` dict in dicts: (cross-pod)
  sieve_duplicate_driver: "file"
  ## Home-dir file name for sieve_duplicate_driver=file.
  sieve_duplicate_file: ".yarilo.sieve-duplicate"
  sieve_vacation_enabled: true
  ## spamtest / virustest (RFC 5235) status-header sources. Leave the header
  ## empty to keep the test unbacked (reports "not scanned"). The raw header
  ## value is normalised against the max_value onto the 0..10 (spam) / 0..5
  ## (virus) scale.
  sieve_spamtest_status_header: ""
  sieve_spamtest_max_value: 10
  sieve_virustest_status_header: ""
  sieve_virustest_max_value: 5
  ## User-Agent field written into ARF feedback reports (vnd.yarilo.report).
  sieve_report_user_agent: "yarilo"
  ## Outbound MTA for redirect / vacation actions.
  sieve_submission_host: ""
  sieve_submission_ssl: "no"
  sieve_submission_timeout: 30
  sieve_submission_auth_secret: ""
  ## sieve_global_before / sieve_global_after: ordered lists of absolute paths to
  ## .sieve files executed before / after each user's active script. Admin-defined.
  ## Files must be present on the pod filesystem (e.g. via ConfigMap volume mount).
  sieve_global_before: []
  sieve_global_after: []
  ## imapsieve (RFC 6785): run Sieve scripts on IMAP events (APPEND / COPY / FLAG).
  ## Per-mailbox binding is via the IMAP METADATA annotation /shared/imapsieve/script
  ## (SETMETADATA), not static config; the value names a script in imapsieve_script_dir.
  imapsieve_enabled: false
  ## Directory the mailbox-bound scripts live in. When imapsieve_scripts below is
  ## non-empty, a ConfigMap is rendered and mounted read-only at this path in the
  ## IMAP pods; otherwise provide the scripts on the pod filesystem yourself.
  imapsieve_script_dir: "/etc/yarilo/imapsieve"
  ## Admin scripts, keyed by name (a mailbox's /shared/imapsieve/script annotation
  ## binds one by "<name>"; the file is <name>.sieve). Example:
  ##   imapsieve_scripts:
  ##     report-spam: |
  ##       require ["imapsieve", "environment", "vnd.yarilo.pipe"];
  ##       if environment :is "imap.cause" "COPY" { pipe "sa-learn-spam"; }
  imapsieve_scripts: {}
  imapsieve_global_before: []
  imapsieve_global_after: []
  ## sieve_extensions is the whitelist of Sieve extensions users may declare with
  ## require. Corresponds to the sieve_extensions. Empty list = allow all
  ## (backwards-compatible). Operators who need enotify/include/extlists must add
  ## them explicitly.
  sieve_extensions:
    - fileinto
    - reject
    - ereject
    - envelope
    - encoded-character
    - variables
    - relational
    - subaddress
    - body
    - date
    - index
    - mailbox
    - duplicate
    - imap4flags
    - redirect
    - copy
    - vacation
    - environment
    - vnd.yarilo.debug
    - vnd.yarilo.environment
    - vnd.yarilo.pipe
    - vnd.yarilo.filter

  ## sieveEnvironment exposes operator-defined key-value pairs to Sieve scripts
  ## via the vnd.yarilo.environment extension as vnd.yarilo.config.<key> items.
  ## Corresponds to the sieve_environment setting.
  ## Example:
  ##   sieveEnvironment:
  ##     spam-folder: Junk
  ##     org-name: Acme Corp
  sieve_environment: {}

  ## vnd.yarilo.pipe — external program execution via Sieve scripts.
  ## Corresponds to the sieve_pipe_bin_dir / sieve_pipe_socket_dir /
  ## sieve_pipe_exec_timeout / sieve_pipe_input_eol settings.
  sieve_pipe_bin_dir: "/usr/lib/yarilo/sieve-pipe"
  sieve_pipe_socket_dir: "sieve-pipe"
  sieve_pipe_exec_timeout: 10
  sieve_pipe_input_eol: "crlf"

  ## vnd.yarilo.filter — message filtering via external programs.
  ## Programs receive the message on stdin; non-empty stdout replaces the message.
  ## Empty stdout or non-zero exit = pass-through (message unchanged).
  ## Corresponds to the sieve_filter_bin_dir / sieve_filter_socket_dir /
  ## sieve_filter_exec_timeout / sieve_filter_input_eol settings.
  sieve_filter_bin_dir: "/usr/lib/yarilo/sieve-filter"
  sieve_filter_socket_dir: "sieve-filter"
  sieve_filter_exec_timeout: 10
  sieve_filter_input_eol: "crlf"

  ## vnd.yarilo.execute — run programs and capture output into Sieve variables.
  ## Corresponds to the sieve_execute_bin_dir / sieve_execute_socket_dir /
  ## sieve_execute_exec_timeout / sieve_execute_input_eol settings.
  sieve_execute_bin_dir: "/usr/lib/yarilo/sieve-execute"
  sieve_execute_socket_dir: "sieve-execute"
  sieve_execute_exec_timeout: 10
  sieve_execute_input_eol: "crlf"

## -------------------------------------------------------------------
## General infrastructure
## -------------------------------------------------------------------
general:
  ## startupDialRetries — number of dial attempts (with exponential backoff)
  ## when connecting to external dependencies at startup (warden, Redis).
  ## Prevents permanent loss of functionality on rolling restarts when a
  ## dependency pod is not yet ready. Default 3.
  startup_dial_retries: 3

  limits:
    ## Maximum simultaneous IMAP/POP3 connections from a single IP address.
    max_user_ip_connections: 10

  ## HAProxy PROXY protocol v1/v2 support.
  ## Enable when an upstream load balancer (HAProxy, nginx, AWS NLB with proxy_protocol)
  ## sits in front of the director and forwards the real client IP in the PROXY header.
  ## The director reads the header before TLS handshake; conn.RemoteAddr() always reflects
  ## the real client IP after this point.
  ##
  ## haproxy_protocol must also be enabled per-listener (services.imaps.haproxy_protocol etc.)
  ## in the generated config — the global enabled flag controls all listeners at once.
  ##
  ## trustedNets: CIDRs of load balancers allowed to send PROXY headers.
  ##              Connections from untrusted IPs have the header silently ignored.
  ## timeout:     Seconds to wait for the PROXY header before rejecting the connection.
  haproxy:
    enabled: false
    trusted_nets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"
    timeout: 3

  ## Native inbound client-IP forwarding on the LOGIN pods (#742).
  ## This is the login_trusted_networks analogue — the third way (besides the
  ## HAProxy PROXY protocol above, and none) for an upstream proxy to hand the
  ## real client IP to yarilo. Per protocol the operator chooses ONE of:
  ##   - haproxy: general.haproxy + <listener>.haproxy_protocol   (PROXY header)
  ##   - native:  general.xclient  + <listener>.xclient_protocol  (this block)
  ##   - none:    neither                                          (socket IP only)
  ##
  ## The forwarded IP is honoured only when the connection's peer is inside
  ## trusted_nets below AND the listener has xclient_protocol: true. The
  ## mechanisms per protocol:
  ##   - IMAP:       ID command fields (x-originating-ip / x-originating-port)
  ##   - POP3:       XCLIENT ADDR= PORT=
  ##   - Submission: XCLIENT ADDR= (advertised in EHLO; Postfix-compatible reset)
  ##   - LMTP:       XCLIENT ADDR= (critical for a Postfix relay in front, which
  ##                 can only convey the original SMTP client IP via XCLIENT)
  ##
  ## lmtp-login also gains HAProxy PROXY support here (services.lmtp
  ## .haproxy_protocol) — pick haproxy or xclient per the same rule.
  ##
  ## Precedence when BOTH haproxy and xclient are active on a listener: the
  ## PROXY header rewrites the peer first, the trusted-net check runs against
  ## that rewritten peer (the real adjacent hop), and the XCLIENT/ID forward is
  ## the final client IP. `enabled` toggles xclient_protocol on every listener.
  xclient:
    enabled: false
    trusted_nets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"

## -------------------------------------------------------------------
## Redis — state backend for yarilo-locks (and future yarilo-warden).
## -------------------------------------------------------------------
## Bundled (default): a StatefulSet runs in the release, single-replica
## for single-node clusters. For prod HA either bump replicas + run
## Sentinel/Cluster externally and point at it via externalUrl.
##
## bundled: false disables the StatefulSet + Service templates;
## externalUrl is then required.
redis:
  bundled: true
  replicas: 1
  ## image — pulled from the public Redis library on Docker Hub by default.
  image:
    repository: redis
    tag: "8.10"
    pullPolicy: IfNotPresent
  ## persistent volume claim for AOF + dump; required for restart safety.
  persistence:
    size: 1Gi
  storageClass: ""

  ## External Redis (used when bundled: false). Standard go-redis URL.
  ## Examples:
  ##   redis://my-redis.prod.svc:6379/0
  ##   rediss://master.cache.amazonaws.com:6379/0
  externalUrl: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

## -------------------------------------------------------------------
## Database — external SQL passdb/userdb backend.
##
## yarilo does NOT bundle a database. Deploy MySQL or PostgreSQL
## separately (see hack/db/) and point yarilo at it via one of:
##
##   Option A — reference an existing Kubernetes Secret:
##     database:
##       secretName: yarilo-db-creds   # Secret in the same namespace
##       secretKey: dsn                # key holding the DSN string
##       initAddr: "yarilo-mysql.db.svc:3306"
##
##   Option B — literal DSN (dev/test only; avoid in production):
##     database:
##       dsn: "user:pass@tcp(host:3306)/dbname?parseTime=true&charset=utf8mb4"
##       initAddr: "host:3306"
##
##   Option C — no SQL passdb (SQLite or file-based):
##     Leave all fields empty and configure components.auth.passdb[] directly.
##
## The DSN is injected as YARILO_DB_DSN into every session component.
## Reference it in passdb config (default in values.yaml):
##   components.auth.passdb:
##     - driver: mysql
##       dsn: "${YARILO_DB_DSN}"
## -------------------------------------------------------------------
database:
  ## Kubernetes Secret name containing the DSN (recommended).
  secretName: ""
  ## Key inside the Secret that holds the DSN string.
  secretKey: "dsn"
  ## Literal DSN — used only when secretName is empty.
  dsn: ""
  ## TCP probe address for init-containers. Format: "host:port".
  ## Example: "yarilo-mysql.db.svc:3306"
  initAddr: ""

## -------------------------------------------------------------------
## Telemetry (:8080 per component pod)
## -------------------------------------------------------------------
telemetry:
  listen: ":8080"
  # Go runtime profilers on the telemetry port. Disabled by default: this is a
  # switch thrown for the duration of an investigation, and the component logs a
  # warning at every start while it is on — the failure mode is not enabling it,
  # it is enabling it for an afternoon and leaving it on for a year.
  #
  # enabled serves the profiles that describe execution: CPU, execution trace,
  # allocations, goroutines, block and mutex. These are stacks and counts.
  #
  # heapEnabled is separate because it differs in kind, not degree:
  # /debug/pprof/heap dumps the live objects of a process that has just parsed
  # other people's mail, so the dump can contain message bodies. Finding where
  # CPU and allocations go does not need it — leave it off unless the question
  # is specifically what is retained.
  pprof:
    enabled: false
    heapEnabled: false
    # Sampling rates for the block and mutex profiles. The routes above answer
    # 200 with an EMPTY profile while these are 0 — a diagnostic that looks like
    # an answer. Set them for a measurement window and clear them afterwards:
    # every blocking operation and every contended mutex pays while they are on.
    # blockProfileRate: 10000   # nanoseconds of blocked time per sample
    # mutexProfileFraction: 100 # one in N contention events
    blockProfileRate: 0
    mutexProfileFraction: 0
  # Timer-driven liveness watchdog (#904). Disabled by default: it restarts a
  # pod whose request path is wedged (a deadlock, a hung NFS handle) while the
  # process and this HTTP server keep answering — so it is only meaningful once a
  # component wires a self-check. Keep timeoutSeconds < intervalSeconds.
  livenessWatchdog:
    enabled: false
    intervalSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    # POST /debug/fault/deadlock wedges the self-check so an operator can confirm
    # on a live pod that the watchdog trips and the container restarts. A
    # deliberate self-destruct switch — leave off outside a verification run.
    faultInjectionEnabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

## -------------------------------------------------------------------
## Shared scheduling / security
## -------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: telemetry
  initialDelaySeconds: 10
  periodSeconds: 30
  # Stacks on top of the watchdog's own consecutive-failure threshold so a
  # single slow /healthz cannot restart a busy pod (#904).
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: telemetry
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

logLevel: info

## logLevelOverrides raises (or lowers) verbosity for individual components
## without touching the rest of the installation. Keyed by the component name the
## container reports in YARILO_COMPONENT, so no knowledge of the internal
## components.* key layout is needed:
##
##   logLevelOverrides:
##     yarilo-auth: debug
##     yarilo-imap-login: debug
##
## Recognised names: yarilo-director, yarilo-monitor, yarilo-auth, yarilo-warden,
## yarilo-locks, yarilo-fts, yarilo-backend-api, yarilo-backend-reg,
## yarilo-quota-status, yarilo-imap, yarilo-pop3, yarilo-lmtp,
## yarilo-managesieve, yarilo-submission, and the matching *-login components.
##
## Keeping the installation at info and raising one component on demand is the
## intended pattern: cluster-wide debug produces enough volume to rotate away the
## very window being investigated.
logLevelOverrides: {}

## initContainerImage — image used by dependency-wait init containers.
## Must include busybox-compatible `nc` (netcat). Default: busybox:1.36.
initContainerImage: "busybox:1.36"

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Named dicts (pkg/dict). Yarilo features (metadata, quota counters, ACL state)
# look these up by name. Each entry picks a driver (file|redis|sql|memory|fail)
# and configures it via driver-specific `settings`. See https://doc.yarilomail.org/DICT for the
# full reference per driver. The same template renders into yarilo.yaml.
#
# Standalone single-pod default uses file driver on the local PVC.
# Backend multi-pod helm release should override with redis or sql to share
# state across replicas.
# IMAP namespaces (RFC 2342 / RFC 9051 §6.3.10).
#
# When omitted (default), yarilo runs as personal-only — backwards-
# compatible with pre-v1.20 deployments.
#
# When you declare Shared/Public namespaces, yarilo opens an
# additional storage handle per namespace and routes SELECT/APPEND/
# COPY/MOVE/SUBSCRIBE/etc to the right backend based on the prefix.
# IMPORTANT (pre-ACL-1): with Shared/Public configured, **any
# authenticated user reads and writes everything under them**.
# Treat as cooperative-trust until ACL-1 lands.
#
# Storage roots referenced by `location:` are the operator's
# responsibility — mount the PV (NFS/CephFS RWX in multi-pod
# deployments) at the chosen path; yarilo creates the per-folder
# maildir tree on the first CREATE / APPEND. Do NOT point shared
# locations at per-user storage paths.
#
# See https://doc.yarilomail.org/NAMESPACE for full schema, separator semantics,
# METADATA priv/ per-accessing-user behaviour and the post-NS-1b
# roadmap (ACL-1, NS-3 cross-pod routing, QUOTA-1 owner-paid).
## RFC 4314 server-side ACL — GETACL / SETACL / DELETEACL / MYRIGHTS
## / LISTRIGHTS plus enforcement on SELECT / APPEND / COPY / MOVE
## / STORE / EXPUNGE / CREATE / DELETE / RENAME / STATUS. Storage
## is a per-mailbox `yarilo-acl` file alongside each folder's
## `yarilo.index*`; a namespace-wide `yarilo-acl-list` index
## mirrors which mailboxes have an explicit ACL for LIST
## optimisation. Admin surface lives at
## `yarilo-backend-api /api/backend/acl/*` and `yarctl
## backend acl <command>`. When disabled, every ACL command
## returns NO("ACL extension disabled by operator") and ACL is
## absent from the CAPABILITY response.
## Quota engine — enforcement on every save (IMAP APPEND/COPY/MOVE, LMTP
## delivery, quota-status policy service), summed from the index count backend.
## Limits come from the userdb quota_rule field / quota_status.default_quota_rules.
## Independent of the IMAP QUOTA extension (protocol.imap.imap_quota).
## Full-text search (https://doc.yarilomail.org/FTS). fts_engine is REQUIRED when enabled —
## startup fails fast on a missing or unknown engine name.
fts:
  enabled: false
  fts_engine: ""                   # "flatcurve" (fts image) | "bleve" (own stream)
  fts_mode: remote                 # remote (k8s) | embedded (tests/CLI)
  fts_addr: ""                     # sessions dial, e.g. "yarilo-fts:9106"
  fts_listen: ":9106"
  fts_auth_master_addr: ""         # userdb lookups, e.g. "yarilo-auth:9102"
  ## Connections a session process keeps to yarilo-fts. One connection
  ## serialises request/response pairs, so this is what decides how many
  ## lookups actually run at once: a search fanning out over several folders is
  ## queued, not parallel, until this is above one. Connections open on demand,
  ## so raising it costs nothing until that many calls overlap. Per process,
  ## not per deployment: yarilo-jmap opens its own pool of this size for
  ## Email/query in addition to the session backend's.
  fts_max_conns: 4
  ## Mailboxes yarilo-fts indexes at once. The engine holds one mutex per user,
  ## so this parallelises across users, not across one user's mailboxes — a
  ## second worker on the same user would wait inside the engine while other
  ## users' mail stays unindexed, which is why dispatch hands each worker a
  ## different user. Raise only with fts_fetch_seconds / fts_build_seconds in
  ## hand: if reads dominate, more workers buy little.
  fts_index_workers: 1
  ## Messages an index pass reads ahead of the one it is tokenising, so storage
  ## reads overlap with parsing. Below 2 disables it.
  ##
  ## Off by default, from measurement rather than caution: reading is ~0.3% of
  ## an index pass and tokenising is the rest, so overlapping them buys almost
  ## nothing while the window costs memory once per worker. Raise it where reads
  ## are genuinely slow — cold alt-tier storage, or an NFS mount with a cold
  ## cache — which fts_read_seconds against fts_build_seconds will show.
  fts_prefetch_depth: 1
  fts_prefetch_max_bytes: 32M
  fts_autoindex: false
  fts_autoindex_max_recent_msgs: 0
  ## fts_message_max_size — human-readable (bytes or K/M/G/T, e.g. "50M"). "0" = unlimited. Quote it.
  fts_message_max_size: "0"
  fts_header_includes: []
  fts_header_excludes: []
  fts_commit_limit: 500
  fts_search_add_missing: body-search-only
  fts_search_read_fallback: true
  ## Seconds to wait for a mailbox that has NOTHING indexed yet. A first index
  ## gives no signal to judge the engine by -- a flat checkpoint is what a job
  ## the indexer has not reached looks like, and what a broken engine looks
  ## like -- so the lag heuristic cannot run and this is the bound instead. It
  ## measures queue latency, not indexing speed, which is why it is separate
  ## from fts_search_timeout_secs.
  fts_search_first_index_grace: 10
  ## Seconds an unused per-user index handle stays open. The handle owns a
  ## writable index, which holds the on-disk write lock, so a user who moves to
  ## another backend leaves the old one holding that lock until this expires --
  ## and until then the new owner cannot index them at all.
  ## Lower means a moved user is picked up sooner; higher avoids reopening the
  ## index across gaps in a busy account's traffic. 0 = built-in default (300).
  fts_handle_idle_timeout: 300
  fts_search_timeout_secs: 30
  fts_search_strict: false
  ## Disables FTS SEARCH only, while indexing/autoindex keep running
  ## unaffected (#726 item 3) — an incident-response knob: "the FTS
  ## index/engine is misbehaving, stop querying it, don't let the index go
  ## stale while we investigate." false degrades every SEARCH to the
  ## sequential scan, as if FTS weren't configured at all. Distinct from
  ## fts.enabled (all-or-nothing, including indexing).
  fts_search: true
  ## Supported: en/fr/de/it/pt/ru/es (stemmed) + uk (Ukrainian — no official
  ## Snowball algorithm exists, so it's lowercase + stopwords only, #718).
  languages: [en]
  language_filters: [lowercase, stopwords, snowball]
  ## Per-language override of language_filters (#726 item 4) — e.g. a
  ## mixed uk/ru deployment wants uk without "snowball" (no official
  ## stemmer exists for it, #718) even though the global default has it
  ## for the other languages. A language absent here uses language_filters
  ## unchanged; a present language's list is a full replacement, not a
  ## merge. Every key must also be one of the languages above (typos like
  ## "ukr" are a startup error). Changing this (including adding/removing
  ## an override, even to a list identical to the global default) forces
  ## a reindex for that language, since the override's mere presence is
  ## part of the settings checksum.
  fts_language_filters_override: {}
  # fts_language_filters_override:
  #   uk: [lowercase, stopwords]
  #   de: [lowercase, snowball]
  ## Generic/address tokenizer byte caps (#726 item 1). 0 = package
  ## defaults (30 / 250) — the most common operator tunings for index
  ## size vs. long-token searchability.
  fts_language_tokenizer_generic_token_maxlen: 0
  fts_language_tokenizer_address_token_maxlen: 0
  ## Tokenizer algorithm (#726 item 2): "simple" is the only one
  ## implemented today. "tr29" is a valid reference option but errors
  ## clearly at startup until it lands (blocked on the Bleve stream) —
  ## never silently falls back to "simple". wb5a / explicit_prefix are
  ## TR29-only knobs, also rejected if true for the same reason.
  fts_language_tokenizer_generic_algorithm: simple
  fts_language_tokenizer_generic_wb5a: false
  fts_language_tokenizer_generic_explicit_prefix: false
  ## Per-part language detection (#696): how much of each body/attachment
  ## part's own text is sampled to pick its stemmer, and how much text is
  ## required before trusting the result. 0 = package defaults. Only
  ## matters when 2+ languages are configured above.
  ## human-readable (bytes or K/M/G/T). "0" = buildmail default. Quote it.
  fts_detection_sample_bytes: "0"
  fts_detection_min_runes: 0
  fts_flatcurve_commit_limit: 500
  ## Shortest term worth indexing, in CHARACTERS. It counted bytes until
  ## #1055, which applied a different rule to every script: a one-character
  ## Latin word was dropped while a one-character Cyrillic or CJK one was kept.
  ## The default still means "drop single characters" — it just now means that
  ## everywhere. Changing it changes index contents, so it is a re-index.
  fts_flatcurve_min_term_size: 2
  ## Queues a mailbox for automatic background shard compaction once its
  ## sealed-shard count reaches this value (#715), on top of the manual
  ## `yarctl fts optimize` command. 0 disables auto-optimize (manual
  ## only) — explicit, not just "unset falls back to a default".
  fts_flatcurve_optimize_limit: 10
  fts_flatcurve_rotate_count: 5000
  ## Also rotates a shard if its commit took longer than this many ms
  ## (#724) — bounds commit latency for mailboxes with large documents
  ## and few messages per shard, which rotate_count alone never catches.
  ## 0 disables the time-based trigger (rotate_count-only, explicit).
  fts_flatcurve_rotate_time: 5000
  ## Where FTS data lives, written "driver:prefix=<path>" — the fs-api form, so
  ## a value carried over from an equivalent deployment needs no editing. The
  ## path is a template expanded per user with ~/, %h, %u, %n and %d.
  ##
  ## Only posix is implemented. Naming the driver says the value is a
  ## filesystem path rather than a location in some store; anything else (s3:,
  ## obox:) fails startup instead of being taken for part of a path, as does an
  ## argument other than prefix=. Two shorter spellings are also read:
  ## posix:<path> (the form namespace locations use) and a bare path.
  ##
  ## Defaults to posix:prefix=%h/fts/, outside the mail tree. FTS data is derived — deletable
  ## and rebuildable — while mail is not, and FTS is write-heavy: index writes
  ## are about a third of the pipeline. Those are different durability and I/O
  ## requirements, so they get different places, and a volume can be given to
  ## one without the other.
  ##
  ## Set to "" to keep the historical placement inside the mail index tree.
  ##
  ## The path must distinguish accounts: %h, %u or ~/ on their own, or %d
  ## together with %n. %d alone is one directory per domain and %n alone
  ## repeats across domains; both merge accounts' indexes, and startup fails
  ## rather than letting one user's search return another's mail. Note that
  ## "changing the root is safe, the index rebuilds" applies to moving a root
  ## and not to sharing one — a rebuild re-merges what merged.
  ##
  ## UPGRADE NOTE (2.3.64): the default changed from "" to %h/fts, so an
  ## upgrade moves the location. Nothing is migrated — existing indexes are
  ## orphaned where they are and rebuilt under %h/fts on first search or
  ## autoindex, which is safe because the data is derived but costs a reindex
  ## and leaves the old fts-flatcurve directories occupying space until they
  ## are removed by hand. Set fts_index_root: "" to keep the old placement.
  fts_index_root: "posix:prefix=%h/fts/"
  ## What the index shards sit on: "local" or "nfs". Declared, not detected
  ## — an approach that changes with the filesystem has to be a setting.
  ## It decides where a durability call is real: on a local filesystem the
  ## shard directory is fsynced after a compaction so the rename and the
  ## removals survive a crash, while NFS commits metadata operations before
  ## the reply by protocol and has no commit-a-directory call at all, so the
  ## same fsync is a no-op and is skipped. Unset means "local", the value
  ## that does the extra work — mis-declaring costs a wasted syscall one way
  ## and a rebuilt index after a crash the other. Every k8s backend runs on
  ## the tag's RWX NFS PV and should say so; standalone on a local PV should
  ## not. NOTE: an NFS export must be `sync` either way (https://doc.yarilomail.org/DEPLOYMENT).
  fts_storage_type: "local"
  ## Mailboxes autoindexing skips: special-use flags written with their
  ## backslash, or names with * and ? wildcards. Empty excludes nothing.
  ##
  ## Junk and trash are why it exists: high volume, attachment-heavy, almost
  ## never searched, and indexing cost is dominated by tokenisation — that is
  ## the cost of keeping current an index of content nobody queries.
  ##
  ## Patterns are written in the hierarchy separator the namespace configures:
  ## with separator "." use "EXPUNGED.*", with "/" use "EXPUNGED/*". A star does
  ## not cross the separator, so list the parent too when both are meant. A
  ## malformed pattern is dropped with a log line at startup.
  ##
  ## AUTOINDEXING only. An explicit rescan, and the catch-up a search triggers,
  ## both still index the mailbox: an excluded folder is un-pre-indexed rather
  ## than unsearchable.
  ##
  ## A flag is resolved against imap_special_use_defaults, not the per-user
  ## special-use file — reading that takes the cross-process lock and this runs
  ## on every delivery. A user who moved \Junk to a folder of their own naming
  ## is not covered; name patterns are the fallback for that.
  ##
  ## fts_autoindex_skipped_total counts what this refuses, so an over-broad
  ## pattern is visible rather than looking like an index that stopped filling.
  fts_autoindex_exclude: []
  ## Suffix expansion at INDEX time: stores every suffix of a term so an inner
  ## fragment can be found. Only reachable through prefix expansion below, so
  ## the two are one mechanism seen from both ends.
  fts_flatcurve_substring_search: false
  ## Which search terms are expanded as prefixes: yes | no | N | N-M, counted in
  ## characters. A prefix search asks the index for every term beginning with
  ## what was typed, so a short one can name a large part of it.
  ##
  ## unmeasured as a default — it expands everything, which is what the engine
  ## did before the setting existed. Measured against a vocabulary sharing
  ## prefixes, a two-character term cost 26x an exact match, six characters
  ## 2.2x, and eight characters nothing; but the useful threshold depends on how
  ## a corpus distributes prefixes rather than on length, so it cannot be chosen
  ## once for every deployment. Measure against a real index before narrowing.
  ##
  ## "no" turns substring search off in effect, since a stored suffix is only
  ## reachable by expansion. That combination is refused at startup.
  fts_flatcurve_prefix_search: "yes"
  ## Attachment text extraction (#669): no built-in PDF/office parsing —
  ## delegates to an external decoder, opt-in per driver.
  fts_decoder_driver: none           # none | script | tika
  fts_decoder_script_addr: ""        # "unix:///path/to.sock" or "host:port"
  fts_decoder_tika_url: ""           # e.g. "http://tika:9998"
  fts_decoder_max_size: "0"          # attachment bytes to decoder (human-readable, e.g. "10M"); "0"=unlimited. Quote it.
  fts_decoder_timeout_secs: 30
  ## tika driver retry against transient failures (network errors, 5xx)
  ## before degrading — indexing the message without the attachment's text
  ## instead of failing it outright (#697). 0 = default 2 (one retry). Not
  ## used by the script driver, which has no retry.
  fts_decoder_max_attempts: 0
  ## Skip re-tokenizing a body part whose normalized text was already
  ## indexed for the SAME message (multipart/alternative text+html twins,
  ## a repeated quoted block). Opt-in — some operators may not want this.
  fts_dedup_body_parts: false

quota:
  enabled: false
  ## Quota-root name surfaced in IMAP GETQUOTA / GETQUOTAROOT responses.
  quota_name: "User quota"
  ## Text returned when a save is rejected for being over quota
  ## (IMAP OVERQUOTA, LMTP 452, quota-status REJECT).
  quota_exceeded_message: "Quota exceeded (mailbox for user is full)"
  ## Reject any single message larger than this (human size, e.g. "50M").
  ## Empty / "0" = unlimited. Independent of the usage limit; carries a
  ## distinct "exceeds max mail size" rejection text.
  quota_mail_size: ""

  ## Scale the resolved storage / message limit (limit*pct/100). 100 = no
  ## scaling. Useful to enforce at a fraction of the nominal limit.
  quota_storage_percentage: 100
  quota_message_percentage: 100
  ## Byte headroom added to the storage limit after the percentage scaling
  ## (human size). Empty / "0" = none.
  quota_storage_extra: ""
  ## Storage overshoot allowed past the limit on inbound delivery (LMTP/LDA)
  ## ONLY — never interactive IMAP. Lets a nearly-full mailbox still accept one
  ## more delivery. Human size. Default "10M".
  quota_grace: "10M"
  ## Omit the quota root from IMAP GETQUOTA/GETQUOTAROOT for users whose limits
  ## are all unlimited.
  quota_ignore_unlimited: false
  ## Cap the number of mailboxes (folders) a user may have. 0 = unlimited.
  ## Enforced at folder creation.
  quota_mailbox_count: 0
  ## Cap the number of messages in a single mailbox. 0 = unlimited. Enforced
  ## on save (IMAP APPEND/COPY/MOVE, LMTP delivery).
  quota_mailbox_message_count: 0

  ## Hide the quota root from IMAP GETQUOTA/GETQUOTAROOT for every user
  ## (enforcement still applies). Differs from quota_ignore_unlimited, which
  ## hides only unlimited users.
  quota_hidden: false

  ## quota_warning — run an action when usage crosses a percentage of the limit.
  ## The action is a program located in quota_warning_bin_dir (mirrors
  ## sieve_execute_bin_dir), run best-effort with the crossing context passed
  ## via env: USER, HOME, HOST, QUOTA_WARNING_NAME, QUOTA_RESOURCE,
  ## QUOTA_THRESHOLD, QUOTA_PERCENTAGE, QUOTA_USAGE, QUOTA_LIMIT. When no bin dir
  ## is set the crossing is only logged.
  quota_warning_bin_dir: ""
  quota_warning_exec_timeout: 10
  quota_warnings: []
  #  - quota_warning_name: "storage90"
  #    quota_warning_resource: storage      # storage | message
  #    quota_warning_threshold: over        # over | under
  #    quota_warning_percentage: 90         # % of the user's limit
  #    quota_warning_execute: "warn-user"   # program in quota_warning_bin_dir

  ## quota_clone — mirror the authoritative usage into external dicts (advisory,
  ## never the source of truth; enforcement always reads the index). Names refer
  ## to entries in the top-level dicts: map. yarilo fans out to ALL of them at
  ## once (e.g. SQL + Redis simultaneously). Keys written: priv/quota/storage,
  ## priv/quota/messages. Empty disables cloning.
  quota_clone_dicts: []
  #  - quota_clone_sql
  #  - quota_clone_redis
  ## Debounce: at most one mirror write per this many seconds per session, plus
  ## a final flush on session close. Default 10.
  quota_clone_flush_delay: 10

  ## quota_over_status — keep an external "over quota" flag in sync. At login
  ## the actual over-quota state is compared to the userdb quota_over_flag; on a
  ## mismatch a program (from quota_warning_bin_dir) updates the external flag so
  ## an MTA can reject mail to over-quota users without querying yarilo.
  ## mask is the wildcard the userdb flag is matched against (empty = disabled).
  ## The program receives USER, HOME, HOST, QUOTA_OVER_FLAG (old), QUOTA_OVER
  ## (yes/no) via env. lazy_check defers from login to the first quota operation.
  quota_over_status_mask: ""
  quota_over_status_lazy_check: false
  quota_over_status_execute: ""   # program name in quota_warning_bin_dir

acl:
  enabled: false
  ## Root-level default ACLs resolve from INBOX's ACL for private and
  ## shared namespaces. This is the maildir answer to the namespace
  ## root == INBOX collision, where the local folder-"" default is
  ## unavailable: INBOX's ACL becomes the default for sibling folders
  ## that have no ACL of their own. Corresponds to
  ## acl_defaults_from_inbox.
  defaults_from_inbox: false
  ## Evaluate only the global ACL rules below and ignore the per-mailbox
  ## yarilo-acl files. Useful for centrally-administered installs.
  globals_only: false
  ## How long (seconds) a parsed per-mailbox ACL is trusted before its
  ## file's mtime+size are re-validated. The acl_cache_ttl knob
  ## (default 30). 0 disables caching — every right check reads the file.
  acl_cache_ttl: 30
  ## Owner-discovery registry: names a dict (from the top-level dicts:
  ## section) that records who granted what to whom in owner-templated
  ## namespaces, which is what lets LIST user/* enumerate the owners the
  ## caller may see. Key space matches the reference's shared-boxes
  ## layout, so a dict_import migration is mechanical. Unset disables
  ## discovery — user/* then lists nobody, and grants are reachable only
  ## by naming the owner (corresponds to acl_shared_dict).
  # acl_shared_dict: "acl"
  ## Operator-configured global ACL rules, applied across all users and
  ## merged with each mailbox's own ACL (global takes precedence: global
  ## grants add, global negatives revoke, and a matching global entry
  ## resets local negatives). Each rule targets a mailbox name or "*" for
  ## every mailbox. A leading "-" on rights marks a negative entry.
  ## Identifiers: anyone | authenticated | owner | user=<name> |
  ## group=<name> | group-override=<name>.
  global: []
  #   - mailbox: "*"
  #     entries:
  #       - { identifier: "user=admin@example.com", rights: "lrswipkxtea" }
  #       - { identifier: "anyone",                  rights: "-lr" }
  #   - mailbox: "Public/News"
  #     entries:
  #       - { identifier: "anyone", rights: "lr" }

namespaces: []
#   - type: personal              # personal | other | shared
#     prefix: ""                  # mailbox name prefix; "" reserved for personal
#     separator: "."              # one char; default "." (maildir++). dbox/fs
#                                 # deployments typically use "/". Each backend
#                                 # converts it to its on-disk layout (maildir
#                                 # flat ".A.B", dbox nested "mailboxes/A/B").
#     list: "yes"                 # LIST exposure: yes (node + children),
#                                 # children (only the children -- the node is
#                                 # not a mailbox), no (addressable, not
#                                 # advertised). Values are yes/children/no only. Unset
#                                 # defaults to children for an owner-templated
#                                 # prefix (user/%u names nothing until an owner
#                                 # is filled in), yes otherwise.
#     subscriptions: true         # does THIS namespace keep its own subscription
#                                 # file? Omit to take the default for its kind:
#                                 # personal always keeps one; a fixed
#                                 # shared/public namespace keeps one (a
#                                 # site-wide list); an owner-templated one never
#                                 # does -- its storage resolves per owner, so
#                                 # such a file would name no owner, and asking
#                                 # for one fails at startup. Setting false
#                                 # delegates: subscriptions then follow the
#                                 # SUBSCRIBER, kept in their own namespace under
#                                 # the client-visible name.
#     inbox: true                 # owns the magic "INBOX" (set on exactly one)
#     # personal inherits storage from cfg.Storage.MailHomeTemplate;
#     # leave `location:` unset.
#   - type: shared
#     prefix: "Shared/"
#     separator: "."
#     list: "yes"
#     acl_ignore: false           # true = bypass ACL enforcement for this ns
#                                 # (rights not checked, no lookup-right hiding)
#     # Absolute path; mount a PV here in multi-pod deployments.
#     location: "maildir:/var/yarilo/shared"
#   - type: other                 # Other Users — declared-only until ACL-1 + NS-3
#     prefix: "user/"
#     separator: "/"
#     list: "yes"

dicts:
  # IMAP METADATA (RFC 5464) state. When omitted, GETMETADATA /
  # SETMETADATA respond NO "Metadata storage not configured" but the
  # rest of the server still works. file driver is fine for standalone
  # single-pod releases; switch to redis or sql for backend multi-pod.
  metadata:
    driver: file
    settings:
      path: /var/yarilo/dicts/metadata.json
#   quota:
#     driver: redis
#     settings:
#       addr: yarilo-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
#       db: 0
#       prefix: "yarilo:quota:"
#     expire_secs: 86400
#   # Optional: vacation dedup tracking (sieve vacation extension).
#   # Scripts are stored on the filesystem; this dict is only for vacation dedup.
#   sieve_vacation:
#     driver: redis
#     settings:
#       addr: yarilo-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
#       db: 0
#       prefix: "yarilo:sieve:vacation:%u:"
#   # Optional: duplicate-test dedup (RFC 7352). driver=redis makes the dedup
#   # window cross-pod; omit (or driver=memory) for per-process behaviour.
#   sieve_duplicate:
#     driver: redis
#     settings:
#       addr: yarilo-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
#       db: 0
#       prefix: "yarilo:sieve:duplicate:%u:"
#   # Optional: quota_clone SQL target in mapped mode. Each dict key binds to a
#   # table column, so a quota_clone mirror becomes a clean per-user schema an
#   # external reader (billing, dashboards) can query directly:
#   #   CREATE TABLE quota (username VARCHAR(255) PRIMARY KEY, bytes BIGINT, messages BIGINT);
#   # The operator owns the table (no auto-create in mapped mode). Without "maps"
#   # the sql driver keeps its generic key/value layout. Reference this name from
#   # protocol.lmtp.quota_clone_dicts.
#   ## The dict drivers take the same pool knobs inside `settings`, since that is
#   ## where their DSN already lives. quota_clone_mysql is the hottest SQL path in
#   ## the system — it writes on every mail save — so it benefits most from reuse:
#   ##   settings:
#   ##     max_open_conns: 25
#   ##     conn_max_lifetime: 300
#   quota_clone_mysql:
#     driver: sql
#     settings:
#       driver: mysql
#       dsn: "${YARILO_DB_DSN}"
#       maps:
#         - { key: "priv/quota/storage",  table: quota, username_field: username, value_field: bytes }
#         - { key: "priv/quota/messages", table: quota, username_field: username, value_field: messages }