## yarilo Helm chart values
## Full reference: https://github.com/0kaba0hub/yarilo

image:
  repository: ghcr.io/0kaba0hub/yarilo
  tag: ""          # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

## -------------------------------------------------------------------
## Components — each runs as a separate Deployment + Service.
## All enabled by default (multi-process mode). Set replicas: 0
## or enabled: false to disable a component.
## -------------------------------------------------------------------
components:
  ## Main mail server: IMAP / POP3 / LMTP / Submission sessions.
  ## Requires a PVC for mail storage (storage.persistence).
  yarilo:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  ## Authentication service — passdb chain.
  ## Stateless; safe to scale horizontally.
  auth:
    enabled: true
    replicas: 1
    listen: ":9100"
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## Connection rate limiter (anvil).
  ## Keeps per-user/IP counters in memory — keep replicas: 1.
  anvil:
    enabled: true
    replicas: 1
    listen: ":9101"
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## Consistent-hash router.
  ## Director-to-director ring sync (Phase B) is not yet implemented —
  ## keep replicas: 1 until ring sync lands.
  director:
    enabled: true
    replicas: 1
    listen: ":9102"
    userExpire: 900      # seconds before user→backend mapping expires
    pingInterval: 30     # seconds between PING keepalive probes
    pingTimeout: 10      # seconds to wait for PONG before closing
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

## -------------------------------------------------------------------
## Server hostname — used as EHLO banner, Message-ID domain, and the
## hostname surfaced in Received: headers. Must match the TLS cert SAN.
## -------------------------------------------------------------------
hostname: ""

## -------------------------------------------------------------------
## External TLS (user-facing: IMAPS / Submissions / POP3S)
## -------------------------------------------------------------------
tls:
  ## Name of an existing Secret containing tls.crt and tls.key.
  ## Required if imaps, submissions, or pop3s is enabled.
  secretName: ""

  ## Optional cert-manager Certificate to provision the secretName above.
  certificate:
    enabled: false
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod
    dnsNames: []
    duration: ""
    renewBefore: ""

## -------------------------------------------------------------------
## Internal mTLS (between components: yarilo ↔ auth ↔ anvil ↔ director)
## When enabled, all inter-component connections use mTLS.
## Provide a Secret with tls.crt, tls.key, and ca.crt.
## -------------------------------------------------------------------
internalTLS:
  enabled: false
  secretName: ""   # Secret name; must be in the same namespace

## -------------------------------------------------------------------
## Services — per-listener toggles (yarilo main component)
## -------------------------------------------------------------------
services:
  ## IMAP over TLS (port 993)
  imaps:
    enabled: true
    port: 993
    containerPort: 10993
    disablePlainAuth: false

  ## IMAP with STARTTLS (port 143)
  imap:
    enabled: false
    port: 143
    containerPort: 10143
    disablePlainAuth: false

  ## Submission STARTTLS (port 587)
  submission:
    enabled: false
    port: 587
    containerPort: 10587
    disablePlainAuth: true

  ## Submission SSL (port 465)
  submissions:
    enabled: false
    port: 465
    containerPort: 10465
    disablePlainAuth: true

  ## POP3 with STARTTLS (port 110)
  pop3:
    enabled: false
    port: 110
    containerPort: 10110

  ## POP3 over TLS (port 995)
  pop3s:
    enabled: false
    port: 995
    containerPort: 10995

  ## LMTP local delivery — fronted by external MTA (Postfix etc.).
  lmtp:
    enabled: false
    port: 24
    containerPort: 10024

## -------------------------------------------------------------------
## Protocol tuning (independent of listener)
## -------------------------------------------------------------------
protocol:
  imap:
    idleNotifyInterval: 120      # seconds; 0 = disabled
    maxLineLength: 65536          # bytes
    idSend: "name *"              # ID pairs; * = default; empty = disabled
    loginGreeting: ""
    logoutFormat: ""
    clientWorkarounds: []

  submission:
    hostname: ""
    maxMessageSize: 41943040      # 40 MiB
    maxLineLength: 4096
    maxRecipients: 0              # 0 = unlimited
    recipientDelimiter: "+"
    addReceivedHeader: true
    clientWorkarounds: []
    relay:
      host: ""
      port: 25
      user: ""
      password: ""                # supports ${ENV_VAR}
      ssl: "no"                   # no | smtps | starttls
      sslVerify: true
      trusted: false
      connectTimeout: 30
      commandTimeout: 300

  lmtp:
    loginGreeting: "Yarilo ready."
    addReceivedHeader: true
    saveToDetailMailbox: false
    hdrDeliveryAddress: final     # none | final | original
    verboseReplies: false
    userConcurrencyLimit: 10      # 0 = unlimited
    readTimeout: 300
    writeTimeout: 300
    clientWorkarounds: []

  pop3:
    noFlagUpdates: false
    reuseXUIDL: false
    uidlFormat: "%u.%v"
    uidlDuplicates: rename        # allow | rename
    enableLast: false
    deleteType: expunge           # expunge | flag
    deletedFlag: ""

## -------------------------------------------------------------------
## General infrastructure (shared across all listeners)
## -------------------------------------------------------------------
general:
  limits:
    maxUserIPConnections: 10      # 0 = unlimited

  haproxy:
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"
    timeout: 3

  xclient:
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"

## -------------------------------------------------------------------
## Authentication
## -------------------------------------------------------------------
auth:
  passdb:
    - driver: sqlite
      dsn: /var/lib/yarilo/users.db

## -------------------------------------------------------------------
## Storage (yarilo main component only)
## -------------------------------------------------------------------
storage:
  mailbox: maildir
  maildirRoot: /var/mail/vhosts
  mailHomeTemplate: "%d/%n"
  index: fileindex

  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    # existingClaim: ""

## -------------------------------------------------------------------
## Telemetry
## -------------------------------------------------------------------
telemetry:
  listen: ":8080"
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

## -------------------------------------------------------------------
## Kubernetes service (yarilo main — external)
## -------------------------------------------------------------------
service:
  type: LoadBalancer
  telemetryPort: 8080
  # loadBalancerIP: ""
  annotations: {}

## -------------------------------------------------------------------
## Shared probe / scheduling / security settings
## Applied to all component Deployments unless overridden per-component.
## -------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: telemetry
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: telemetry
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

## -------------------------------------------------------------------
## Log level (also settable via LOG_LEVEL env var)
## -------------------------------------------------------------------
logLevel: info   # debug | info | warn | error

## -------------------------------------------------------------------
## Extra environment variables injected into all containers
## -------------------------------------------------------------------
extraEnv: []
# - name: DB_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: yarilo-secrets
#       key: db-password

## -------------------------------------------------------------------
## Extra volumes / mounts (applied to all Deployments)
## -------------------------------------------------------------------
extraVolumes: []
extraVolumeMounts: []
