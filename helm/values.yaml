## yarilo Helm chart values

image:
  repository: ghcr.io/0kaba0hub/yarilo
  tag: ""
  pullPolicy: IfNotPresent

## -------------------------------------------------------------------
## Components
## -------------------------------------------------------------------
components:

  ## Director — front-end proxy.
  ## Accepts client connections, routes to backend via consistent hash.
  director:
    enabled: true
    replicas: 1

    ## Internal director protocol (ring management, LOOKUP between directors).
    directorPort: 9102

    ## Client-facing listeners (same ports as a regular mail server).
    listeners:
      imaps:
        enabled: true
        port: 993
        containerPort: 10993
      imap:
        enabled: false
        port: 143
        containerPort: 10143
      pop3s:
        enabled: false
        port: 995
        containerPort: 10995
      pop3:
        enabled: false
        port: 110
        containerPort: 10110
      lmtp:
        enabled: false
        port: 24
        containerPort: 10024

    ## TLS cert presented to mail clients (IMAPS/POP3S).
    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    ## mTLS for internal connections (director ↔ auth, director ↔ backend).
    internalTLS:
      enabled: false
      secretName: ""

    ## Consistent-hash routing settings.
    userExpire: 900
    pingInterval: 30
    pingTimeout: 10

    ## Static backend list loaded at startup.
    ## Each entry must match a backend service in the backend namespace.
    ## tag: optional pool tag to group backends (empty = default pool).
    backends: []
    # - host: yarilo-imap.yarilo-backend.svc.cluster.local
    #   port: 993
    #   tag: ""
    # - host: yarilo-pop3.yarilo-backend.svc.cluster.local
    #   port: 110
    #   tag: ""
    # - host: yarilo-lmtp.yarilo-backend.svc.cluster.local
    #   port: 24
    #   tag: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## Auth — passdb/userdb chain.
  auth:
    enabled: true
    replicas: 1
    listen: ":9100"

    internalTLS:
      enabled: false
      secretName: ""

    passdb:
      - driver: sqlite
        dsn: /var/lib/yarilo/users.db
        ## passwordQuery: "SELECT password FROM users WHERE username = ?"
        ## userQuery:     "SELECT home, uid, gid FROM users WHERE username = ?"
        ## defaultPassScheme: BCRYPT

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## Anvil — connection rate limiter. Keep replicas: 1.
  anvil:
    enabled: true
    replicas: 1
    listen: ":9101"

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## IMAP backend — handles sessions proxied from director.
  imap:
    enabled: true
    replicas: 1
    listen: ":10993"
    containerPort: 10993

    internalTLS:
      enabled: false
      secretName: ""

    storage:
      mailbox: maildir
      maildirRoot: /var/mail/vhosts
      mailHomeTemplate: "%d/%n"
      index: fileindex
      persistence:
        enabled: true
        storageClass: ""
        accessMode: ReadWriteMany
        size: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  ## POP3 backend.
  pop3:
    enabled: false
    replicas: 1
    listen: ":10110"
    containerPort: 10110

    internalTLS:
      enabled: false
      secretName: ""

    storage:
      mailbox: maildir
      maildirRoot: /var/mail/vhosts
      mailHomeTemplate: "%d/%n"
      index: fileindex
      persistence:
        enabled: true
        storageClass: ""
        accessMode: ReadWriteMany
        size: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## LMTP backend — local delivery from MTA.
  lmtp:
    enabled: false
    replicas: 1
    listen: ":10024"
    containerPort: 10024

    internalTLS:
      enabled: false
      secretName: ""

    storage:
      mailbox: maildir
      maildirRoot: /var/mail/vhosts
      mailHomeTemplate: "%d/%n"
      index: fileindex
      persistence:
        enabled: true
        storageClass: ""
        accessMode: ReadWriteMany
        size: 10Gi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

## -------------------------------------------------------------------
## Protocol tuning
## -------------------------------------------------------------------
protocol:
  imap:
    idleNotifyInterval: 120
    maxLineLength: 65536
    idSend: "name *"
    loginGreeting: ""
    logoutFormat: ""
    clientWorkarounds: []

  pop3:
    noFlagUpdates: false
    reuseXUIDL: false
    uidlFormat: "%u.%v"
    uidlDuplicates: rename
    enableLast: false
    deleteType: expunge
    deletedFlag: ""

  lmtp:
    loginGreeting: "Yarilo ready."
    addReceivedHeader: true
    saveToDetailMailbox: false
    hdrDeliveryAddress: final
    verboseReplies: false
    userConcurrencyLimit: 10
    readTimeout: 300
    writeTimeout: 300
    clientWorkarounds: []

  submission:
    hostname: ""
    maxMessageSize: 41943040
    maxLineLength: 4096
    maxRecipients: 0
    recipientDelimiter: "+"
    addReceivedHeader: true
    clientWorkarounds: []
    relay:
      host: ""
      port: 25
      user: ""
      password: ""
      ssl: "no"
      sslVerify: true
      trusted: false
      connectTimeout: 30
      commandTimeout: 300

## -------------------------------------------------------------------
## General infrastructure
## -------------------------------------------------------------------
general:
  limits:
    maxUserIPConnections: 10
  haproxy:
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"
    timeout: 3
  xclient:
    enabled: false
    trustedNets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"

## -------------------------------------------------------------------
## Telemetry (:8080 per component pod)
## -------------------------------------------------------------------
telemetry:
  listen: ":8080"
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

## -------------------------------------------------------------------
## Shared scheduling / security
## -------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: telemetry
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: telemetry
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

logLevel: info

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
