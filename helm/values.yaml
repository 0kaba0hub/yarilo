## yarilo Helm chart values

image:
  repository: ghcr.io/0kaba0hub/yarilo
  tag: ""
  pullPolicy: IfNotPresent

## -------------------------------------------------------------------
## Storage (shared across all session components)
## -------------------------------------------------------------------
## These settings apply to every yarilo session component (imap, pop3,
## lmtp). When a userdb lookup returns explicit per-user values
## (volatile_dir=, index_dir=, control_dir= or modifiers in the mail=
## location string), those take priority over these cluster-wide defaults.
storage:
  mailbox: maildir
  maildir_root: /var/mail/vhosts
  mail_home_template: "%d/%u"
  index: fileindex
  ## mail_path: ""                            # mail storage root (empty = same as home); supports ~/ and %u/%d/%n/%h
  ## mail_inbox_path: ""                      # INBOX override path (empty = mail_path); supports ~/ and %u/%d/%n/%h
  ## mdboxAltStoragePath: "/mnt/cold/%d/%n"  # cold-tier base for mdbox alt-move
  ## index_dir: "/var/yarilo-index/%d/%n"     # redirect per-folder index files to a faster disk
  ## control_dir: "/var/yarilo-control/%d/%n" # redirect yarilo-uidlist and subscriptions files
  ## volatile_dir: "/run/yarilo-volatile/%d/%n" # local tmpfs for index tmp files (NFS deployments)
  ## alt_dir: "/mnt/cold/%d/%n"               # cold-tier alt storage root (two-tier maildir)
  ## index_log_compact_min_bytes: 32768    # 32 KiB — compact log when >= this size and age >= minAge
  ## index_log_compact_max_bytes: 1048576  # 1 MiB  — compact unconditionally above this size
  ## index_log_compact_min_age_secs: 300    # 5 min  — minimum log age before min-size compaction fires
  ## max_concurrent_writes: 0           # 0 = unlimited; tune to storage type: ~32 HDD, ~256 SSD
  ## mailbox_list_utf8: true            # true = UTF-8 on disk (default); false = modified-UTF-7 for legacy migrations
  ## mailbox_list_normalize_to_nfc: true # true = NFC-normalise folder names (default)
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

## -------------------------------------------------------------------
## Components
## -------------------------------------------------------------------
components:

  ## Director — front-end proxy.
  ## Accepts client connections, routes to backend via consistent hash.
  director:
    enabled: false
    replicas: 1

    ## Internal director protocol (ring management, LOOKUP between directors).
    directorPort: 9102

    ## Client-facing listeners.
    ## IMAP/POP3/Submission are handled by dedicated login pods; director only proxies LMTP.
    listeners:
      lmtp:
        enabled: false
        port: 24
        containerPort: 10024

    ## mTLS for internal connections (director ↔ auth, director ↔ backend).
    internalTLS:
      enabled: false
      secretName: ""

    ## Consistent-hash routing settings.
    user_expire: 900
    ping_interval: 30
    ping_timeout: 10

    ## Static backend list loaded at startup.
    ## Each entry must match a backend service in the backend namespace.
    ## tag: optional pool tag to group backends (empty = default pool).
    backends: []
    # - host: yarilo-imap.yarilo-backend.svc.cluster.local
    #   port: 993
    #   tag: ""
    # - host: yarilo-pop3.yarilo-backend.svc.cluster.local
    #   port: 110
    #   tag: ""
    # - host: yarilo-lmtp.yarilo-backend.svc.cluster.local
    #   port: 24
    #   tag: ""

    ## Peer director addresses for ring sync (required when replicas > 1).
    ## Each entry is "host:port" where port matches directorPort (default 9102).
    ## With StatefulSet, use headless-service pod DNS:
    ##   yarilo-director-0.yarilo-director-headless:9102
    ##   yarilo-director-1.yarilo-director-headless:9102
    peers: []

    ## HTTP admin API (yarilo-admin CLI target).
    ## A 32-char token is auto-generated into Secret <release>-director-api-token on first
    ## deploy and preserved on upgrades. To rotate: delete the Secret before helm upgrade.
    api:
      port: 9103
      ## CIDRs allowed to reach the API. Default: loopback + k8s service/pod CIDRs.
      allowed_nets:
        - "127.0.0.0/8"
        - "10.96.0.0/12"
        - "10.244.0.0/16"

    ## yarilo-monitor sidecar — probes backend pods and reports health to the director.
    ## Runs as a sidecar container in the director pod.
    monitor:
      enabled: false

      ## Image override (defaults to the same image as the director).
      image: ""

      ## Which protocols to probe on every backend in the ring.
      ## Ports default to standard mail ports (993 / 110 / 24).
      pollIMAP: true
      imapPort: 993
      pollPOP3: false
      pop3Port: 110
      pollLMTP: false
      lmtpPort: 24

      ## Poll interval and per-probe timeout (seconds).
      interval: 10
      timeout: 3

      ## Consecutive failures before rapid poll; rapid poll threshold.
      retryCount: 3
      rapidRounds: 10
      rapidFailsNeeded: 7

      ## Per-tag monitoring credentials.
      ## The tag is the same label used on backends, users, and storage.
      ## The "" key covers untagged backends.
      ##
      ## tags:
      ##   "":
      ##     user: monitor@example.com
      ##     password: secret
      ##   ssd:
      ##     user: monitor-ssd@example.com
      ##     password: ssd-secret
      tags: {}

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## Auth — passdb/userdb chain.
  auth:
    enabled: true
    replicas: 1
    ## listen — client protocol (login pods speak here).
    listen: ":9100"
    ## addr — address login pods dial to reach yarilo-auth.
    ## Defaults to listen when empty (single-process / dev mode).
    ## In k8s set to the ClusterIP service DNS, e.g. "<release>-auth:9100".
    addr: ""
    ## masterListen — master protocol for password-less
    ## userdb lookups (USER / LIST) used by yarilo-backend-api admin
    ## endpoints and CLI tooling. Empty disables; the binary then only
    ## opens the client listener.
    masterListen: ":9102"
    ## saslListen — plain-TCP listener for Postfix SASL auth
    ## (smtpd_sasl_type=dovecot, smtpd_sasl_path=inet:[yarilo-auth]:12345).
    ## Empty disables the listener.
    saslListen: ""

    internalTLS:
      enabled: false
      secretName: ""

    passdb:
      - driver: mysql
        dsn: "${YARILO_DB_DSN}"
        default_pass_scheme: BCRYPT
        ## Custom queries (optional — leave empty to use the auto-created yarilo_users schema).
        ## password_query: |
        ##   SELECT password, '' AS home, '' AS mail, active AS enabled
        ##   FROM users WHERE username = LOWER(%u)
        ## user_query: |
        ##   SELECT CONCAT(home, mpath) AS home,
        ##          CONCAT(mbtype, ':~/', maildir,
        ##                 ':INDEX=~/index',
        ##                 ':VOLATILEDIR=/tmp/yarilo-volatile/%2.256Nu/%u') AS mail,
        ##          CONCAT('*:bytes=', quota) AS quota_rule
        ##   FROM mailbox WHERE username = %u
        ## iterate_query: |
        ##   SELECT username FROM users WHERE active = 1 ORDER BY username
        ## skip_schema: true   # set when using a custom table instead of yarilo_users

    ## failureDelay — timing-leak mitigation. Every failed auth
    ## reply (wrong password, unknown user, malformed SASL) is
    ## held back this many seconds before surfacing to the client
    ## so unknown-user and wrong-password paths return in the same
    ## wall-clock time. Default 2s. Corresponds to the
    ## `auth_failure_delay`. Set to 0 to disable (tests only —
    ## production should keep >0).
    ## persistence — SQLite fallback only; not used when mysql.bundled=true.
    persistence:
      enabled: false
      storageClass: ""
      size: 1Gi

    ## maxAttempts — number of failed auth attempts allowed on a single
    ## connection before the server sends BYE and closes (IMAP/POP3).
    ## Mirrors the `auth_max_attempts`. Default 3.
    maxAttempts: 3
    failure_delay: 2
    ## internal_failure_delay_ms — separate delay for INTERNAL
    ## failures (passdb backend down, SQL refused). Matches
    ## the `auth_internal_failure_delay` setting. Typically shorter
    ## than failure_delay so a passdb outage does not amplify
    ## into user-facing latency.
    internal_failure_delay_ms: 2000

    ## cache — in-process auth cache (LRU, bytes-bounded).
    ## OPT-IN, disabled by default (sizeBytes: 0). Stores
    ## HMAC-ed passwords (never plain) keyed by
    ## `<service>\t<username>`. Positive entries hold the
    ## verified credential and bag; negative entries short-
    ## circuit failed lookups for the NegativeTTL window. Evict
    ## selectively via `yarilo-admin auth cache flush
    ## [user-mask...]`.
    cache:
      size_bytes: 104857600
      ttl_seconds: 1800
      negative_ttl_seconds: 1800

    ## penalty — cross-pod IP-bound auth-fail backoff. OPT-IN.
    ## Every failed auth from a given client IP increments the
    ## counter in the anvil service; subsequent attempts from that
    ## IP sleep PenaltyToSecs(count) seconds before the chain runs
    ## (exponential 0/2/4/8/15 cap). Successful auth resets the
    ## counter to 0. Master-user flows are exempt.
    ##
    ## Requires the anvil service to be reachable.
    penalty:
      enabled: false

    ## token — one-time session token issued after successful passdb.
    ## The login pod forwards the token to the backend (XCLIENT TOKEN=);
    ## the backend calls yarilo-auth VERIFY to consume it and enter
    ## authenticated state without replaying credentials.
    token:
      ## ttl_seconds — how long the token is valid for the backend to
      ## consume. Must be larger than the login→backend roundtrip time.
      ## Default 60 s is generous; lower to 10-15 s in production.
      ttl_seconds: 60
      ## backend — token store implementation.
      ## "memory": in-process (single auth pod only).
      ## "redis": Redis-backed, safe for replicaCount > 1.
      backend: memory
      ## redis_addr — Redis URL used when backend=redis.
      ## Format: redis://[password@]host:port/db
      redis_addr: ""

    ## oauth2 — OAuth 2.0 bearer-token providers. Each entry
    ## becomes a passdb that participates in the auth chain (placed
    ## AHEAD of SQL so an OAUTHBEARER login resolves through the
    ## validator before SQL ever sees the bearer token as a
    ## plaintext password). Empty list disables OAUTHBEARER.
    ##
    ## See docs/AUTH_OAUTH2.md for the wire spec, configuration
    ## reference, and worked examples for Google Workspace,
    ## Microsoft 365, and Keycloak / Authelia.
    ##
    ## Four validation modes:
    ##   - local         — JWT verify against jwks_url (recommended)
    ##   - introspection — RFC 7662 endpoint
    ##   - tokeninfo     — Google-style endpoint
    ##   - discovery     — auto-resolve via OIDC discovery (issuer_url)
    oauth2: []
      # - mode: discovery
      #   issuer_url: https://accounts.google.com
      #   audience: <your-google-oauth-client-id>
      #   scopes: [openid, email]
      #   username_attribute: email
      #   username_validation_format: "%Lu"
      #   extra_fields: [sub, hd]
      # - mode: local
      #   jwks_url: https://login.microsoftonline.com/common/discovery/keys
      #   issuers: ["https://login.microsoftonline.com/<tenant-id>/v2.0"]
      #   audience: <your-azure-app-id>
      #   username_attribute: preferred_username
      # - mode: introspection
      #   introspection_url: https://keycloak.internal/realms/yarilo/protocol/openid-connect/token/introspect
      #   introspection_mode: post
      #   client_id: yarilo-auth
      #   client_secret: change-me
      #   username_attribute: email

    ## policy — wforce-compatible HTTP policy-server hook. URL=""
    ## disables. When set, every login attempt POSTs JSON to the
    ## policy server which can allow / reject / tarpit the request.
    ## See docs/AUTH_POLICY.md for the wire format and a wforce
    ## configuration example.
    ##
    ## hashNonce is REQUIRED when url is set — it salts the pwhash
    ## field so two deployments don't share the same hash space.
    ## Default hash is truncated to 12 bits (4096 buckets) so the
    ## policy server can group attempts without seeing real
    ## passwords.
    policy:
      url: ""
      api_header: ""
      hash_mech: sha256
      hash_nonce: ""
      hash_truncate_bits: 12
      timeout_ms: 5000
      reject_on_fail: false
      log_only: false
      check_before: true
      check_after: true
      report_after: true

    ## masterUsers — master-user impersonation
    ## (SASL PLAIN authzid). OPT-IN, disabled by default. While
    ## `enabled: false` the IMAP / POP3 / Submission / wire
    ## yarilo-auth code paths drop the authzid before consulting
    ## the chain — distinct authzid produces an opaque auth
    ## failure indistinguishable from a wrong password.
    ##
    ## Set `enabled: true` to allow EITHER of these admin paths:
    ##   1. A dedicated `masterdb` chain (entries below) whose
    ##      rows are unconditionally allowed to impersonate any
    ##      target. Independent SQL store; same query syntax as
    ##      the regular `passdb`.
    ##   2. A regular `passdb` row that returns the extra field
    ##      `master_user=yes` from its passwordQuery. That row
    ##      is then allowed to impersonate any target — useful
    ##      when admins and end-users share one user table.
    ##
    ## `separator` enables the legacy `target<sep>master` SASL
    ## workaround for clients that cannot supply authzid (older
    ## Outlook, some mobile MUAs). Empty disables the workaround
    ## even when `enabled: true`. `*` matches the default
    ## `auth_master_user_separator`.
    master_users:
      enabled: false
      separator: "*"
      masterdb: []
        ## - driver: sqlite
        ##   dsn: /var/lib/yarilo/masters.db
        ##   password_query: "SELECT password FROM masters WHERE username = ?"
        ##   default_pass_scheme: BCRYPT

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 320Mi

  ## Anvil — connection rate limiter. Keep replicas: 1.
  anvil:
    enabled: true
    replicas: 1
    listen: ":9101"

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## yarilo-backend-api — storage-plane operator HTTP API.
  ## Exposes dict / acl (later) / quota (later) / folder / user
  ## operations consumed by yarilo-admin CLI. Mounts the same
  ## storage PVC as the session pods + connects to every
  ## configured dict.
  ##
  ## Bearer token auth (auto-generated Secret unless tokenSecret
  ## is provided). For multi-pod backend cluster, director's
  ## /api/admin/proxy/<user>/... proxies admin requests to the
  ## right backend's yarilo-backend-api by user-to-backend mapping.
  backendAPI:
    enabled: true
    replicas: 1
    listen: ":9105"

    internalTLS:
      enabled: false
      secretName: ""

    ## Pre-existing Secret with key "token" holding the bearer
    ## token. When empty, the chart generates a random token and
    ## stores it in <release>-backend-api-token. CLI reads from
    ## YARILO_BACKEND_API_TOKEN env or --backend-token flag.
    token_secret: ""

    ## CIDR allow-list for callers. Empty = allow any IP (token
    ## auth still applies). Set to your operator subnet for
    ## defence-in-depth.
    allowed_nets: []

    ## yarilo-auth master-protocol address. When set, backend-api
    ## dials at startup via pkg/authclient and:
    ##   - enriches /api/backend/user/info with a `userdb` block
    ##     (uid, gid, groups, quota_rule, allow_nets, ...) plus a
    ##     `userdb_status` field ("ok" / "not_found" / "error")
    ##   - serves /api/backend/user/iterate
    ## Empty disables both surfaces — handy for dev / smoke runs.
    ## In a standard Helm release this is the in-cluster service:
    ##   "<release>-auth:9102"
    auth_master_addr: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  ## yarilo-locks — cross-process write coordinator.
  ## Every session pod dials this Service to take X locks on
  ## mbox:<user>:<folder> before mutating maildir / index files.
  ## State lives in Redis (see top-level redis: section).
  ## Default 2 replicas for HA — set replicas: 1 for single-node dev.
  locks:
    enabled: true
    replicas: 2
    listen: ":9104"

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 128Mi

  ## IMAP backend — handles sessions proxied from director.
  ## Director proxies 993→imap:993, 143→imap:143.
  imap:
    enabled: true
    replicas: 1

    listeners:
      imaps:
        enabled: true
        servicePort: 993
        containerPort: 10993
      imap:
        enabled: false
        servicePort: 143
        containerPort: 10143

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  ## POP3 backend — director proxies 995→pop3:995, 110→pop3:110.
  pop3:
    enabled: false
    replicas: 1

    listeners:
      pop3s:
        enabled: true
        servicePort: 995
        containerPort: 10995
      pop3:
        enabled: false
        servicePort: 110
        containerPort: 10110

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## LMTP backend — director proxies 24→lmtp:24.
  lmtp:
    enabled: false
    replicas: 1

    listeners:
      lmtp:
        enabled: true
        servicePort: 24
        containerPort: 10024

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## Postfix SASL proxy — delegates smtpd_sasl_type=dovecot authentication to yarilo-auth.
  ## Postfix config: smtpd_sasl_path = inet:<host>:12325
  ## Postfix has no direct access to yarilo-auth; yarilo-sasl-login proxies each session.
  saslLogin:
    enabled: false
    replicas: 1
    servicePort: 12325
    containerPort: 12325

    ## auth_addr overrides the yarilo-auth dial address.
    ## Defaults to auth_service.addr from the shared config.
    auth_addr: ""

    ## trusted_nets lists CIDRs allowed to connect. Empty = allow all.
    trusted_nets: []
    #  - "10.0.0.0/8"

    ## haproxy enables PROXY protocol v1/v2 on the listener.
    haproxy: false
    haproxy_timeout: 3
    ## haproxy_nets lists CIDRs whose PROXY header is trusted.
    haproxy_nets: []
    #  - "10.0.0.0/8"

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  ## Postfix policy service — quota enforcement before message queuing.
  ## Postfix config: check_policy_service inet:[<ClusterIP>]:12340
  quotaStatus:
    enabled: false
    replicas: 1
    servicePort: 12340
    containerPort: 12340

    ## default_quota_rules mirror yarilo.yaml quota_rule format.
    ## Applied to every recipient; per-user rules require userdb lookup (future phase).
    default_quota_rules: []
    #  - "*:storage=5G"
    #  - "*:messages=100000"
    #  - "Trash:storage=+1G"
    #  - "Spam:ignore"

    ## alias_dict is the name of a dict in the dicts: map that resolves
    ## virtual aliases (source → destination). Empty = disabled.
    alias_dict: ""
    alias_max_hops: 5

    ## auth_master_addr is the yarilo-auth master-protocol listener address
    ## used for per-user quota_rule lookups via userdb. When set, per-user
    ## rules override default_quota_rules; default_quota_rules remain as fallback.
    ## Example: "yarilo-auth:9101"
    auth_master_addr: ""

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  ## Submission backend — accepts mail from submission-login pods, relays to upstream MTA.
  ## ClusterIP only; mail clients connect to yarilo-submission-login (LoadBalancer).
  submission:
    enabled: false
    replicas: 1

    listeners:
      submission:
        enabled: true
        servicePort: 587
        containerPort: 10587
      submissions:
        enabled: false
        servicePort: 465
        containerPort: 10465

    internalTLS:
      enabled: false
      secretName: ""

    tls:
      secretName: ""

    service:
      type: ClusterIP

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## IMAP login pod — TLS terminator + director LOOKUP + proxy to yarilo-imap backend.
  ## Faces mail clients on 993/143; does NOT store mail.
  imapLogin:
    enabled: false
    replicas: 1

    listeners:
      imaps:
        enabled: true
        servicePort: 993
        containerPort: 10993
      imap:
        enabled: false
        servicePort: 143
        containerPort: 10143

    ## TLS cert presented to mail clients (IMAPS / STARTTLS for IMAP).
    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    ## mTLS for connections to director and backend pods.
    internalTLS:
      enabled: false
      secretName: ""

    ## backend_addr bypasses director LOOKUP for standalone deployments.
    ## Set to "<release>-imap:<port>" (plain) or "<release>-imap:<tls-port>" (mTLS).
    ## Leave empty in director deployments — LOOKUP is used instead.
    backend_addr: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## POP3 login pod — TLS terminator + director LOOKUP + proxy to yarilo-pop3 backend.
  pop3Login:
    enabled: false
    replicas: 1

    listeners:
      pop3s:
        enabled: true
        servicePort: 995
        containerPort: 10995
      pop3:
        enabled: false
        servicePort: 110
        containerPort: 10110

    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    internalTLS:
      enabled: false
      secretName: ""

    ## backend_addr bypasses director LOOKUP for standalone deployments.
    ## Set to "<release>-pop3:<port>" (plain) or "<release>-pop3:<tls-port>" (mTLS).
    ## Leave empty in director deployments — LOOKUP is used instead.
    backend_addr: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## Submission login pod — TLS terminator + director LOOKUP + proxy to yarilo-submission backend.
  submissionLogin:
    enabled: false
    replicas: 1

    listeners:
      submission:
        enabled: true
        servicePort: 587
        containerPort: 10587
      submissions:
        enabled: false
        servicePort: 465
        containerPort: 10465

    tls:
      secretName: ""
      certificate:
        enabled: false
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames: []

    internalTLS:
      enabled: false
      secretName: ""

    ## backend_addr bypasses director LOOKUP for standalone deployments.
    ## Set to "<release>-submission:<port>" (plain) or "<release>-submission:<tls-port>" (mTLS).
    ## Leave empty in director deployments — LOOKUP is used instead.
    backend_addr: ""

    service:
      type: LoadBalancer
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## LMTP login pod — MTA-facing LMTP proxy with per-recipient anvil CONNECT
  ## and yarilo-auth SESSION token issuance. Fans out one backend connection
  ## per recipient, each with a YARILO preamble.
  lmtpLogin:
    enabled: false
    replicas: 1

    listeners:
      lmtp:
        enabled: true
        servicePort: 24
        containerPort: 10024

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address (set either this or director_addr).
    ## Typically "<release>-lmtp:<containerPort>" within the cluster.
    backend_addr: ""

    ## Director mode: per-recipient LOOKUP via yarilo-director (set either this or backend_addr).
    director_addr: ""
    ## director_tag restricts LOOKUP to backends with this tag. Empty = full ring.
    director_tag: ""
    ## backend_port overrides the port in the director LOOKUP result. 0 = use result as-is.
    backend_port: 0

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## ManageSieve backend — RFC 5804 Sieve script management (internal, port 14190).
  manageSieve:
    enabled: false
    replicas: 1

    listeners:
      managesieve:
        enabled: true
        servicePort: 14190
        containerPort: 14190

    internalTLS:
      enabled: false
      secretName: ""

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## ManageSieve login pod — RFC 5804 client-facing proxy (port 4190, STARTTLS).
  manageSieveLogin:
    enabled: false
    replicas: 1

    listeners:
      managesieve:
        enabled: true
        servicePort: 4190
        containerPort: 14190
        disablePlainAuth: false

    tls:
      secretName: ""

    internalTLS:
      enabled: false
      secretName: ""

    ## Standalone mode: fixed backend address.
    ## Typically "<release>-managesieve:<containerPort>" within the cluster.
    backend_addr: ""

    haproxy_protocol: false
    haproxy_timeout: 3
    haproxy_nets: []

    service:
      type: ClusterIP
      annotations: {}

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

## -------------------------------------------------------------------
## Protocol tuning
## -------------------------------------------------------------------
protocol:
  imap:
    imap_idle_notify_interval: 120
    imap_max_line_length: 65536
    imap_id_send: "name *"
    login_greeting: ""
    imap_logout_format: ""
    client_workarounds: []
    ## RFC 6154 SPECIAL-USE — map a folder name to a special-use attribute
    ## advertised in LIST replies. Operators can override per deployment;
    ## per-user CREATE (USE ...) takes precedence at runtime via the
    ## on-disk special_use file, per the
    ## namespace.mailbox.special_use convention.
    imap_special_use_defaults:
      Sent: "\\Sent"
      Drafts: "\\Drafts"
      Trash: "\\Trash"
      Junk: "\\Junk"
      Archive: "\\Archive"
  pop3:
    pop3_no_flag_updates: false
    pop3_reuse_xuidl: false
    pop3_uidl_format: "%u.%v"
    pop3_uidl_duplicates: rename
    pop3_enable_last: false
    pop3_delete_type: expunge
    pop3_deleted_flag: ""
    pop3_save_uidl: false     # persist computed UIDLs to index for stability across index rebuilds
    pop3_lock_session: false  # dotlock file in user home to prevent simultaneous IMAP+POP3 access

  lmtp:
    login_greeting: "Yarilo ready."
    add_received_header: true
    save_to_detail_mailbox: false
    hdr_delivery_address: final
    verbose_replies: false
    user_concurrency_limit: 10
    read_timeout: 300
    write_timeout: 300
    client_workarounds: []

  submission:
    hostname: ""
    max_message_size: 41943040
    max_line_length: 4096
    max_recipients: 0
    recipient_delimiter: "+"
    add_received_header: true
    client_workarounds: []
    relay:
      host: ""
      port: 25
      user: ""
      password: ""
      ssl: "no"
      ssl_verify: true
      trusted: false
      connect_timeout: 30
      command_timeout: 300

  managesieve:
    max_script_size: 65536
    max_invalid_commands: 3

## -------------------------------------------------------------------
## Sieve mail filtering
## -------------------------------------------------------------------
## Every key in this section carries the sieve_ prefix (matching the config
## koanf tags and Dovecot's verbatim setting names), even under `sieve:`.
sieve:
  sieve_enabled: false
  ## sieve_scripts_driver selects the script storage backend: "fs" (default, files
  ## in user home) or "redis" (dict backend, requires sieve_scripts_dict to
  ## reference an entry in dicts:). Use "redis" for multi-pod without shared NFS.
  sieve_scripts_driver: "fs"
  ## sieve_scripts_dict is the key in dicts: pointing to the dict instance used
  ## when sieve_scripts_driver is "redis". Ignored for "fs".
  sieve_scripts_dict: ""
  ## sieve_default_name is the reserved script name used as the active-pointer
  ## entry point. Default: "yarilo".
  sieve_default_name: "yarilo"
  sieve_max_script_size: 65536
  sieve_max_redirects: 32
  ## sieve_max_actions caps the total actions a single script may apply (fileinto,
  ## redirect, keep, ...). Guards runaway scripts. 0 = unlimited.
  sieve_max_actions: 32
  ## Max tracking period for the duplicate test, seconds (RFC 7352 §7 — a
  ## larger :seconds is silently clamped). 0 = no limit. Default 7 days.
  sieve_duplicate_max_period: 604800
  ## duplicate test (RFC 7352) backend:
  ##   file   — per-user file in the home dir (default; cross-pod on shared storage)
  ##   memory — per-process, single-pod only
  ##   redis  — the `sieve_duplicate` dict in dicts: (cross-pod)
  sieve_duplicate_driver: "file"
  ## Home-dir file name for sieve_duplicate_driver=file.
  sieve_duplicate_file: ".yarilo.sieve-duplicate"
  sieve_vacation_enabled: true
  ## spamtest / virustest (RFC 5235) status-header sources. Leave the header
  ## empty to keep the test unbacked (reports "not scanned"). The raw header
  ## value is normalised against the max_value onto the 0..10 (spam) / 0..5
  ## (virus) scale.
  sieve_spamtest_status_header: ""
  sieve_spamtest_max_value: 10
  sieve_virustest_status_header: ""
  sieve_virustest_max_value: 5
  ## User-Agent field written into ARF feedback reports (vnd.yarilo.report).
  sieve_report_user_agent: "yarilo"
  ## Outbound MTA for redirect / vacation actions.
  sieve_submission_host: ""
  sieve_submission_ssl: "no"
  sieve_submission_timeout: 30
  sieve_submission_auth_secret: ""
  ## sieve_global_before / sieve_global_after: ordered lists of absolute paths to
  ## .sieve files executed before / after each user's active script. Admin-defined.
  ## Files must be present on the pod filesystem (e.g. via ConfigMap volume mount).
  sieve_global_before: []
  sieve_global_after: []
  ## sieve_extensions is the whitelist of Sieve extensions users may declare with
  ## require. Corresponds to the sieve_extensions. Empty list = allow all
  ## (backwards-compatible). Operators who need enotify/include/extlists must add
  ## them explicitly.
  sieve_extensions:
    - fileinto
    - reject
    - ereject
    - envelope
    - encoded-character
    - variables
    - relational
    - subaddress
    - body
    - date
    - index
    - mailbox
    - duplicate
    - imap4flags
    - redirect
    - copy
    - vacation
    - environment
    - vnd.yarilo.debug
    - vnd.yarilo.environment
    - vnd.yarilo.pipe
    - vnd.yarilo.filter

  ## sieveEnvironment exposes operator-defined key-value pairs to Sieve scripts
  ## via the vnd.yarilo.environment extension as vnd.yarilo.config.<key> items.
  ## Corresponds to the sieve_environment setting.
  ## Example:
  ##   sieveEnvironment:
  ##     spam-folder: Junk
  ##     org-name: Acme Corp
  sieve_environment: {}

  ## vnd.yarilo.pipe — external program execution via Sieve scripts.
  ## Corresponds to the sieve_pipe_bin_dir / sieve_pipe_socket_dir /
  ## sieve_pipe_exec_timeout / sieve_pipe_input_eol settings.
  sieve_pipe_bin_dir: "/usr/lib/yarilo/sieve-pipe"
  sieve_pipe_socket_dir: "sieve-pipe"
  sieve_pipe_exec_timeout: 10
  sieve_pipe_input_eol: "crlf"

  ## vnd.yarilo.filter — message filtering via external programs.
  ## Programs receive the message on stdin; non-empty stdout replaces the message.
  ## Empty stdout or non-zero exit = pass-through (message unchanged).
  ## Corresponds to the sieve_filter_bin_dir / sieve_filter_socket_dir /
  ## sieve_filter_exec_timeout / sieve_filter_input_eol settings.
  sieve_filter_bin_dir: "/usr/lib/yarilo/sieve-filter"
  sieve_filter_socket_dir: "sieve-filter"
  sieve_filter_exec_timeout: 10
  sieve_filter_input_eol: "crlf"

  ## vnd.yarilo.execute — run programs and capture output into Sieve variables.
  ## Corresponds to the sieve_execute_bin_dir / sieve_execute_socket_dir /
  ## sieve_execute_exec_timeout / sieve_execute_input_eol settings.
  sieve_execute_bin_dir: "/usr/lib/yarilo/sieve-execute"
  sieve_execute_socket_dir: "sieve-execute"
  sieve_execute_exec_timeout: 10
  sieve_execute_input_eol: "crlf"

## -------------------------------------------------------------------
## General infrastructure
## -------------------------------------------------------------------
general:
  ## startupDialRetries — number of dial attempts (with exponential backoff)
  ## when connecting to external dependencies at startup (anvil, Redis).
  ## Prevents permanent loss of functionality on rolling restarts when a
  ## dependency pod is not yet ready. Default 3.
  startup_dial_retries: 3

  limits:
    ## Maximum simultaneous IMAP/POP3 connections from a single IP address.
    max_user_ip_connections: 10

  ## HAProxy PROXY protocol v1/v2 support.
  ## Enable when an upstream load balancer (HAProxy, nginx, AWS NLB with proxy_protocol)
  ## sits in front of the director and forwards the real client IP in the PROXY header.
  ## The director reads the header before TLS handshake; conn.RemoteAddr() always reflects
  ## the real client IP after this point.
  ##
  ## haproxy_protocol must also be enabled per-listener (services.imaps.haproxy_protocol etc.)
  ## in the generated config — the global enabled flag controls all listeners at once.
  ##
  ## trustedNets: CIDRs of load balancers allowed to send PROXY headers.
  ##              Connections from untrusted IPs have the header silently ignored.
  ## timeout:     Seconds to wait for the PROXY header before rejecting the connection.
  haproxy:
    enabled: false
    trusted_nets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"
    timeout: 3

  ## XCLIENT forwarding support.
  ## When enabled, the director sends an XCLIENT ADDR=<real-ip> command to the backend
  ## (yarilo-imap / yarilo-pop3 / yarilo-lmtp) immediately after connecting, so the
  ## backend session sees the real client IP instead of the director's pod IP.
  ##
  ## Requires the backend to trust the director's pod CIDR in its own xclient.trusted_nets.
  ## The director itself does not check trusted_nets for outgoing XCLIENT — trusted_nets here
  ## is written into the backend config so it knows which sources to accept XCLIENT from.
  xclient:
    enabled: false
    trusted_nets:
      - "127.0.0.1/32"
      - "10.0.0.0/8"

## -------------------------------------------------------------------
## Redis — state backend for yarilo-locks (and future yarilo-anvil).
## -------------------------------------------------------------------
## Bundled (default): a StatefulSet runs in the release, single-replica
## for single-node clusters. For prod HA either bump replicas + run
## Sentinel/Cluster externally and point at it via externalUrl.
##
## bundled: false disables the StatefulSet + Service templates;
## externalUrl is then required.
redis:
  bundled: true
  replicas: 1
  ## image — pulled from the public Redis library on Docker Hub by default.
  image:
    repository: redis
    tag: "8.8"
    pullPolicy: IfNotPresent
  ## persistent volume claim for AOF + dump; required for restart safety.
  persistence:
    size: 1Gi
  storageClass: ""

  ## External Redis (used when bundled: false). Standard go-redis URL.
  ## Examples:
  ##   redis://my-redis.prod.svc:6379/0
  ##   rediss://master.cache.amazonaws.com:6379/0
  externalUrl: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

## -------------------------------------------------------------------
## Database — external SQL passdb/userdb backend.
##
## yarilo does NOT bundle a database. Deploy MySQL or PostgreSQL
## separately (see hack/db/) and point yarilo at it via one of:
##
##   Option A — reference an existing Kubernetes Secret:
##     database:
##       secretName: yarilo-db-creds   # Secret in the same namespace
##       secretKey: dsn                # key holding the DSN string
##       initAddr: "yarilo-mysql.db.svc:3306"
##
##   Option B — literal DSN (dev/test only; avoid in production):
##     database:
##       dsn: "user:pass@tcp(host:3306)/dbname?parseTime=true&charset=utf8mb4"
##       initAddr: "host:3306"
##
##   Option C — no SQL passdb (SQLite or file-based):
##     Leave all fields empty and configure components.auth.passdb[] directly.
##
## The DSN is injected as YARILO_DB_DSN into every session component.
## Reference it in passdb config (default in values.yaml):
##   components.auth.passdb:
##     - driver: mysql
##       dsn: "${YARILO_DB_DSN}"
## -------------------------------------------------------------------
database:
  ## Kubernetes Secret name containing the DSN (recommended).
  secretName: ""
  ## Key inside the Secret that holds the DSN string.
  secretKey: "dsn"
  ## Literal DSN — used only when secretName is empty.
  dsn: ""
  ## TCP probe address for init-containers. Format: "host:port".
  ## Example: "yarilo-mysql.db.svc:3306"
  initAddr: ""

## -------------------------------------------------------------------
## Telemetry (:8080 per component pod)
## -------------------------------------------------------------------
telemetry:
  listen: ":8080"
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

## -------------------------------------------------------------------
## Shared scheduling / security
## -------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /healthz
    port: telemetry
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: telemetry
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]

logLevel: info

## initContainerImage — image used by dependency-wait init containers.
## Must include busybox-compatible `nc` (netcat). Default: busybox:1.36.
initContainerImage: "busybox:1.36"

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# Named dicts (pkg/dict). Yarilo features (metadata, quota counters, ACL state)
# look these up by name. Each entry picks a driver (file|redis|sql|memory|fail)
# and configures it via driver-specific `settings`. See docs/DICT.md for the
# full reference per driver. The same template renders into yarilo.yaml.
#
# Standalone single-pod default uses file driver on the local PVC.
# Backend multi-pod helm release should override with redis or sql to share
# state across replicas.
# IMAP namespaces (RFC 2342 / RFC 9051 §6.3.10).
#
# When omitted (default), yarilo runs as personal-only — backwards-
# compatible with pre-v1.20 deployments.
#
# When you declare Shared/Public namespaces, yarilo opens an
# additional storage handle per namespace and routes SELECT/APPEND/
# COPY/MOVE/SUBSCRIBE/etc to the right backend based on the prefix.
# IMPORTANT (pre-ACL-1): with Shared/Public configured, **any
# authenticated user reads and writes everything under them**.
# Treat as cooperative-trust until ACL-1 lands.
#
# Storage roots referenced by `location:` are the operator's
# responsibility — mount the PV (NFS/CephFS RWX in multi-pod
# deployments) at the chosen path; yarilo creates the per-folder
# maildir tree on the first CREATE / APPEND. Do NOT point shared
# locations at per-user storage paths.
#
# See docs/NAMESPACE.md for full schema, separator semantics,
# METADATA priv/ per-accessing-user behaviour and the post-NS-1b
# roadmap (ACL-1, NS-3 cross-pod routing, QUOTA-1 owner-paid).
## RFC 4314 server-side ACL — GETACL / SETACL / DELETEACL / MYRIGHTS
## / LISTRIGHTS plus enforcement on SELECT / APPEND / COPY / MOVE
## / STORE / EXPUNGE / CREATE / DELETE / RENAME / STATUS. Storage
## is a per-mailbox `yarilo-acl` file alongside each folder's
## `yarilo.index*`; a namespace-wide `yarilo-acl-list` index
## mirrors which mailboxes have an explicit ACL for LIST
## optimisation. Admin surface lives at
## `yarilo-backend-api /api/backend/acl/*` and `yarilo-admin
## backend acl <command>`. When disabled, every ACL command
## returns NO("ACL extension disabled by operator") and ACL is
## absent from the CAPABILITY response.
acl:
  enabled: false
  ## Root-level default ACLs resolve from INBOX's ACL for private and
  ## shared namespaces. This is the maildir answer to the namespace
  ## root == INBOX collision, where the local folder-"" default is
  ## unavailable: INBOX's ACL becomes the default for sibling folders
  ## that have no ACL of their own. Corresponds to
  ## acl_defaults_from_inbox.
  defaults_from_inbox: false
  ## Evaluate only the global ACL rules below and ignore the per-mailbox
  ## yarilo-acl files. Useful for centrally-administered installs.
  globals_only: false
  ## Operator-configured global ACL rules, applied across all users and
  ## merged with each mailbox's own ACL (global takes precedence: global
  ## grants add, global negatives revoke, and a matching global entry
  ## resets local negatives). Each rule targets a mailbox name or "*" for
  ## every mailbox. A leading "-" on rights marks a negative entry.
  ## Identifiers: anyone | authenticated | owner | user=<name> |
  ## group=<name> | group-override=<name>.
  global: []
  #   - mailbox: "*"
  #     entries:
  #       - { identifier: "user=admin@example.com", rights: "lrswipkxtea" }
  #       - { identifier: "anyone",                  rights: "-lr" }
  #   - mailbox: "Public/News"
  #     entries:
  #       - { identifier: "anyone", rights: "lr" }

namespaces: []
#   - type: personal              # personal | other | shared
#     prefix: ""                  # mailbox name prefix; "" reserved for personal
#     separator: "."              # one char; default "." (maildir++). dbox/fs
#                                 # deployments typically use "/". Each backend
#                                 # converts it to its on-disk layout (maildir
#                                 # flat ".A.B", dbox nested "mailboxes/A/B").
#     list: true                  # show in NAMESPACE response
#     subscriptions: true
#     inbox: true                 # owns the magic "INBOX" (set on exactly one)
#     # personal inherits storage from cfg.Storage.MailHomeTemplate;
#     # leave `location:` unset.
#   - type: shared
#     prefix: "Shared/"
#     separator: "."
#     list: true
#     acl_ignore: false           # true = bypass ACL enforcement for this ns
#                                 # (rights not checked, no lookup-right hiding)
#     # Absolute path; mount a PV here in multi-pod deployments.
#     location: "maildir:/var/yarilo/shared"
#   - type: other                 # Other Users — declared-only until ACL-1 + NS-3
#     prefix: "user/"
#     separator: "/"
#     list: true

dicts:
  # IMAP METADATA (RFC 5464) state. When omitted, GETMETADATA /
  # SETMETADATA respond NO "Metadata storage not configured" but the
  # rest of the server still works. file driver is fine for standalone
  # single-pod releases; switch to redis or sql for backend multi-pod.
  metadata:
    driver: file
    settings:
      path: /var/yarilo/dicts/metadata.json
#   quota:
#     driver: redis
#     settings:
#       addr: yarilo-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
#       db: 0
#       prefix: "yarilo:quota:"
#     expire_secs: 86400
#   # Optional: vacation dedup tracking (sieve vacation extension).
#   # Scripts are stored on the filesystem; this dict is only for vacation dedup.
#   sieve_vacation:
#     driver: redis
#     settings:
#       addr: yarilo-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
#       db: 0
#       prefix: "yarilo:sieve:vacation:%u:"
#   # Optional: duplicate-test dedup (RFC 7352). driver=redis makes the dedup
#   # window cross-pod; omit (or driver=memory) for per-process behaviour.
#   sieve_duplicate:
#     driver: redis
#     settings:
#       addr: yarilo-redis.{{ .Release.Namespace }}.svc.cluster.local:6379
#       db: 0
#       prefix: "yarilo:sieve:duplicate:%u:"