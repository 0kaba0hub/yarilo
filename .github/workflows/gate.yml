name: Gate — lint and test

## The single gate both branch pipelines run. One copy, because two copies of a
## gate drift, and the day they differ is the day something merges into one
## branch that the other would have refused.
on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ## The one list of paths that decide whether this gate has anything to do.
  ##
  ## It used to be a `paths:` filter on each caller's pull_request trigger,
  ## which meant a docs-only PR started no run at all -- fine while nothing was
  ## required, and a permanent "expected" that can never arrive once Lint and
  ## Test are required checks. A skipped job counts as passed, a job that never
  ## starts does not.
  ##
  ## So the filter moved here, where both lines read it instead of keeping two
  ## copies that agree by inspection.
  changes:
    name: Changes
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Does this change any code
        id: check
        run: |
          # A push has already been filtered by the caller's own paths, and a
          # manual run is asked for deliberately: only a pull request has a
          # base to compare against.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "${BASE}...${GITHUB_SHA}")
          echo "changed files:"
          echo "${CHANGED}"
          if echo "${CHANGED}" | grep -qE '^(app/|helm/|internal/|pkg/|go\.mod$|go\.sum$|docker/Dockerfile$|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no code paths touched; lint and test are skipped, which satisfies them as required checks"
          fi

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          ## The runners are self-hosted and keep GOCACHE/GOMODCACHE on local
          ## disk between jobs, so Go already reuses both build artefacts and
          ## test results. setup-go's own cache duplicates that through the
          ## GitHub cache service: measured on run 30441836747 it moved ~1.85 GB
          ## per job, costing 8m05s to restore and 2m02s to save while the tests
          ## themselves took 12s. Disabling it leaves the local cache as the only
          ## one, which is the one that actually works here.
          cache: false

      ## Pinned, and only rebuilt when the pin changes: `@latest` recompiled the
      ## linter on every run and silently changed the ruleset under us, so a
      ## green PR could go red on merge without a code change. v1 is required —
      ## .golangci.yml is v1 format (it enables `gosimple`, which v2 folded into
      ## staticcheck), so bumping to v2 needs a config migration first.
      - name: Install golangci-lint
        run: |
          want=v1.64.8
          have=$(golangci-lint version 2>/dev/null | grep -oE 'version v?[0-9.]+' | grep -oE '[0-9.]+' || true)
          if [ "v${have}" != "$want" ]; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@$want
          fi

      - name: Run golangci-lint
        run: golangci-lint run ./...

      ## On every gate run, not on a clock: Trivy asks what CVEs exist in an
      ## image, which changes when a CVE is published; this asks whether our
      ## code calls one, which changes when we write a call.
      ##
      ## Twice, because the image is built with -tags flatcurve: an untagged
      ## scan leaves the cgo/xapian branch and everything it imports out of the
      ## call graph, so it would not be about what we ship (#1497).
      ## go vet, both tag sets, because the linter does not run these checks
      ## and CI did not run vet at all: six addresses built with "%s:%d" and
      ## handed to net.Dial -- which silently dials elsewhere for an IPv6
      ## literal -- sat there until someone typed the command by hand (#1508).
      ##
      ## Both sets for the same reason govulncheck runs twice: one of the six
      ## was only visible under -tags flatcurve, and it was the relay dial.
      - name: Run go vet
        run: |
          go vet ./...
          if ! dpkg -s libxapian-dev >/dev/null 2>&1 || ! command -v g++ >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxapian-dev g++
          fi
          CGO_ENABLED=1 go vet -tags flatcurve ./...

      # Lines in blocks of three or more, against the package's Go lines --
      # exactly what the sweep removes, and not godoc, which it keeps. The
      # baseline records what each unswept package holds today; a swept one
      # leaves it and the 8% threshold alone holds it, so a new essay fails
      # here instead of waiting for the next sweep (#1620).
      - name: Check the comment share
        run: go run ./hack/commentcensus -check

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          if ! dpkg -s libxapian-dev >/dev/null 2>&1 || ! command -v g++ >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxapian-dev g++
          fi
          CGO_ENABLED=1 govulncheck -tags flatcurve ./...

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          ## Pinned so `helm lint` cannot start failing on a chart that did not
          ## change.
          version: v3.19.0

      - name: Lint Helm chart
        run: helm lint helm

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          ## The runners are self-hosted and keep GOCACHE/GOMODCACHE on local
          ## disk between jobs, so Go already reuses both build artefacts and
          ## test results. setup-go's own cache duplicates that through the
          ## GitHub cache service: measured on run 30441836747 it moved ~1.85 GB
          ## per job, costing 8m05s to restore and 2m02s to save while the tests
          ## themselves took 12s. Disabling it leaves the local cache as the only
          ## one, which is the one that actually works here.
          cache: false

      - name: Install go-junit-report
        run: |
          command -v go-junit-report >/dev/null || \
            go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run tests
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee /tmp/test-output.log | go-junit-report -set-exit-code > /tmp/test-results.xml

      ## Storage and IMAP under the race detector. Not the whole tree: these are
      ## the packages where a handle is shared between goroutines, and the plain
      ## run above cannot see a data race at all -- a test asserting that a
      ## cache is safe passed for a day while the fields inside it were
      ## unguarded (#1626). Half a minute of runner time buys the only check
      ## that can fail on it.
      - name: Run storage and IMAP tests under the race detector
        run: go test -race -count=1 ./internal/storage/... ./internal/imap/...

      ## The flatcurve FTS engine is cgo + libxapian and only builds with the
      ## "flatcurve" tag; the runner installs libxapian-dev / g++ on demand.
      ## CGO_ENABLED=1 is explicit: without a C toolchain Go silently drops
      ## the cgo files and the build fails with undefined symbols.
      - name: Run flatcurve engine tests
        run: |
          if ! dpkg -s libxapian-dev >/dev/null 2>&1 || ! command -v g++ >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxapian-dev g++
          fi
          CGO_ENABLED=1 go test -tags flatcurve ./internal/fts/flatcurve/ ./internal/ftsservice/ ./internal/ftsbench/

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Go Tests
          path: /tmp/test-results.xml
          reporter: java-junit

      - name: Upload raw test output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-test-output
          path: /tmp/test-output.log
          retention-days: 14

