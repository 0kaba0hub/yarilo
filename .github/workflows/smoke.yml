name: Smoke test — yarilo

on:
  workflow_dispatch:
    inputs:
      host:
        description: "yarilo hostname"
        required: true
      imap_port:
        description: "IMAPS port"
        default: "993"
      pop3s_port:
        description: "POP3S port (leave empty to skip)"
        default: ""
      telemetry_url:
        description: "Telemetry base URL (e.g. http://10.0.0.1:8080)"
        required: true
      insecure:
        description: "Skip TLS cert verification (true/false)"
        default: "false"

  workflow_call:
    inputs:
      host:
        type: string
        required: true
      imap_port:
        type: string
        default: "993"
      pop3s_port:
        type: string
        default: ""
      telemetry_url:
        type: string
        required: true
      insecure:
        type: string
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build smoketest
        run: go build -o /tmp/smoketest ./app/smoketest

      - name: Run smoke checks
        run: |
          POP3S_FLAGS=""
          if [ -n "${{ inputs.pop3s_port }}" ]; then
            POP3S_FLAGS="-pop3s -pop3s-port ${{ inputs.pop3s_port }}"
          fi
          /tmp/smoketest \
            -host "${{ inputs.host }}" \
            -telemetry "${{ inputs.telemetry_url }}" \
            -insecure="${{ inputs.insecure }}" \
            -timeout 15s \
            $POP3S_FLAGS

      - name: Run imaptest
        run: |
          docker run --rm dovecot/imaptest \
            host="${{ inputs.host }}" \
            port="${{ inputs.imap_port }}" \
            ssl=yes \
            user="${{ secrets.SMOKE_IMAP_USER }}" \
            pass="${{ secrets.SMOKE_IMAP_PASS }}" \
            no_pipelining=yes \
            clients=1 \
            count=5
