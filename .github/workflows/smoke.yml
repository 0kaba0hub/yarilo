name: Smoke test — yarilo

on:
  workflow_dispatch:
    inputs:
      host:
        description: "yarilo hostname"
        required: true
      imap_port:
        description: "IMAPS port"
        default: "993"
      pop3s_port:
        description: "POP3S port (leave empty to skip)"
        default: ""
      telemetry_url:
        description: "Telemetry base URL (e.g. http://10.0.0.1:8080)"
        required: true
      insecure:
        description: "Skip TLS cert verification (true/false)"
        default: "false"
      director_api:
        description: "Director admin API base URL (#755, e.g. http://10.0.0.1:9103); leave empty to skip. Only reachable from an in-cluster/port-forwarded runner."
        default: ""

  workflow_call:
    inputs:
      host:
        type: string
        required: true
      imap_port:
        type: string
        default: "993"
      pop3s_port:
        type: string
        default: ""
      telemetry_url:
        type: string
        required: true
      insecure:
        type: string
        default: "false"
      director_api:
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build smoketest
        run: go build -o /tmp/smoketest ./app/smoketest

      - name: Run smoke checks
        env:
          SMOKE_IMAP_USER: ${{ vars.SMOKE_IMAP_USER }}
          SMOKE_IMAP_PASS: ${{ secrets.SMOKE_IMAP_PASS }}
          SMOKE_QUOTA_OVER_USER: ${{ vars.SMOKE_QUOTA_OVER_USER }}
          SMOKE_QUOTA_OVER_PASS: ${{ secrets.SMOKE_QUOTA_OVER_PASS }}
          DIRECTOR_API_TOKEN: ${{ secrets.SMOKE_DIRECTOR_API_TOKEN }}
          SMOKE_ACL_PEER_USER: ${{ vars.SMOKE_ACL_PEER_USER }}
          SMOKE_ACL_PEER_PASS: ${{ secrets.SMOKE_ACL_PEER_PASS }}
          SMOKE_ACL_SHARED_PREFIX: ${{ vars.SMOKE_ACL_SHARED_PREFIX }}
        run: |
          POP3S_FLAGS=""
          if [ -n "${{ inputs.pop3s_port }}" ]; then
            POP3S_FLAGS="-pop3s -pop3s-port ${{ inputs.pop3s_port }}"
          fi
          # Director admin API check (#755): only when a URL is provided —
          # the API is a ClusterIP, reachable only from an in-cluster or
          # port-forwarded runner. Token comes from the secret env above.
          DIRECTOR_FLAGS=""
          if [ -n "${{ inputs.director_api }}" ]; then
            DIRECTOR_FLAGS="-director-api ${{ inputs.director_api }}"
          fi
          # QUOTA + ACL checks reuse the imap login user when it is configured.
          QUOTA_ACL_FLAGS=""
          if [ -n "$SMOKE_IMAP_USER" ]; then
            QUOTA_ACL_FLAGS="-quota-user $SMOKE_IMAP_USER -quota-pass $SMOKE_IMAP_PASS -acl-user $SMOKE_IMAP_USER -acl-pass $SMOKE_IMAP_PASS"
          fi
          # The shared-namespace disclosure matrix needs a second account and a
          # namespace both can name; it stays off until both are configured.
          if [ -n "$SMOKE_ACL_PEER_USER" ] && [ -n "$SMOKE_ACL_SHARED_PREFIX" ]; then
            QUOTA_ACL_FLAGS="$QUOTA_ACL_FLAGS -acl-peer-user $SMOKE_ACL_PEER_USER -acl-peer-pass $SMOKE_ACL_PEER_PASS -acl-shared-prefix $SMOKE_ACL_SHARED_PREFIX"
          fi
          # FETCH (ENVELOPE BODYSTRUCTURE) on the login user's OWN INBOX. It
          # reuses that account deliberately: the value of this check is that
          # the mailbox is long-lived, not created by the run, since a fresh
          # one carries current index extensions and takes a different path
          # (#1184). Run the workflow once per mailbox format to cover all
          # three.
          ENVELOPE_FLAGS=""
          if [ -n "$SMOKE_IMAP_USER" ]; then
            ENVELOPE_FLAGS="-envelope-user $SMOKE_IMAP_USER -envelope-pass $SMOKE_IMAP_PASS"
          fi
          # Enforcement check only runs when a dedicated over-quota user is set.
          if [ -n "$SMOKE_QUOTA_OVER_USER" ]; then
            QUOTA_ACL_FLAGS="$QUOTA_ACL_FLAGS -quota-over-user $SMOKE_QUOTA_OVER_USER -quota-over-pass $SMOKE_QUOTA_OVER_PASS"
          fi
          /tmp/smoketest \
            -host "${{ inputs.host }}" \
            -imap-port "${{ inputs.imap_port }}" \
            -telemetry "${{ inputs.telemetry_url }}" \
            -insecure="${{ inputs.insecure }}" \
            -timeout 15s \
            $POP3S_FLAGS $QUOTA_ACL_FLAGS $ENVELOPE_FLAGS $DIRECTOR_FLAGS

      - name: Run imaptest
        run: |
          docker run --rm dovecot/imaptest \
            host="${{ inputs.host }}" \
            port="${{ inputs.imap_port }}" \
            ssl=yes \
            user="${{ vars.SMOKE_IMAP_USER }}" \
            pass="${{ secrets.SMOKE_IMAP_PASS }}" \
            no_pipelining=yes \
            clients=1 \
            count=5
