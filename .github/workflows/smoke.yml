name: Smoke test — yarilo

on:
  workflow_dispatch:
    inputs:
      host:
        description: "yarilo hostname"
        required: true
      imap_port:
        description: "IMAPS port"
        default: "993"
      pop3s_port:
        description: "POP3S port (leave empty to skip)"
        default: ""
      telemetry_url:
        description: "Telemetry base URL (e.g. http://10.0.0.1:8080)"
        required: true
      insecure:
        description: "Skip TLS cert verification (true/false)"
        default: "false"
      namespace:
        description: "k8s namespace to read smoke-creds secret from"
        default: "yarilo-sb"

  workflow_call:
    inputs:
      host:
        type: string
        required: true
      imap_port:
        type: string
        default: "993"
      pop3s_port:
        type: string
        default: ""
      telemetry_url:
        type: string
        required: true
      insecure:
        type: string
        default: "false"
      namespace:
        type: string
        default: "yarilo-sb"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_SANDBOX }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Read IMAP credentials from k8s secret
        run: |
          IMAP_USER=$(kubectl get secret yarilo-smoke-creds \
            -n "${{ inputs.namespace }}" \
            -o jsonpath='{.data.user}' | base64 -d)
          IMAP_PASS=$(kubectl get secret yarilo-smoke-creds \
            -n "${{ inputs.namespace }}" \
            -o jsonpath='{.data.password}' | base64 -d)
          echo "IMAP_USER=$IMAP_USER" >> $GITHUB_ENV
          echo "::add-mask::$IMAP_PASS"
          echo "IMAP_PASS=$IMAP_PASS" >> $GITHUB_ENV

      - name: Build smoketest
        run: go build -o /tmp/smoketest ./app/smoketest

      - name: Run smoke checks
        run: |
          POP3S_FLAGS=""
          if [ -n "${{ inputs.pop3s_port }}" ]; then
            POP3S_FLAGS="-pop3s -pop3s-port ${{ inputs.pop3s_port }}"
          fi
          /tmp/smoketest \
            -host "${{ inputs.host }}" \
            -telemetry "${{ inputs.telemetry_url }}" \
            -insecure="${{ inputs.insecure }}" \
            -timeout 15s \
            $POP3S_FLAGS

      - name: Run imaptest
        run: |
          docker run --rm dovecot/imaptest \
            host="${{ inputs.host }}" \
            port="${{ inputs.imap_port }}" \
            ssl=yes \
            user="$IMAP_USER" \
            pass="$IMAP_PASS" \
            no_pipelining=yes \
            clients=1 \
            count=5
