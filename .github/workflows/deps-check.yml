name: Deps check — yarilo

on:
  schedule:
    - cron: "0 9 * * 1"  # every Monday at 09:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check Go dependency updates
    runs-on: ubuntu-24.04
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check for updates
        id: check
        run: |
          # "all" reaches the TEST dependencies of our dependencies -- modules
          # that are in the graph, are never built into anything we ship, and
          # cannot be updated by the command this job then suggests. That noise
          # is what made the first issue unactionable (#1447).
          #
          # -deps -test ./... is the honest set: what our binaries import, plus
          # what OUR tests import. Someone else's test dependency is theirs.
          MODS=$(go list -deps -test -f '{{with .Module}}{{.Path}}{{end}}' ./... \
            | sort -u | grep -v '^$' | grep -v '^github.com/yarilomail/yarilo$')
          if [ -z "$MODS" ]; then
            echo "::error::could not list module dependencies; refusing to report 'no updates' from a check that checked nothing"
            exit 1
          fi
          echo "checking $(echo "$MODS" | wc -l) modules"
          UPDATES=$(go list -m -u $MODS 2>/dev/null | grep '\[' || true)
          if [ -z "$UPDATES" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            {
              echo "updates<<EOF"
              echo "$UPDATES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue if updates available
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const updates = `${{ steps.check.outputs.updates }}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies'
            });
            const alreadyOpen = existing.data.some(i => i.title === 'Go dependency updates available');
            if (alreadyOpen) {
              core.info('Issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Go dependency updates available',
              labels: ['dependencies'],
              body: `The following Go modules have newer versions available:\n\n\`\`\`\n${updates}\n\`\`\`\n\nTo update one, run:\n\`\`\`sh\ngo get <module>@latest && go mod tidy\n\`\`\`\n\nOnly modules yarilo builds or tests with are listed; test dependencies of dependencies are not ours to bump.`
            });
