name: CI — yarilo

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "helm/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "helm/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"

## Cancel superseded runs on the same ref. PR pushes supersede each other, so
## an in-flight run for an older commit is wasted work. Runs on main are never
## cancelled: build/push and the release it triggers must complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/yarilo
  DOCKERHUB_IMAGE: docker.io/0kaba0/yarilo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    # TEMPORARY: both org self-hosted runners are online but not dispatching jobs
    # (GitHub-side broker issue, not ours). Revert to [self-hosted, linux] once
    # dispatch resumes -- ubuntu-24.04 is slower and burns included Actions minutes.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          ## The runners are self-hosted and keep GOCACHE/GOMODCACHE on local
          ## disk between jobs, so Go already reuses both build artefacts and
          ## test results. setup-go's own cache duplicates that through the
          ## GitHub cache service: measured on run 30441836747 it moved ~1.85 GB
          ## per job, costing 8m05s to restore and 2m02s to save while the tests
          ## themselves took 12s. Disabling it leaves the local cache as the only
          ## one, which is the one that actually works here.
          cache: false

      ## Pinned, and only rebuilt when the pin changes: `@latest` recompiled the
      ## linter on every run and silently changed the ruleset under us, so a
      ## green PR could go red on merge without a code change. v1 is required —
      ## .golangci.yml is v1 format (it enables `gosimple`, which v2 folded into
      ## staticcheck), so bumping to v2 needs a config migration first.
      - name: Install golangci-lint
        run: |
          want=v1.64.8
          have=$(golangci-lint version 2>/dev/null | grep -oE 'version v?[0-9.]+' | grep -oE '[0-9.]+' || true)
          if [ "v${have}" != "$want" ]; then
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@$want
          fi

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: docker/Dockerfile

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          ## Pinned so `helm lint` cannot start failing on a chart that did not
          ## change.
          version: v3.19.0

      - name: Lint Helm chart
        run: helm lint helm

  test:
    name: Test
    # TEMPORARY: both org self-hosted runners are online but not dispatching jobs
    # (GitHub-side broker issue, not ours). Revert to [self-hosted, linux] once
    # dispatch resumes -- ubuntu-24.04 is slower and burns included Actions minutes.
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          ## The runners are self-hosted and keep GOCACHE/GOMODCACHE on local
          ## disk between jobs, so Go already reuses both build artefacts and
          ## test results. setup-go's own cache duplicates that through the
          ## GitHub cache service: measured on run 30441836747 it moved ~1.85 GB
          ## per job, costing 8m05s to restore and 2m02s to save while the tests
          ## themselves took 12s. Disabling it leaves the local cache as the only
          ## one, which is the one that actually works here.
          cache: false

      - name: Install go-junit-report
        run: |
          command -v go-junit-report >/dev/null || \
            go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run tests
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee /tmp/test-output.log | go-junit-report -set-exit-code > /tmp/test-results.xml

      ## The flatcurve FTS engine is cgo + libxapian and only builds with the
      ## "flatcurve" tag; the runner installs libxapian-dev / g++ on demand.
      ## CGO_ENABLED=1 is explicit: without a C toolchain Go silently drops
      ## the cgo files and the build fails with undefined symbols.
      - name: Run flatcurve engine tests
        run: |
          if ! dpkg -s libxapian-dev >/dev/null 2>&1 || ! command -v g++ >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxapian-dev g++
          fi
          CGO_ENABLED=1 go test -tags flatcurve ./internal/fts/flatcurve/ ./internal/ftsservice/ ./internal/ftsbench/

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Go Tests
          path: /tmp/test-results.xml
          reporter: java-junit

      - name: Upload raw test output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-test-output
          path: /tmp/test-output.log
          retention-days: 14

  build:
    name: Build & Push
    if: github.event_name == 'push'
    needs: [lint, test]
    # TEMPORARY: both org self-hosted runners are online but not dispatching jobs
    # (GitHub-side broker issue, not ours). Revert to [self-hosted, linux] once
    # dispatch resumes -- ubuntu-24.04 is slower and burns included Actions minutes.
    runs-on: ubuntu-24.04
    concurrency:
      group: build-main-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/, ""); print $2}' helm/Chart.yaml)
          RELEASE_TAG="v${APP_VERSION}"
          # The release, not the tag, decides whether there is work left. The
          # tag is pushed one step before the release is created, so a failure
          # between the two used to leave a state the pipeline could never
          # reach again: the tag existed, so every re-run answered "already
          # released" and skipped the step that had failed, reporting success
          # over a missing release (#1331).
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_RELEASE=false
          else
            IS_RELEASE=true
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
        with:
          # TEMPORARY, tied to the ubuntu-24.04 runs-on override above: the
          # docker driver needs the containerd image store to export a GHA
          # cache (self-hosted has it enabled; the hosted runner's default
          # docker daemon does not), and nothing after this step reaches into
          # the local image store, so docker-container is a safe swap. Revert
          # together with the runs-on lines once self-hosted dispatch resumes.
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: 0kaba0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ steps.version.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.image_tag }}

      - name: Generate release notes
        if: steps.version.outputs.is_release == 'true'
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Push git tag
        if: steps.version.outputs.is_release == 'true'
        run: |
          # Tolerates a tag left behind by an earlier attempt: on a re-run the
          # tag is already there and pointing at this same commit, and failing
          # here would strand the release again.
          TAG="${{ steps.version.outputs.tag }}"
          if EXISTING=$(git ls-remote --exit-code --tags origin "refs/tags/${TAG}" 2>/dev/null); then
            EXISTING_SHA=$(echo "$EXISTING" | cut -f1)
            if [ "${EXISTING_SHA}" != "${GITHUB_SHA}" ]; then
              echo "::error::${TAG} already points at ${EXISTING_SHA}, not ${GITHUB_SHA} -- refusing to move a published tag"
              exit 1
            fi
            echo "::notice::${TAG} already exists at this commit; continuing to the release"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md

      - name: Cleanup old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: yarilo
          package-type: container
          min-versions-to-keep: 16
          ignore-versions: '^\d+\.\d+\.\d+$'
          token: ${{ secrets.GITHUB_TOKEN }}
