name: CI — yarilo

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "helm/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "helm/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "docker/Dockerfile"
      ## A change to the pipeline is validated by the pipeline. Without this a
      ## PR that rewrites how the gate is assembled gets no checks at all, and
      ## the first thing to exercise it is whatever merges next.
      - ".github/workflows/**"

## Cancel superseded runs on the same ref. PR pushes supersede each other, so
## an in-flight run for an older commit is wasted work. Runs on main are never
## cancelled: build/push and the release it triggers must complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/yarilo
  DOCKERHUB_IMAGE: docker.io/0kaba0/yarilo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ## Lint and test live in gate.yml so that this pipeline and the develop one
  ## run the same gate rather than two copies of it.
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    name: Build & Push
    if: github.event_name == 'push'
    needs: [gate]
    runs-on: [self-hosted, linux]
    concurrency:
      group: build-main-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/, ""); print $2}' helm/Chart.yaml)
          RELEASE_TAG="v${APP_VERSION}"
          # The release, not the tag, decides whether there is work left. The
          # tag is pushed one step before the release is created, so a failure
          # between the two used to leave a state the pipeline could never
          # reach again: the tag existed, so every re-run answered "already
          # released" and skipped the step that had failed, reporting success
          # over a missing release (#1331).
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_RELEASE=false
          else
            IS_RELEASE=true
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          # The self-hosted runner's docker daemon persists between runs, same
          # as GOCACHE/GOMODCACHE above, so the classic docker driver already
          # reuses layers from its own local build cache with no export step
          # and no per-run trip to the GitHub Actions cache API -- see the
          # dropped cache-from/cache-to below.
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: 0kaba0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.image_tag }},enable=${{ steps.version.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache-from/cache-to: the docker driver above already reuses
          # this runner's own layer cache locally. An explicit GHA cache
          # export would only add a network round-trip this runner does not
          # need, and it requires the containerd image store to be enabled on
          # the daemon in the first place -- a setting outside this file.
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.image_tag }}

      - name: Generate release notes
        if: steps.version.outputs.is_release == 'true'
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Push git tag
        if: steps.version.outputs.is_release == 'true'
        run: |
          # Tolerates a tag left behind by an earlier attempt: on a re-run the
          # tag is already there and pointing at this same commit, and failing
          # here would strand the release again.
          TAG="${{ steps.version.outputs.tag }}"
          if EXISTING=$(git ls-remote --exit-code --tags origin "refs/tags/${TAG}" 2>/dev/null); then
            EXISTING_SHA=$(echo "$EXISTING" | cut -f1)
            if [ "${EXISTING_SHA}" != "${GITHUB_SHA}" ]; then
              echo "::error::${TAG} already points at ${EXISTING_SHA}, not ${GITHUB_SHA} -- refusing to move a published tag"
              exit 1
            fi
            echo "::notice::${TAG} already exists at this commit; continuing to the release"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md

      - name: Cleanup old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: yarilo
          package-type: container
          min-versions-to-keep: 16
          ignore-versions: '^\d+\.\d+\.\d+$'
          token: ${{ secrets.GITHUB_TOKEN }}
