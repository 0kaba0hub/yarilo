name: Trivy — vulnerability & malware scan

## Weekly, and only weekly. NOT on every merge: we live on patch versions, so a
## push trigger fired on essentially every merge while telling us nothing new
## -- a scan's findings change when a CVE is published, not when we commit. The
## risk here is time-based, so the trigger is a clock, and one trigger is
## easier to reason about than two.
on:
  schedule:
    - cron: "0 6 * * 0"  # every Sunday at 06:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build image for scanning
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: yarilo:scan

      - name: Run Trivy — image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yarilo:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Run Trivy — filesystem scan (deps + config)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
