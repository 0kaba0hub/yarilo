# Stand-alone Postgres for yarilo sandbox with split passdb/userdb schema.
# Sits alongside the yarilo Release in namespace yarilo-sb.
#
# Apply BEFORE the yarilo helm install so the DSN secret + tables exist.
#
#   kubectl apply -f helm_values/postgres-sandbox.yaml
#
# Resets are easy: kubectl delete -f .../postgres-sandbox.yaml; PVC is then
# garbage-collected.
---
apiVersion: v1
kind: Namespace
metadata:
  name: yarilo-sb
---
apiVersion: v1
kind: Secret
metadata:
  name: yarilo-postgres
  namespace: yarilo-sb
type: Opaque
stringData:
  # Yarilo passdb DSN — referenced from values-sandbox.yaml via DB_DSN.
  dsn: "postgres://yarilo:sandbox-secret@yarilo-postgres:5432/yarilo?sslmode=disable"
  # Same credentials, split out so the StatefulSet can initialise the DB.
  POSTGRES_DB: "yarilo"
  POSTGRES_USER: "yarilo"
  POSTGRES_PASSWORD: "sandbox-secret"
---
# Schema mounted into /docker-entrypoint-initdb.d/. Postgres runs every .sql
# file in alphabetical order on the FIRST startup only (it checks for the
# PG_VERSION marker on the data volume). Deleting the PVC re-applies it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yarilo-postgres-init
  namespace: yarilo-sb
data:
  01-schema.sql: |
    -- Single users table covering both passdb (password / active) and
    -- userdb (home / mail_path / quota / allow_nets / director_tag).
    -- values-sandbox.yaml splits the SELECT into passwordQuery + userQuery
    -- so the same yarilo wiring works against multi-table production schemas.
    --
    -- password column holds reference-style "{SCHEME}hash". Supported schemes:
    -- BCRYPT, SHA512-CRYPT, PLAIN. See docs/AUTH.md.
    --
    -- Read-status per column (yarilo HEAD):
    --   username, password, active       → used now (passwordQuery)
    --   home, mail_path                  → returned in userdb response but
    --                                       maildir backend currently derives
    --                                       the path from the username anyway
    --   mailbox_format, quota_bytes,
    --   allow_nets, director_tag,
    --   display_name, last_login_at      → forward-compat, not yet read by
    --                                       yarilo (quota engine, director,
    --                                       login ACL — future phases)
    CREATE TABLE IF NOT EXISTS users (
        username       VARCHAR(254) PRIMARY KEY,          -- RFC 5321 envelope max (full email)
        password       VARCHAR(255) NOT NULL,             -- enough for {BCRYPT}/{SHA512-CRYPT} + headroom
        active         BOOLEAN NOT NULL DEFAULT TRUE,

        -- userdb / storage
        home           VARCHAR(255) NOT NULL DEFAULT '',  -- Maildir base override
        mailbox_format VARCHAR(16)  NOT NULL DEFAULT '',  -- '' | maildir | dbox | mdbox
        mail_path      VARCHAR(255) NOT NULL DEFAULT '',  -- absolute path; '' = derived from username
        quota_bytes    BIGINT       NOT NULL DEFAULT 0,   -- 0 = unlimited

        -- access control / routing
        allow_nets     VARCHAR(512) NOT NULL DEFAULT '',  -- comma-separated CIDRs; '' = no restriction
        director_tag   VARCHAR(64)  NOT NULL DEFAULT '',  -- routing tag for yarilo-director (Phase 5)

        -- ops / display
        display_name   VARCHAR(255) NOT NULL DEFAULT '',
        last_login_at  TIMESTAMPTZ,

        -- audit
        created_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),

        CHECK (username = LOWER(username))
    );

    -- Index for iterate_query (active-user listing).
    CREATE INDEX IF NOT EXISTS users_active_idx ON users (active) WHERE active;

    -- Auto-update updated_at on every UPDATE.
    CREATE OR REPLACE FUNCTION users_set_updated_at() RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS users_updated_at ON users;
    CREATE TRIGGER users_updated_at BEFORE UPDATE ON users
        FOR EACH ROW EXECUTE FUNCTION users_set_updated_at();
---
apiVersion: v1
kind: Service
metadata:
  name: yarilo-postgres
  namespace: yarilo-sb
  labels:
    app: yarilo-postgres
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app: yarilo-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarilo-postgres
  namespace: yarilo-sb
spec:
  serviceName: yarilo-postgres
  replicas: 1
  selector:
    matchLabels:
      app: yarilo-postgres
  template:
    metadata:
      labels:
        app: yarilo-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: yarilo-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "yarilo"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: yarilo-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
