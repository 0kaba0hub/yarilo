# Stand-alone MySQL for yarilo sandbox with split passdb/userdb schema.
# Sits alongside the yarilo Release in namespace yarilo-sb.
#
# Apply BEFORE the yarilo helm install so the DSN secret + tables exist.
#
#   kubectl apply -f helm_values/mysql-sandbox.yaml
#
# Resets are easy: kubectl delete -f .../mysql-sandbox.yaml; PVC is then
# garbage-collected.
---
apiVersion: v1
kind: Namespace
metadata:
  name: yarilo-sb
---
apiVersion: v1
kind: Secret
metadata:
  name: yarilo-mysql
  namespace: yarilo-sb
type: Opaque
stringData:
  # Yarilo passdb DSN — inject into yarilo pods via extraEnv referencing this secret.
  dsn: "yarilo:sandbox-secret@tcp(yarilo-mysql:3306)/yarilo?parseTime=true&charset=utf8mb4"
  # MySQL entrypoint env vars — used by the StatefulSet to initialise the DB.
  MYSQL_DATABASE: "yarilo"
  MYSQL_USER: "yarilo"
  MYSQL_PASSWORD: "sandbox-secret"
  MYSQL_ROOT_PASSWORD: "sandbox-secret"
---
# Schema mounted into /docker-entrypoint-initdb.d/. MySQL runs every .sql
# file in alphabetical order on the FIRST startup only (data dir must be
# empty). Deleting the PVC re-applies it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yarilo-mysql-init
  namespace: yarilo-sb
data:
  01-schema.sql: |
    USE yarilo;

    -- PostfixAdmin-compatible mailbox table.
    -- values-sandbox.yaml queries this table via passwordQuery / userQuery / iterateQuery.
    CREATE TABLE IF NOT EXISTS mailbox (
        username   VARCHAR(255)  NOT NULL,
        password   VARCHAR(255)  NOT NULL,
        active     TINYINT(1)    NOT NULL DEFAULT 1,

        -- userdb / storage (used by values-sandbox.yaml userQuery)
        home       VARCHAR(255)  NOT NULL DEFAULT '',   -- base home dir (e.g. /var/mail/vhosts)
        mpath      VARCHAR(255)  NOT NULL DEFAULT '',   -- sub-path appended to home
        mbtype     VARCHAR(255)  NOT NULL DEFAULT '',   -- mailbox type prefix (e.g. maildir:)
        maildir    VARCHAR(255)  NOT NULL DEFAULT '',   -- relative maildir path inside home+mpath
        codepage   VARCHAR(255)  NOT NULL DEFAULT '',   -- charset label (legacy; unused in yarilo)
        quota      BIGINT        NOT NULL DEFAULT 0,    -- bytes; 0 = unlimited

        -- access control
        allow_nets VARCHAR(1024) NOT NULL DEFAULT '',   -- comma-separated CIDRs; '' = no restriction

        -- routing
        domain     VARCHAR(255)  NOT NULL DEFAULT '',

        -- ops
        created    DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP,
        modified   DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,

        PRIMARY KEY (username)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE INDEX IF NOT EXISTS mailbox_active_idx ON mailbox (active);
---
apiVersion: v1
kind: Service
metadata:
  name: yarilo-mysql
  namespace: yarilo-sb
  labels:
    app: yarilo-mysql
spec:
  clusterIP: None
  ports:
    - port: 3306
      name: mysql
  selector:
    app: yarilo-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarilo-mysql
  namespace: yarilo-sb
spec:
  serviceName: yarilo-mysql
  replicas: 1
  selector:
    matchLabels:
      app: yarilo-mysql
  template:
    metadata:
      labels:
        app: yarilo-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: yarilo-mysql
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mysqladmin ping -h localhost -u root --password=\"$MYSQL_ROOT_PASSWORD\" --silent 2>/dev/null"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: yarilo-mysql-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
