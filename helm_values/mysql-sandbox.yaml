# Stand-alone MySQL for yarilo sandbox.
# Lives in namespace: db (separate from yarilo-sb).
#
# Apply BEFORE the yarilo helm install so tables exist:
#
#   kubectl apply -f helm_values/mysql-sandbox.yaml
#
# Reset: kubectl delete -f helm_values/mysql-sandbox.yaml
# PVC is garbage-collected when the namespace is deleted.
---
apiVersion: v1
kind: Namespace
metadata:
  name: db
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql
  namespace: db
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql
    app.kubernetes.io/component: mysql
type: Opaque
stringData:
  MYSQL_DATABASE: "yarilo"
  MYSQL_USER: "yarilo"
  MYSQL_PASSWORD: "sandbox-secret"
  MYSQL_ROOT_PASSWORD: "sandbox-root-secret"
---
# Schema mounted into /docker-entrypoint-initdb.d/.
# MySQL runs every .sql file on FIRST startup only (empty data dir).
# Deleting the PVC forces re-apply on next pod start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: db
data:
  01-schema.sql: |
    USE yarilo;

    CREATE TABLE IF NOT EXISTS domain (
        id          BIGINT(20) UNSIGNED  NOT NULL AUTO_INCREMENT,
        domain      VARCHAR(255)         NOT NULL,
        transport   VARCHAR(255)         NOT NULL,
        customer_id VARCHAR(255)         NOT NULL,
        trial       TINYINT(1)           NOT NULL DEFAULT 0,
        abuse       TINYINT(1)           NOT NULL DEFAULT 0,
        active      TINYINT(1)           NOT NULL DEFAULT 1,
        created     DATETIME             NOT NULL DEFAULT CURRENT_TIMESTAMP,
        modified    DATETIME             NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        UNIQUE KEY (domain),
        KEY (customer_id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS alias (
        id       BIGINT(20) UNSIGNED NOT NULL AUTO_INCREMENT,
        address  VARCHAR(255)        NOT NULL,
        goto     MEDIUMTEXT          NOT NULL,
        domain   VARCHAR(255)        NOT NULL,
        active   TINYINT(1)          NOT NULL DEFAULT 1,
        created  DATETIME            NOT NULL DEFAULT CURRENT_TIMESTAMP,
        modified DATETIME            NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        PRIMARY KEY (id),
        UNIQUE KEY (address),
        KEY (goto(255)),
        KEY (domain)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS mailbox (
        id                BIGINT(20) UNSIGNED NOT NULL AUTO_INCREMENT,
        username          VARCHAR(255)        NOT NULL,
        password          VARCHAR(255)        NOT NULL,
        mbtype            VARCHAR(255)        NOT NULL DEFAULT 'maildir',
        home              VARCHAR(255)        NOT NULL DEFAULT '/maildir/',
        maildir           VARCHAR(255)        NOT NULL,
        quota             BIGINT(20)          NOT NULL DEFAULT 0,
        local_part        VARCHAR(255)        NOT NULL,
        domain            VARCHAR(255)        NOT NULL,
        abuse             TINYINT(1)              NULL DEFAULT 0,
        active            TINYINT(1)          NOT NULL DEFAULT 1,
        allow_nets        TEXT                    NULL,
        created           DATETIME            NOT NULL DEFAULT CURRENT_TIMESTAMP,
        modified          DATETIME            NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        password_modified DATETIME            NOT NULL DEFAULT CURRENT_TIMESTAMP,
        mpath             VARCHAR(255)            NULL DEFAULT '',
        codepage          VARCHAR(8)          NOT NULL DEFAULT '',
        system_account    TINYINT(1)          NOT NULL DEFAULT 0,
        director_tag      VARCHAR(255)            NULL,
        PRIMARY KEY (id),
        UNIQUE KEY (username),
        KEY (domain),
        KEY (password_modified),
        KEY (system_account)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: db
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql
    app.kubernetes.io/component: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: mysql
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: mysql
        app.kubernetes.io/component: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mysqladmin ping -h localhost -u root --password=\"$MYSQL_ROOT_PASSWORD\" --silent 2>/dev/null"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mysqladmin ping -h localhost -u root --password=\"$MYSQL_ROOT_PASSWORD\" --silent 2>/dev/null"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: mysql-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: db
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql
    app.kubernetes.io/component: mysql
