## yarilo sandbox — mail-sb.seconddns.com
##
## Pre-reqs:
##   1. cert-manager + ClusterIssuer "letsencrypt-prod" in the cluster.
##   2. DNS A/AAAA for mail-sb.seconddns.com pointing at the LB IP.
##   3. Postgres + schema in yarilo-sb namespace (apply postgres-sandbox.yaml first).
##
## Install:
##   helm upgrade --install yarilo ./helm \
##     -f helm_values/values-sandbox.yaml \
##     -n yarilo-sb --create-namespace

hostname: mail-sb.seconddns.com

image:
  repository: ghcr.io/0kaba0hub/yarilo
  pullPolicy: Always

logLevel: debug

tls:
  secretName: yarilo-tls
  certificate:
    enabled: true
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod
    dnsNames:
      - mail-sb.seconddns.com

services:
  imaps:       { enabled: true,  port: 993, disablePlainAuth: false }
  imap:        { enabled: true,  port: 143, disablePlainAuth: false }
  submission:  { enabled: true,  port: 587, disablePlainAuth: true }
  submissions: { enabled: true,  port: 465, disablePlainAuth: true }
  pop3:        { enabled: true,  port: 110 }
  pop3s:       { enabled: true,  port: 995 }
  lmtp:        { enabled: true,  port: 24 }

protocol:
  submission:
    addReceivedHeader: true
    maxMessageSize: 41943040
    recipientDelimiter: "+"
  lmtp:
    addReceivedHeader: true
    hdrDeliveryAddress: final
  imap:
    idleNotifyInterval: 120
    maxLineLength: 65536

## Split passdb (auth_users) and userdb (mail_users), Dovecot-style.
## Schema is created by postgres-sandbox.yaml's init.sql, so skipSchema=true
## tells yarilo not to attempt CREATE TABLE on its own (it would target the
## built-in yarilo_users table, which we don't use here).
auth:
  passdb:
    - driver: postgres
      dsn: "${DB_DSN}"
      skipSchema: true
      defaultPassScheme: BCRYPT
      passwordQuery: |
        SELECT password,
               '' AS home,
               '' AS mail,
               CASE WHEN active THEN 1 ELSE 0 END AS enabled
        FROM auth_users
        WHERE email = %u
      userQuery: |
        SELECT home, mail_loc
        FROM mail_users
        WHERE email = %u
      iterateQuery: |
        SELECT email
        FROM auth_users
        WHERE active = TRUE
        ORDER BY email

extraEnv:
  - name: DB_DSN
    valueFrom:
      secretKeyRef:
        name: yarilo-postgres
        key: dsn

storage:
  mailbox: maildir
  maildirRoot: /var/mail/vhosts
  index: fileindex
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi

service:
  type: LoadBalancer
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
