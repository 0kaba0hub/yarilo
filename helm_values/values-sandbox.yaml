## yarilo sandbox — mail-sb.seconddns.com
##
## Pre-reqs:
##   1. cert-manager + ClusterIssuer "letsencrypt-prod" in the cluster.
##   2. DNS A/AAAA for mail-sb.seconddns.com pointing at the LB IP.
##   3. MySQL in yarilo-sb namespace (apply mysql-sandbox.yaml first).
##
## Install:
##   helm upgrade --install yarilo ./helm \
##     -f helm_values/values-sandbox.yaml \
##     -n yarilo-sb --create-namespace

hostname: mail-sb.seconddns.com

## ACL is a top-level, protocol-agnostic mail-storage concern.
acl:
  enabled: true

## Namespaces. Personal owns INBOX (storage from storage.mail_home_template);
## Public is a shared, non-owner store used to exercise delivery-through-namespaces.
namespaces:
  - type: personal
    prefix: ""
    separator: "/"
    list: true
    subscriptions: true
    inbox: true
  - type: public
    prefix: "Public/"
    separator: "/"
    list: true
    subscriptions: false
    location: "maildir:/var/mail/vhosts/public"

storage:
  volatileDir: "/tmp/yarilo-volatile/%d/%n"
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

## Enable XCLIENT so session pods accept real-client-IP forwarding from login pods.
general:
  xclient:
    enabled: true
    trusted_nets:
      - "10.0.0.0/8"
  limits:
    max_user_ip_connections: 0

image:
  repository: ghcr.io/0kaba0hub/yarilo
  tag: latest
  pullPolicy: Always

logLevel: debug

service:
  type: LoadBalancer

protocol:
  imap:
    imap_idle_notify_interval: 120
    imap_max_line_length: 65536
  lmtp:
    add_received_header: true
    hdr_delivery_address: final
  managesieve:
    max_script_size: 65536

sieve:
  sieve_enabled: true
  sieve_default_name: "yarilo"
  sieve_max_script_size: 65536
  sieve_max_redirects: 32
  sieve_max_actions: 32
  sieve_vacation_enabled: true
  sieve_submission_host: "relay-fwd.yarilo-relay.svc.cluster.local:25"
  sieve_submission_ssl: "no"
  sieve_submission_auth_secret: "sieve-smtp-auth"
  sieve_global_before: []
  sieve_global_after: []
  sieve_extensions:
    - fileinto
    - reject
    - ereject
    - envelope
    - encoded-character
    - variables
    - relational
    - subaddress
    - body
    - date
    - index
    - mailbox
    - duplicate
    - imap4flags
    - redirect
    - copy
    - vacation
    - enotify
    - foreverypart
    - mime
    - extracttext
    - replace
    - enclose
    - vnd.yarilo.debug
    - vnd.yarilo.filter
    - vnd.yarilo.execute
    - vnd.yarilo.pipe
    - environment
    - vnd.yarilo.environment

dicts:
  metadata:
    driver: redis
    settings:
      addr: yarilo-redis.yarilo-sb.svc.cluster.local:6379
      db: 0
      prefix: "yarilo:metadata:"
      path: null
  quota:
    driver: redis
    settings:
      addr: yarilo-redis.yarilo-sb.svc.cluster.local:6379
      db: 0
      prefix: "yarilo:quota:"
    expire_secs: 86400
  sieve_vacation:
    driver: redis
    settings:
      addr: yarilo-redis.yarilo-sb.svc.cluster.local:6379
      db: 0
      prefix: "yarilo:sieve:vacation:%u:"

## External MySQL — managed by mysql-sandbox.yaml; bundled StatefulSet disabled.
mysql:
  bundled: false

## DSN injected from the yarilo-mysql Secret created by mysql-sandbox.yaml.
extraEnv:
  - name: YARILO_DB_DSN
    valueFrom:
      secretKeyRef:
        name: yarilo-mysql
        key: dsn

components:
  ## IMAP login — TLS terminator on :993 (IMAPS) / :143 (STARTTLS).
  ## Creates yarilo-tls Secret via cert-manager.
  imapLogin:
    enabled: true
    tls:
      secretName: yarilo-tls
      certificate:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames:
          - mail-sb.seconddns.com
    listeners:
      imaps:
        enabled: true
      imap:
        enabled: true
    backend_addr: "yarilo-imap:10143"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  ## POP3 login — TLS terminator on :995 (POP3S) / :110 (STLS).
  ## Reuses yarilo-tls Secret from imapLogin.
  pop3Login:
    enabled: true
    tls:
      secretName: yarilo-tls
    listeners:
      pop3s:
        enabled: true
      pop3:
        enabled: true
    backend_addr: "yarilo-pop3:10110"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  auth:
    passdb:
      - driver: mysql
        dsn: "${YARILO_DB_DSN}"
        default_pass_scheme: BCRYPT
        ## PostfixAdmin mailbox table — skip_schema prevents yarilo-auth from
        ## creating its own yarilo_users table.
        ## Columns matched by name — only "password" is required.
        ## "enabled" maps to PostfixAdmin's "active"; absent columns default active.
        skip_schema: true
        password_query: |
          SELECT password, active AS enabled, allow_nets
          FROM mailbox
          WHERE username = %u
        user_query: |
          SELECT CONCAT(home, mpath) AS home,
                 CONCAT(mbtype, ':~/', maildir,
                        ':INDEX=~/index',
                        ':VOLATILEDIR=/tmp/yarilo-volatile/%2.256Nu/%u') AS mail,
                 CONCAT('*:bytes=', quota_bytes, ':messages=', quota_messages) AS quota_rule
          FROM mailbox
          WHERE username = %u
        iterate_query: |
          SELECT username
          FROM mailbox
          WHERE active = 1
          ORDER BY username

    token:
      backend: redis
      redis_addr: "redis://yarilo-redis.yarilo-sb.svc.cluster.local:6379/0"

  ## IMAP session pod.
  imap:
    listeners:
      imap:
        enabled: true

  ## POP3 session pod.
  pop3:
    enabled: true
    listeners:
      pop3:
        enabled: true

  ## LMTP backend — receives preamble-wrapped connections from lmtp-login.
  lmtp:
    enabled: true

  ## LMTP login proxy — MTA-facing, plain LMTP, no preamble required.
  lmtpLogin:
    enabled: true
    backend_addr: "yarilo-lmtp:10024"

  saslLogin:
    enabled: true
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  quotaStatus:
    enabled: true
    auth_master_addr: "yarilo-auth:9102"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  ## ManageSieve backend — internal, not exposed outside cluster.
  manageSieve:
    enabled: true

  ## ManageSieve login pod — client-facing on :4190 STARTTLS.
  manageSieveLogin:
    enabled: true
    backend_addr: "yarilo-managesieve:14190"
    tls:
      secretName: yarilo-tls
    listeners:
      managesieve:
        enabled: true
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
