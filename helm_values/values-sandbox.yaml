## yarilo sandbox — mail-sb.seconddns.com
##
## Pre-reqs:
##   1. cert-manager + ClusterIssuer "letsencrypt-prod" in the cluster.
##   2. DNS A/AAAA for mail-sb.seconddns.com pointing at the LB IP.
##   3. MySQL (apply mysql-sandbox.yaml first — namespace: db).
##   4. Redis (apply redis-sandbox.yaml first — namespace: redis).
##
## Install:
##   helm upgrade --install yarilo ./helm \
##     -f helm_values/values-sandbox.yaml \
##     -n yarilo-sb --create-namespace

hostname: mail-sb.seconddns.com

## ACL is a top-level, protocol-agnostic mail-storage concern.
acl:
  enabled: true

## Quota engine — count-authoritative enforcement on every save (IMAP
## APPEND/COPY/MOVE, LMTP delivery, quota-status policy service). Limits come
## from the userdb quota_rule (see auth.passdb user_query). Independent of the
## IMAP QUOTA extension exposure (protocol.imap.imap_quota).
quota:
  enabled: true
  quota_name: "User quota"
  quota_exceeded_message: "Quota exceeded (mailbox for user is full)"
  quota_mail_size: "50M"
  ## Mirror usage to Redis + MySQL simultaneously (fan-out), for external readers.
  quota_clone_dicts:
    - quota_clone_redis
    - quota_clone_mysql
  quota_clone_flush_delay: 10

## Full-text search (FTS-1). The yarilo-fts service (components.fts below) owns
## the indexes; sessions dial it at fts_addr. fts_auth_master_addr is required
## so the service resolves each user's home + INDEX=~/index from userdb exactly
## like the session pods do. Engine: flatcurve (Xapian) — runs the -fts image.
fts:
  enabled: true
  fts_engine: flatcurve
  fts_mode: remote
  fts_addr: ""
  fts_auth_master_addr: "yarilo-auth:9102"
  fts_autoindex: true
  # Fail loud in the sandbox: when FTS returns nothing / is unavailable, surface an
  # IMAP error instead of silently falling back to a sequential scan, so FTS
  # regressions (e.g. #638) are caught by smoketest instead of being masked.
  fts_search_read_fallback: false
  language_filters: [lowercase, snowball, stopwords]
  languages: [en]

## Namespaces. Personal owns INBOX (storage from storage.mail_home_template);
## Public is a shared, non-owner store used to exercise delivery-through-namespaces.
namespaces:
  - type: personal
    prefix: ""
    separator: "/"
    list: true
    subscriptions: true
    inbox: true
  - type: public
    prefix: "Public/"
    separator: "/"
    list: true
    subscriptions: false
    location: "maildir:/var/mail/vhosts/public"

storage:
  volatileDir: "/tmp/yarilo-volatile/%d/%n"
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

## Enable XCLIENT so session pods accept real-client-IP forwarding from login pods.
general:
  xclient:
    enabled: true
    trusted_nets:
      - "10.0.0.0/8"
  limits:
    max_user_ip_connections: 0

image:
  repository: ghcr.io/0kaba0hub/yarilo
  tag: latest
  pullPolicy: Always

logLevel: debug

service:
  type: LoadBalancer

protocol:
  imap:
    imap_idle_notify_interval: 120
    imap_max_line_length: 65536
    imap_quota: true
  lmtp:
    add_received_header: true
    hdr_delivery_address: final
  managesieve:
    max_script_size: 65536

sieve:
  sieve_enabled: true
  sieve_default_name: "yarilo"
  imapsieve_enabled: true
  imapsieve_script_dir: "/etc/yarilo/imapsieve"
  imapsieve_scripts:
    refile: |
      require ["imapsieve", "environment", "fileinto", "mailbox"];
      if environment :is "imap.cause" "APPEND" { fileinto :create "ImapSieveArchive"; }
  sieve_max_script_size: 65536
  sieve_max_redirects: 32
  sieve_max_actions: 32
  sieve_spamtest_status_header: "X-Spam-Score"
  sieve_duplicate_driver: file
  sieve_vacation_enabled: true
  sieve_submission_host: "relay-fwd.yarilo-relay.svc.cluster.local:25"
  sieve_submission_ssl: "no"
  sieve_submission_auth_secret: "sieve-smtp-auth"
  sieve_global_before: []
  sieve_global_after: []
  sieve_extensions:
    - fileinto
    - reject
    - ereject
    - envelope
    - encoded-character
    - variables
    - relational
    - subaddress
    - body
    - date
    - index
    - mailbox
    - mailboxid
    - mboxmetadata
    - servermetadata
    - imapsieve
    - duplicate
    - imap4flags
    - redirect
    - copy
    - vacation
    - enotify
    - spamtest
    - spamtestplus
    - virustest
    - "comparator-i;ascii-numeric"
    - foreverypart
    - mime
    - extracttext
    - replace
    - enclose
    - vnd.yarilo.debug
    - vnd.yarilo.filter
    - vnd.yarilo.execute
    - vnd.yarilo.pipe
    - vnd.yarilo.report
    - environment
    - vnd.yarilo.environment

dicts:
  metadata:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo:metadata:"
      path: null
  ## quota_clone mirror targets — fan-out: usage is written to BOTH at once.
  ## Advisory mirror only; enforcement always reads the index.
  quota_clone_redis:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "quota:"
  quota_clone_mysql:
    driver: sql
    settings:
      driver: mysql
      dsn: "${YARILO_DB_DSN}"
      ## Mapped mode (#590): each key binds to a column of the operator-owned
      ## quota(username, bytes, messages) table, so the mirror is a clean
      ## per-user schema external tooling can query directly.
      maps:
        - { key: "priv/quota/storage",  table: quota, username_field: username, value_field: bytes }
        - { key: "priv/quota/messages", table: quota, username_field: username, value_field: messages }
  sieve_vacation:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo:sieve:vacation:%u:"
  sieve_duplicate:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo:sieve:duplicate:%u:"

## External MySQL — managed by mysql-sandbox.yaml; bundled StatefulSet disabled.
mysql:
  bundled: false

## External Redis — managed by redis-sandbox.yaml (namespace: redis); the chart's
## in-namespace Redis StatefulSet is disabled. Consumers (locks state, dicts)
## point at redis.redis.svc.cluster.local:6379.
redis:
  bundled: false
  externalUrl: "redis://redis.redis.svc.cluster.local:6379/0"

## DSN injected from the yarilo-mysql Secret created by mysql-sandbox.yaml.
extraEnv:
  - name: YARILO_DB_DSN
    valueFrom:
      secretKeyRef:
        name: yarilo-mysql
        key: dsn

components:
  director:
    enabled: true
    internalTLS:
      enabled: true
      secretName: yarilo-director-internal-tls
      certificate:
        enabled: true
        issuerRef:
          kind: Issuer
          name: yarilo-internal-ca
    ## 3 is the minimum meaningful ring (min_members: 3). 5 was only ever set to
    ## observe a non-minimal ring; steady state does not need it, and the peer
    ## mesh grows quadratically — the seed poll opens a fresh mTLS connection to
    ## every other replica on every tick, so 5 replicas is 5x4=20 handshakes per
    ## cycle against 3x2=6. See the issue on making those connections persistent;
    ## this only reduces the symptom.
    replicas: 3
    ## resources (#878): NO cpu limit, same reasoning as the login pods. Every
    ## login blocks on a director LOOKUP, and the chart default of 500m throttled
    ## it — measured 320 CFS periods / 8s throttled against 76s used (~10%) over
    ## one imaptest run. Server-side LOOKUP itself is 0.4ms
    ## (yarilo_director_lookup_seconds), so throttling is pure added latency on a
    ## login-blocking path. requests stay at the chart default 100m: the sandbox
    ## node is already at 85% of allocatable CPU requests.
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        ## null removes the chart default; Helm deep-merges, so omitting the key
        ## would keep 500m.
        cpu: null
        memory: 256Mi
    ring_secret: "sandbox-ring-secret-32charslong00"
    min_members: 3
    seed_poll_idle_interval: 5
    assignment_policy: least_sessions
    backend_unreachable_reporters: 1
    listeners:
      lmtp:
        enabled: true
        port: 24
        containerPort: 10024
    backends: []


  ## internal mTLS for co-located backend + shared services (sandbox #856 gate)
  backend:
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
  anvil:
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
  locks:
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls

  ## IMAP login — TLS terminator on :993 (IMAPS) / :143 (STARTTLS).
  ## Creates yarilo-tls Secret via cert-manager.
  ##
  ## resources (#878): NO cpu limit. Login pods carry all the asymmetric crypto
  ## in the system — per login they complete three ECDSA handshakes (client TLS
  ## on 993/143, mTLS to yarilo-auth, mTLS to yarilo-anvil). The chart default
  ## limit of 200m throttled a 500-client burst to a hard 20s CPU ceiling per
  ## 100s: measured 21.2s used vs 152.4s spent throttled, which blew the auth
  ## dial deadline 813 times and surfaced as 1041 NO [UNAVAILABLE] to clients.
  ## A CFS quota is wrong for a bursty TLS terminator — requests reserve the
  ## floor, the burst is allowed to use idle node capacity.
  imapLogin:
    enabled: true
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    tls:
      secretName: yarilo-tls
      certificate:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames:
          - mail-sb.seconddns.com
    listeners:
      imaps:
        enabled: true
      imap:
        enabled: true
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 10143
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  ## POP3 login — TLS terminator on :995 (POP3S) / :110 (STLS).
  ## Reuses yarilo-tls Secret from imapLogin.
  pop3Login:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    tls:
      secretName: yarilo-tls
    listeners:
      pop3s:
        enabled: true
      pop3:
        enabled: true
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 10110
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  auth:
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    passdb:
      - driver: mysql
        dsn: "${YARILO_DB_DSN}"
        default_pass_scheme: BCRYPT
        ## PostfixAdmin mailbox table — skip_schema prevents yarilo-auth from
        ## creating its own yarilo_users table.
        ## Columns matched by name — only "password" is required.
        ## "enabled" maps to PostfixAdmin's "active"; absent columns default active.
        skip_schema: true
        password_query: |
          SELECT password, active AS enabled, allow_nets
          FROM mailbox
          WHERE username = %u
        user_query: |
          SELECT CONCAT(home, mpath) AS home,
                 CONCAT(mbtype, ':~/', maildir,
                        ':INDEX=~/index',
                        ':VOLATILEDIR=/tmp/yarilo-volatile/%2.256Nu/%u') AS mail,
                 CONCAT('*:bytes=', quota_bytes, ':messages=', quota_messages) AS quota_rule
          FROM mailbox
          WHERE username = %u
        iterate_query: |
          SELECT username
          FROM mailbox
          WHERE active = 1
          ORDER BY username

    token:
      backend: redis
      redis_addr: "redis://redis.redis.svc.cluster.local:6379/0"

  ## IMAP session pod.
  imap:
    listeners:
      imap:
        enabled: true

  ## POP3 session pod.
  pop3:
    enabled: true
    listeners:
      pop3:
        enabled: true

  ## LMTP backend — receives preamble-wrapped connections from lmtp-login.
  lmtp:
    enabled: true

  ## LMTP login proxy — MTA-facing, plain LMTP, no preamble required.
  lmtpLogin:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 10024

  saslLogin:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  quotaStatus:
    enabled: true
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    auth_master_addr: "yarilo-auth:9102"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  ## Full-text search service — sole owner of the FTS indexes (queue + worker
  ## + LOOKUP). Runs the -fts image variant (the only cgo/libxapian binary);
  ## Recreate strategy so only one writer ever holds the index files.
  fts:
    enabled: true

  ## ManageSieve backend — internal, not exposed outside cluster.
  manageSieve:
    enabled: true

  ## ManageSieve login pod — client-facing on :4190 STARTTLS.
  manageSieveLogin:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 14190
    tls:
      secretName: yarilo-tls
    listeners:
      managesieve:
        enabled: true
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

## NOTE (#878): there is deliberately NO top-level `resources:` block here.
## The chart has no `.Values.resources` — sizing is per-component only
## (`components.<name>.resources`). A top-level block silently does nothing,
## and previously made this deployment look like it ran with a 1000m CPU limit
## while every login pod was in fact capped at the chart default of 200m.
## Add resources under the component you actually mean to size.
