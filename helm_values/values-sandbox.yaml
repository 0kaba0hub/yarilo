## yarilo sandbox — mail-sb.seconddns.com
##
## Pre-reqs:
##   1. cert-manager + ClusterIssuer "letsencrypt-prod" in the cluster.
##   2. DNS A/AAAA for mail-sb.seconddns.com pointing at the LB IP.
##   3. MySQL (apply mysql-sandbox.yaml first — namespace: db).
##   4. Redis (apply redis-sandbox.yaml first — namespace: redis).
##
## Install:
##   helm upgrade --install yarilo ./helm \
##     -f helm_values/values-sandbox.yaml \
##     -n yarilo-sb --create-namespace

hostname: mail-sb.seconddns.com

## ACL is a top-level, protocol-agnostic mail-storage concern.
acl:
  enabled: true
  ## Owner discovery (#1168): names the dict below that records who granted
  ## what to whom, which is what lets LIST user/* enumerate owners instead of
  ## the caller having to already know the name.
  acl_shared_dict: "acl_shared"

## Quota engine — count-authoritative enforcement on every save (IMAP
## APPEND/COPY/MOVE, LMTP delivery, quota-status policy service). Limits come
## from the userdb quota_rule (see auth.passdb user_query). Independent of the
## IMAP QUOTA extension exposure (protocol.imap.imap_quota).
quota:
  enabled: true
  quota_name: "User quota"
  quota_exceeded_message: "Quota exceeded (mailbox for user is full)"
  quota_mail_size: "50M"
  ## Mirror usage to Redis + MySQL simultaneously (fan-out), for external readers.
  quota_clone_dicts:
    - quota_clone_redis
    - quota_clone_mysql
  quota_clone_flush_delay: 10

## Full-text search (FTS-1). The yarilo-fts service (components.fts below) owns
## the indexes; sessions dial it at fts_addr. fts_auth_master_addr is required
## so the service resolves each user's home + INDEX=~/index from userdb exactly
## like the session pods do. Engine: flatcurve (Xapian) — runs the -fts image.
fts:
  enabled: true
  fts_engine: flatcurve
  fts_mode: remote
  fts_addr: ""
  fts_auth_master_addr: "yarilo-auth:9102"
  fts_autoindex: true
  # Fail loud in the sandbox: when FTS returns nothing / is unavailable, surface an
  # IMAP error instead of silently falling back to a sequential scan, so FTS
  # regressions (e.g. #638) are caught by smoketest instead of being masked.
  fts_search_read_fallback: false
  # Written down explicitly, at the default, because the 2.3.215 window ran with
  # it lowered to 60 via --set to watch an eviction inside a short window. The
  # sandbox's real state belongs in this file, not in someone's shell history.
  fts_handle_idle_timeout: 300
  language_filters: [lowercase, stopwords, snowball]
  # The detector only picks among the languages listed here, so a single-entry
  # list silently indexes every message as English -- including non-English mail,
  # which then gets the wrong stopword list and stemmer. Listing several keeps the
  # sandbox representative of real traffic and makes per-language FTS work
  # measurable at all.
  languages: [en, es, it, uk]

## Namespaces. Personal owns INBOX (storage from storage.mail_home_template);
## Public is a shared, non-owner store used to exercise delivery-through-namespaces.
namespaces:
  - type: personal
    prefix: ""
    separator: "/"
    list: "yes"
    subscriptions: true
    inbox: true
  # A public namespace is declared as type: shared with a public prefix and
  # location; there is no "public" type. It was silently skipped, so nothing
  # under Public/ was ever a shared mailbox (#1086).
  - type: shared
    prefix: "Public/"
    separator: "/"
    list: "yes"
    subscriptions: false
    location: "maildir:/var/mail/vhosts/public"
  # Owner-templated shared namespace (B1): user/<owner>/ resolves the owner via
  # userdb and opens the owner's own store. The driver comes from the owner's
  # userdb mail_location (so the mdbox/maildir/sdbox matrix is honoured); the
  # root is this location expanded against the owner. %h -> the owner's home.
  - type: shared
    prefix: "user/%u/"
    separator: "/"
    list: children
    subscriptions: false
    location: "maildir:%h/Maildir"

storage:
  mail_volatile_path: "/tmp/yarilo-volatile/%2.256Nu/%u"
  ## On-disk format of the per-user mdbox map index. Declared, not inherited:
  ## the value decides what an older image can still open.
  mdbox_map_format: v2
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi

## Enable XCLIENT so session pods accept real-client-IP forwarding from login pods.
general:
  xclient:
    enabled: true
    trusted_nets:
      - "10.0.0.0/8"
  limits:
    max_user_ip_connections: 0

## Profiling. The endpoints cost nothing while nobody fetches, and the port is
## cluster-internal, so they stay reachable here for investigations. The heap
## dump is a different thing and stays off: it holds live objects, which in a
## mail process are message bodies.
##
## The two sampling rates are what make the block and mutex profiles say
## anything; at 0 they answer with an empty profile. Set them for a measurement
## window (blockProfileRate: 10000, mutexProfileFraction: 100), take the
## capture, put them back to 0 — every blocking operation pays while they are on.
telemetry:
  pprof:
    enabled: true
    blockProfileRate: 0
    mutexProfileFraction: 0

image:
  repository: ghcr.io/yarilomail/yarilo
  tag: latest
  ## IfNotPresent, not Always: every tag we deploy is immutable, so re-pulling
  ## buys nothing -- and it costs the one case that matters, a rollback while
  ## the registry is unreachable, where the node's cached image is the way out
  ## rather than a staleness risk (#1217).
  pullPolicy: IfNotPresent

logLevel: debug

service:
  type: LoadBalancer

protocol:
  jmap:
    jmap_base_url: "https://mail-sb.seconddns.com"
  imap:
    imap_idle_notify_interval: 120
    imap_max_line_length: 65536
    imap_quota: true
  lmtp:
    add_received_header: true
    hdr_delivery_address: final
  managesieve:
    max_script_size: 65536

sieve:
  sieve_enabled: true
  sieve_default_name: "yarilo"
  imapsieve_enabled: true
  imapsieve_script_dir: "/etc/yarilo/imapsieve"
  imapsieve_scripts:
    refile: |
      require ["imapsieve", "environment", "fileinto", "mailbox"];
      if environment :is "imap.cause" "APPEND" { fileinto :create "ImapSieveArchive"; }
  sieve_max_script_size: 65536
  sieve_max_redirects: 32
  sieve_max_actions: 32
  sieve_spamtest_status_header: "X-Spam-Score"
  sieve_duplicate_driver: file
  sieve_vacation_enabled: true
  sieve_submission_host: "relay-fwd.yarilo-relay.svc.cluster.local:25"
  sieve_submission_ssl: "no"
  sieve_submission_auth_secret: "sieve-smtp-auth"
  sieve_global_before: []
  sieve_global_after: []
  sieve_extensions:
    - fileinto
    - reject
    - ereject
    - envelope
    - encoded-character
    - variables
    - relational
    - subaddress
    - body
    - date
    - index
    - mailbox
    - mailboxid
    - mboxmetadata
    - servermetadata
    - imapsieve
    - duplicate
    - imap4flags
    - redirect
    - copy
    - vacation
    - enotify
    - spamtest
    - spamtestplus
    - virustest
    - "comparator-i;ascii-numeric"
    - foreverypart
    - mime
    - extracttext
    - replace
    - enclose
    - vnd.yarilo.debug
    - vnd.yarilo.filter
    - vnd.yarilo.execute
    - vnd.yarilo.pipe
    - vnd.yarilo.report
    - environment
    - vnd.yarilo.environment

dicts:
  ## Owner-discovery registry for the user/%u namespace. Discovery only —
  ## rights always come from the ACL files; a lost key costs visibility,
  ## never access.
  acl_shared:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo-sb:acl-shared:"
  metadata:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo-sb:metadata:"
      path: null
  ## quota_clone mirror targets — fan-out: usage is written to BOTH at once.
  ## Advisory mirror only; enforcement always reads the index.
  quota_clone_redis:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo-sb:quota:"
  quota_clone_mysql:
    driver: sql
    settings:
      driver: mysql
      dsn: "${YARILO_DB_DSN}"
      ## Mapped mode (#590): each key binds to a column of the operator-owned
      ## quota(username, bytes, messages) table, so the mirror is a clean
      ## per-user schema external tooling can query directly.
      maps:
        - { key: "priv/quota/storage",  table: quota, username_field: username, value_field: bytes }
        - { key: "priv/quota/messages", table: quota, username_field: username, value_field: messages }
  sieve_vacation:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo-sb:sieve:vacation:%u:"
  sieve_duplicate:
    driver: redis
    settings:
      addr: redis.redis.svc.cluster.local:6379
      db: 0
      prefix: "yarilo-sb:sieve:duplicate:%u:"

## External MySQL — managed by mysql-sandbox.yaml; bundled StatefulSet disabled.
mysql:
  bundled: false

## initAddr is what makes the wait-db init container render. Without it the chart
## silently skips wait-db, so auth and the session pods waited only for Redis and
## then crash-looped against a database that was not up yet — the init container
## looked like protection it was not providing.
##
## Only initAddr is set here: the DSN itself arrives through extraEnv from the
## yarilo-mysql Secret, so secretName/dsn stay empty on purpose.
database:
  initAddr: "mysql.db.svc:3306"

## External Redis — managed by redis-sandbox.yaml (namespace: redis); the chart's
## in-namespace Redis StatefulSet is disabled. Consumers (locks state, dicts)
## point at redis.redis.svc.cluster.local:6379.
redis:
  bundled: false
  externalUrl: "redis://redis.redis.svc.cluster.local:6379/0"

## DSN injected from the yarilo-mysql Secret created by mysql-sandbox.yaml.
extraEnv:
  - name: YARILO_DB_DSN
    valueFrom:
      secretKeyRef:
        name: yarilo-mysql
        key: dsn
  ## The static passdb's shared credential. Kept in a secret rather than here
  ## because it authenticates as any username -- see the allow_nets note at the
  ## passdb entry for why that is bounded to the cluster network.
  - name: YARILO_STATIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: yarilo-static-passdb
        key: password

components:
  director:
    enabled: true
    internalTLS:
      enabled: true
      secretName: yarilo-director-internal-tls
      certificate:
        enabled: true
        issuerRef:
          kind: Issuer
          name: yarilo-internal-ca
    ## 3 is the minimum meaningful ring (min_members: 3). 5 was only ever set to
    ## observe a non-minimal ring; steady state does not need it, and the peer
    ## mesh grows quadratically — the seed poll opens a fresh mTLS connection to
    ## every other replica on every tick, so 5 replicas is 5x4=20 handshakes per
    ## cycle against 3x2=6. See the issue on making those connections persistent;
    ## this only reduces the symptom.
    replicas: 3
    ## resources (#878): NO cpu limit, same reasoning as the login pods. Every
    ## login blocks on a director LOOKUP, and the chart default of 500m throttled
    ## it — measured 320 CFS periods / 8s throttled against 76s used (~10%) over
    ## one imaptest run. Server-side LOOKUP itself is 0.4ms
    ## (yarilo_director_lookup_seconds), so throttling is pure added latency on a
    ## login-blocking path. requests stay at the chart default 100m: the sandbox
    ## node is already at 85% of allocatable CPU requests.
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        ## null removes the chart default; Helm deep-merges, so omitting the key
        ## would keep 500m.
        cpu: null
        memory: 256Mi
    ring_secret: "sandbox-ring-secret-32charslong00"
    min_members: 3
    seed_poll_idle_interval: 5
    assignment_policy: least_sessions
    backend_unreachable_reporters: 1
    listeners:
      lmtp:
        enabled: true
        port: 24
        containerPort: 10024
    backends: []


  ## internal mTLS for co-located backend + shared services (sandbox #856 gate)
  backend:
    ## 2, not the chart default of 3: three do not fit. The node has 4 cores,
    ## other namespaces hold ~1590m of it, and each backend pod requests 460m
    ## across its eight containers -- the third is refused outright with
    ## "0/1 nodes are available: 1 Insufficient cpu".
    ##
    ## It fit historically only because the pods were placed one at a time as
    ## the node filled; after any restart that replaces all three, the last one
    ## stays Pending. That state is worse than two replicas rather than merely
    ## smaller: the ring is built for three, so every user hashing to the
    ## missing pod is unroutable, and nothing reports it as a failure.
    ##
    ## Two also stops the node saturating: with three declared, the smoke jobs
    ## and imaptest ran for fifteen minutes without finishing and the kubelet
    ## stopped serving pods/log while staying Ready. Both complete normally at
    ## two.
    replicas: 2
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
  warden:
    # #908 PR4: singleton lifted. Redis-backed state (penalties + sessions + kick
    # bus) is shared across replicas, so the sandbox runs 2 to exercise the
    # cross-replica paths (kick published on one pod, delivered by another).
    replicas: 2
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    service:
      state_backend: redis
      key_prefix: "yarilo-sb:warden:"
      channel_prefix: "yarilo-sb:warden:events:"
  locks:
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    # Sandbox shares one Redis; every component lives under the yarilo-sb: namespace.
    service:
      key_prefix: "yarilo-sb:locks:"
      channel_prefix: "yarilo-sb:events:"

  ## IMAP login — TLS terminator on :993 (IMAPS) / :143 (STARTTLS).
  ## Creates yarilo-tls Secret via cert-manager.
  ##
  ## resources (#878): NO cpu limit. Login pods carry all the asymmetric crypto
  ## in the system — per login they complete three ECDSA handshakes (client TLS
  ## on 993/143, mTLS to yarilo-auth, mTLS to yarilo-warden). The chart default
  ## limit of 200m throttled a 500-client burst to a hard 20s CPU ceiling per
  ## 100s: measured 21.2s used vs 152.4s spent throttled, which blew the auth
  ## dial deadline 813 times and surfaced as 1041 NO [UNAVAILABLE] to clients.
  ## A CFS quota is wrong for a bursty TLS terminator — requests reserve the
  ## floor, the burst is allowed to use idle node capacity.
  imapLogin:
    enabled: true
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    tls:
      secretName: yarilo-tls
      certificate:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames:
          - mail-sb.seconddns.com
    listeners:
      imaps:
        enabled: true
      imap:
        enabled: true
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 10143
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  ## JMAP login — HTTPS terminator on :8443, per-request proxy to the
  ## yarilo-jmap backend container (:10443). Until the backend PR lands,
  ## authenticated requests answer 502 — the login-layer probes still gate.
  jmapLogin:
    enabled: true
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    tls:
      secretName: yarilo-tls
      certificate:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames:
          - mail-sb.seconddns.com
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 10443
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  ## POP3 login — TLS terminator on :995 (POP3S) / :110 (STLS).
  ## Reuses yarilo-tls Secret from imapLogin.
  pop3Login:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    tls:
      secretName: yarilo-tls
    listeners:
      pop3s:
        enabled: true
      pop3:
        enabled: true
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 10110
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  auth:
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    ## Master users (#1301 window): impersonation via SASL authzid or the
    ## target*master separator. The masterdb is a dedicated table in the same
    ## MySQL as the main passdb; skip_schema + an explicit query, per the
    ## #1299 contract.
    master_users:
      enabled: false
      separator: "*"
      masterdb:
        - driver: mysql
          dsn: "${YARILO_DB_DSN}"
          skip_schema: true
          password_query: |
            SELECT password, active AS enabled
            FROM yarilo_masters
            WHERE username = %u
    passdb:
      - driver: mysql
        dsn: "${YARILO_DB_DSN}"
        default_pass_scheme: BCRYPT
        ## PostfixAdmin mailbox table — skip_schema prevents yarilo-auth from
        ## creating its own yarilo_users table.
        ## Columns matched by name — only "password" is required.
        ## "enabled" maps to PostfixAdmin's "active"; absent columns default active.
        skip_schema: true
        password_query: |
          SELECT password, active AS enabled, allow_nets
          FROM mailbox
          WHERE username = %u
        user_query: |
          SELECT CONCAT(home, mpath) AS home,
                 CONCAT(mbtype, ':~/', maildir,
                        ':INDEX=~/index',
                        ':VOLATILEDIR=/tmp/yarilo-volatile/%2.256Nu/%u') AS mail,
                 CONCAT('*:bytes=', quota_bytes, ':messages=', quota_messages) AS quota_rule
          FROM mailbox
          WHERE username = %u
        iterate_query: |
          SELECT username
          FROM mailbox
          WHERE active = 1
          ORDER BY username
      ## Static passdb, last in the chain, so the smoke row for this driver has
      ## something to check (#1311). It matches EVERY username by design, which
      ## on an internet-facing deployment would hand every account a second
      ## valid password -- so it hands out allow_nets with the credential, and
      ## login refuses the session from anywhere else. The smoke job runs
      ## in-cluster, which is the only place this account is meant to work.
      - driver: static
        static_password: "${YARILO_STATIC_PASSWORD}"
        default_pass_scheme: PLAIN
        fields:
          ## microk8s pod CIDR: the smoke job dials the service pod-to-pod,
          ## so the source is always a pod IP. Nodes/LB (10.50.80.x) are not
          ## in it deliberately -- nothing that reaches this account runs there.
          allow_nets: "10.1.0.0/16"
          userdb_home: "/var/mail/vhosts/d00001.test/static"
          userdb_mail: "maildir:~/Maildir:INDEX=~/index"

    token:
      backend: redis
      redis_addr: "redis://redis.redis.svc.cluster.local:6379/0"
      # Sandbox shares one Redis; every component lives under the yarilo-sb: namespace.
      key_prefix: "yarilo-sb:authtoken:"

    # Cross-pod auth-fail tarpit via warden (prod-like; exercises the #908 Redis
    # penalty backend end-to-end). #942 fixed the mTLS client-config dial.
    penalty:
      enabled: true

    # Negative auth caching stays ON (default 1800s) on purpose (#950). The
    # per-password negative-MAC fix (Option A) makes it safe — a wrong-password
    # storm no longer blocks the user's correct password — and keeping it ON is
    # exactly what the #950 acceptance must exercise. Do NOT set
    # negative_ttl_seconds: 0 here: that was the interim mitigation, and with the
    # fix in place it would only mask the fixed path (no negatives = nothing to
    # poison = a trivially-green anti-test).
    cache:
      cache_size: "100M"
      ttl_seconds: 1800
      negative_ttl_seconds: 1800

  ## IMAP session pod.
  imap:
    listeners:
      imap:
        enabled: true

  ## POP3 session pod.
  pop3:
    enabled: true
    listeners:
      pop3:
        enabled: true

  ## LMTP backend — receives preamble-wrapped connections from lmtp-login.
  lmtp:
    enabled: true

  ## LMTP login proxy — MTA-facing, plain LMTP, no preamble required.
  lmtpLogin:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 10024

  saslLogin:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  quotaStatus:
    enabled: true
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    auth_master_addr: "yarilo-auth:9102"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "10.50.80.29"
        metallb.universe.tf/allow-shared-ip: "yarilo-mail"

  ## Full-text search service — sole owner of the FTS indexes (queue + worker
  ## + LOOKUP). Runs the -fts image variant (the only cgo/libxapian binary);
  ## Recreate strategy so only one writer ever holds the index files.
  fts:
    enabled: true

  ## ManageSieve backend — internal, not exposed outside cluster.
  manageSieve:
    enabled: true

  ## JMAP backend — one more container in the co-located pod, reached only by
  ## jmapLogin. internalTLS is on cluster-wide here, so the peer certificate is
  ## the trust anchor and xclient stays off.
  jmap:
    enabled: true
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls

  ## ManageSieve login pod — client-facing on :4190 STARTTLS.
  manageSieveLogin:
    enabled: true
    ## Same crypto profile as imapLogin — see the #878 note there.
    resources:
      requests:
        ## Small floor only — requests reserve scheduling capacity, and the node
        ## budget is shared with the director/backend/session pods. The burst is
        ## served by idle node CPU, which is what removing the limit unlocks.
        cpu: 100m
        memory: 128Mi
      limits:
        ## null removes the chart's default 200m ceiling: Helm deep-merges
        ## values, so omitting the key would keep the default, not drop it.
        cpu: null
        memory: 512Mi
    internalTLS:
      enabled: true
      secretName: yarilo-internal-tls
    backend_addr: ""
    director_addr: "yarilo-director:9102"
    backend_port: 14190
    tls:
