## yarilo sandbox — mail-sb.seconddns.com
##
## Pre-reqs:
##   1. cert-manager + ClusterIssuer "letsencrypt-prod" in the cluster.
##   2. DNS A/AAAA for mail-sb.seconddns.com pointing at the LB IP.
##   3. MySQL in yarilo-sb namespace (apply mysql-sandbox.yaml first).
##
## Install:
##   helm upgrade --install yarilo ./helm \
##     -f helm_values/values-sandbox.yaml \
##     -n yarilo-sb --create-namespace

hostname: mail-sb.seconddns.com

image:
  repository: ghcr.io/0kaba0hub/yarilo
  pullPolicy: Always

logLevel: debug

service:
  type: LoadBalancer

protocol:
  imap:
    idleNotifyInterval: 120
    maxLineLength: 65536
  lmtp:
    addReceivedHeader: true
    hdrDeliveryAddress: final

## External MySQL — managed by mysql-sandbox.yaml; bundled StatefulSet disabled.
mysql:
  bundled: false

## DSN injected from the yarilo-mysql Secret created by mysql-sandbox.yaml.
extraEnv:
  - name: YARILO_DB_DSN
    valueFrom:
      secretKeyRef:
        name: yarilo-mysql
        key: dsn

components:
  ## IMAP login — TLS terminator on :993 (IMAPS) / :143 (STARTTLS).
  ## Creates yarilo-tls Secret via cert-manager.
  imapLogin:
    enabled: true
    tls:
      secretName: yarilo-tls
      certificate:
        enabled: true
        issuerRef:
          kind: ClusterIssuer
          name: letsencrypt-prod
        dnsNames:
          - mail-sb.seconddns.com
    listeners:
      imaps:
        enabled: true
      imap:
        enabled: true

  ## POP3 login — TLS terminator on :995 (POP3S) / :110 (STLS).
  ## Reuses yarilo-tls Secret from imapLogin.
  pop3Login:
    enabled: true
    tls:
      secretName: yarilo-tls
    listeners:
      pop3s:
        enabled: true
      pop3:
        enabled: true

  auth:
    passdb:
      - driver: mysql
        dsn: "${YARILO_DB_DSN}"
        defaultPassScheme: BCRYPT
        ## Custom users table created by mysql-sandbox.yaml.
        ## skipSchema prevents yarilo-auth from creating its own yarilo_users table.
        skipSchema: true
        passwordQuery: |
          SELECT password,
                 '' AS home,
                 '' AS mail,
                 active AS enabled
          FROM users
          WHERE username = LOWER(%u)
        userQuery: |
          SELECT home, mail_path
          FROM users
          WHERE username = LOWER(%u)
        iterateQuery: |
          SELECT username
          FROM users
          WHERE active = 1
          ORDER BY username

  ## IMAP session pod.
  ## PVC yarilo-mail is created from this component's persistence config.
  imap:
    storage:
      persistence:
        enabled: true
        accessMode: ReadWriteOnce
        size: 5Gi

  ## POP3 session pod.
  pop3:
    enabled: true

  ## LMTP — inbound delivery from MTA, no login proxy.
  lmtp:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
