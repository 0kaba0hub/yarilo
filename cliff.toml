[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
## {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^ci: update .* image tag", skip = true },
  { message = "^ci:", skip = true },
  { message = "\\[skip ci\\]", skip = true },
  # A security fix is grouped by its body, not its type: it is still a fix, and
  # the subject line is what a reader sees in the notes. A commit whose body
  # carries a SECURITY: paragraph is lifted out of Bug Fixes, because whether an
  # operator goes and audits their data depends on telling the two apart.
  { body = "(?s).*SECURITY:.*", group = "Security" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Chores" },
]
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
