[extend]
useDefault = true

# Global allowlists (top-level array). NOT [[rules.allowlists]] — that binds the
# entry to a rule and leaves a phantom rule with no id, which fails config load
# under the gitleaks CLI ("rule |id| is missing or empty").
[[allowlists]]
description = "IMAP/SMTP AUTH= capability strings in protocol documentation"
regexTarget = "match"
regexes = ['^AUTH=SCRAM-SHA-']
paths = ['docs/.*\.md']

[[allowlists]]
description = "Fake auth token literal in the auth-client unit test fixtures — a mock server reply the test asserts on, not a real secret. AND-scoped to the file AND this exact literal."
condition = "AND"
regexTarget = "match"
regexes = ['abc123def456']
paths = ['''internal/auth/client/client_test\.go''']

[[allowlists]]
description = "Example mailbox names in the storage-escaping tests. generic-api-key reads a dotted folder name in a comment as a high-entropy key: the finding is the literal Invoices.2026, which is the example the whole test file is about. AND-scoped to that file AND that literal."
condition = "AND"
regexTarget = "match"
regexes = ['Invoices\.2026']
paths = ['''internal/storage/mailboxbuild/escape_test\.go''']
