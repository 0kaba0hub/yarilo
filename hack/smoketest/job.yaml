apiVersion: batch/v1
kind: Job
metadata:
  name: smoketest
  namespace: yarilo-sb
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: smoketest
        image: ghcr.io/yarilomail/yarilo:2.0.59
        command:
        - yarilo-smoketest
        args:
        - -host=yarilo-managesieve-login.yarilo-sb.svc.cluster.local
        - -imap-host=yarilo-imap-login.yarilo-sb.svc.cluster.local
        - -smtp-host=relay-mx.yarilo-relay.svc.cluster.local
        - -managesieve
        - -managesieve-user=u1@d00001.test
        - -managesieve-pass=Yarilo!test1
        - -sieve
        - -insecure
        - -telemetry=
